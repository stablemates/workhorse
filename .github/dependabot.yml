# Keeps the pinned dependencies current.
#
# Every action in .github/workflows is pinned to a commit SHA, which is what stops a moved tag from
# changing what a release job executes. A SHA never moves on its own, so without this file the
# workflows would quietly age into unpatched versions. Dependabot reads the `# vX.Y.Z` comment
# beside each SHA, opens a pull request that moves both, and CI decides whether it merges.
#
# Each pull request runs the full CI, and each fix on it runs CI again, so this file keeps the number
# of pull requests low:
#
# - Every ecosystem runs monthly. Security updates do not follow the schedule, so a vulnerable
#   dependency still gets a pull request at once.
# - The cooldown makes a release wait before Dependabot proposes it. A release that its maintainers
#   replace with a fix in the first days then never opens a pull request. The cooldown does not
#   apply to security updates. A major waits 30 days, except in `github-actions` and `docker`:
#   Dependabot rejects the whole file if those two ecosystems set `semver-major-days` or another
#   `semver-*-days` key, and then it opens no version update for any ecosystem. That happened
#   from SM-1839 until its fix.
# - Updates are grouped so one month produces a few reviewable pull requests rather than thirty.
#   Majors stay ungrouped: they change behavior and deserve their own review.
#
# Weekly runs opened 13 pull requests on 2026-10-26, and 8 of them failed CI (SM-1839).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    # attest-action v0.0.7 adds `require-build-hashes` to its own `[tool.uv]` table, and only uv
    # 0.13.0 or later reads that key. The pinned uv in mise.toml discards the table, and then
    # `uv run --locked` inside the action fails. Only release-python.yml uses the action, and CI on a
    # pull request does not run it, so a bump passes CI and fails the release rehearsal (SM-1892).
    # SM-1894 moves uv and the action together, proves it with a dry run, and removes this entry.
    # A `versions` rule also holds back a security update in its range, so this entry is temporary.
    ignore:
      - dependency-name: astral-sh/attest-action
        versions: [">=0.0.7"]

  # The pnpm workspace root. One entry covers every workspace package, because pnpm-lock.yaml at the
  # root is the single lockfile CI installs from.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 10
    groups:
      # Mantine requires one version across its packages, so a lone `@mantine/core` bump cannot
      # build. This group carries every update type, majors included, for that reason. The `npm`
      # group below deliberately does not, because an ungrouped major is easier to review alone.
      #
      # Dependabot puts a dependency in the most specific group that matches it, not the first one
      # declared. A group naming `update-types` is more specific than one naming only `patterns`, so
      # a broad group once claimed every `@mantine/*` package and this group stayed empty. A Mantine
      # major then matched no group and arrived alone. The `@mantine/*` exclusion in `npm` is what
      # keeps this group reachable; removing it disables this group.
      mantine:
        patterns: ["@mantine/*"]
      # OpenTelemetry JS releases its API, its stable SDK packages and its experimental packages as
      # one line, and each SDK package names a narrow `@opentelemetry/api` peer range. A lone bump
      # breaks that range: on 2026-10-26, four pull requests each moved one package to the 3.0 line
      # (#1107 to #1110), and the API bump in the production group was outside the range of SDK
      # 2.12. This group moves every `@opentelemetry/*` package together, majors included. The
      # `@opentelemetry/*` exclusion in `npm` keeps it reachable, for the reason above.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      # One group for the minor and patch updates of every other package, development and production
      # alike. Two groups ran CI twice for the same lockfile and failed together when a shared
      # generated file, such as the dashboard/v1 bundle, went stale.
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
        exclude-patterns: ["@mantine/*", "@opentelemetry/*"]
    # These majors cannot be taken automatically, and each one would arrive every month and fail.
    #
    # TypeScript 7 is the native port, and its package carries no JavaScript compiler API. Eight
    # tracked files import that API, including the generators for the dashboard/v1 response schemas
    # and the SQL catalogues, so neither governed artifact can be produced at all. This is a fact
    # about the package rather than a preference, and SM-841 revisits it when the API ships.
    #
    # The Prisma adapter claims `@prisma/client >=6 <8` (SM-840), and CI tests each claimed major
    # against its own fixture. typescript/prisma pins Prisma 6, and typescript/adapter-conformance
    # pins Prisma 7. A major bump moves a fixture off its major: Prisma 7 rejects the `url` that the
    # Prisma 6 schema must have. A Prisma 8 bump also needs a decision to widen the peer range
    # (ADR 0058). The CLI and the client are named separately because they arrive as separate pull
    # requests, and each fails against the other's major: #164 moved the CLI alone, #153 moved the
    # client alone.
    #
    # Objection 4 is a choice, not a blocker. Since October 2026 the `objection` package is
    # published from the ditojs/objection fork, while Vincit keeps the original repository and npm
    # access. The Objection recipe certifies one exact 3.x version (SM-1483). A move to 4.x changes
    # that certification, so a maintainer plans it instead of a routine pull request.
    #
    # Only the major is ignored, so a 6.x or 7.x Prisma, a 5.x TypeScript, or a 3.x Objection still
    # opens.
    #
    # The OpenTelemetry JS 3 line waits for SM-1840. `@stablemates/workhorse-otel` publishes the peer
    # range `@opentelemetry/api-logs >=0.200.0 <0.300.0`, so adopting the 0.300 experimental
    # packages is a decision about that published range, not a routine bump. The entries below hold
    # back exactly that line: API 1.10, the 3.0 stable packages, the 0.300 experimental packages,
    # and the auto-instrumentations release that requires them. Remove them with SM-1840.
    # `ignore` never applies to security updates.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: prisma
        update-types:
          - version-update:semver-major
      - dependency-name: "@prisma/client"
        update-types:
          - version-update:semver-major
      - dependency-name: objection
        update-types:
          - version-update:semver-major
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/context-async-hooks"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/core"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-metrics"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-trace-base"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/api-logs"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/exporter-logs-otlp-http"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/sdk-logs"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/sdk-node"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/auto-instrumentations-node"
        versions: [">=0.82.0"]

  # `uv`, not `pip`: the Python half locks with uv.lock, and the pip ecosystem would edit
  # pyproject.toml without updating that lockfile. CI runs under UV_LOCKED, so such a pull request
  # would fail rather than merge.
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      # Each example certifies one exact version of its framework, and its document and site page
      # name that version. A new version is a certification, so it gets its own pull request. If
      # the example tests fail, the other Python updates still merge. On 2026-10-26,
      # pydantic-ai-slim 2.60.0 failed the PydanticAI example tests and held ruff back with it
      # (SM-1841). LangGraph moves its two packages together; pydantic-ai-slim arrives alone.
      langgraph:
        patterns: ["langgraph*"]
      python:
        patterns: ["*"]
        update-types: [minor, patch]
        exclude-patterns: ["langgraph*", "pydantic-ai*"]

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
    # OpenTelemetry 1.47 requires Go 1.26; support.json still promises Go 1.25.
    # Lift this limit when that support floor moves. Compatible 1.46 patches stay eligible.
    ignore:
      - dependency-name: "go.opentelemetry.io/otel*"
        versions: [">=1.47.0"]

  # The Ruby gem's Gemfile.lock. Dependabot reads only the Gemfile in this directory, so it does not
  # update ruby/gemfiles/rails_8_0.gemfile.lock. When a Ruby update changes ruby/Gemfile,
  # `pnpm ruby:lockfile-check` fails the pull request until someone relocks that file on the branch.
  # `pnpm ruby:vuln` audits that lockfile as well, and an advisory there fails CI until someone
  # relocks it.
  - package-ecosystem: bundler
    directory: /ruby
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      ruby:
        patterns: ["*"]
        update-types: [minor, patch]

  # The base images in Dockerfile, Dockerfile.dashboard and Dockerfile.site. The published image is
  # built from these, so a base image that stops receiving patches is a deployment concern.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # One pull request for the images that remain after the ignore list below. One pull request per
    # image ran the full CI once for each image.
    groups:
      docker:
        patterns: ["*"]
    # Several base images carry a version this repository decides elsewhere. The Go line is a
    # supported runtime recorded in support.json. The uv line is a pinned image that
    # typescript/demo/src/multilang-workers.test.ts names, and moving it is a decision about the
    # Python toolchain. The Node line is the toolchain support.json and mise.toml pin, and adopting
    # a new major is a decision that carries the tested matrix with it. The Rust version is the
    # toolchain rust-toolchain.toml and mise.toml pin, so it moves with those files and CI; #363
    # moved it alone. Tests hold the Dockerfiles to all four. Dependabot reads none of them, so a
    # version bump here is always wrong by default and arrives every month until someone closes it.
    #
    # The JVM and .NET images follow the `java`, `dotnet` and `gradle` pins in mise.toml, and the
    # workflows and support.json name the same versions. multilang-workers.test.ts holds the
    # eclipse-temurin and dotnet/sdk images to those pins, so a bump of the image alone fails CI:
    # #1099 and #1101 did. A bump moves the mise.toml pin and these images in one change. The
    # dotnet/runtime image moves with the SDK that ships it.
    #
    # Node ignores the major alone. A 24.x release still opens, because that is the same supported
    # major with its own fixes, and only the major is the decision. The bump this entry exists for
    # moved every image to Node 25, which removed corepack, and the site image build then stopped
    # at `corepack enable`.
    #
    # Dependabot names an image without its registry: `astral-sh/uv`, not `ghcr.io/astral-sh/uv`,
    # and `dotnet/sdk`, not `mcr.microsoft.com/dotnet/sdk`. An entry with the registry matches
    # nothing. The uv entry had that form from SM-833 until SM-1839, and #861 moved uv anyway.
    #
    # Only the version is ignored. A digest update on the same version still opens, which is the
    # base image's own security patches, and `ignore` never applies to security updates.
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: astral-sh/uv
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: node
        update-types:
          - version-update:semver-major
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: gradle
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: dotnet/sdk
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: dotnet/runtime
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
