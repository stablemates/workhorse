# Keeps the pinned dependencies current.
#
# Every action in .github/workflows is pinned to a commit SHA, which is what stops a moved tag from
# changing what a release job executes. A SHA never moves on its own, so without this file the
# workflows would quietly age into unpatched versions. Dependabot reads the `# vX.Y.Z` comment
# beside each SHA, opens a pull request that moves both, and CI decides whether it merges.
#
# Updates are grouped so one week produces a few reviewable pull requests rather than thirty.
# Majors stay ungrouped: they change behavior and deserve their own review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # The pnpm workspace root. One entry covers every workspace package, because pnpm-lock.yaml at the
  # root is the single lockfile CI installs from.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Mantine requires one version across its packages, so a lone `@mantine/core` bump cannot
      # build. This group carries every update type, majors included, for that reason. The two
      # groups below deliberately do not, because an ungrouped major is easier to review alone.
      #
      # Dependabot puts a dependency in the most specific group that matches it, not the first one
      # declared. A group naming a `dependency-type` and `update-types` is more specific than one
      # naming only `patterns`, so `npm-production` claimed every `@mantine/*` package and this
      # group stayed empty. A Mantine major then matched no group and arrived alone. The two
      # exclusions below are what keep this group reachable; removing either one disables it.
      mantine:
        patterns: ["@mantine/*"]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ["@mantine/*"]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns: ["@mantine/*"]
    # Two majors cannot be taken yet, and each one arrives every Monday and fails the same way.
    #
    # TypeScript 7 is the native port, and its package carries no JavaScript compiler API. Eight
    # tracked files import that API, including the generators for the dashboard/v1 response schemas
    # and the SQL catalogues, so neither governed artifact can be produced at all. This is a fact
    # about the package rather than a preference, and SM-841 revisits it when the API ships.
    #
    # Prisma 7 rejects `url` in a datasource block, which is what typescript/prisma generates from.
    # The adapter source needs only `$queryRawUnsafe` and would survive the move; the published peer
    # claim `@prisma/client >=6 <7` is what does not. SM-840 holds that decision, and this entry
    # only stops the weekly reminder — it does not make the decision. The CLI and the client are
    # named separately because they arrive as separate pull requests, and each fails against the
    # other's major: #164 moved the CLI alone, #153 moved the client alone.
    #
    # Only the major is ignored, so a 6.x Prisma or a 5.x TypeScript still opens. `ignore` never
    # applies to security updates.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: prisma
        update-types:
          - version-update:semver-major
      - dependency-name: "@prisma/client"
        update-types:
          - version-update:semver-major

  # `uv`, not `pip`: the Python half locks with uv.lock, and the pip ecosystem would edit
  # pyproject.toml without updating that lockfile. CI runs under UV_LOCKED, so such a pull request
  # would fail rather than merge.
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  # The base images in Dockerfile, Dockerfile.dashboard and Dockerfile.site. The published image is
  # built from these, so a base image that stops receiving patches is a deployment concern.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Three base images carry a version this repository decides elsewhere. The Go line is a
    # supported runtime recorded in support.json. The uv line is a pinned image that
    # typescript/demo/src/multilang-workers.test.ts names, and moving it is a decision about the
    # Python toolchain. The Node line is the toolchain support.json and mise.toml pin, and adopting
    # a new major is a decision that carries the tested matrix with it. Tests hold the Dockerfiles
    # to all three. Dependabot reads none of them, so a version bump here is always wrong by
    # default and arrives every week until someone closes it.
    #
    # Node ignores the major alone. A 24.x release still opens, because that is the same supported
    # major with its own fixes, and only the major is the decision. The bump this entry exists for
    # moved every image to Node 25, which removed corepack, and the site image build then stopped
    # at `corepack enable`.
    #
    # Only the version is ignored. A digest update on the same version still opens, which is the
    # base image's own security patches, and `ignore` never applies to security updates.
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: ghcr.io/astral-sh/uv
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: node
        update-types:
          - version-update:semver-major
