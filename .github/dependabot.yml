# Keeps the pinned dependencies current.
#
# Every action in .github/workflows is pinned to a commit SHA, which is what stops a moved tag from
# changing what a release job executes. A SHA never moves on its own, so without this file the
# workflows would quietly age into unpatched versions. Dependabot reads the `# vX.Y.Z` comment
# beside each SHA, opens a pull request that moves both, and CI decides whether it merges.
#
# Updates are grouped so one week produces a few reviewable pull requests rather than thirty.
# Majors stay ungrouped: they change behavior and deserve their own review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # The pnpm workspace root. One entry covers every workspace package, because pnpm-lock.yaml at the
  # root is the single lockfile CI installs from.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Mantine requires one version across its packages, so a lone `@mantine/core` bump cannot
      # build. This group carries every update type, majors included, for that reason. The two
      # groups below deliberately do not, because an ungrouped major is easier to review alone.
      #
      # Dependabot puts a dependency in the most specific group that matches it, not the first one
      # declared. A group naming a `dependency-type` and `update-types` is more specific than one
      # naming only `patterns`, so `npm-production` claimed every `@mantine/*` package and this
      # group stayed empty. A Mantine major then matched no group and arrived alone. The two
      # exclusions below are what keep this group reachable; removing either one disables it.
      mantine:
        patterns: ["@mantine/*"]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ["@mantine/*"]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns: ["@mantine/*"]
    # Two majors cannot be taken yet, and each one arrives every Monday and fails the same way.
    #
    # TypeScript 7 is the native port, and its package carries no JavaScript compiler API. Eight
    # tracked files import that API, including the generators for the dashboard/v1 response schemas
    # and the SQL catalogues, so neither governed artifact can be produced at all. This is a fact
    # about the package rather than a preference, and SM-841 revisits it when the API ships.
    #
    # Prisma 7 rejects `url` in a datasource block, which is what typescript/prisma generates from.
    # The adapter source needs only `$queryRawUnsafe` and would survive the move; the published peer
    # claim `@prisma/client >=6 <7` is what does not. SM-840 holds that decision, and this entry
    # only stops the weekly reminder — it does not make the decision. The CLI and the client are
    # named separately because they arrive as separate pull requests, and each fails against the
    # other's major: #164 moved the CLI alone, #153 moved the client alone.
    #
    # Only the major is ignored, so a 6.x Prisma or a 5.x TypeScript still opens. `ignore` never
    # applies to security updates.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: prisma
        update-types:
          - version-update:semver-major
      - dependency-name: "@prisma/client"
        update-types:
          - version-update:semver-major
      # The packages below exist only so a recipe runs against the version its published page
      # certifies: Objection in objection.mdx and packed-packages.ts, stripe-node in stripe.mdx, and
      # MikroORM in mikroorm.mdx and its integration test. No product package depends on them. A bump
      # either fails the fixture or leaves the page naming a version nobody tested, so moving one
      # re-certifies the recipe and its page in the same change. Alerts still arrive, and
      # `pnpm tooling:vuln` still fails CI on an advisory in any of them.
      - dependency-name: objection
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: stripe
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "@mikro-orm/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  # `uv`, not `pip`: the Python half locks with uv.lock, and the pip ecosystem would edit
  # pyproject.toml without updating that lockfile. CI runs under UV_LOCKED, so such a pull request
  # would fail rather than merge.
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    # The same holds for the recipe pins in the dev group. celery.mdx names Celery with the Kombu,
    # Billiard and Vine it resolves to. langgraph.mdx and langgraph-bridge.md name both LangGraph
    # packages, and langgraph-bridge.md also names the langgraph-checkpoint they resolve. enqueue.mdx
    # names the SQLAlchemy and greenlet the async fixture tests. pydanticai_approval.py refuses to
    # run on any PydanticAI but the one pydanticai.mdx names. Django stays open: the `django` extra
    # is a product claim, not a recipe.
    # `pnpm tooling:vuln` still fails CI on an advisory in any of them.
    ignore:
      - dependency-name: celery
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: kombu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: billiard
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: vine
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: langgraph
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: langgraph-checkpoint-postgres
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: pydantic-ai-slim
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: sqlalchemy
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: greenlet
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: langgraph-checkpoint
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
    # Only the sqlx, Bun and GORM examples import these modules, and go-sqlx.mdx, go-bun.mdx and
    # gorm.mdx certify the versions go.mod pins. go-bun.mdx also installs the google/uuid those
    # examples use. pgx stays open: the published module depends on it.
    # `pnpm go:vuln` scans ./..., examples included, so it still fails CI on a reachable advisory.
    ignore:
      - dependency-name: github.com/jmoiron/sqlx
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: github.com/uptrace/bun
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: github.com/uptrace/bun/dialect/pgdialect
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: gorm.io/gorm
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: github.com/google/uuid
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: gorm.io/driver/postgres
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  # The Ruby gem's Gemfile.lock. Dependabot reads only the Gemfile in this directory, so it does not
  # update ruby/gemfiles/rails_8_0.gemfile.lock; `pnpm ruby:vuln` audits that lockfile as well, and
  # an advisory there fails CI until someone relocks it.
  - package-ecosystem: bundler
    directory: /ruby
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ruby:
        patterns: ["*"]
        update-types: [minor, patch]
    # sequel.mdx certifies the Sequel the Gemfile pins, and the gemspec does not depend on it. pg
    # stays open: the published gem depends on it. `pnpm ruby:vuln` still audits Gemfile.lock.
    ignore:
      - dependency-name: sequel
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  # The base images in Dockerfile, Dockerfile.dashboard and Dockerfile.site. The published image is
  # built from these, so a base image that stops receiving patches is a deployment concern.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Four base images carry a version this repository decides elsewhere. The Go line is a
    # supported runtime recorded in support.json. The uv line is a pinned image that
    # typescript/demo/src/multilang-workers.test.ts names, and moving it is a decision about the
    # Python toolchain. The Node line is the toolchain support.json and mise.toml pin, and adopting
    # a new major is a decision that carries the tested matrix with it. The Rust version is the
    # toolchain rust-toolchain.toml and mise.toml pin, so it moves with those files and CI; #363
    # moved it alone. Tests hold the Dockerfiles to all four. Dependabot reads none of them, so a
    # version bump here is always wrong by default and arrives every week until someone closes it.
    #
    # Node ignores the major alone. A 24.x release still opens, because that is the same supported
    # major with its own fixes, and only the major is the decision. The bump this entry exists for
    # moved every image to Node 25, which removed corepack, and the site image build then stopped
    # at `corepack enable`.
    #
    # Only the version is ignored. A digest update on the same version still opens, which is the
    # base image's own security patches, and `ignore` never applies to security updates.
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: ghcr.io/astral-sh/uv
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: node
        update-types:
          - version-update:semver-major
