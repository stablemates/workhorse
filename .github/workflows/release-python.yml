# Builds and publishes the Python distribution from python/vX.Y.Z tags. The tag names the same commit
# as the matching v* and go/v* tags, so all three registries carry one version (ADR 0050).
# The build job validates only Python and the dashboard assets embedded in its distributions. It
# carries no publication identity; only the PyPI environment can mint the publisher token.
# The attestation rehearsal proves, before publish and on every dry run, that the pinned uv uploads
# a PEP 740 attestation with each distribution. uv before 0.9.12 dropped them silently (SM-1098).
name: Release Python

on:
  push:
    tags: ["python/v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and validate without publishing
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

# A tag push and a manual run for the same tag would otherwise build and publish side by side. The
# second run waits for the first rather than cancelling it, because a cancelled publish can leave a
# registry holding part of a release.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # A release must build what the lockfile pins. Without this, `uv` re-resolves a pyproject.toml
  # that has moved past uv.lock and publishes a distribution nobody reviewed. See ci.yml.
  UV_LOCKED: "1"
  # uv.lock does not cover the build backend, so every editable build of the project would otherwise
  # pick the newest hatchling. This makes it the pinned backend `pnpm tooling:vuln` audits.
  UV_BUILD_CONSTRAINT: ${{ github.workspace }}/python/build-constraints.txt

jobs:
  build:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
    steps:
      - name: Require successful main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "$successful_runs" -eq 0 ]; then
            echo "No successful main CI push run exists for $GITHUB_SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v1
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Install matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21 # Pinned to the uv version in mise.toml.
      - run: pnpm install --frozen-lockfile
      # The tooling that builds these distributions is judged before they are built for publication.
      - run: pnpm tooling:vuln
      - run: pnpm python:release-check
      - run: pnpm rust:release-check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: python/dist/*

  # Repeats the publish job's preparation without the PyPI environment, then runs `uv publish`
  # against a loopback endpoint and fails unless every distribution arrived with its attestation.
  attestation-rehearsal:
    needs: build
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21 # Pinned to the uv version in mise.toml.
          enable-cache: false
          ignore-empty-workdir: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: python/dist
      - uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: python/dist/*
      - run: node scripts/check-attestation-upload.ts python/dist

  publish:
    if: startsWith(github.ref, 'refs/tags/python/v') && inputs.dry-run != true
    needs: [build, attestation-rehearsal]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21 # Pinned to the uv version in mise.toml.
          enable-cache: false
          ignore-empty-workdir: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: python/dist
      - uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: python/dist/*
      - run: uv publish --trusted-publishing always python/dist/*
