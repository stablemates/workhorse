# Publishes every package from a tag, with npm provenance attesting that these exact tarballs were
# built by this workflow from this commit. The build job validates only the npm packages and assets
# they contain; broad repository checks remain owned by main CI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and validate without publishing
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

# A tag push and a manual run for the same tag would otherwise build and publish side by side. The
# second run waits for the first rather than cancelling it, because a cancelled publish can leave a
# registry holding part of a release.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: depot-ubuntu-24.04
    # The JVM release check added its gates and consumers to the npm, Rust, and Ruby checks.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_test_packed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST_PACKED: postgres://workhorse:workhorse@localhost:5432/workhorse_test_packed
    steps:
      - name: Require successful main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "$successful_runs" -eq 0 ]; then
            echo "No successful main CI push run exists for $GITHUB_SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Set up Gradle before the other tools. If the runner image already has this Gradle version in
      # /usr/bin, the action puts /usr/bin first on the PATH, where /usr/bin/go is an older Go. Each
      # later setup step puts its own directory ahead of /usr/bin, so the pinned tools stay first
      # (SM-1484).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: 9.8.2 # Pinned to the gradle version in mise.toml.
          cache-disabled: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No `cache: pnpm` and no Rust cache. This job builds the published artifacts, and a cache
      # restored into it would let an earlier run decide its dependencies and build outputs. A
      # pull request run can write those caches. The lockfiles alone decide what this job fetches
      # (SM-1666). `scripts/release-workflow-caches.test.ts` rejects a cache in a release job, and
      # it requires `package-manager-cache: false` in each setup-node step of a release job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v1
        with:
          toolchain: 1.89.0 # Pinned to the rust version in mise.toml.
          components: rustfmt, clippy
          cache: false
      # Not `bundler-cache`: the release check installs the gem's own bundle, and a cache restored
      # into the job that builds the published artifacts would let an earlier run decide its gems.
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: 3.4.11 # Pinned to the ruby version in mise.toml.
      # The JVM release check builds and signs the three artifacts. Not the Gradle cache: a cache
      # restored into the job that builds the published artifacts would let an earlier run decide
      # its plugins and dependencies.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25.0.4 # Pinned to the java version in mise.toml.
      - name: Install matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # The npm tooling that builds these artifacts runs beside the publishing credentials, so its
      # advisories are judged before anything is built for publication. This job installs no
      # Python toolchain; `release-python.yml` and main CI judge the Python half.
      - run: pnpm tooling:vuln:npm
      - run: pnpm npm:release-check
      # Under CI the Rust database tests refuse to skip, and they read only `DATABASE_URL_TEST`.
      # Scoping it to this step leaves the npm check on the database it has always used.
      - run: pnpm rust:release-check
        env:
          DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test_packed
      # The Ruby specs refuse to skip under CI as well, and they read the same variable.
      - run: pnpm ruby:release-check
        env:
          DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test_packed
      # The JVM dry run: the JVM gates, then the three artifacts staged and signed with a throwaway
      # key that the check generates and discards. Its consumers read the same variable. It uploads
      # nothing and reads no secret.
      - run: pnpm jvm:release-check
        env:
          DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test_packed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: dist-tarballs/*.tgz

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    needs: build
    # GitHub-hosted, not Depot, and only this job. npm verifies the Sigstore provenance bundle
    # against the runner environment and rejects anything it reads as `self-hosted`, which is how
    # it classifies a Depot runner. The build job keeps Depot because it does the heavy compute;
    # this job only downloads the tarballs the build produced and writes them to the registry.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No `cache: pnpm`. This job holds the publication identity, so it installs only what the
      # lockfile pins from the registry. A restored cache is a writable artifact from an earlier
      # run, and this is the one job where nothing but the lockfile should decide what executes.
      #
      # Node 24 for npm 11: npm exchanges this job's OIDC identity for a registry credential only
      # from 11.5.1, and Node 22 ships npm 10. No `registry-url`, because that option exists to
      # write a `NODE_AUTH_TOKEN` placeholder into `.npmrc` and this job has no token to put there.
      # npm leaves an unset placeholder in place as a literal, which would turn a failed exchange
      # into an unauthorized write the registry answers with `E404`. Without it npm says it is not
      # logged in. registry.npmjs.org is npm's default, so nothing else changes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: dist-tarballs

      # Publication carries no secret. `npm publish` exchanges this job's OIDC identity for a
      # short-lived registry credential, which npm mints only for the trusted publisher npmjs.com
      # names for each package: this repository and this workflow file. Renaming either stops
      # publication until a maintainer updates npmjs.com, the way renaming `release-python.yml`
      # stops PyPI publication.
      #
      # The preflight checks this runner and every target version before the first write, then
      # publishes @stablemates/workhorse ahead of the adapters that declare it as a peer. A failure
      # partway through reports which packages reached the registry; npm publication cannot be
      # rolled back, so that ledger is the only record of what recovery has to work around.
      - name: Preflight the publisher, then publish with provenance
        run: pnpm npm:publish

  # The Rust crate joins the train only once `rust/Cargo.toml` carries the tag's version, so an
  # unfinished SDK never ships because some other line released. It follows npm so that a stopped
  # train never reaches crates.io, and crates.io, like npm, never accepts a version twice.
  #
  # The job can fail after crates.io accepts the crate, for example at the job timeout. A re-run
  # must then let `github-release` run. So before the upload, the job packages the crate and
  # `scripts/check-registry-version.ts` asks crates.io for the tag version (SM-1860). If crates.io
  # serves it with the checksum of the packaged crate, the job uploads nothing and succeeds. If the
  # checksum differs, the job fails. The `rubygems` job does the same.
  crates-io:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    needs: publish
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v1
        with:
          toolchain: 1.89.0 # Pinned to the rust version in mise.toml.
          cache: false
      - name: Compare the crate version with the tag
        id: version
        run: |
          set -euo pipefail
          crate="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "workhorse") | .version')"
          if [ "v$crate" = "$GITHUB_REF_NAME" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            message="rust/Cargo.toml is at $crate, so $GITHUB_REF_NAME does not publish workhorse to crates.io"
            echo "::notice::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      # `cargo package` makes the same bytes from the same tag, and `cargo publish` uploads the
      # bytes that it packages. `--no-verify`, because `cargo publish` verifies the package.
      - name: Package workhorse
        if: steps.version.outputs.publish == 'true'
        run: cargo package --package workhorse --locked --no-verify
      # Plain `node` runs the check, so the step installs no dependency beside the publication
      # identity.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Ask crates.io whether it serves the version
        if: steps.version.outputs.publish == 'true'
        id: registry
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/check-registry-version.ts crates-io workhorse "$version" \
            "target/package/workhorse-$version.crate"
      # Publication carries no secret. The action exchanges this job's OIDC identity for a
      # short-lived crates.io token, which crates.io mints only for the trusted publisher the
      # `workhorse` crate names: this repository, this workflow file, and the `crates-io`
      # environment. The action's post step revokes the token when the job ends.
      - name: Exchange the OIDC identity for a crates.io token
        if: steps.registry.outputs.upload == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish workhorse
        if: steps.registry.outputs.upload == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --package workhorse --locked

  rubygems:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    needs: publish
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `bundler-cache`, for the same reason as the publish job: this job can mint a RubyGems
      # token, so the lockfile alone decides what runs beside it.
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: 3.4.11 # Pinned to the ruby version in mise.toml.
      - name: Compare the gem version with the tag
        id: version
        working-directory: ruby
        run: |
          set -euo pipefail
          gem="$(ruby -e 'require_relative "lib/stablemates/workhorse/version"; print Stablemates::Workhorse::VERSION')"
          if [ "v$gem" = "$GITHUB_REF_NAME" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            message="ruby/lib/stablemates/workhorse/version.rb is at $gem, so $GITHUB_REF_NAME does not publish stablemates-workhorse to RubyGems"
            echo "::notice::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      # `gem build` makes the same bytes from the same tag, and `rake release` runs `gem build` on
      # the same gemspec. The archive goes outside the checkout, so `rake release` builds its own.
      - name: Build stablemates-workhorse
        if: steps.version.outputs.publish == 'true'
        working-directory: ruby
        run: gem build stablemates-workhorse.gemspec --output "$RUNNER_TEMP/stablemates-workhorse-${GITHUB_REF_NAME#v}.gem"
      # Plain `node` runs the check, so the step installs no dependency beside the publication
      # identity.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Ask RubyGems.org whether it serves the version
        if: steps.version.outputs.publish == 'true'
        id: registry
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/check-registry-version.ts rubygems stablemates-workhorse "$version" \
            "$RUNNER_TEMP/stablemates-workhorse-$version.gem"
      - name: Install the gem's bundle
        if: steps.registry.outputs.upload == 'true'
        working-directory: ruby
        env:
          BUNDLE_FROZEN: "true"
        run: bundle install
      # Publication carries no secret. The action exchanges this job's OIDC identity for a
      # short-lived RubyGems API key, which RubyGems.org mints only for the trusted publisher the
      # `stablemates-workhorse` gem names: this repository, this workflow file, and the `rubygems`
      # environment. It then runs `rake release`, which builds the gem and pushes it. The train tag
      # is already `v` plus the gem version, so Bundler finds it and neither creates nor pushes a
      # tag, and the read-only token could not push one anyway.
      - name: Publish stablemates-workhorse
        if: steps.registry.outputs.upload == 'true'
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          working-directory: ruby

  # The three JVM artifacts of ADR 0103 publish to Maven Central from the train tag. Like the crate
  # and the gem, they join only when `jvm/gradle.properties` carries the tag's version, and they
  # follow npm so that a stopped train never reaches Central.
  #
  # Unlike the other registries, Central has no trusted publishing, so this job reads four secrets
  # of the protected `maven-central` environment (SM-1384): `MAVEN_SIGNING_KEY` and
  # `MAVEN_SIGNING_PASSWORD` in the step that signs, and `MAVEN_CENTRAL_USERNAME` and
  # `MAVEN_CENTRAL_PASSWORD` in the step that uploads. No other step receives them. Until the
  # maintainer adds them, the job writes a notice and publishes nothing.
  #
  # The upload uses `publishingType=AUTOMATIC` (SM-1837). The Portal validates the deployment and,
  # if it passes, publishes it to Central with no Portal step by a person. Central never deletes a
  # published version, so the checks come before the upload: the reviewer of the `maven-central`
  # environment approves the job, the release consumers run the bytes that the job uploads, and the
  # Portal validates the bundle. The upload step ends only when the Portal reports `PUBLISHED`, and
  # fails on `FAILED` or after 60 minutes. Thus `github-release` runs only after a real publish.
  #
  # The Portal can publish a deployment after the job fails, for example after the 60 minutes. The
  # upload step therefore first asks the Portal whether Maven Central has the three artifacts at the
  # version (SM-1838). If it has all three, the step uploads nothing and succeeds, so a re-run lets
  # `github-release` run. If it has some but not all, the step fails. All the earlier steps and
  # checks run on each re-run.
  #
  # The job uploads the bytes that its own consumers ran (SM-1506). One step signs the artifacts and
  # writes the bundle. The next step, without a secret, runs the release consumers from the same
  # staging directory. Then the upload step sends that bundle.
  maven-central:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    needs: publish
    runs-on: depot-ubuntu-24.04
    # The consumers, then up to 60 minutes of Portal validation and publishing.
    timeout-minutes: 90
    environment: maven-central
    permissions:
      contents: read
    # Each consumer runs one task in a scratch database. Under CI the check refuses to skip them.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_test_packed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the JVM version with the tag
        id: version
        env:
          # Only whether each secret exists. The values stay out of this step.
          HAS_CREDENTIALS: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' && secrets.MAVEN_CENTRAL_PASSWORD != '' && secrets.MAVEN_SIGNING_KEY != '' && secrets.MAVEN_SIGNING_PASSWORD != '' }}
        run: |
          set -euo pipefail
          jvm="$(sed -n 's/^version=//p' jvm/gradle.properties)"
          if [ "v$jvm" != "$GITHUB_REF_NAME" ]; then
            message="jvm/gradle.properties is at $jvm, so $GITHUB_REF_NAME does not publish the JVM artifacts to Maven Central"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_CREDENTIALS" != "true" ]; then
            message="The maven-central environment lacks a Maven Central secret, so $GITHUB_REF_NAME does not publish the JVM artifacts (SM-1384)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
      # Set up Gradle before the other tools. If the runner image already has this Gradle version in
      # /usr/bin, the action puts /usr/bin first on the PATH, where /usr/bin/go is an older Go. Each
      # later setup step puts its own directory ahead of /usr/bin, so the pinned tools stay first
      # (SM-1484).
      - if: steps.version.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: 9.8.2 # Pinned to the gradle version in mise.toml.
          cache-disabled: true
      - if: steps.version.outputs.publish == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No pnpm store cache and no Gradle cache, for the same reason as the publish job: this job
      # holds the signing key and the Portal token. The pnpm lockfile decides the Node.js modules
      # that run beside them. For the Gradle build, jvm/gradle/verification-metadata.xml decides:
      # Gradle refuses each plugin and library whose sha256 checksum is not in that file or differs
      # from it (SM-1489). The file does not cover the Gradle distribution and the JDK, which the
      # pinned setup steps install.
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25.0.4 # Pinned to the java version in mise.toml.
      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      # The check refuses a signing key whose fingerprint is not the release key. It stages the
      # three artifacts, signs them, verifies every signature and checksum, and refuses a version
      # that differs from the tag. It verifies the signatures with only the public key.
      - name: Stage and sign the JVM artifacts
        if: steps.version.outputs.publish == 'true'
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: pnpm jvm:package-check --tag "$GITHUB_REF_NAME" --signing-key environment --no-consumers --bundle "$RUNNER_TEMP/workhorse-jvm.zip"
      # The consumers take the artifacts from the staging directory that the bundle holds, so the
      # job uploads the jars that they ran. This step gets no secret. The consumer builds are not
      # in jvm/gradle/verification-metadata.xml, so they run only after the step that signs ends.
      - name: Run the release consumers on the signed artifacts
        if: steps.version.outputs.publish == 'true'
        env:
          DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test_packed
        run: pnpm jvm:package-check --tag "$GITHUB_REF_NAME" --consumers-only
      # A consumer build starts Gradle daemons, which would otherwise run on beside the step that
      # receives the Portal token.
      - name: Stop the Gradle daemons of the consumers
        if: always() && steps.version.outputs.publish == 'true'
        run: gradle --stop
      - name: Upload the bundle to the Central Portal
        if: steps.version.outputs.publish == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: pnpm exec tsx scripts/upload-maven-central.ts "$RUNNER_TEMP/workhorse-jvm.zip" "workhorse-jvm-$GITHUB_REF_NAME" "${GITHUB_REF_NAME#v}"

  # The four .NET packages of ADR 0107 publish to nuget.org from the train tag. Like the crate, the
  # gem, and the JVM artifacts, they join only when `dotnet/Directory.Build.props` carries the tag's
  # version, and they follow npm so that a stopped train never reaches nuget.org.
  #
  # The job runs on each `v*` tag. It enters the protected `nuget` environment, so no step starts
  # until the required reviewer of that environment approves the run. The version check runs after
  # the approval, so each `v*` run waits for the reviewer, even a run that pushes nothing. If the
  # reviewer rejects the run, the job fails and `github-release` does not run. `github-release`
  # needs this job, so the GitHub release announces a version only after nuget.org has it. A version
  # mismatch or a missing `NUGET_USER` secret ends the job with success and no push. The GitHub
  # release then appears without the .NET packages.
  #
  # Publication carries no stored key. `NuGet/login` exchanges this job's OIDC identity for an API
  # key that nuget.org mints for one hour, only for the trusted publishing policy of SM-1441. Only
  # the push step receives that key. nuget.org never deletes a published version, so the reviewer
  # of the `nuget` environment is the human check before the versions become permanent. nuget.org
  # signs each package with its repository signature, so the job adds no author signature.
  #
  # The job pushes the bytes that its own consumer ran. The check packs the four packages into
  # one directory, runs package validation against the previous published version, and runs the
  # release consumer from that directory. The push step then sends the same files.
  nuget:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    needs: publish
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    environment: nuget
    permissions:
      contents: read
      id-token: write
    # The consumer runs one task in a scratch database. Under CI the check refuses to skip it.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_test_packed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the .NET version with the tag
        id: version
        env:
          # Only whether the secret exists. The value stays out of this step.
          HAS_USER: ${{ secrets.NUGET_USER != '' }}
        run: |
          set -euo pipefail
          dotnet="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' dotnet/Directory.Build.props)"
          if [ "v$dotnet" != "$GITHUB_REF_NAME" ]; then
            message="dotnet/Directory.Build.props is at $dotnet, so $GITHUB_REF_NAME does not publish the .NET packages to nuget.org"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_USER" != "true" ]; then
            message="The nuget environment lacks the NUGET_USER secret, so $GITHUB_REF_NAME does not publish the .NET packages (SM-1441)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.version.outputs.publish == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No pnpm store cache and no NuGet package cache, for the same reason as the publish job:
      # this job can mint a nuget.org key, so the lockfiles and the pinned versions alone decide
      # what runs beside it.
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # The SDK goes into its own directory, so the muxer finds no other SDK of the runner image.
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.403 # Pinned to the dotnet version in mise.toml.
      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      # The check refuses a version that differs from the tag. This step gets no secret.
      - name: Pack, validate, and run the release consumer
        if: steps.version.outputs.publish == 'true'
        env:
          DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test_packed
        run: pnpm dotnet:package-check --tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/nuget"
      # The build servers of the check would otherwise run on beside the step that gets the key.
      - name: Stop the .NET build servers
        if: always() && steps.version.outputs.publish == 'true'
        run: dotnet build-server shutdown
      - name: Exchange the OIDC identity for a nuget.org key
        if: steps.version.outputs.publish == 'true'
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      # `Workhorse` goes first, because each other package depends on it. `--skip-duplicate` lets a
      # run that stopped partway through push the rest of the packages again. Each push also sends
      # the `.snupkg` beside its `.nupkg`.
      - name: Publish the .NET packages
        if: steps.version.outputs.publish == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for id in Workhorse Workhorse.Hosting Workhorse.EntityFrameworkCore Workhorse.AspNetCore; do
            dotnet nuget push "$RUNNER_TEMP/nuget/$id.$version.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  # The schema tool ships only on npm, so a Python or Go developer without a Node.js toolchain has
  # no way to create a development database from a published artifact. Attaching the clean-install
  # SQL to the release gives them one. It is a development path: `psql -f` applies none of the CLI's
  # guards, so the documentation points deployments at the CLI.
  #
  # The release announces the version, so it waits for every registry that publishes from this tag.
  # If the version of a crate, gem, JVM, or .NET line does not match the tag, its job publishes
  # nothing and still succeeds. A failed crate, gem, Central, or nuget.org upload leaves no public
  # release to retract.
  github-release:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    needs: [publish, crates-io, rubygems, maven-central, nuget]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No `cache: pnpm`, for the same reason as the publish job: this job holds a contents-write
      # token, so the lockfile alone decides what runs beside it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Generate the clean-install schema artifact
        run: pnpm schema:generate
      - name: Create or update the release with schema.sql
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="Release notes for this version are in [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md).

          \`schema.sql\` below is the clean-install artifact for this version. It creates a development
          database without a Node.js toolchain:

          \`\`\`bash
          psql \"\$DATABASE_URL\" -f schema.sql
          \`\`\`

          It carries none of the CLI's guards. Deployments run \`workhorse schema install\` or
          \`workhorse schema migrate\` instead."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" sql/schema.sql --clobber
          else
            gh release create "$tag" sql/schema.sql --title "$tag" --notes "$notes"
          fi
