# Publishes every package from a tag, with npm provenance attesting that these tarballs were
# built by this workflow from this commit.
#
# Provenance requires `id-token: write`, a public repository, and a `repository` field in each
# published manifest. Nothing else in the release is implicit: the tag must match the version in
# package.json, and the full check suite runs before anything is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and validate without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_PRIMARY: postgres://workhorse:workhorse@localhost:5432/workhorse_dev_primary
      WORKHORSE_TEST_DATABASE_URL: postgres://workhorse:workhorse@localhost:5432/workhorse_test
      WORKHORSE_DEMO_DATABASE_URL: postgres://workhorse:workhorse@localhost:5432/workhorse_demo
      DATABASE_URL_TEST_PACKED: postgres://workhorse:workhorse@localhost:5432/workhorse_test_packed
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with the manifests would publish a version nobody can reproduce from
      # the repository, so it fails before the build rather than after the publish.
      - name: Check the tag against every package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in $(pnpm --silent exec tsx scripts/packages.ts --manifests); do
            version="$(node -p "require('./$manifest').version")"
            if [ "$version" != "$tag" ]; then
              echo "$manifest is $version but the tag is $tag" >&2
              exit 1
            fi
          done

      - name: Check the changelog documents this release
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "^## ${GITHUB_REF_NAME#v} " CHANGELOG.md

      - run: pnpm db:reset:dev-primary
      - run: pnpm db:reset:test
      - run: pnpm db:reset:test-packed
      - run: pnpm check

      - name: Pack the publishable packages
        run: |
          mkdir -p dist-tarballs
          for location in $(pnpm --silent exec tsx scripts/packages.ts --locations); do
            pnpm --silent --dir "$location" pack --pack-destination "$PWD/dist-tarballs"
          done
          ls -l dist-tarballs

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: dist-tarballs/*.tgz

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: dist-tarballs

      # @stablemates/workhorse goes first because every adapter declares it as a peer.
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tarball in $(pnpm --silent exec tsx scripts/packages.ts --tarballs); do
            npm publish --provenance --access public "dist-tarballs/$tarball"
          done
