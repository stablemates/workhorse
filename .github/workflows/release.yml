# Publishes every package from a tag, with npm provenance attesting that these exact tarballs were
# built by this workflow from this commit. The build job validates only the npm packages and assets
# they contain; broad repository checks remain owned by main CI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and validate without publishing
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_test_packed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST_PACKED: postgres://workhorse:workhorse@localhost:5432/workhorse_test_packed
    steps:
      - name: Require successful main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "$successful_runs" -eq 0 ]; then
            echo "No successful main CI push run exists for $GITHUB_SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm npm:release-check

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: dist-tarballs/*.tgz

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: dist-tarballs

      # @stablemates/workhorse goes first because every adapter declares it as a peer.
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tarball in $(pnpm --silent exec tsx scripts/packages.ts --tarballs); do
            npm publish --provenance --access public "./dist-tarballs/$tarball"
          done

  # The schema tool ships only on npm, so a Python or Go developer without a Node.js toolchain has
  # no way to create a development database from a published artifact. Attaching the clean-install
  # SQL to the release gives them one. It is a development path: `psql -f` applies none of the CLI's
  # guards, so the documentation points deployments at the CLI.
  github-release:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the clean-install schema artifact
        run: pnpm schema:generate
      - name: Create or update the release with schema.sql
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="Release notes for this version are in [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md).

          \`schema.sql\` below is the clean-install artifact for this version. It creates a development
          database without a Node.js toolchain:

          \`\`\`bash
          psql \"\$DATABASE_URL\" -f schema.sql
          \`\`\`

          It carries none of the CLI's guards. Deployments run \`workhorse schema install\` or
          \`workhorse schema migrate\` instead."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" sql/schema.sql --clobber
          else
            gh release create "$tag" sql/schema.sql --title "$tag" --notes "$notes"
          fi
