# Public CI policy lives in docs/decisions/0043-public-ci-and-release-policy.md and
# docs/decisions/0083-run-each-language-suite-once-per-change.md. Pull requests and pushes run each
# language's suite once, on the newest supported combination. Weekly runs exercise every
# language/database combination declared in support.json, every variation of a suite, such as Go's
# race detector and Rust without optional features, and every package check. A pull request runs a
# lane only when it changes an input of that lane, as scripts/ci-lanes.ts maps them. A file that the
# map does not name runs every lane. A docs-only pull request skips the unit lane, the one always-run
# lane that reads no documentation. A push to main uses the same map for the files that it changes,
# but a push that changes a release file, such as a changelog, runs every lane.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0" # Weekly full compatibility matrix.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_HOME: ${{ github.workspace }}/.pnpm-home
  # V8 sizes each heap at 4288 MB whatever the machine has, so two Node processes can promise more
  # memory than the runner owns. A runner that runs out of memory dies without uploading a log,
  # which is how the packed lane failed unseen for eleven nights. The largest single process
  # measured across these lanes is the site build at 1.6 GB. See SM-775.
  #
  # The cap has to hold for the widest lane, not the average one: every runner here has 8 GB except
  # the TypeScript lane's four-core runner, which has 16 GB and spends it on three test workers.
  # Three heaps at this cap fit that runner, and two fit every other one. See SM-835.
  NODE_OPTIONS: --max-old-space-size=2048
  # `uv run` and `uv sync` resolve and rewrite uv.lock when pyproject.toml has moved past it, so a
  # pull request could change a Python dependency and still pass while the committed lockfile named
  # a different version. Under UV_LOCKED the commands fail instead, which makes the lockfile the
  # only thing that decides which Python packages CI executes.
  UV_LOCKED: "1"
  # uv.lock does not cover the build backend, so every editable build of the project would otherwise
  # pick the newest hatchling. This makes it the pinned backend `pnpm tooling:vuln` audits.
  UV_BUILD_CONSTRAINT: ${{ github.workspace }}/python/build-constraints.txt

jobs:
  plan:
    name: lane plan and support matrix
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    outputs:
      # One boolean for each other job. Each job runs only when its value is true, and the required
      # job holds each result to it.
      lanes: ${{ steps.lanes.outputs.lanes }}
      typescript: ${{ steps.matrix.outputs.typescript }}
      python: ${{ steps.matrix.outputs.python }}
      go: ${{ steps.matrix.outputs.go }}
      rust: ${{ steps.matrix.outputs.rust }}
      ruby: ${{ steps.matrix.outputs.ruby }}
      jvm: ${{ steps.matrix.outputs.jvm }}
      dotnet: ${{ steps.matrix.outputs.dotnet }}
      packed: ${{ steps.matrix.outputs.packed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit, whose first parent is the base branch. The
          # lane plan compares the two to list the files that the pull request changes. For a push,
          # the lane plan fetches more history and compares the `before` commit of the event with
          # this commit.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: matrix
        run: pnpm --silent exec tsx scripts/ci-matrix.ts "$GITHUB_EVENT_NAME" "${{ github.event.schedule }}" >> "$GITHUB_OUTPUT"
      - id: lanes
        env:
          SCHEDULE: ${{ github.event.schedule }}
          LANE_PLAN_PATH: ${{ runner.temp }}/lane-plan.json
        run: pnpm --silent exec tsx scripts/ci-lanes.ts "$GITHUB_EVENT_NAME" "$SCHEDULE" >> "$GITHUB_OUTPUT"
      # The release workflows publish a commit only after a successful push run that planned every
      # lane. scripts/check-main-ci-plan.ts downloads this artifact to read the plan that the run
      # used (SM-1886). If the upload fails, the run fails, so a successful push run has a plan.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-plan
          path: ${{ runner.temp }}/lane-plan.json
          if-no-files-found: error
          overwrite: true

  static:
    name: format, generated files, lint, security, types
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['static']
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    # A step that reads the files of one language only runs only when the plan selects the lane of
    # that language, as scripts/ci-lanes.ts maps it. The cross-language checks and the setup that
    # they need run in every run. scripts/ci-lanes.test.ts holds each step to its lane (SM-1877).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Set up Gradle before the other tools. If the runner image already has this Gradle version in
      # /usr/bin, the action puts /usr/bin first on the PATH, where /usr/bin/go is an older Go. Each
      # later setup step puts its own directory ahead of /usr/bin, so the pinned tools stay first
      # (SM-1484).
      #
      # The first step restores the Gradle cache. The cache service can stall, and a stalled restore
      # can use the full time limit of the job. Usually the restore takes less than 10 s. Thus the
      # first step stops after 5 minutes. If it stops or fails, the next step removes the Gradle
      # download that it can leave incomplete. Then the third step provisions the pinned Gradle
      # with no cache. The post step of the first step reads its inputs again when the job ends.
      # If GRADLE_SETUP_FALLBACK is true, that post step saves no cache (SM-1874). Every other job
      # that sets up Gradle uses the same three steps.
      - id: setup-gradle
        if: fromJSON(needs.plan.outputs.lanes)['jvm']
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        timeout-minutes: 5
        continue-on-error: true
        with:
          gradle-version: 9.8.2 # Pinned to the gradle version in mise.toml.
          cache-disabled: ${{ env.GRADLE_SETUP_FALLBACK == 'true' }}
      - if: fromJSON(needs.plan.outputs.lanes)['jvm'] && steps.setup-gradle.outcome != 'success'
        run: |
          rm -rf "$RUNNER_TEMP/.gradle-actions/gradle-installations"
          echo "GRADLE_SETUP_FALLBACK=true" >> "$GITHUB_ENV"
      - if: fromJSON(needs.plan.outputs.lanes)['jvm'] && steps.setup-gradle.outcome != 'success'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: 9.8.2 # Pinned to the gradle version in mise.toml.
          cache-disabled: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # The action turns its cache on by default only on GitHub-hosted runners, so each setup-uv
      # step turns it on. Without the cache, each job downloads more than 100 packages. Each job
      # installs a different set of packages, so each job keeps its own cache entry (SM-1874).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.21 # Pinned to the uv version in mise.toml.
          enable-cache: true
          cache-suffix: static
      # `sql-catalogues:check` and `dashboard-spec:check` format the Rust catalogues with rustfmt, so
      # this step runs in every run. `rust:vuln` asks cargo for the dependency graph of the root
      # Cargo.lock.
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v1
        with:
          toolchain: 1.89.0 # Pinned to the rust version in mise.toml.
          components: rustfmt
          cache: false
          rustflags: ""
      - if: fromJSON(needs.plan.outputs.lanes)['rust']
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2 # Pinned to the cargo-deny version in mise.toml.
      # `ruby:lint` runs RuboCop over the Ruby gem, `ruby-api:check` loads it to read its API, and
      # `ruby:vuln` runs bundler-audit from its bundle.
      - if: fromJSON(needs.plan.outputs.lanes)['ruby']
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: 3.4.11 # Pinned to the ruby version in mise.toml.
          working-directory: ruby
          bundler-cache: true
      # `jvm:lint` compiles the JVM sources with Error Prone and NullAway, `jvm:format:check` runs
      # google-java-format over them, and `java-api:check` and `kotlin-api:check` build the JVM
      # artifacts to read their API, all on the JDK that mise.toml pins.
      - if: fromJSON(needs.plan.outputs.lanes)['jvm']
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25.0.4 # Pinned to the java version in mise.toml.
      # `dotnet:lint` runs `dotnet format` over the .NET solution and builds it with the analyzers as
      # errors, and `dotnet-api:check` builds the packages to read their API, on the SDK that
      # mise.toml pins. The SDK goes into its own directory, so the muxer
      # finds no other SDK of the runner image.
      - if: fromJSON(needs.plan.outputs.lanes)['dotnet']
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.403 # Pinned to the dotnet version in mise.toml.
      - run: pnpm install --frozen-lockfile
      # `pnpm npm:release-check` runs knip before it builds, so run knip here with no `dist/` too. A
      # knip config that loads a build output passes after the build and fails the release (SM-1292).
      - run: pnpm lint:dead-code
      - run: pnpm build:runtime:dev
      - run: pnpm sql-catalogues:check
      - run: pnpm go:sqlc:check
      - run: pnpm dashboard-spec:check
      - run: pnpm dashboard-bundle:check
      - run: pnpm parity:check
      - run: pnpm typescript-api:check
      - if: fromJSON(needs.plan.outputs.lanes)['python']
        run: pnpm python-api:check
      - if: fromJSON(needs.plan.outputs.lanes)['go']
        run: pnpm go-api:check
      - if: fromJSON(needs.plan.outputs.lanes)['ruby']
        run: pnpm ruby-api:check
      - if: fromJSON(needs.plan.outputs.lanes)['jvm']
        run: pnpm java-api:check
      - if: fromJSON(needs.plan.outputs.lanes)['jvm']
        run: pnpm kotlin-api:check
      - if: fromJSON(needs.plan.outputs.lanes)['dotnet']
        run: pnpm dotnet-api:check
      - run: pnpm cli-surface:check
      - run: pnpm telemetry-surface:check
      # The parts of `pnpm format:check` and `pnpm lint`, so that the part of one language can skip.
      # `pnpm go:fmt:check` and `pnpm go:lint` also read benchmarks/connection-budget/go-probe,
      # which the go lane does not read, so they run in every run.
      - run: pnpm exec oxfmt --check .
      - if: fromJSON(needs.plan.outputs.lanes)['python']
        run: pnpm python:format:check
      - run: pnpm go:fmt:check
      - if: fromJSON(needs.plan.outputs.lanes)['jvm']
        run: pnpm jvm:format:check
      - run: pnpm exec oxlint --deny-warnings --import-plugin --vitest-plugin typescript dashboard site scripts vitest*.config.ts
      - run: pnpm lint:dead-code
      - if: fromJSON(needs.plan.outputs.lanes)['python']
        run: pnpm python:lint
      - run: pnpm go:lint
      - if: fromJSON(needs.plan.outputs.lanes)['ruby']
        run: pnpm ruby:lint
      - if: fromJSON(needs.plan.outputs.lanes)['jvm']
        run: pnpm jvm:lint
      - if: fromJSON(needs.plan.outputs.lanes)['dotnet']
        run: pnpm dotnet:lint
      - run: pnpm npm:vuln
      - if: fromJSON(needs.plan.outputs.lanes)['python']
        run: pnpm python:vuln
      - if: fromJSON(needs.plan.outputs.lanes)['go']
        run: pnpm go:vuln
      - if: fromJSON(needs.plan.outputs.lanes)['rust']
        run: pnpm rust:vuln
      - if: fromJSON(needs.plan.outputs.lanes)['ruby']
        run: pnpm ruby:vuln
      # `jvm:vuln` publishes the JVM artifacts to a scratch repository, resolves their runtime class
      # paths as a caller does, and asks the OSV database about each module.
      - if: fromJSON(needs.plan.outputs.lanes)['jvm']
        run: pnpm jvm:vuln
      # `dotnet:vuln` restores a consumer of the four .NET packages, checks that it resolves each
      # shipped dependency at its floor, and lists every advisory of its graph. NuGet Audit already
      # fails every restore of the solution on an advisory.
      - if: fromJSON(needs.plan.outputs.lanes)['dotnet']
        run: pnpm dotnet:vuln
      # The build and publication tooling, in its own lane under ADR 0058.
      - run: pnpm tooling:vuln
      - run: pnpm typecheck

  unit:
    name: environment-independent tests
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['unit']
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.21 # Pinned to the uv version in mise.toml.
          enable-cache: true
          cache-suffix: unit
      - run: pnpm install --frozen-lockfile
      # Make the Python environment before the tests. Otherwise the first test that runs
      # `uv run --project python` makes it, and its time limit includes the install (SM-1874).
      - run: uv sync --project python
      # The TypeScript part of `pnpm test:unit`, split so each test runs once per change (ADR 0083):
      # the npm-release-scope lane runs the rest of it. The python and go lanes run the whole suite of
      # their language, which contains its unit scope, so this lane runs neither unit scope again.
      - run: pnpm npm:test:python-toolchain

  # The TypeScript unit scope minus the tests that spawn Python tools, which the unit lane runs.
  # `pnpm npm:release-check` runs this suite in release.yml, whose build job installs no Python
  # toolchain. A test here that spawned `uv` once passed CI and failed only the release, so this
  # lane installs what that job installs for the suite. Like that job, it takes Go from the runner
  # image, which `gofmt` in the suite needs. See SM-1098.
  npm-release-scope:
    name: npm release test scope
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['npm-release-scope']
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # A runner image that ships uv would hide the gap this lane exists to show.
      - name: Require a runner without uv
        run: |
          if command -v uv; then
            echo "This lane must run without uv, like the release.yml build job" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # The build the release check runs first. It includes the dashboard bundle, without which
      # dashboard-cli-auth.test.ts skips here but runs in the release.
      - run: pnpm build:runtime:check-dashboard-bundle
      - run: pnpm npm:test:unit

  typescript:
    name: TypeScript (node ${{ matrix.node }}, postgres ${{ matrix.postgres }})
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['typescript']
    # Four cores rather than the two every other job takes. This lane carries the dashboard server,
    # the demo application, the CLI, the adapter suites and the pooling conformance lane, so it runs
    # five times the tests of the Go or Python lane. It also shares its cores with the PostgreSQL
    # service container those tests drive. See SM-835.
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.typescript) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-${{ matrix.postgres }}
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime:dev
      # The pooling conformance lanes in integration-pooling.test.ts. PgBouncer configures from
      # the environment but PgCat needs a generated pgcat.toml mounted into the container, which
      # service containers cannot carry, so the fixture script provisions both poolers and writes
      # the lane URLs into GITHUB_ENV.
      - name: Start the pooling fixture
        run: pnpm pooling:up
      - run: pnpm db:reset:test
      - run: pnpm test:database:typescript
        env:
          WORKHORSE_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Stop the pooling fixture
        if: always()
        run: pnpm pooling:down

  python:
    name: Python ${{ matrix.python }} (postgres ${{ matrix.postgres }})
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['python']
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.python) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
      WORKHORSE_REQUIRE_DATABASE: "1"
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.21 # Pinned to the uv version in mise.toml.
          enable-cache: true
          cache-suffix: python-${{ matrix.python }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime:dev
      - run: pnpm db:reset:test
      - run: pnpm python:test

  go:
    name: Go ${{ matrix.go }} (postgres ${{ matrix.postgres }})
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['go']
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.go) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
      WORKHORSE_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      # setup-go sets GOTOOLCHAIN=local, so the matrix release compiles the suite, not the
      # `toolchain` line of go/go.mod. The log records the real compiler, and the lane fails if it
      # is another release. The weekly run adds the development compiler of mise.toml (SM-1670).
      - name: Record the Go compiler
        working-directory: go
        env:
          MATRIX_GO: ${{ matrix.go }}
        run: |
          set -euo pipefail
          go version
          compiler="$(go env GOVERSION)"
          case "$compiler" in
            "go$MATRIX_GO" | "go$MATRIX_GO".*) ;;
            *)
