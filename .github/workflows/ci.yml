      WORKHORSE_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Set up Gradle before the other tools. If the runner image already has this Gradle version in
      # /usr/bin, the action puts /usr/bin first on the PATH, where /usr/bin/go is an older Go. Each
      # later setup step puts its own directory ahead of /usr/bin, so the pinned tools stay first
      # (SM-1484).
      - id: setup-gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        timeout-minutes: 5
        continue-on-error: true
        with:
          gradle-version: 9.8.2 # Pinned to the gradle version in mise.toml.
          cache-disabled: ${{ env.GRADLE_SETUP_FALLBACK == 'true' }}
      - if: steps.setup-gradle.outcome != 'success'
        run: |
          rm -rf "$RUNNER_TEMP/.gradle-actions/gradle-installations"
          echo "GRADLE_SETUP_FALLBACK=true" >> "$GITHUB_ENV"
      - if: steps.setup-gradle.outcome != 'success'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: 9.8.2 # Pinned to the gradle version in mise.toml.
          cache-disabled: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ fromJSON(needs.plan.outputs.jvm).include[0].java }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/with-env.ts gradle -p jvm :workhorse-kotlin:test :workhorse-spring-boot-starter:test -Pworkhorse.springBoot=snapshot

  ruby-rails:
    name: Ruby Active Job on Rails 8.0
    # The ruby job runs the adapter against Rails 8.1 on every change. The older release is a
    # variation, so it runs weekly as ADR 0083 describes.
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['ruby-rails']
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
      BUNDLE_GEMFILE: ${{ github.workspace }}/ruby/gemfiles/rails_8_0.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
          working-directory: ruby
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset:test
      - run: pnpm ruby:test:active-job

  ruby-rails-main:
    name: Ruby Active Job on Rails main
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['ruby-rails-main']
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    # Rails main previews the next release, so this job reports without blocking a merge, and the
    # required job leaves it out. Its gemfile has no lockfile, so each run resolves the current main.
    continue-on-error: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
      BUNDLE_GEMFILE: ${{ github.workspace }}/ruby/gemfiles/rails_main.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
          working-directory: ruby
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset:test
      - run: pnpm ruby:test:active-job

  demo:
    name: demo and site smoke
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['demo']
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_dev_primary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_PRIMARY: postgres://workhorse:workhorse@localhost:5432/workhorse_dev_primary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The development demo builds its JVM worker's class path with Gradle. Set up Gradle first. The
      # comment in the `static` job gives the reason (SM-1484).
      - id: setup-gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        timeout-minutes: 5
        continue-on-error: true
        with:
          gradle-version: 9.8.2 # Pinned to the gradle version in mise.toml.
          cache-disabled: ${{ env.GRADLE_SETUP_FALLBACK == 'true' }}
      - if: steps.setup-gradle.outcome != 'success'
        run: |
          rm -rf "$RUNNER_TEMP/.gradle-actions/gradle-installations"
          echo "GRADLE_SETUP_FALLBACK=true" >> "$GITHUB_ENV"
      - if: steps.setup-gradle.outcome != 'success'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: 9.8.2 # Pinned to the gradle version in mise.toml.
          cache-disabled: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1 # Pinned to the node version in mise.toml.
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.21 # Pinned to the uv version in mise.toml.
          enable-cache: true
          cache-suffix: demo
      # The development demo runs its JVM worker on the JDK, and its .NET worker with `dotnet run`
      # on the SDK, that mise.toml pins. The SDK goes into its own directory, so the muxer finds no
      # other SDK of the runner image.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25.0.4 # Pinned to the java version in mise.toml.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.403 # Pinned to the dotnet version in mise.toml.
      # The development demo starts its Ruby worker with `bundle exec`. The demo smoke test runs a
      # copy of the tracked files, which lacks the ignored `ruby/.bundle/config` naming the bundle
      # path, so the smoke step names the installed bundle itself.
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: 3.4.11 # Pinned to the ruby version in mise.toml.
          working-directory: ruby
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset:dev-primary
      - run: pnpm build
      - run: pnpm test:demo-smoke:built
        env:
          BUNDLE_PATH: ${{ github.workspace }}/ruby/vendor/bundle
      - run: pnpm test:site-smoke:built

  required:
    name: required
    if: always()
    needs:
      [
        plan,
        static,
        unit,
        npm-release-scope,
        typescript,
        python,
        go,
        runtime-smoke,
        packed,
        rust,
        ruby,
        jvm,
        jvm-verification-metadata,
        dotnet,
        spring-boot,
        ruby-rails,
        demo,
      ]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
      LANES: ${{ needs.plan.outputs.lanes }}
    steps:
      # A lane that the plan selects must succeed, and a lane that it skips must be skipped. A
      # failed, canceled, or unexpectedly skipped lane fails this job, and so does a failed plan.
      - name: Require every lane that the plan selected
        run: |
          set -euo pipefail
          if [ "$(echo "$RESULTS" | jq -r .plan.result)" != success ]; then
            echo "The lane plan did not succeed." >&2
            exit 1
          fi
          mismatches=$(echo "$RESULTS" | jq -c --argjson lanes "$LANES" '
            [to_entries[] | select(.key != "plan")
              | {job: .key, selected: $lanes[.key], result: .value.result}
              | select(if .selected == true then .result != "success"
                  elif .selected == false then .result != "skipped"
                  else true end)]')
          if [ "$mismatches" != "[]" ]; then
            echo "These jobs do not match the lane plan: $mismatches" >&2
            exit 1
          fi

  notify:
    name: report a failed schedule
    # Nobody watches the Actions tab, and a runner that dies uploads no log, so the packed lane
    # failed for eleven nights unseen. A scheduled failure opens an issue instead. See SM-775.
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    needs:
      [
        plan,
        static,
        unit,
        npm-release-scope,
        typescript,
        python,
        go,
        runtime-smoke,
        packed,
        rust,
        ruby,
        jvm,
        jvm-verification-metadata,
        dotnet,
        spring-boot,
        ruby-rails,
        ruby-rails-main,
        demo,
        required,
      ]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Scheduled CI is failing
    steps:
      - name: Open or update the failure issue
        run: |
          set -euo pipefail
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
          body=$(printf '%s failed at %s.\n\nFailed jobs: %s\n\nA runner that runs out of memory uploads no log, so an empty job here means the runner died rather than a check failing.\n' "$RUN_URL" "$GITHUB_SHA" "$failed")
          # Matching the title rather than searching keeps one open issue per outage, because the
          # search index lags a fresh issue by long enough for the next night to open a second one.
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
