      # and tests on one Java release. The static job lints on the pinned JDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm jvm:build
      # Each database test makes its own scratch database from DATABASE_URL_TEST.
      - run: pnpm jvm:test
      # The JVM release dry run of ADR 0103, on the floor lane only: it stages the three artifacts,
      # signs them with a throwaway key that it generates and discards, verifies them, and runs the
      # Java, Kotlin, and Spring Boot consumers from the staged files. It uploads nothing and reads no
      # secret. The first matrix entry is the Java floor of support.json.
      - if: matrix.java == fromJSON(needs.plan.outputs.jvm).include[0].java
        run: pnpm jvm:package-check

  dotnet:
    name: .NET ${{ matrix.dotnet }} (postgres ${{ matrix.postgres }})
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['dotnet']
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.dotnet) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
      WORKHORSE_REQUIRE_DATABASE: "1"
      # RuntimeTests fails when the tests run on another .NET release than the lane names.
      WORKHORSE_DOTNET_RUNTIME: ${{ matrix.dotnet }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Every lane builds on the SDK that mise.toml pins. It carries the .NET 10 runtime. The SDK
      # goes into its own directory, so the muxer finds no other SDK of the runner image.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.403 # Pinned to the dotnet version in mise.toml.
      # A lane for a later release installs its .NET and ASP.NET Core runtimes beside the pinned
      # SDK. The SDK stays the only SDK, so the build does not change (ADR 0107, "Floors").
      - if: matrix.runtime != 'sdk'
        env:
          CHANNEL: ${{ matrix.dotnet }}.0
          QUALITY: ${{ matrix.runtime }}
        # The download host can refuse a download for some minutes, for example with HTTP 409.
        # dotnet-install.sh tries each download three times in about 30 s. Thus this step does the
        # full install again after 30, 60, and 120 s (SM-1874).
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # `set -e` does not apply in a function that an `if` calls, so each command returns on failure.
          install_runtimes() {
            curl -fsSL --retry 3 --retry-all-errors https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh" || return 1
            for runtime in dotnet aspnetcore; do
              bash "$RUNNER_TEMP/dotnet-install.sh" --runtime "$runtime" --channel "$CHANNEL" --quality "$QUALITY" --install-dir "$DOTNET_ROOT" || return 1
            done
          }
          for attempt in 1 2 3 4; do
            if install_runtimes; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::The runtime install failed $attempt times"
              exit 1
            fi
            delay=$((30 * 2 ** (attempt - 1)))
            echo "::warning::The runtime install failed on attempt $attempt. The next attempt starts in $delay s"
            sleep "$delay"
          done
          dotnet --list-runtimes
      - run: pnpm install --frozen-lockfile
      - run: pnpm dotnet:build
      # The tests target net10.0. A lane for a later release rolls them forward to the newest
      # runtime, and a preview lane allows a prerelease runtime. Each database test class shares
      # one scratch database that the tests make from DATABASE_URL_TEST.
      - if: matrix.runtime == 'sdk'
        run: pnpm dotnet:test
      # The .NET release dry run of ADR 0107 on the first lane: it packs the four packages, checks
      # them, and runs the release consumer from a local feed. It publishes nothing.
      - if: matrix.runtime == 'sdk' && matrix.postgres == fromJSON(needs.plan.outputs.dotnet).include[0].postgres
        run: pnpm dotnet:package-check
      - if: matrix.runtime != 'sdk'
        env:
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: ${{ matrix.runtime == 'preview' && '1' || '0' }}
        run: pnpm dotnet:test --property:RollForward=LatestMajor

