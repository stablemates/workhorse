    if: fromJSON(needs.plan.outputs.lanes)['rust']
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.rust) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v1
        with:
          toolchain: 1.89.0 # Pinned to the rust version in mise.toml.
          components: rustfmt, clippy
          # The Cargo workspace is the repository root, so the action's default caches `target/`.
          # Naming `rust` here cached a `rust/target` that never exists, and every run rebuilt
          # the whole dependency graph.
          # The action defaults to `-D warnings`; `rust:clippy` already denies warnings itself.
          rustflags: ""
      - name: Install matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-${{ matrix.postgres }}
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset:test
      # `rust:test` runs the whole suite once, with every optional feature on.
      - run: pnpm rust:gates
      # The snapshot builds rustdoc JSON on the pinned toolchain, so it runs here, where that
      # toolchain and the Cargo cache already are, rather than in the static job. See ADR 0079.
      - run: pnpm rust-api:check
      - run: pnpm rust:test:no-features
        if: github.event.schedule == '17 4 * * 0'
      - run: pnpm rust:package-check
        if: github.event.schedule == '17 4 * * 0'

