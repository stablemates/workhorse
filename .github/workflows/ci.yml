      # that installs the Rails 8.0 lockfile. This step finds a stale one on the pull request that
      # makes it stale. See SM-1230.
      - run: pnpm ruby:lockfile-check
      # Unlike the Go and Rust package checks, this runs on every change (ADR 0083, amended by
      # SM-1138). It takes seconds. The release job checks the gem only on the pinned Ruby, so this
      # step is what loads it on the newest supported Ruby outside the development bundle.
      - run: pnpm ruby:package-check

  jvm:
    name: JVM on Java ${{ matrix.java }} (postgres ${{ matrix.postgres }})
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['jvm']
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.jvm) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
      WORKHORSE_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Set up Gradle before the other tools. If the runner image already has this Gradle version in
      # /usr/bin, the action puts /usr/bin first on the PATH, where /usr/bin/go is an older Go. Each
      # later setup step puts its own directory ahead of /usr/bin, so the pinned tools stay first
      # (SM-1484).
      - id: setup-gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        timeout-minutes: 5
        continue-on-error: true
        with:
          gradle-version: 9.8.2 # Pinned to the gradle version in mise.toml.
          cache-disabled: ${{ env.GRADLE_SETUP_FALLBACK == 'true' }}
      - if: steps.setup-gradle.outcome != 'success'
        run: |
          rm -rf "$RUNNER_TEMP/.gradle-actions/gradle-installations"
          echo "GRADLE_SETUP_FALLBACK=true" >> "$GITHUB_ENV"
      - if: steps.setup-gradle.outcome != 'success'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: 9.8.2 # Pinned to the gradle version in mise.toml.
          cache-disabled: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
