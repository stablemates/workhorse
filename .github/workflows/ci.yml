# Public CI policy lives in docs/decisions/0043-public-ci-and-release-policy.md. Pull requests and
# pushes run the newest supported combination. Daily runs verify packed installs, and weekly runs
# exercise every language/database combination declared in support.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 3 * * *" # Daily packed-install verification.
    - cron: "17 4 * * 0" # Weekly full compatibility matrix.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_HOME: ${{ github.workspace }}/.pnpm-home
  # V8 sizes each heap at 4288 MB whatever the machine has, so two Node processes can promise more
  # memory than the runner owns. A runner that runs out of memory dies without uploading a log,
  # which is how the packed lane failed unseen for eleven nights. The largest single process
  # measured across these lanes is the site build at 1.6 GB. See SM-775.
  #
  # The cap has to hold for the widest lane, not the average one: every runner here has 8 GB except
  # the TypeScript lane's four-core runner, which has 16 GB and spends it on three test workers.
  # Three heaps at this cap fit that runner, and two fit every other one. See SM-835.
  NODE_OPTIONS: --max-old-space-size=2048
  # `uv run` and `uv sync` resolve and rewrite uv.lock when pyproject.toml has moved past it, so a
  # pull request could change a Python dependency and still pass while the committed lockfile named
  # a different version. Under UV_LOCKED the commands fail instead, which makes the lockfile the
  # only thing that decides which Python packages CI executes.
  UV_LOCKED: "1"

jobs:
  plan:
    name: support matrix
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    outputs:
      typescript: ${{ steps.matrix.outputs.typescript }}
      python: ${{ steps.matrix.outputs.python }}
      go: ${{ steps.matrix.outputs.go }}
      packed: ${{ steps.matrix.outputs.packed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: matrix
        run: pnpm --silent exec tsx scripts/ci-matrix.ts "$GITHUB_EVENT_NAME" "${{ github.event.schedule }}" >> "$GITHUB_OUTPUT"

  static:
    name: format, generated files, lint, security, types
    if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * 0'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime:dev
      - run: pnpm sql-catalogues:check
      - run: pnpm dashboard-spec:check
      - run: pnpm dashboard-bundle:check
      - run: pnpm parity:check
      - run: pnpm typescript-api:check
      - run: pnpm python-api:check
      - run: pnpm go-api:check
      - run: pnpm cli-surface:check
      - run: pnpm telemetry-surface:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm npm:vuln
      - run: pnpm python:vuln
      - run: pnpm go:vuln
      - run: pnpm typecheck

  unit:
    name: environment-independent tests
    if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * 0'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime:dev
      - run: pnpm test:unit

  typescript:
    name: TypeScript (node ${{ matrix.node }}, postgres ${{ matrix.postgres }})
    needs: plan
    if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * 0'
    # Four cores rather than the two every other job takes. This lane carries the dashboard server,
    # the demo application, the CLI, the adapter suites and the pooling conformance lane, so it runs
    # five times the tests of the Go or Python lane. It also shares its cores with the PostgreSQL
    # service container those tests drive. See SM-835.
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.typescript) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
      - name: Install matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-${{ matrix.postgres }}
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime:dev
      # The pooling conformance lanes in integration-pooling.test.ts. PgBouncer configures from
      # the environment but PgCat needs a generated pgcat.toml mounted into the container, which
      # service containers cannot carry, so the fixture script provisions both poolers and writes
      # the lane URLs into GITHUB_ENV.
      - name: Start the pooling fixture
        run: pnpm pooling:up
      - run: pnpm db:reset:test
      - run: pnpm test:database:typescript
        env:
          WORKHORSE_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Stop the pooling fixture
        if: always()
        run: pnpm pooling:down

  python:
    name: Python ${{ matrix.python }} (postgres ${{ matrix.postgres }})
    needs: plan
    if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * 0'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.python) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime:dev
      - run: pnpm db:reset:test
      - run: pnpm python:test

  go:
    name: Go ${{ matrix.go }} (postgres ${{ matrix.postgres }})
    needs: plan
    if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * 0'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.go) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime:dev
      - run: pnpm db:reset:test
      - run: pnpm go:test
      - run: pnpm go:test:race

  runtime-smoke:
    name: runtime smoke (${{ matrix.runtime }})
    if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * 0'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://workhorse:workhorse@localhost:5432/workhorse_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.runtime == 'bun'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime:dev
      - run: pnpm db:reset:test
      - run: pnpm test:runtime-smoke:${{ matrix.runtime }}

  packed:
    name: packed install (node ${{ matrix.node }})
    needs: plan
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 3 * * *'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.packed) }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST_PACKED: postgres://workhorse:workhorse@localhost:5432/workhorse_test_packed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset:test-packed
      - run: pnpm test:packed

  demo:
    name: demo and site smoke
    if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * 0'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workhorse
          POSTGRES_PASSWORD: workhorse
          POSTGRES_DB: workhorse_dev_primary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_PRIMARY: postgres://workhorse:workhorse@localhost:5432/workhorse_dev_primary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset:dev-primary
      - run: pnpm build
      - run: pnpm test:demo-smoke:built
      - run: pnpm test:site-smoke:built

  required:
    name: required
    if: always()
    needs: [plan, static, unit, typescript, python, go, runtime-smoke, packed, demo]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every merge-gate job
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'

  notify:
    name: report a failed schedule
    # Nobody watches the Actions tab, and a runner that dies uploads no log, so the packed lane
    # failed for eleven nights unseen. A scheduled failure opens an issue instead. See SM-775.
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    needs: [plan, static, unit, typescript, python, go, runtime-smoke, packed, demo, required]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Scheduled CI is failing
    steps:
      - name: Open or update the failure issue
        run: |
          set -euo pipefail
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
          body=$(printf '%s failed at %s.\n\nFailed jobs: %s\n\nA runner that runs out of memory uploads no log, so an empty job here means the runner died rather than a check failing.\n' "$RUN_URL" "$GITHUB_SHA" "$failed")
          # Matching the title rather than searching keeps one open issue per outage, because the
          # search index lags a fresh issue by long enough for the next night to open a second one.
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
