pre-commit:
  # The hook runs the unit scope of each language only. A unit scope needs no database. CI runs the
  # database suites, and the full suite of each language, on every pull request and `main` push.
  # The build runs alone, before the checks, so that no check reads a `dist` directory while
  # TypeScript rewrites it. Piped jobs stop at the first failure, so a failed build skips the checks.
  piped: true
  jobs:
    # `typescript-api:check` reads the built declarations rather than the source, so without this
    # build a commit was judged against whatever an earlier build left behind.
    - name: build the TypeScript declarations
      glob: "{typescript/*/src/**,typescript/*/package.json,typescript/dashboard-contract/index.d.ts,scripts/typescript-api.ts,scripts/generate-typescript-api.ts,scripts/api-snapshot.ts,api/typescript.txt}"
      run: mise exec -- pnpm build:runtime:dev
    - name: run the commit checks
      group:
        parallel: true
        jobs:
          # The inputs of `scripts/generate-sql-catalogues.ts`, the schema that it reads, and each
          # catalogue that it writes. The check needs no database.
          - name: check generated SQL catalogues
            glob: "{protocol/v1/manifest.json,protocol/v1/governed-surface.json,sql/schema/current.sql,scripts/generate-sql-catalogues.ts,scripts/sql-catalogue-*.ts,scripts/sql-governed-surface.ts,scripts/sql-surface.ts,go/sql_catalogue_generated.go,rust/src/sql_catalogue_generated.rs,jvm/workhorse/src/main/java/run/workhorse/internal/SqlCatalogue.java,typescript/core/src/queue/sql-catalogue.generated.ts,python/src/workhorse/_statements.py,dotnet/src/**/*SqlCatalogue.*,ruby/lib/stablemates/workhorse/sql_catalogue_generated.rb}"
            run: mise exec -- pnpm sql-catalogues:check
          - name: check parity tables
            glob: "{rust/**,rust/PARITY.md,ruby/spec/**,typescript/core/test/support/parity-capabilities.ts,docs/parity.md,scripts/generate-parity-tables.ts}"
            run: mise exec -- pnpm parity:check
          # `pnpm rust:conformance:check` also runs `pnpm parity:check`, which the job above
          # already runs for the same Rust paths. This job runs only the conformance check.
          - name: check generated Rust conformance evidence
            glob: "{rust/**,rust/PARITY.md,docs/rust-conformance.md,scripts/generate-rust-conformance.ts}"
            run: mise exec -- pnpm exec tsx scripts/generate-rust-conformance.ts --check
          - name: check the TypeScript public API snapshot
            glob: "{typescript/*/src/**,typescript/*/package.json,typescript/dashboard-contract/index.d.ts,scripts/typescript-api.ts,scripts/generate-typescript-api.ts,scripts/api-snapshot.ts,api/typescript.txt}"
            run: mise exec -- pnpm typescript-api:check
          - name: check the Python public API snapshot
            glob: "{python/src/**,python/tools/api_snapshot.py,scripts/generate-python-api.ts,scripts/api-snapshot.ts,api/python.txt}"
            run: mise exec -- pnpm python-api:check
          - name: check the Go public API for unaccepted breaks
            glob: "{go/**,scripts/generate-go-api.ts,scripts/api-snapshot.ts,api/go.txt}"
            run: mise exec -- pnpm go-api:check
          # Each package check runs `tsc -b`, which builds the projects its config references into
          # `.build/typecheck` before it checks the package. `tsc -p` only read those outputs, so it
          # failed in a worktree that had never run the root type check. Packages share referenced
          # projects, so these checks run one at a time and never write the same file together.
          - name: check TypeScript package types
            group:
              jobs:
                - name: check core types
                  glob: "typescript/core/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse typecheck
                - name: check adapter conformance types
                  glob: "typescript/adapter-conformance/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse-adapter-conformance typecheck
                - name: check dashboard server types
                  glob: "typescript/dashboard-server/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse-dashboard-server typecheck
                - name: check dashboard types
                  glob: "typescript/dashboard/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse-dashboard typecheck
                - name: check demo types
                  glob: "typescript/demo/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse-demo typecheck
                - name: check drizzle types
                  glob: "typescript/drizzle/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse-drizzle typecheck
                - name: check kysely types
                  glob: "typescript/kysely/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse-kysely typecheck
                - name: check prisma types
                  glob: "typescript/prisma/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse-prisma typecheck
                - name: check typeorm types
                  glob: "typescript/typeorm/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse-typeorm typecheck
                - name: check knex types
                  glob: "typescript/knex/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse-knex typecheck
                - name: check otel types
                  glob: "typescript/otel/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse-otel typecheck
                - name: check dashboard app types
                  glob: "dashboard/app/**"
                  run: mise exec -- pnpm --filter @stablemates/workhorse-dashboard-app typecheck
          - name: check dashboard contract types
            glob: "typescript/dashboard-contract/**"
            run: mise exec -- pnpm --filter @stablemates/workhorse-dashboard-contract typecheck
          - name: check generated dashboard specification
            glob: "{dashboard/v1/**,typescript/dashboard-server/spec/**,typescript/dashboard-server/src/router.ts,typescript/dashboard-server/src/wire.ts,go/dashboard/v1_generated.go,python/src/workhorse/dashboard_v1.py,rust/src/dashboard/v1_generated.rs}"
            run: mise exec -- pnpm dashboard-spec:check
          - name: check generated dashboard bundle
            glob: "{dashboard/app/**,dashboard/v1/bundle/**,dashboard/v1/manifest.json,scripts/build-runtime.ts,scripts/generate-dashboard-bundle.ts,go/dashboard/bundle.json,go/dashboard/read-surface-*.tar.gz,python/src/workhorse/dashboard/bundle.json,python/src/workhorse/dashboard/read-surface-*.tar.gz,rust/dashboard/bundle.json,rust/dashboard/read-surface-*.tar.gz}"
            run: mise exec -- pnpm dashboard-bundle:check
          - name: check Python types
            glob: "python/**"
            run: mise exec -- pnpm python:typecheck
          # CI's format lane rejects what an editor forgot to format on save. Staged files pass
          # through oxfmt itself so its config decides coverage and ignores, exactly as CI does.
          - name: check formatting
            glob: "**/*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml}"
            run: mise exec -- pnpm exec oxfmt --check {staged_files}
          - name: check Rust formatting
            glob: "{rust/**/*.rs,rust/Cargo.toml,rust/Cargo.lock,rustfmt.toml,rust/rust-toolchain.toml}"
            run: mise exec -- pnpm rust:format:check
          # `pnpm rust:test:unit` runs the library and binary targets with `WORKHORSE_NO_DATABASE=1`,
          # which skips the library tests that need a scratch database. The CI `rust` job runs those
          # tests and the integration targets in `rust/tests` and `rust/demo-worker/tests` with
          # `pnpm rust:test` in `pnpm rust:gates`.
          - name: test Rust unit scope
            glob: "{rust/**/*.rs,rust/Cargo.toml,rust/Cargo.lock}"
            run: mise exec -- pnpm rust:test:unit
          # `dotnet format` and a build with the analyzers as errors. CI's `dotnet` job runs the tests.
          - name: lint .NET
            glob: "dotnet/**"
            run: mise exec -- pnpm dotnet:lint
          # Spotless, then the Gradle build with the JVM linters, with no database. The two Gradle
          # builds share `jvm/build`, so they run one at a time. CI's `jvm` job runs the tests.
          - name: check JVM formatting and lint
            group:
              piped: true
              jobs:
                - name: check JVM formatting
                  glob: "jvm/**"
                  run: mise exec -- pnpm jvm:format:check
                - name: lint JVM
                  glob: "jvm/**"
                  run: mise exec -- pnpm jvm:lint
          - name: lint Ruby
            glob: "ruby/**"
            run: mise exec -- pnpm ruby:lint
          - name: lint Python
            glob: "python/**"
            run: mise exec -- pnpm python:lint
          - name: test Python unit scope
            glob: "python/**"
            run: mise exec -- pnpm python:test:unit
          - name: vet Go
            glob: "go/**"
            run: mise exec -- pnpm go:vet
          - name: lint Go
            glob: "go/**"
            run: mise exec -- pnpm go:lint
          - name: test Go unit scope
            glob: "go/**"
            run: mise exec -- pnpm go:test:unit
          - name: check site types
            glob: "site/**"
            run: mise exec -- pnpm docs:typecheck
          - name: test changed scope
            run: mise exec -- pnpm test:changed {staged_files}
          # `vitest related` cannot select tests from a .sql path, so a SQL change names the one
          # schema suite that needs no database. CI's `npm-release-scope` job also runs it, with
          # `pnpm npm:test:unit`. The schema installation and migration suites use PostgreSQL, so
          # CI's `typescript` job runs them with `pnpm test:database:typescript`.
          - name: test schema limits after SQL changes
            glob: "sql/**"
            run: mise exec -- pnpm test:changed typescript/core/test/schema-limits.test.ts

pre-push:
  jobs:
    # The last stop before work leaves the machine. A checkout whose installed versions have
    # drifted from `mise.toml` fails here rather than in CI.
    - name: verify the pinned toolchain
      run: mise exec -- pnpm toolchain:verify

post-checkout:
  jobs:
    - name: install dependencies the checkout needs
      run: |
        # Stop at the first failed step. The script's status is otherwise its last command's, so a
        # failed install followed by a successful prune reported success.
        set -e

        # Git hands post-checkout the previous HEAD, the new HEAD, and a flag that is 1 for a
        # branch checkout and 0 for a file checkout.

        # A freshly created worktree reports the null SHA as its previous HEAD, and only a
        # linked worktree has a git dir distinct from the common dir. Together they mean this
        # tree was just created and has nothing installed yet, so provision it from scratch.
        if [ "{1}" = "0000000000000000000000000000000000000000" ] &&
          [ "$(git rev-parse --git-dir)" != "$(git rev-parse --git-common-dir)" ]; then
          mise exec -- pnpm install --frozen-lockfile
          mise exec -- pnpm worktree:setup
        # Any other branch checkout can still move dependencies underneath us. The primary
        # clone never satisfies the branch above, so switching branches there left node_modules
        # describing the branch being left behind: a dependency added on the branch being
        # entered was simply absent from disk, and the build failed on a missing module.
        # Comparing the lockfile keeps unrelated switches instant. This must stay an elif
        # because the null SHA above is not a valid argument to git diff.
        elif [ "{3}" = "1" ] && ! git diff --quiet "{1}" "{2}" -- pnpm-lock.yaml; then
          mise exec -- pnpm install --frozen-lockfile
        fi
        if [ "{3}" = "1" ] && [ "{1}" != "0000000000000000000000000000000000000000" ]; then
          if ! git diff --quiet "{1}" "{2}" -- python/uv.lock; then
            mise exec -- uv sync --project python --frozen
          fi
          if ! git diff --quiet "{1}" "{2}" -- go/go.sum; then
            mise exec -- go -C go mod download
          fi
        fi
        mise exec -- pnpm worktree:prune

post-merge:
  jobs:
    - name: synchronize changed dependencies and clean removed worktrees
      run: |
        # Stop at the first failed step, as post-checkout does.
        set -e
        if ! git diff --quiet ORIG_HEAD HEAD -- pnpm-lock.yaml; then
          mise exec -- pnpm install --frozen-lockfile
        fi
        if ! git diff --quiet ORIG_HEAD HEAD -- python/uv.lock; then
          mise exec -- uv sync --project python --frozen
        fi
        if ! git diff --quiet ORIG_HEAD HEAD -- go/go.sum; then
          mise exec -- go -C go mod download
        fi
        mise exec -- pnpm worktree:prune
