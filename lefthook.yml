pre-commit:
  jobs:
    - name: check
      run: pnpm format && pnpm lint
      stage_fixed: true
    - name: check types
      run: pnpm typecheck
    - name: test
      run: pnpm test

post-checkout:
  jobs:
    - name: install dependencies for new worktree
      run: |
        if [ "{1}" = "0000000000000000000000000000000000000000" ] &&
          [ "$(git rev-parse --git-dir)" != "$(git rev-parse --git-common-dir)" ]; then
          pnpm install --frozen-lockfile
        fi
