pre-commit:
  parallel: true
  jobs:
    - name: check generated SQL catalogues
      glob: "{protocol/v1/manifest.json,scripts/generate-sql-catalogues.ts,go/sql_catalogue_generated.go,typescript/core/src/queue/sql-catalogue.generated.ts,python/src/workhorse/_statements.py}"
      run: pnpm sql-catalogues:check
    - name: check adapter conformance types
      glob: "typescript/adapter-conformance/**"
      run: pnpm --filter @workhorse-js/adapter-conformance typecheck
    - name: check core types
      glob: "typescript/core/**"
      run: pnpm --filter @workhorse-js/core typecheck
    - name: check dashboard contract types
      glob: "typescript/dashboard-contract/**"
      run: pnpm --filter @workhorse-js/dashboard-contract typecheck
    - name: check dashboard server types
      glob: "typescript/dashboard-server/**"
      run: pnpm --filter @workhorse-js/dashboard-server typecheck
    - name: check generated dashboard specification
      glob: "{dashboard/v1/**,typescript/dashboard-server/spec/**,typescript/dashboard-server/src/router.ts,typescript/dashboard-server/src/wire.ts,go/dashboard/v1_generated.go,python/src/workhorse/dashboard_v1.py}"
      run: pnpm dashboard-spec:check
    - name: check dashboard types
      glob: "typescript/dashboard/**"
      run: pnpm --filter @workhorse-js/dashboard typecheck
    - name: check demo types
      glob: "typescript/demo/**"
      run: pnpm --filter @workhorse-js/demo typecheck
    - name: check drizzle types
      glob: "typescript/drizzle/**"
      run: pnpm --filter @workhorse-js/drizzle typecheck
    - name: check kysely types
      glob: "typescript/kysely/**"
      run: pnpm --filter @workhorse-js/kysely typecheck
    - name: check prisma types
      glob: "typescript/prisma/**"
      run: pnpm --filter @workhorse-js/prisma typecheck
    - name: check typeorm types
      glob: "typescript/typeorm/**"
      run: pnpm --filter @workhorse-js/typeorm typecheck
    - name: check Python types
      glob: "python/**"
      run: pnpm python:typecheck
    - name: vet Go
      glob: "go/**"
      run: pnpm go:vet
    - name: check site types
      glob: "site/**"
      run: pnpm docs:typecheck
    - name: test changed scopes
      group:
        jobs:
          - name: test changed scope
            run: pnpm test:changed {staged_files}
          - name: test changed database scope
            glob: "{typescript/*/src/**,typescript/core/benchmarks/**,typescript/demo/test/app.integration.test.ts,typescript/*/test/integration.test.ts,typescript/core/test/support/**,typescript/core/test/benchmark-conventional.test.ts,typescript/core/test/integration-*.test.ts,typescript/core/test/isolation-canary-*.test.ts,typescript/core/test/schema-installation.test.ts}"
            run: pnpm test:database:changed {staged_files}
          - name: test database scope after SQL changes
            glob: "sql/**"
            run: pnpm test:schema

post-checkout:
  jobs:
    - name: install dependencies the checkout needs
      run: |
        # Git hands post-checkout the previous HEAD, the new HEAD, and a flag that is 1 for a
        # branch checkout and 0 for a file checkout.

        # A freshly created worktree reports the null SHA as its previous HEAD, and only a
        # linked worktree has a git dir distinct from the common dir. Together they mean this
        # tree was just created and has nothing installed yet, so provision it from scratch.
        if [ "{1}" = "0000000000000000000000000000000000000000" ] &&
          [ "$(git rev-parse --git-dir)" != "$(git rev-parse --git-common-dir)" ]; then
          pnpm install --frozen-lockfile
          pnpm worktree:setup
        # Any other branch checkout can still move dependencies underneath us. The primary
        # clone never satisfies the branch above, so switching branches there left node_modules
        # describing the branch being left behind: a dependency added on the branch being
        # entered was simply absent from disk, and the build failed on a missing module.
        # Comparing the lockfile keeps unrelated switches instant. This must stay an elif
        # because the null SHA above is not a valid argument to git diff.
        elif [ "{3}" = "1" ] && ! git diff --quiet "{1}" "{2}" -- pnpm-lock.yaml; then
          pnpm install --frozen-lockfile
        fi
        pnpm worktree:prune

post-merge:
  jobs:
    - name: clean resources left by removed worktrees
      run: pnpm worktree:prune
