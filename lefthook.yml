pre-commit:
  jobs:
    - name: check
      run: pnpm format && pnpm lint
      stage_fixed: true
    - name: check types
      run: pnpm typecheck
    - name: test
      run: pnpm test

post-checkout:
  jobs:
    - name: set up new worktree
      run: |
        if [ "{1}" = "0000000000000000000000000000000000000000" ] &&
          [ "$(git rev-parse --git-dir)" != "$(git rev-parse --git-common-dir)" ]; then
          pnpm install --frozen-lockfile
          pnpm worktree:setup
        fi
        pnpm worktree:prune

post-merge:
  jobs:
    - name: clean resources left by removed worktrees
      run: pnpm worktree:prune
