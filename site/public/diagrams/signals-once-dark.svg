<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 324" width="960" height="324" role="img" aria-labelledby="signals-once-dark-title signals-once-dark-desc">
<title id="signals-once-dark-title">Workhorse accepts only the first delivery of a signal</title>
<desc id="signals-once-dark-desc">The task for ord-381 waits for the approval signal. At 3 h, the review service sends approval with the key review-77, and Workhorse resumes the task. At 3 h + 5 s, the service sends the same key again, and Workhorse returns duplicate. At 3 h + 1 min, a second reviewer sends the key review-78, and Workhorse returns already_delivered with the first payload. The task resumes one time.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="324" fill="#04080e"/>
<text x="316" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">3 h</text>
<text x="564" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">3 h + 5 s</text>
<text x="812" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">3 h + 1 min</text>
<line x1="200" y1="52" x2="928" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="98" fill="#f2f4f5" font-size="10" font-family="Geist Mono">sendSignal</text>
<text x="24" y="174" fill="#f2f4f5" font-size="10" font-family="Geist Mono">Workhorse</text>
<text x="24" y="250" fill="#f2f4f5" font-size="10" font-family="Geist Mono">task</text>
<path d="M 316,116 V 150" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 316,192 V 226" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 564,116 V 150" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 564,192 V 226" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 812,116 V 150" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 812,192 V 226" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="200" y="76" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="76" width="232" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="316" y="94" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">review-77</text>
<text x="316" y="108" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">{ approved: true }</text>
<rect x="448" y="76" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="448" y="76" width="232" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="564" y="94" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">review-77 again</text>
<text x="564" y="108" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the same request</text>
<rect x="696" y="76" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="696" y="76" width="232" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="812" y="94" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">review-78</text>
<text x="812" y="108" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">{ approved: false }</text>
<rect x="200" y="152" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="152" width="232" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="316" y="170" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">delivered</text>
<text x="316" y="184" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">stores the payload</text>
<rect x="448" y="152" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="448" y="152" width="232" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="564" y="170" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">duplicate</text>
<text x="564" y="184" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">returns the stored payload</text>
<rect x="696" y="152" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="696" y="152" width="232" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="812" y="170" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">already_delivered</text>
<text x="812" y="184" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">returns the first payload</text>
<rect x="200" y="228" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="228" width="232" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="316" y="246" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">resumes</text>
<text x="316" y="260" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">one time</text>
<rect x="448" y="228" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="448" y="228" width="232" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="564" y="246" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">no change</text>
<text x="564" y="260" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">does not resume again</text>
<rect x="696" y="228" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="696" y="228" width="232" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="812" y="246" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">no change</text>
<text x="812" y="260" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">does not resume again</text>
<text x="24" y="308" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The first accepted delivery resumes the task. A later delivery does not change it.</text>
</svg>
