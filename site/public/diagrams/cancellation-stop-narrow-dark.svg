<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 374" width="400" height="374" role="img" aria-labelledby="cancellation-stop-narrow-dark-title cancellation-stop-narrow-dark-desc">
<title id="cancellation-stop-narrow-dark-title">Workhorse asks a running handler to stop, and the handler decides when it stops</title>
<desc id="cancellation-stop-narrow-dark-desc">Worker A claims the order.upload task at 0 s, and its heartbeat at 10 s moves the lease to 40 s. At 12 s, an operator cancels the task, and Workhorse records the request. The heartbeat at 20 s returns cancel_requested and does not move the lease. If the handler obeys the signal, it stops and the worker confirms the cancellation. If the handler ignores the signal, the lease expires at 40 s and recovery cancels the task.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="374" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">0 s</text>
<rect x="104" y="24" width="272" height="42" rx="6" fill="#04080e"/>
<rect x="104" y="24" width="272" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="240" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">worker A claims the task</text>
<text x="240" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the lease lasts 30 s</text>
<path d="M 240,66 V 78" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">10 s</text>
<rect x="104" y="80" width="272" height="42" rx="6" fill="#04080e"/>
<rect x="104" y="80" width="272" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="240" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">heartbeat: accepted</text>
<text x="240" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">lease until 40 s</text>
<path d="M 240,122 V 134" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">12 s</text>
<rect x="104" y="136" width="272" height="42" rx="6" fill="#04080e"/>
<rect x="104" y="136" width="272" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="240" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">an operator cancels</text>
<text x="240" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">Workhorse records the request</text>
<path d="M 240,178 V 190" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f2f4f5" font-size="9" font-family="Geist Mono">20 s</text>
<rect x="104" y="192" width="272" height="42" rx="6" fill="#04080e"/>
<rect x="104" y="192" width="272" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="240" y="211" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">heartbeat: cancel_requested</text>
<text x="240" y="225" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the signal is aborted</text>
<path d="M 240,234 V 246 H 110 V 270" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 240,246 H 290 V 270" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="24" y="272" width="172" height="42" rx="6" fill="#04080e"/>
<rect x="24" y="272" width="172" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="110" y="291" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the handler obeys</text>
<text x="110" y="305" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">canceled · the worker confirms</text>
<rect x="204" y="272" width="172" height="42" rx="6" fill="#04080e"/>
<rect x="204" y="272" width="172" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="290" y="291" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the handler ignores</text>
<text x="290" y="305" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">canceled at 40 s · recovery</text>
<text x="24" y="342" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">After the request, a heartbeat does not move</text>
<text x="24" y="357" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the lease. The handler decides when it stops.</text>
</svg>
