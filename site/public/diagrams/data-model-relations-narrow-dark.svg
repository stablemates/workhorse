<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 512" width="400" height="512" role="img" aria-labelledby="data-model-relations-narrow-dark-title data-model-relations-narrow-dark-desc">
<title id="data-model-relations-narrow-dark-title">The task table and the tables that hang from it</title>
<desc id="data-model-relations-narrow-dark-desc">task owns retained enqueue_idempotency keys, at most one live task_runtime row, at most one terminal task_outcome row, exactly one task_query projection, task_redrive edges as the failed source and at most one as the redrive target, task_checkpoint restart boundaries, at most one task_progress row, task_wait timer boundaries, the task_event rows it emits, and the attempt_history rows of its closed attempts. schedule_definition fires schedule_occurrence rows, and each occurrence enqueues at most one task. rate_limit_policy owns rate_limit_bucket token state. concurrency_policy and admission_shard are queue tables without a relation.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="512" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">identity</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task</text>
<text x="244" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">stable identity</text>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">life</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task_runtime · task_outcome</text>
<text x="244" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">0..1 each · exactly one exists</text>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">reads</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task_query · enqueue_idempotency</text>
<text x="244" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">1 projection · 0..n keys</text>
<text x="24" y="217" fill="#f2f4f5" font-size="9" font-family="Geist Mono">durable</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="211" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task_checkpoint · task_wait</text>
<text x="244" y="225" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">0..n · task_progress 0..1</text>
<text x="24" y="273" fill="#f2f4f5" font-size="9" font-family="Geist Mono">history</text>
<rect x="112" y="248" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="248" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="267" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task_event · attempt_history</text>
<text x="244" y="281" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">0..n each</text>
<text x="24" y="329" fill="#f2f4f5" font-size="9" font-family="Geist Mono">redrive</text>
<rect x="112" y="304" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="304" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="323" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task_redrive</text>
<text x="244" y="337" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">0..n source · 0..1 target</text>
<text x="24" y="385" fill="#f2f4f5" font-size="9" font-family="Geist Mono">schedule</text>
<rect x="112" y="360" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="360" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="379" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">schedule_definition</text>
<text x="244" y="393" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">fires schedule_occurrence</text>
<text x="24" y="441" fill="#f2f4f5" font-size="9" font-family="Geist Mono">queue</text>
<rect x="112" y="416" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="416" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="435" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">rate_limit_policy</text>
<text x="244" y="449" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">owns rate_limit_bucket</text>
<text x="24" y="480" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Each table section ends with its</text>
<text x="24" y="495" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">column types.</text>
</svg>
