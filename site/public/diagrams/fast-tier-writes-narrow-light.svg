<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 416" width="400" height="416" role="img" aria-labelledby="fast-tier-writes-narrow-light-title fast-tier-writes-narrow-light-desc">
<title id="fast-tier-writes-narrow-light-title">The writes of one task on the full tier and on the fast tier</title>
<desc id="fast-tier-writes-narrow-light-desc">On the full tier, enqueue writes the task row, a ready task_runtime row, and an enqueued event. The claim changes task_runtime and adds a claimed event. Success writes a task_outcome row, an event, and an attempt_history row. On the fast tier, enqueue writes the task row and a ready fast_task_runtime row. The claim changes only that row. Success writes one fast_task_outcome row. History is written only when the queue enables it.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="400" height="416" fill="#f9fafb"/>
<text x="24" y="49" fill="#1a2027" font-size="9" font-family="Geist Mono">full</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="43" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">enqueue</text>
<text x="244" y="57" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">task · task_runtime · event</text>
<text x="24" y="105" fill="#1a2027" font-size="9" font-family="Geist Mono">full</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="99" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">claim</text>
<text x="244" y="113" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">task_runtime · event</text>
<text x="24" y="161" fill="#1a2027" font-size="9" font-family="Geist Mono">full</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="155" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">success</text>
<text x="244" y="169" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">task_outcome · event · history</text>
<text x="24" y="233" fill="#1a2027" font-size="9" font-family="Geist Mono">fast</text>
<rect x="112" y="208" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="208" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="227" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">enqueue</text>
<text x="244" y="241" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">task · fast_task_runtime</text>
<text x="24" y="289" fill="#1a2027" font-size="9" font-family="Geist Mono">fast</text>
<rect x="112" y="264" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="264" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="283" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">claim</text>
<text x="244" y="297" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">fast_task_runtime</text>
<text x="24" y="345" fill="#1a2027" font-size="9" font-family="Geist Mono">fast</text>
<rect x="112" y="320" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="320" width="264" height="42" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="244" y="339" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">success</text>
<text x="244" y="353" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">fast_task_outcome · no history</text>
<text x="24" y="384" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">On the fast tier, history rows and claimed</text>
<text x="24" y="399" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">events are opt-in for each queue.</text>
</svg>
