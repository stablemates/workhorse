<rect x="788" y="240" width="139" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="857.5" y="258" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">runs the handler</text>
<text x="857.5" y="272" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">attempt 2</text>
<rect x="347" y="316" width="139" height="40" rx="6" fill="#04080e"/>
<rect x="347" y="316" width="139" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="416.5" y="340" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">email 1 sent</text>
<rect x="788" y="316" width="139" height="40" rx="6" fill="#04080e"/>
<rect x="788" y="316" width="139" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="857.5" y="334" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">email 2 sent</text>
<text x="857.5" y="348" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a duplicate</text>
<rect x="204" y="136" width="40" height="12" rx="2" fill="#04080e"/>
<text x="224" y="145" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">CLAIM</text>
<rect x="398.5" y="252" width="36" height="12" rx="2" fill="#04080e"/>
<text x="416.5" y="261" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">SEND</text>
<rect x="792" y="212" width="40" height="12" rx="2" fill="#04080e"/>
<text x="812" y="221" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">CLAIM</text>
<rect x="875.5" y="288" width="36" height="12" rx="2" fill="#04080e"/>
<text x="893.5" y="297" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">SEND</text>
<text x="24" y="392" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The handler ran two times. Write it so that a second run causes no damage.</text>
</svg>
