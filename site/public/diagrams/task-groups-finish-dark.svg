<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-labelledby="task-groups-finish-dark-title task-groups-finish-dark-desc">
<title id="task-groups-finish-dark-title">The last finished member task finishes the group and enqueues its callback</title>
<desc id="task-groups-finish-dark-desc">Queue.taskGroup creates the group for imp-7, enqueues 20,000 imports.row tasks, and seals the group in one transaction. Workers run the rows. 19,998 succeed, and 2 fail after their last retry. In the transaction of the last terminal row, Workhorse finishes the group with the result failed and enqueues the imports.report callback.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="264" fill="#04080e"/>
<path d="M 216,128 H 254" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 476,128 H 514" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 716,128 H 754" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="24" y="96" width="192" height="64" rx="6" fill="#04080e"/>
<rect x="24" y="96" width="192" height="64" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="120" y="126" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Queue.taskGroup</text>
<text x="120" y="140" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">create · add 20,000 · seal</text>
<text x="120" y="184" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">one transaction</text>
<rect x="256" y="56" width="220" height="152" rx="8" fill="rgba(242,244,245,0.02)" stroke="rgba(242,244,245,0.12)" stroke-width="0.8"/>
<rect x="268" y="50" width="152" height="12" rx="2" fill="#04080e"/>
<text x="344" y="59" fill="#95999d" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">MEMBER TASKS · imports.row</text>
<rect x="272" y="76" width="188" height="36" rx="6" fill="#04080e"/>
<rect x="272" y="76" width="188" height="36" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="366" y="98" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">19,998 succeeded</text>
<rect x="272" y="120" width="188" height="36" rx="6" fill="#04080e"/>
<rect x="272" y="120" width="188" height="36" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="366" y="136" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">2 failed</text>
<text x="366" y="150" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">after the last retry</text>
<rect x="272" y="164" width="188" height="32" rx="6" fill="#04080e"/>
<rect x="272" y="164" width="188" height="32" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="366" y="184" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">pending: 0</text>
<rect x="516" y="96" width="200" height="64" rx="6" fill="#04080e"/>
<rect x="516" y="96" width="200" height="64" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="616" y="126" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">group finished</text>
<text x="616" y="140" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">result: failed</text>
<text x="616" y="184" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">in the transaction of the last row</text>
<rect x="756" y="76" width="180" height="48" rx="6" fill="#04080e"/>
<rect x="756" y="76" width="180" height="48" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="846" y="98" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">onFinish</text>
<text x="846" y="112" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">imports.report enqueued</text>
<rect x="756" y="136" width="180" height="48" rx="6" fill="#04080e"/>
<rect x="756" y="136" width="180" height="48" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="846" y="158" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">onSuccess</text>
<text x="846" y="172" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">only for succeeded</text>
<text x="24" y="248" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Each member task counts when it becomes terminal. A retry does not finish a member task.</text>
</svg>
