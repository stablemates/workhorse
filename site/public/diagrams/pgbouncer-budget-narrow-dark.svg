<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 277" width="400" height="277" role="img" aria-labelledby="pgbouncer-budget-narrow-dark-title pgbouncer-budget-narrow-dark-desc">
<title id="pgbouncer-budget-narrow-dark-title">Four workers on one pool share one listener and one heartbeat connection</title>
<desc id="pgbouncer-budget-narrow-dark-desc">Four workers run on one pool of 20 connections. In TypeScript, Go, Python, Ruby, Java, and Kotlin, the four workers share one listener connection and one heartbeat connection from the pool. Thus 18 connections remain for claims and handlers. In Rust, the four workers share one heartbeat connection from the pool, so 19 remain. The shared Rust listener connection is outside the pool, so the server or the pooler must accept one more client.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="277" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">5 SDKs</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">18 remain</text>
<text x="244" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">2 kept: 1 listener, 1 heartbeat</text>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">Rust</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">19 remain</text>
<text x="244" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">1 kept: 1 heartbeat</text>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">Rust</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">1 listener</text>
<text x="244" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">outside the pool</text>
<text x="24" y="200" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">5 SDKs: TypeScript, Go, Python, Ruby, JVM.</text>
<text x="24" y="215" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The workers on one pool share these</text>
<text x="24" y="230" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">connections. The Rust listener needs one</text>
<text x="24" y="245" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">more client of the server or the pooler.</text>
</svg>
