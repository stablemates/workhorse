<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" role="img" aria-labelledby="admin-cli-waits-light-title admin-cli-waits-light-desc">
<title id="admin-cli-waits-light-title">Three read-only commands tell why a task does not finish</title>
<desc id="admin-cli-waits-light-desc">The task order-88 did not finish in one hour. admin checkpoints order-88 shows that the handler completed reserve-stock, so it ran. admin waits order-88 shows no durable timer. admin external-waits lists order-88 with a pending human decision named approval.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="284" fill="#f9fafb"/>
<text x="24" y="40" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">order-88</text>
<text x="24" y="55" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">did not finish in one hour</text>
<path d="M 444,92 H 534" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="24" y="72" width="420" height="40" rx="6" fill="#f9fafb"/>
<rect x="24" y="72" width="420" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="234" y="96" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">admin checkpoints order-88</text>
<rect x="536" y="72" width="400" height="40" rx="6" fill="#f9fafb"/>
<rect x="536" y="72" width="400" height="40" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="736" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">reserve-stock completed</text>
<text x="736" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the handler ran</text>
<path d="M 444,148 H 534" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="24" y="128" width="420" height="40" rx="6" fill="#f9fafb"/>
<rect x="24" y="128" width="420" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="234" y="152" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">admin waits order-88</text>
<rect x="536" y="128" width="400" height="40" rx="6" fill="#f9fafb"/>
<rect x="536" y="128" width="400" height="40" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="736" y="146" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">no durable timer</text>
<text x="736" y="160" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the task does not sleep</text>
<path d="M 444,204 H 534" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="24" y="184" width="420" height="40" rx="6" fill="#f9fafb"/>
<rect x="24" y="184" width="420" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="234" y="208" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">admin external-waits</text>
<rect x="536" y="184" width="400" height="40" rx="6" fill="#f9fafb"/>
<rect x="536" y="184" width="400" height="40" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="736" y="202" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">order-88: approval</text>
<text x="736" y="216" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">a pending human decision</text>
<text x="24" y="268" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">These commands only read. You can run them on production without a confirmation.</text>
</svg>
