<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="rate-limits-keys-light-title rate-limits-keys-light-desc">
<title id="rate-limits-keys-light-title">Each key has its own bucket, so one customer does not delay another</title>
<desc id="rate-limits-keys-light-desc">The perKey bucket of provider-api lets each customer start five tasks each minute, with a burst of two. At 0 s, acme enqueues 20 tasks, and two start. At 6 s, globex enqueues one task. The claim skips the 18 acme tasks, because the acme bucket has no whole token, and the globex task starts. At 12 s, the acme bucket has one new token, and one more acme task starts.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="336" fill="#f9fafb"/>
<text x="24" y="40" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">provider-api</text>
<text x="24" y="55" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">perKey: 5 each minute · burst 2</text>
<text x="260" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">0 s</text>
<text x="351.42857142857144" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">2 s</text>
<text x="442.8571428571429" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">4 s</text>
<text x="534.2857142857142" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">6 s</text>
<text x="625.7142857142858" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">8 s</text>
<text x="717.1428571428571" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">10 s</text>
<text x="808.5714285714286" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">12 s</text>
<text x="900" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">14 s</text>
<line x1="260" y1="52" x2="900" y2="52" stroke="rgba(26,32,39,0.14)"/>
<text x="24" y="88" fill="#1a2027" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">acme</text>
<text x="24" y="103" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">20 tasks</text>
<rect x="260" y="72" width="136" height="40" rx="6" fill="#f9fafb"/>
<rect x="260" y="72" width="136" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="328" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">2 tasks start</text>
<text x="328" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">acme bucket empty</text>
<text x="24" y="144" fill="#1a2027" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">acme</text>
<text x="24" y="159" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">waiting</text>
<rect x="260" y="128" width="548.5714285714286" height="40" rx="6" fill="#f9fafb"/>
<rect x="260" y="128" width="548.5714285714286" height="40" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="534.2857142857142" y="146" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">18 tasks stay ready</text>
<text x="534.2857142857142" y="160" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">no whole acme token</text>
<text x="24" y="200" fill="#1a2027" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">globex</text>
<text x="24" y="215" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">1 task</text>
<rect x="534.2857142857142" y="184" width="136" height="40" rx="6" fill="#f9fafb"/>
<rect x="534.2857142857142" y="184" width="136" height="40" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="602.2857142857142" y="202" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">starts</text>
<text x="602.2857142857142" y="216" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">own bucket full</text>
<text x="24" y="256" fill="#1a2027" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">acme</text>
<text x="24" y="271" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">new token</text>
<rect x="808.5714285714286" y="240" width="136" height="40" rx="6" fill="#f9fafb"/>
<rect x="808.5714285714286" y="240" width="136" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="876.5714285714286" y="258" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">1 task starts</text>
<text x="876.5714285714286" y="272" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">one acme token</text>
<text x="24" y="320" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">A start needs a token from the queue bucket and from the bucket of its key.</text>
</svg>
