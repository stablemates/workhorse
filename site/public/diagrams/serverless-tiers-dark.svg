<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="serverless-tiers-dark-title serverless-tiers-dark-desc">
<title id="serverless-tiers-dark-title">The web tier and the worker tier meet only in PostgreSQL</title>
<desc id="serverless-tiers-dark-desc">The checkout runs on Vercel Node.js. It commits order-42 and its order.fulfill task in one transaction. workhorse worker runs on a Cloud Run worker pool and connects to the same PostgreSQL database. It claims the task and runs the handler. During a deployment, the old worker gets a termination signal, stops claims, and lets active handlers finish.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="260" fill="#04080e"/>
<path d="M 296,124 H 362" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 664,124 H 598" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="306" y="104" width="48" height="12" rx="2" fill="#04080e"/>
<text x="330" y="113" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">COMMIT</text>
<rect x="611" y="104" width="40" height="12" rx="2" fill="#04080e"/>
<text x="631" y="113" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">CLAIM</text>
<rect x="24" y="56" width="272" height="152" rx="8" fill="rgba(242,244,245,0.02)" stroke="rgba(242,244,245,0.12)" stroke-width="0.8"/>
<rect x="36" y="50" width="148" height="12" rx="2" fill="#04080e"/>
<text x="110" y="59" fill="#95999d" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">WEB TIER · VERCEL NODE.JS</text>
<rect x="40" y="76" width="240" height="48" rx="6" fill="#04080e"/>
<rect x="40" y="76" width="240" height="48" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="160" y="98" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">checkout route</text>
<text x="160" y="112" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a request invocation</text>
<rect x="40" y="140" width="240" height="52" rx="6" fill="#04080e"/>
<rect x="40" y="140" width="240" height="52" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="160" y="164" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">order-42 + order.fulfill</text>
<text x="160" y="178" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">one transaction</text>
<rect x="364" y="92" width="232" height="64" rx="6" fill="#04080e"/>
<rect x="364" y="92" width="232" height="64" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="480" y="122" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">PostgreSQL</text>
<text x="480" y="136" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the same database</text>
<rect x="664" y="56" width="272" height="152" rx="8" fill="rgba(242,244,245,0.02)" stroke="rgba(242,244,245,0.12)" stroke-width="0.8"/>
<rect x="676" y="50" width="200" height="12" rx="2" fill="#04080e"/>
<text x="776" y="59" fill="#95999d" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">WORKER TIER · CLOUD RUN WORKER POOL</text>
<rect x="680" y="76" width="240" height="48" rx="6" fill="#04080e"/>
<rect x="680" y="76" width="240" height="48" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="800" y="98" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">workhorse worker</text>
<text x="800" y="112" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a continuous process</text>
<rect x="680" y="140" width="240" height="52" rx="6" fill="#04080e"/>
<rect x="680" y="140" width="240" height="52" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="800" y="164" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">termination signal</text>
<text x="800" y="178" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">stops claims · drains</text>
<text x="24" y="244" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Keep request handlers on the serverless platform. Run the worker on compute that keeps a process.</text>
</svg>
