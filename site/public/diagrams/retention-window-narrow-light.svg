<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 288" width="400" height="288" role="img" aria-labelledby="retention-window-narrow-light-title retention-window-narrow-light-desc">
<title id="retention-window-narrow-light-title">A window is a minimum: the event stays until the pass after it expires</title>
<desc id="retention-window-narrow-light-desc">The event window is 14 days, and the history pass runs each day at 03:00 UTC. A task writes an event on day 1 at 10:00. On day 15 at 03:00, the cutoff is the start of day 1, so the pass keeps the event. At 10:00 the event is 14 days old, and no routine deletes it yet. On day 16 at 03:00, the cutoff is the start of day 2, and the pass drops the day-1 partition.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="400" height="288" fill="#f9fafb"/>
<text x="24" y="49" fill="#1a2027" font-size="9" font-family="Geist Mono">day 1</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="43" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the event is written</text>
<text x="244" y="57" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">10:00 · day-1 partition</text>
<path d="M 248,66 V 78" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="105" fill="#1a2027" font-size="9" font-family="Geist Mono">day 15</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="99" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the pass keeps day 1</text>
<text x="244" y="113" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">03:00 · cutoff: start of day 1</text>
<path d="M 248,122 V 134" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="161" fill="#1a2027" font-size="9" font-family="Geist Mono">day 15</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="155" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the event is 14 days old</text>
<text x="244" y="169" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">10:00 · not deleted yet</text>
<path d="M 248,178 V 190" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="217" fill="#1a2027" font-size="9" font-family="Geist Mono">day 16</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="244" y="211" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the pass drops day 1</text>
<text x="244" y="225" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">03:00 · cutoff: start of day 2</text>
<text x="24" y="256" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The event stays for about 14 days and</text>
<text x="24" y="271" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">17 hours. A window is a minimum.</text>
</svg>
