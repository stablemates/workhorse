<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 247" width="400" height="247" role="img" aria-labelledby="maintenance-cadence-narrow-light-title maintenance-cadence-narrow-light-desc">
<title id="maintenance-cadence-narrow-light-title">Each worker runs the tick at one cadence and the maintenance routines at another</title>
<desc id="maintenance-cadence-narrow-light-desc">Every worker calls tick_v1 every maintenanceIntervalMs, 1 s by default. Under the workhorse:tick advisory lock, tick_v1 promotes scheduled tasks to ready, then recovers expired leases. At the same cadence, and only with scheduleNamespaces set, the worker evaluates schedules. Every maintenanceRoutinePollMs, 60 s by default, it calls run_maintenance_v1, which runs rollup_stats_v1, prune_terminal_storage_v1, prune_worker_registry_v1, retain_history_v1, and prepare_history_partitions_v1 in this order.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="400" height="247" fill="#f9fafb"/>
<text x="24" y="49" fill="#1a2027" font-size="9" font-family="Geist Mono">1 s</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="43" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">tick_v1</text>
<text x="244" y="57" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">promote, then recover</text>
<text x="24" y="105" fill="#1a2027" font-size="9" font-family="Geist Mono">1 s</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="99" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">schedule evaluation</text>
<text x="244" y="113" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">only with scheduleNamespaces</text>
<text x="24" y="161" fill="#1a2027" font-size="9" font-family="Geist Mono">60 s</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="155" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">run_maintenance_v1</text>
<text x="244" y="169" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">five routines in order</text>
<text x="24" y="200" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The defaults of maintenanceIntervalMs</text>
<text x="24" y="215" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">and maintenanceRoutinePollMs.</text>
</svg>
