<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 359" width="400" height="359" role="img" aria-labelledby="stripe-invoice-paid-narrow-dark-title stripe-invoice-paid-narrow-dark-desc">
<title id="stripe-invoice-paid-narrow-dark-title">One Stripe event becomes one credit, also after a retry</title>
<desc id="stripe-invoice-paid-narrow-dark-desc">Stripe sends invoice.paid. The receiver verifies the signature. In one transaction, it writes the inbox row and enqueues a stripe.invoice-paid task with the payload { inboxId }. It replies 200 only after the commit. The worker writes the ledger row and adds one credit in one transaction. A second delivery finds the inbox row, and a second run finds the ledger row.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="359" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">Stripe</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">invoice.paid</text>
<text x="244" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a signed webhook</text>
<path d="M 248,66 V 78" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">receive</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">verify the signature</text>
<text x="244" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the raw body</text>
<path d="M 248,122 V 134" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">commit</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">inbox row + task</text>
<text x="244" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">one transaction</text>
<path d="M 248,178 V 190" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f2f4f5" font-size="9" font-family="Geist Mono">reply</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="211" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">replies 200</text>
<text x="244" y="225" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">only after the commit</text>
<path d="M 248,234 V 246" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="273" fill="#f2f4f5" font-size="9" font-family="Geist Mono">worker</text>
<rect x="112" y="248" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="248" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="267" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">ledger row + one credit</text>
<text x="244" y="281" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">one transaction</text>
<text x="24" y="312" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The customer gets one credit, also</text>
<text x="24" y="327" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">after a retry.</text>
</svg>
