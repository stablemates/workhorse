<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 359" width="400" height="359" role="img" aria-labelledby="slack-approval-narrow-light-title slack-approval-narrow-light-desc">
<title id="slack-approval-narrow-light-title">Each Slack approval process does one job</title>
<desc id="slack-approval-narrow-light-desc">The task handler registers waitForHuman. The notifier finds the committed wait through Admin.listHumanWaits and posts the buttons. A user clicks. The receiver verifies the signed action and commits the first authorized decision within 2,500 ms, before HTTP 200. The decision worker calls completeHumanWait with the stored key and actor.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="400" height="359" fill="#f9fafb"/>
<text x="24" y="49" fill="#1a2027" font-size="9" font-family="Geist Mono">handler</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="43" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">waitForHuman</text>
<text x="244" y="57" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the task waits</text>
<path d="M 248,66 V 78" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="105" fill="#1a2027" font-size="9" font-family="Geist Mono">notifier</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="99" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">posts the buttons</text>
<text x="244" y="113" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">Admin.listHumanWaits</text>
<path d="M 248,122 V 134" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="161" fill="#1a2027" font-size="9" font-family="Geist Mono">Slack</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="155" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">a user clicks</text>
<text x="244" y="169" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">a signed action</text>
<path d="M 248,178 V 190" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="217" fill="#1a2027" font-size="9" font-family="Geist Mono">receiver</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="211" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">commits the decision</text>
<text x="244" y="225" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">HTTP 200 within 2,500 ms</text>
<path d="M 248,234 V 246" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="273" fill="#1a2027" font-size="9" font-family="Geist Mono">worker</text>
<rect x="112" y="248" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="248" width="264" height="42" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="244" y="267" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">completeHumanWait</text>
<text x="244" y="281" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the stored key and actor</text>
<text x="24" y="312" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">HTTP 200 confirms a durable receipt,</text>
<text x="24" y="327" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">not an approval.</text>
</svg>
