<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 247" width="960" height="247" role="img" aria-labelledby="pgbouncer-budget-light-title pgbouncer-budget-light-desc">
<title id="pgbouncer-budget-light-title">Four workers on one pool share one listener and one heartbeat connection</title>
<desc id="pgbouncer-budget-light-desc">Four workers run on one pool of 20 connections. In TypeScript, Go, Python, Ruby, Java, and Kotlin, the four workers share one listener connection and one heartbeat connection from the pool. Thus 18 connections remain for claims and handlers. In Rust, the four workers share one heartbeat connection from the pool, so 19 remain. The shared Rust listener connection is outside the pool, so the server or the pooler must accept one more client.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="247" fill="#f9fafb"/>
<text x="24" y="40" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">one pool of 20</text>
<text x="24" y="55" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">four workers</text>
<text x="200" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">0</text>
<text x="360" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">5</text>
<text x="520" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">10</text>
<text x="680" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">15</text>
<text x="840" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">20</text>
<text x="896" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">outside the pool</text>
<line x1="200" y1="52" x2="840" y2="52" stroke="rgba(26,32,39,0.14)"/>
<line x1="856" y1="52" x2="936" y2="52" stroke="rgba(26,32,39,0.14)"/>
<text x="24" y="84" fill="#1a2027" font-size="10" font-family="Geist Mono" font-weight="400" text-anchor="start">TypeScript, Go, Python,</text>
<text x="24" y="99" fill="#1a2027" font-size="10" font-family="Geist Mono" font-weight="400" text-anchor="start">Ruby, Java, Kotlin</text>
<text x="24" y="114" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">1 listener · 1 heartbeat</text>
<rect x="200" y="72" width="60" height="40" rx="6" fill="#f9fafb"/>
<rect x="200" y="72" width="60" height="40" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="230" y="96" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">2</text>
<rect x="264" y="72" width="576" height="40" rx="6" fill="#f9fafb"/>
<rect x="264" y="72" width="576" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="552" y="96" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">18 for claims and handlers</text>
<text x="24" y="155" fill="#1a2027" font-size="10" font-family="Geist Mono" font-weight="400" text-anchor="start">Rust</text>
<text x="24" y="170" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">1 heartbeat in the pool</text>
<rect x="200" y="136" width="28" height="40" rx="6" fill="#f9fafb"/>
<rect x="200" y="136" width="28" height="40" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="214" y="160" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">1</text>
<rect x="232" y="136" width="608" height="40" rx="6" fill="#f9fafb"/>
<rect x="232" y="136" width="608" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="536" y="160" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">19 for claims and handlers</text>
<rect x="856" y="136" width="80" height="40" rx="6" fill="#f9fafb"/>
<rect x="856" y="136" width="80" height="40" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="896" y="160" fill="#1a2027" font-size="10" font-weight="600" font-family="Geist" text-anchor="middle">1 listener</text>
<text x="24" y="216" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">All the workers on one pool share these connections, so the count does not grow with the workers.</text>
<text x="24" y="231" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The Rust listener is outside the pool, so the server or the pooler must accept one more client.</text>
</svg>
