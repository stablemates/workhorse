<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 304" width="960" height="304" role="img" aria-labelledby="agent-integration-parts-dark-title agent-integration-parts-dark-desc">
<title id="agent-integration-parts-dark-title">The four parts of an integration, and where each one runs</title>
<desc id="agent-integration-parts-dark-desc">The deployment installs the Workhorse schema. When the application starts, it asserts that the schema is compatible. The application inserts order-42 and enqueues order.created in one transaction, with the number of attempts and the time limits. The worker runs the handler, which sends the confirmation email in a checkpoint. Then the application reads the task by its identifier.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
