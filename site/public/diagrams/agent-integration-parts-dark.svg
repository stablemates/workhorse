<rect x="720" y="48" width="216" height="200" rx="8" fill="rgba(242,244,245,0.02)" stroke="rgba(242,244,245,0.12)" stroke-width="0.8"/>
<rect x="732" y="42" width="44" height="12" rx="2" fill="#04080e"/>
<text x="754" y="51" fill="#95999d" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">WORKER</text>
<rect x="40" y="76" width="160" height="52" rx="6" fill="#04080e"/>
<rect x="40" y="76" width="160" height="52" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="120" y="100" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">1 · schema install</text>
<text x="120" y="114" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">workhorse schema install</text>
<rect x="256" y="76" width="160" height="52" rx="6" fill="#04080e"/>
<rect x="256" y="76" width="160" height="52" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="336" y="100" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">assert compatible</text>
<text x="336" y="114" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">when the app starts</text>
<rect x="476" y="76" width="204" height="52" rx="6" fill="#04080e"/>
<rect x="476" y="76" width="204" height="52" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="578" y="100" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">2 · enqueue + 4 · policy</text>
<text x="578" y="114" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">order-42 and order.created</text>
<rect x="736" y="76" width="160" height="52" rx="6" fill="#04080e"/>
<rect x="736" y="76" width="160" height="52" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="816" y="100" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">3 · handler</text>
<text x="816" y="114" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the email in a checkpoint</text>
<rect x="476" y="198" width="204" height="44" rx="6" fill="#04080e"/>
<rect x="476" y="198" width="204" height="44" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="578" y="218" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">read the task</text>
<text x="578" y="232" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">by its identifier</text>
<text x="578" y="146" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">one transaction · attempts · time limits</text>
<text x="24" y="288" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The deployment owns the schema. The application does not install it when it starts.</text>
</svg>
