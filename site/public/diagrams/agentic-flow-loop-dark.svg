<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="agentic-flow-loop-dark-title agentic-flow-loop-dark-desc">
<title id="agentic-flow-loop-dark-title">The agent loop runs four times, but the model plans one time</title>
<desc id="agentic-flow-loop-dark-desc">The agent.loop handler for conv-12 runs four times. Run 1 on worker A calls the model in the plan checkpoint and creates the research and calculate child tasks. Run 2 on worker B gets the stored plan and the stored tool results, and starts the model-cooldown timer. Run 3 gets past the timer and waits for the approval signal. Run 4 gets the approval and completes the answer.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="336" fill="#04080e"/>
<text x="24" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">agent.loop</text>
<text x="24" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">conv-12</text>
<text x="268.8" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">checkpoint("plan")</text>
<text x="418.40000000000003" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">runChildrenAll</text>
<text x="568" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">sleep("model-cooldown")</text>
<text x="717.5999999999999" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">waitForSignal("approval")</text>
<text x="867.1999999999999" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">complete</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="88" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">Run 1</text>
<text x="24" y="103" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">worker A</text>
<rect x="200" y="72" width="137.6" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="72" width="137.6" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="268.8" y="90" fill="#f2f4f5" font-size="10" font-weight="600" font-family="Geist" text-anchor="middle">calls the model</text>
<text x="268.8" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">stores the plan</text>
<rect x="349.6" y="72" width="137.6" height="40" rx="6" fill="#04080e"/>
<rect x="349.6" y="72" width="137.6" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="418.40000000000003" y="90" fill="#f2f4f5" font-size="10" font-weight="600" font-family="Geist" text-anchor="middle">creates 2 child tasks</text>
<text x="418.40000000000003" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">waits · frees slot</text>
<text x="568" y="96" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">not reached</text>
<text x="717.5999999999999" y="96" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">not reached</text>
<text x="867.1999999999999" y="96" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">not reached</text>
<text x="24" y="144" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">Run 2</text>
<text x="24" y="159" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">after the tools</text>
<rect x="200" y="128" width="137.6" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="128" width="137.6" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="268.8" y="146" fill="#f2f4f5" font-size="10" font-weight="600" font-family="Geist" text-anchor="middle">stored plan</text>
<text x="268.8" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no model call</text>
<rect x="349.6" y="128" width="137.6" height="40" rx="6" fill="#04080e"/>
<rect x="349.6" y="128" width="137.6" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="418.40000000000003" y="146" fill="#f2f4f5" font-size="10" font-weight="600" font-family="Geist" text-anchor="middle">stored results</text>
<text x="418.40000000000003" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no tool runs</text>
<rect x="499.2" y="128" width="137.6" height="40" rx="6" fill="#04080e"/>
<rect x="499.2" y="128" width="137.6" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="568" y="146" fill="#f2f4f5" font-size="10" font-weight="600" font-family="Geist" text-anchor="middle">starts timer</text>
<text x="568" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">waits</text>
<text x="717.5999999999999" y="152" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">not reached</text>
<text x="867.1999999999999" y="152" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">not reached</text>
<text x="24" y="200" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">Run 3</text>
<text x="24" y="215" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">after the cooldown</text>
<rect x="200" y="184" width="137.6" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="184" width="137.6" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="268.8" y="202" fill="#f2f4f5" font-size="10" font-weight="600" font-family="Geist" text-anchor="middle">stored plan</text>
<text x="268.8" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no model call</text>
<rect x="349.6" y="184" width="137.6" height="40" rx="6" fill="#04080e"/>
<rect x="349.6" y="184" width="137.6" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
