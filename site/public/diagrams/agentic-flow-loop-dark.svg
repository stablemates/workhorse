<text x="418.40000000000003" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no tool runs</text>
<rect x="499.2" y="184" width="137.6" height="40" rx="6" fill="#04080e"/>
<rect x="499.2" y="184" width="137.6" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="568" y="202" fill="#f2f4f5" font-size="10" font-weight="600" font-family="Geist" text-anchor="middle">timer done</text>
<text x="568" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">returns</text>
<rect x="648.8" y="184" width="137.6" height="40" rx="6" fill="#04080e"/>
<rect x="648.8" y="184" width="137.6" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="717.5999999999999" y="202" fill="#f2f4f5" font-size="10" font-weight="600" font-family="Geist" text-anchor="middle">waits</text>
<text x="717.5999999999999" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">for approval</text>
<text x="867.1999999999999" y="208" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">not reached</text>
<text x="24" y="256" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">Run 4</text>
<text x="24" y="271" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">after sendSignal</text>
<rect x="200" y="240" width="137.6" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="240" width="137.6" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="268.8" y="258" fill="#f2f4f5" font-size="10" font-weight="600" font-family="Geist" text-anchor="middle">stored plan</text>
<text x="268.8" y="272" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no model call</text>
<rect x="349.6" y="240" width="137.6" height="40" rx="6" fill="#04080e"/>
<rect x="349.6" y="240" width="137.6" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
