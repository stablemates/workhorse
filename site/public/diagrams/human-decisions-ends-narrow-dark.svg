<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" width="400" height="304" role="img" aria-labelledby="human-decisions-ends-narrow-dark-title human-decisions-ends-narrow-dark-desc">
<title id="human-decisions-ends-narrow-dark-title">A result resumes a pending decision, and a time limit or a cancellation ends it</title>
<desc id="human-decisions-ends-narrow-dark-desc">The task for acct-19 waits on account-review. If an operator selects the Approve quick action, or the custom tool calls completeHumanWait with rev-4, Workhorse stores the result and the task becomes ready. If nobody answers before timeoutMs passes, maintenance fails the task with a deadline error. If the app cancels the task, Workhorse cancels it at once. After a failure or a cancellation, a late answer returns stale.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="304" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="start">quick action</text>
<rect x="176" y="24" width="200" height="42" rx="6" fill="#04080e"/>
<rect x="176" y="24" width="200" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="276" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Approve: completed</text>
<text x="276" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the task is ready</text>
<text x="24" y="105" fill="#f2f4f5" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="start">completeHumanWait</text>
<rect x="176" y="80" width="200" height="42" rx="6" fill="#04080e"/>
<rect x="176" y="80" width="200" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="276" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">rev-4: completed</text>
<text x="276" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the task is ready</text>
<text x="24" y="161" fill="#f2f4f5" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="start">timeoutMs passes</text>
<rect x="176" y="136" width="200" height="42" rx="6" fill="#04080e"/>
<rect x="176" y="136" width="200" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="276" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">maintenance: failed</text>
<text x="276" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a late answer: stale</text>
<text x="24" y="217" fill="#f2f4f5" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="start">cancellation</text>
<rect x="176" y="192" width="200" height="42" rx="6" fill="#04080e"/>
<rect x="176" y="192" width="200" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="276" y="211" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">cancel: canceled</text>
<text x="276" y="225" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a late answer: stale</text>
<text x="24" y="256" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">A result resumes the task. A time limit or</text>
<text x="24" y="271" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">a cancellation ends it, and a late answer</text>
<text x="24" y="286" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">returns stale.</text>
</svg>
