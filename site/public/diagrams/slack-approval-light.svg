<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 192" width="960" height="192" role="img" aria-labelledby="slack-approval-light-title slack-approval-light-desc">
<title id="slack-approval-light-title">Each Slack approval process does one job</title>
<desc id="slack-approval-light-desc">The task handler registers waitForHuman. The notifier finds the committed wait through Admin.listHumanWaits and posts the buttons. A user clicks. The receiver verifies the signed action and commits the first authorized decision within 2,500 ms, before HTTP 200. The decision worker calls completeHumanWait with the stored key and actor.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="192" fill="#f9fafb"/>
<rect x="24" y="64" width="168" height="52" rx="6" fill="#f9fafb"/>
<rect x="24" y="64" width="168" height="52" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="108" y="88" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task handler</text>
<text x="108" y="102" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">waitForHuman</text>
<path d="M 192,90 H 208" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="210" y="64" width="168" height="52" rx="6" fill="#f9fafb"/>
<rect x="210" y="64" width="168" height="52" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="294" y="88" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">notifier</text>
<text x="294" y="102" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">posts the buttons</text>
<path d="M 378,90 H 394" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="396" y="64" width="168" height="52" rx="6" fill="#f9fafb"/>
<rect x="396" y="64" width="168" height="52" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="480" y="88" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Slack user</text>
<text x="480" y="102" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">clicks a button</text>
<path d="M 564,90 H 580" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="582" y="64" width="168" height="52" rx="6" fill="#f9fafb"/>
<rect x="582" y="64" width="168" height="52" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="666" y="88" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">receiver</text>
<text x="666" y="102" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">commits · HTTP 200</text>
<path d="M 750,90 H 766" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="768" y="64" width="168" height="52" rx="6" fill="#f9fafb"/>
<rect x="768" y="64" width="168" height="52" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="852" y="88" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">decision worker</text>
<text x="852" y="102" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">completeHumanWait</text>
<text x="666" y="140" fill="#6d7277" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">within 2,500 ms</text>
<text x="24" y="176" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">HTTP 200 confirms a durable receipt. It does not confirm an approval or a task completion.</text>
</svg>
