<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 252" width="960" height="252" role="img" aria-labelledby="django-tasks-acceptance-dark-title django-tasks-acceptance-dark-desc">
<title id="django-tasks-acceptance-dark-title">A TaskResult shows acceptance; the outer block decides the commit</title>
<desc id="django-tasks-acceptance-dark-desc">The request opens transaction.atomic(using="business"). In an inner atomic block, greet.enqueue("Ada") returns a TaskResult with the status READY and a task ID. A later statement in the outer block fails, and Django rolls back the outer block. PostgreSQL removes the task, and the task ID identifies no task.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="252" fill="#04080e"/>
<rect x="24" y="48" width="640" height="156" rx="8" fill="rgba(242,244,245,0.02)" stroke="rgba(242,244,245,0.12)" stroke-width="0.8"/>
<rect x="36" y="42" width="216" height="12" rx="2" fill="#04080e"/>
<text x="144" y="51" fill="#95999d" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">OUTER BLOCK · atomic(using="business")</text>
<rect x="40" y="80" width="300" height="108" rx="8" fill="rgba(242,244,245,0.02)" stroke="rgba(242,244,245,0.12)" stroke-width="0.8"/>
<rect x="52" y="74" width="108" height="12" rx="2" fill="#04080e"/>
<text x="106" y="83" fill="#95999d" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">INNER ATOMIC BLOCK</text>
<path d="M 324,134 H 366" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 648,134 H 702" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="56" y="108" width="268" height="52" rx="6" fill="#04080e"/>
<rect x="56" y="108" width="268" height="52" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="190" y="132" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">greet.enqueue("Ada")</text>
<text x="190" y="146" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">TaskResult · READY · task ID</text>
<rect x="368" y="108" width="280" height="52" rx="6" fill="#04080e"/>
<rect x="368" y="108" width="280" height="52" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="508" y="132" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">a later statement fails</text>
<text x="508" y="146" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">Django rolls back the outer block</text>
<rect x="704" y="108" width="232" height="52" rx="6" fill="#04080e"/>
<rect x="704" y="108" width="232" height="52" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="820" y="132" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the task is gone</text>
<text x="820" y="146" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">its task ID identifies no task</text>
<text x="24" y="236" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">A TaskResult shows that Workhorse accepted the task. It does not show that the transaction committed.</text>
</svg>
