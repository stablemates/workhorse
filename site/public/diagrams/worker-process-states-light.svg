<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" width="960" height="608" role="img" aria-labelledby="worker-process-states-light-title worker-process-states-light-desc">
<title id="worker-process-states-light-title">Every state of a worker process, and how the process leaves it</title>
<desc id="worker-process-states-light-desc">A worker process starts in starting. From starting, a configuration or probe failure exits with failure, every run loop started with readiness true makes it running, and a first signal makes it draining after startup completes. From running, a first SIGTERM or SIGINT makes it draining, and a fatal worker-loop failure makes it failing. From failing, the process exits with failure when its siblings settle or the deadline is missed. From draining, it exits with code 0 when handlers settle and resources close cleanly, with code 1 when a run loop or close rejects or the deadline is missed, with 130 on a second SIGINT, and with 143 on a second SIGTERM.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
