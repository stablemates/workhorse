<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" width="960" height="364" role="img" aria-labelledby="quickstart-crash-light-title quickstart-crash-light-desc">
<title id="quickstart-crash-light-title">The worker stops after the charge, and the next run does not charge again</title>
<desc id="quickstart-crash-light-desc">Run 1 of crash-demo.ts prints charging card, commits the charge checkpoint, and stops the process. The lease of 5 s expires, and the task is available again. Run 2 enqueues with the key order:42 and gets the same task. Its handler starts from the top. The charge checkpoint returns the stored result and prints nothing. The label checkpoint runs, and the task succeeds.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="364" fill="#f9fafb"/>
<text x="312" y="52" fill="#1a2027" font-size="10" font-family="Geist Mono" font-weight="400" text-anchor="middle">checkpoint("charge")</text>
<text x="564" y="52" fill="#1a2027" font-size="10" font-family="Geist Mono" font-weight="400" text-anchor="middle">checkpoint("label")</text>
<text x="816" y="52" fill="#1a2027" font-size="10" font-family="Geist Mono" font-weight="400" text-anchor="middle">return</text>
<line x1="192" y1="68" x2="936" y2="68" stroke="rgba(26,32,39,0.14)"/>
<text x="24" y="98" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">Run 1</text>
<text x="24" y="113" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">node crash-demo.ts</text>
<rect x="192" y="84" width="240" height="48" rx="6" fill="#f9fafb"/>
<rect x="192" y="84" width="240" height="48" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="312" y="106" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">charging card…</text>
<text x="312" y="120" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the checkpoint commits</text>
<rect x="444" y="84" width="240" height="48" rx="6" fill="#f9fafb"/>
<rect x="444" y="84" width="240" height="48" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="564" y="106" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the process stops</text>
<text x="564" y="120" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">before the label</text>
<text x="816" y="111" fill="#6d7277" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">not reached</text>
<rect x="192" y="148" width="744" height="40" rx="6" fill="#f9fafb"/>
<rect x="192" y="148" width="744" height="40" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="564" y="172" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">the lease of 5 s expires · the task is available again</text>
<text x="24" y="172" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the lease</text>
<rect x="192" y="204" width="744" height="40" rx="6" fill="#f9fafb"/>
<rect x="192" y="204" width="744" height="40" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="564" y="222" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">same task</text>
<text x="564" y="236" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the second run enqueues with the key order:42</text>
<text x="24" y="228" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the enqueue</text>
<text x="24" y="274" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">Run 2</text>
<text x="24" y="289" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">SURVIVED=1</text>
<rect x="192" y="260" width="240" height="48" rx="6" fill="#f9fafb"/>
<rect x="192" y="260" width="240" height="48" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="312" y="282" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">stored result</text>
<text x="312" y="296" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">charging card… does not print</text>
<rect x="444" y="260" width="240" height="48" rx="6" fill="#f9fafb"/>
<rect x="444" y="260" width="240" height="48" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="564" y="282" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">printing shipping label…</text>
<text x="564" y="296" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the checkpoint commits</text>
<rect x="696" y="260" width="240" height="48" rx="6" fill="#f9fafb"/>
<rect x="696" y="260" width="240" height="48" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="816" y="282" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the task succeeds</text>
<text x="816" y="296" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">chargeId and labelId</text>
<text x="24" y="348" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The card is charged one time. A handler starts from the top, and its named checkpoints do not run again.</text>
</svg>
