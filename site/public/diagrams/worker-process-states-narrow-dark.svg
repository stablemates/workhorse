<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 695" width="400" height="695" role="img" aria-labelledby="worker-process-states-narrow-dark-title worker-process-states-narrow-dark-desc">
<title id="worker-process-states-narrow-dark-title">Every state of a worker process, and how the process leaves it</title>
<desc id="worker-process-states-narrow-dark-desc">A worker process starts in starting. From starting, a configuration or probe failure exits with failure, every run loop started with readiness true makes it running, and a first signal makes it draining after startup completes. From running, a first SIGTERM or SIGINT makes it draining, and a fatal worker-loop failure makes it failing. From failing, the process exits with failure when its siblings settle or the deadline is missed. From draining, it exits with code 0 when handlers settle and resources close cleanly, with code 1 when a run loop or close rejects or the deadline is missed, with 130 on a second SIGINT, and with 143 on a second SIGTERM.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="695" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">start</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ starting</text>
<text x="244" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the process starts</text>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">starting</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ exited_failure · code 1</text>
<text x="244" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">configuration or probe failure</text>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">starting</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ running</text>
<text x="244" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">every run loop started, readiness true</text>
<text x="24" y="217" fill="#f2f4f5" font-size="9" font-family="Geist Mono">starting</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="211" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ draining</text>
<text x="244" y="225" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">first signal, after startup completes</text>
<text x="24" y="273" fill="#f2f4f5" font-size="9" font-family="Geist Mono">running</text>
<rect x="112" y="248" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="248" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="267" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ draining</text>
<text x="244" y="281" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">first SIGTERM or SIGINT</text>
<text x="24" y="329" fill="#f2f4f5" font-size="9" font-family="Geist Mono">running</text>
<rect x="112" y="304" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="304" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="323" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ failing</text>
<text x="244" y="337" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">fatal worker-loop failure</text>
<text x="24" y="385" fill="#f2f4f5" font-size="9" font-family="Geist Mono">failing</text>
<rect x="112" y="360" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="360" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="379" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ exited_failure · code 1</text>
<text x="244" y="393" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">siblings settle or deadline missed</text>
<text x="24" y="441" fill="#f2f4f5" font-size="9" font-family="Geist Mono">draining</text>
<rect x="112" y="416" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="416" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="435" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ exited_ok · code 0</text>
<text x="244" y="449" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">handlers settle, resources close cleanly</text>
<text x="24" y="497" fill="#f2f4f5" font-size="9" font-family="Geist Mono">draining</text>
<rect x="112" y="472" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="472" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="491" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ exited_failure · code 1</text>
<text x="244" y="505" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">run loop or close rejects, or deadline missed</text>
<text x="24" y="553" fill="#f2f4f5" font-size="9" font-family="Geist Mono">draining</text>
<rect x="112" y="528" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="528" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="547" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ exit_130 · code 130</text>
<text x="244" y="561" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">second SIGINT</text>
<text x="24" y="609" fill="#f2f4f5" font-size="9" font-family="Geist Mono">draining</text>
<rect x="112" y="584" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="584" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="603" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ exit_143 · code 143</text>
<text x="244" y="617" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">second SIGTERM</text>
<text x="24" y="648" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Grouped by the state that each</text>
<text x="24" y="663" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">transition leaves.</text>
</svg>
