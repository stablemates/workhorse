<rect x="112" y="472" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="472" width="264" height="42" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
