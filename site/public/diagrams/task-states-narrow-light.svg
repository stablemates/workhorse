<rect x="112" y="640" width="264" height="42" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="659" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ canceled</text>
