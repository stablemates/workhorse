<text x="244" y="113" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">due</text>
<text x="24" y="161" fill="#1a2027" font-size="9" font-family="Geist Mono">enqueue</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="155" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ scheduled</text>
<text x="244" y="169" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">in the future</text>
<text x="24" y="217" fill="#1a2027" font-size="9" font-family="Geist Mono">blocked</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="211" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ ready</text>
<text x="244" y="225" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">prerequisite succeeds after run_at</text>
<text x="24" y="273" fill="#1a2027" font-size="9" font-family="Geist Mono">blocked</text>
<rect x="112" y="248" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="248" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="267" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ scheduled</text>
<text x="244" y="281" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">prerequisite succeeds before run_at</text>
<text x="24" y="329" fill="#1a2027" font-size="9" font-family="Geist Mono">blocked</text>
<rect x="112" y="304" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="304" width="264" height="42" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="323" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ canceled</text>
<text x="244" y="337" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">cancel immediately</text>
<text x="24" y="385" fill="#1a2027" font-size="9" font-family="Geist Mono">scheduled</text>
