<text x="244" y="603" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ active</text>
<text x="244" y="617" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">heartbeat / cancel request</text>
<text x="24" y="665" fill="#1a2027" font-size="9" font-family="Geist Mono">active</text>
