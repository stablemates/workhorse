<text x="244" y="505" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">claim</text>
<text x="24" y="553" fill="#1a2027" font-size="9" font-family="Geist Mono">ready</text>
<rect x="112" y="528" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="528" width="264" height="42" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="547" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">→ canceled</text>
<text x="244" y="561" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">cancel immediately</text>
<text x="24" y="609" fill="#1a2027" font-size="9" font-family="Geist Mono">active</text>
