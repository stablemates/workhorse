<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="idempotency-outcomes-dark-title idempotency-outcomes-dark-desc">
<title id="idempotency-outcomes-dark-title">One key gives one task. A changed request with the same key fails</title>
<desc id="idempotency-outcomes-dark-desc">The first request for capture:7781 binds the key and creates the invoice.capture task. The same request again finds the key and returns the same taskId. A request with the same key and a different payload raises a conflict error. The original task does not change, and Workhorse creates no second task.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="280" fill="#04080e"/>
<text x="24" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">capture:7781</text>
<text x="24" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">scope invoice-capture</text>
<text x="317.3333333333333" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">the first request</text>
<text x="568" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">the same request again</text>
<text x="818.6666666666666" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">a different payload</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="97" fill="#f2f4f5" font-size="10" font-family="Geist Mono">request</text>
<rect x="200" y="72" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="72" width="234.66666666666666" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="317.3333333333333" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">invoice.capture</text>
<text x="317.3333333333333" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">{ invoiceId: 7781 }</text>
<rect x="450.66666666666663" y="72" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="450.66666666666663" y="72" width="234.66666666666666" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="568" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">invoice.capture</text>
<text x="568" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the same data</text>
<rect x="701.3333333333333" y="72" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="701.3333333333333" y="72" width="234.66666666666666" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="818.6666666666666" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">invoice.capture</text>
<text x="818.6666666666666" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the payload is different</text>
<text x="24" y="153" fill="#f2f4f5" font-size="10" font-family="Geist Mono">Workhorse</text>
<rect x="200" y="128" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="128" width="234.66666666666666" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="317.3333333333333" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">binds the key</text>
<text x="317.3333333333333" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">creates the task</text>
<rect x="450.66666666666663" y="128" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="450.66666666666663" y="128" width="234.66666666666666" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="568" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">finds the key</text>
<text x="568" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the request is the same</text>
<rect x="701.3333333333333" y="128" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="701.3333333333333" y="128" width="234.66666666666666" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="818.6666666666666" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">finds the key</text>
<text x="818.6666666666666" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">compares the request</text>
<text x="24" y="209" fill="#f2f4f5" font-size="10" font-family="Geist Mono">result</text>
<rect x="200" y="184" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="184" width="234.66666666666666" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="317.3333333333333" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">accepted</text>
<text x="317.3333333333333" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a new taskId</text>
<rect x="450.66666666666663" y="184" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="450.66666666666663" y="184" width="234.66666666666666" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="568" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">replayed</text>
<text x="568" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the same taskId</text>
<rect x="701.3333333333333" y="184" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="701.3333333333333" y="184" width="234.66666666666666" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="818.6666666666666" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">conflict error</text>
<text x="818.6666666666666" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no change · no second task</text>
<text x="24" y="264" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Workhorse records the first request. Each later request with the same key must be the same.</text>
</svg>
