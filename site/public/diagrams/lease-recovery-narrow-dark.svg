<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 415" width="400" height="415" role="img" aria-labelledby="lease-recovery-narrow-dark-title lease-recovery-narrow-dark-desc">
<title id="lease-recovery-narrow-dark-title">Recovery replaces the generation, so the late write of the old worker matches no row</title>
<desc id="lease-recovery-narrow-dark-desc">Worker A calls claim_many_v1 and gets the task with attempt 1 and fence 41. Its heartbeat_many_v1 with fence 41 is accepted, and expires_at is extended. Then A stalls past its lease. Worker B calls tick_v1, which calls recover_expired_v1: the lease expires, and the task is ready with attempt 2. B calls claim_many_v1 and gets attempt 2 with fence 42. The late complete_v1 of A with fence 41 returns false, because no generation matches. The complete_v1 of B with fence 42 returns true: the runtime row is deleted, and the outcome is inserted.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="415" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">A</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">claim_many_v1</text>
<text x="244" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">attempt 1, fence 41</text>
<path d="M 248,66 V 78" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">A</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">heartbeat_many_v1</text>
<text x="244" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">accepted · A then stalls</text>
<path d="M 248,122 V 134" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">B</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">tick_v1</text>
<text x="244" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">recover_expired_v1 · attempt 2</text>
<path d="M 248,178 V 190" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f2f4f5" font-size="9" font-family="Geist Mono">B</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="211" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">claim_many_v1</text>
<text x="244" y="225" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">attempt 2, fence 42</text>
<path d="M 248,234 V 246" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="273" fill="#f2f4f5" font-size="9" font-family="Geist Mono">A</text>
<rect x="112" y="248" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="248" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="267" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">complete_v1 (fence 41)</text>
<text x="244" y="281" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">false, no generation matches</text>
<path d="M 248,290 V 302" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="329" fill="#f2f4f5" font-size="9" font-family="Geist Mono">B</text>
<rect x="112" y="304" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="304" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="323" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">complete_v1 (fence 42)</text>
<text x="244" y="337" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">true, outcome inserted</text>
<text x="24" y="368" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The late write of worker A matches</text>
<text x="24" y="383" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">no row.</text>
</svg>
