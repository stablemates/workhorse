<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 247" width="400" height="247" role="img" aria-labelledby="langgraph-owners-narrow-light-title langgraph-owners-narrow-light-desc">
<title id="langgraph-owners-narrow-light-title">Workhorse, LangGraph, and your application each own their own state</title>
<desc id="langgraph-owners-narrow-light-desc">Workhorse owns admission, leases, the retry policy, and the langgraph-approval human wait. LangGraph PostgresSaver owns the graph state, replay, and the actual Interrupt.id. Your application owns graph-driver coordination, receipt storage, reviewer authorization, and tool idempotency. The thread ID workhorse:{task_id} does not change.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="400" height="247" fill="#f9fafb"/>
<text x="24" y="49" fill="#1a2027" font-size="9" font-family="Geist Mono">Workhorse</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="43" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">admission · leases · retries</text>
<text x="244" y="57" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the langgraph-approval wait</text>
<text x="24" y="105" fill="#1a2027" font-size="9" font-family="Geist Mono">LangGraph</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="99" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">graph state · replay</text>
<text x="244" y="113" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the actual Interrupt.id</text>
<text x="24" y="161" fill="#1a2027" font-size="9" font-family="Geist Mono">your app</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="155" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">graph-driver coordination</text>
<text x="244" y="169" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">receipts · reviewers · tools</text>
<text x="24" y="200" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The thread ID workhorse:{task_id}</text>
<text x="24" y="215" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">does not change.</text>
</svg>
