<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="stripe-invoice-paid-light-title stripe-invoice-paid-light-desc">
<title id="stripe-invoice-paid-light-title">One Stripe event becomes one credit, also after a retry</title>
<desc id="stripe-invoice-paid-light-desc">Stripe sends invoice.paid. The receiver verifies the signature. In one transaction, it writes the inbox row and enqueues a stripe.invoice-paid task with the payload { inboxId }. It replies 200 only after the commit. The worker writes the ledger row and adds one credit in one transaction. A second delivery finds the inbox row, and a second run finds the ledger row.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="260" fill="#f9fafb"/>
<path d="M 176,98 H 198" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<path d="M 368,98 H 406" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<path d="M 624,98 H 662" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<path d="M 624,158 H 662" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="392" y="48" width="248" height="156" rx="8" fill="rgba(26,32,39,0.02)" stroke="rgba(26,32,39,0.12)" stroke-width="0.8"/>
<rect x="404" y="42" width="92" height="12" rx="2" fill="#f9fafb"/>
<text x="450" y="51" fill="#6d7277" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">ONE TRANSACTION</text>
<rect x="24" y="72" width="152" height="52" rx="6" fill="#f9fafb"/>
<rect x="24" y="72" width="152" height="52" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="100" y="96" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Stripe</text>
<text x="100" y="110" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">invoice.paid</text>
<rect x="200" y="72" width="168" height="52" rx="6" fill="#f9fafb"/>
<rect x="200" y="72" width="168" height="52" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="284" y="96" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">receiver</text>
<text x="284" y="110" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">verifies the signature</text>
<rect x="408" y="76" width="216" height="44" rx="6" fill="#f9fafb"/>
<rect x="408" y="76" width="216" height="44" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="516" y="96" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">inbox row</text>
<text x="516" y="110" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">unique account, mode, event</text>
<rect x="408" y="136" width="216" height="44" rx="6" fill="#f9fafb"/>
<rect x="408" y="136" width="216" height="44" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="516" y="156" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">stripe.invoice-paid</text>
<text x="516" y="170" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">payload { inboxId }</text>
<rect x="664" y="76" width="272" height="44" rx="6" fill="#f9fafb"/>
<rect x="664" y="76" width="272" height="44" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="800" y="96" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">replies 200</text>
<text x="800" y="110" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">only after the commit</text>
<rect x="664" y="136" width="272" height="44" rx="6" fill="#f9fafb"/>
<rect x="664" y="136" width="272" height="44" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="800" y="156" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">worker</text>
<text x="800" y="170" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">ledger row + one credit</text>
<text x="24" y="244" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">A second delivery finds the inbox row. A second run finds the ledger row. The customer gets one credit.</text>
</svg>
