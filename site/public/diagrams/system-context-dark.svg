<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="system-context-dark-title system-context-dark-desc">
<title id="system-context-dark-title">Every component reaches the durable state through SQL functions in PostgreSQL</title>
<desc id="system-context-dark-desc">The application transaction calls enqueue_v1 or enqueue_batch_v1. The deployment syncs schedules. The TypeScript Worker calls claim_many_v1, heartbeat_many_v1, acknowledge_cancel_v1, complete_v1, fail_v1, register_worker_v1, tick_v1, fire_due_schedules_v2, and the split maintenance routines, and gets the payload, attempt, fence, and operator pause flag. The operator layer calls cancel_v1 with attribution, list_dead_letters_v1, redrive_v1, and redrive_many_v1. The dashboard reads the read model and worker_registry and calls Admin.setWorkerPaused with attribution. Health and scenarios read runtime, outcome, and statistics. A process supervisor sends SIGINT or SIGTERM to the dedicated worker process, and the handler runs external effects outside the SQL transaction.</desc>
