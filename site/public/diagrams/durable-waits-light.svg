<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 276" width="960" height="276" role="img" aria-labelledby="durable-waits-light-title durable-waits-light-desc">
<title id="durable-waits-light-title">A durable wait frees the worker, and the handler runs again from its first line</title>
<desc id="durable-waits-light-desc">Worker A runs the welcome checkpoint, then the handler sleeps until 16:00 and frees the worker. No worker holds the task during the wait. At 16:00, worker B runs the handler from its first line. The welcome checkpoint returns its stored result, the ended wait returns at once, and the handler sends the follow-up. Both runs are attempt 1.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="276" fill="#f9fafb"/>
<text x="312" y="52" fill="#1a2027" font-size="10" font-family="Geist Mono" font-weight="400" text-anchor="middle">ctx.checkpoint("welcome", …)</text>
<text x="564" y="52" fill="#1a2027" font-size="10" font-family="Geist Mono" font-weight="400" text-anchor="middle">ctx.sleepUntil("follow-up-window", …)</text>
<text x="816" y="52" fill="#1a2027" font-size="10" font-family="Geist Mono" font-weight="400" text-anchor="middle">ctx.checkpoint("follow-up", …)</text>
<line x1="192" y1="68" x2="936" y2="68" stroke="rgba(26,32,39,0.14)"/>
<text x="24" y="98" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">Run 1</text>
<text x="24" y="113" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">worker A · 14:00</text>
<text x="24" y="128" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">attempt 1 · fence 1</text>
<rect x="192" y="84" width="240" height="48" rx="6" fill="#f9fafb"/>
<rect x="192" y="84" width="240" height="48" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="312" y="106" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">runs</text>
<text x="312" y="120" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">sends the welcome · result stored</text>
<rect x="444" y="84" width="240" height="48" rx="6" fill="#f9fafb"/>
<rect x="444" y="84" width="240" height="48" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="564" y="106" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">pauses</text>
<text x="564" y="120" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">until 16:00 · frees the slot</text>
<text x="816" y="111" fill="#6d7277" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">not reached</text>
<rect x="192" y="148" width="744" height="40" rx="6" fill="#f9fafb"/>
<rect x="192" y="148" width="744" height="40" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="564" y="172" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">no worker holds the task · scheduled, no owner · a new deployment can replace worker A</text>
<text x="24" y="164" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the wait</text>
<text x="24" y="179" fill="#6d7277" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">14:00 to 16:00</text>
<text x="24" y="218" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">Run 2</text>
<text x="24" y="233" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">worker B · 16:00</text>
<text x="24" y="248" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">attempt 1 · fence 2</text>
<rect x="192" y="204" width="240" height="48" rx="6" fill="#f9fafb"/>
<rect x="192" y="204" width="240" height="48" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="312" y="226" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">replays</text>
<text x="312" y="240" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">stored result · no second email</text>
<rect x="444" y="204" width="240" height="48" rx="6" fill="#f9fafb"/>
<rect x="444" y="204" width="240" height="48" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="564" y="226" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">returns</text>
<text x="564" y="240" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the wait ended</text>
<rect x="696" y="204" width="240" height="48" rx="6" fill="#f9fafb"/>
<rect x="696" y="204" width="240" height="48" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="816" y="226" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">runs</text>
<text x="816" y="240" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">sends the follow-up · task succeeds</text>
</svg>
