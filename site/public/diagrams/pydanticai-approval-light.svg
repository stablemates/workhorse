<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 204" width="960" height="204" role="img" aria-labelledby="pydanticai-approval-light-title pydanticai-approval-light-desc">
<title id="pydanticai-approval-light-title">No process waits for the reviewer: a new activation resumes the Agent</title>
<desc id="pydanticai-approval-light-desc">In the first activation, the handler stores the history and the agent-history-receipt checkpoint, then registers the credit-approval human wait, and Workhorse suspends the task. The reviewer approves, and Workhorse commits the decision. A new activation reads the decision and gives the history to a new Agent.run call, which runs the credit tool.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="204" fill="#f9fafb"/>
<rect x="16" y="48" width="360" height="108" rx="8" fill="rgba(26,32,39,0.02)" stroke="rgba(26,32,39,0.12)" stroke-width="0.8"/>
<rect x="28" y="42" width="76" height="12" rx="2" fill="#f9fafb"/>
<text x="66" y="51" fill="#6d7277" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">ACTIVATION 1</text>
<rect x="392" y="48" width="172" height="108" rx="8" fill="rgba(26,32,39,0.02)" stroke="rgba(26,32,39,0.12)" stroke-width="0.8"/>
<rect x="404" y="42" width="56" height="12" rx="2" fill="#f9fafb"/>
<text x="432" y="51" fill="#6d7277" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">REVIEWER</text>
<rect x="580" y="48" width="360" height="108" rx="8" fill="rgba(26,32,39,0.02)" stroke="rgba(26,32,39,0.12)" stroke-width="0.8"/>
<rect x="592" y="42" width="76" height="12" rx="2" fill="#f9fafb"/>
<text x="630" y="51" fill="#6d7277" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">ACTIVATION 2</text>
<rect x="24" y="80" width="156" height="52" rx="6" fill="#f9fafb"/>
<rect x="24" y="80" width="156" height="52" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="102" y="104" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">store the history</text>
<text x="102" y="118" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">agent-history-receipt</text>
<path d="M 180,106 H 210" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="212" y="80" width="156" height="52" rx="6" fill="#f9fafb"/>
<rect x="212" y="80" width="156" height="52" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="290" y="104" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">credit-approval</text>
<text x="290" y="118" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the task suspends</text>
<path d="M 368,106 H 398" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="400" y="80" width="156" height="52" rx="6" fill="#f9fafb"/>
<rect x="400" y="80" width="156" height="52" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="478" y="104" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">reviewer approves</text>
<text x="478" y="118" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">Workhorse commits it</text>
<path d="M 556,106 H 586" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="588" y="80" width="156" height="52" rx="6" fill="#f9fafb"/>
<rect x="588" y="80" width="156" height="52" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="666" y="104" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">read the decision</text>
<text x="666" y="118" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">then store it</text>
<path d="M 744,106 H 774" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="776" y="80" width="156" height="52" rx="6" fill="#f9fafb"/>
<rect x="776" y="80" width="156" height="52" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="854" y="104" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">new Agent.run</text>
<text x="854" y="118" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">runs the credit tool</text>
<text x="24" y="188" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The conversation ID stays the task ID. Each Agent.run call gets a new run ID.</text>
</svg>
