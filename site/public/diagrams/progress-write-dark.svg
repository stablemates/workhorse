<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" height="272" role="img" aria-labelledby="progress-write-dark-title progress-write-dark-desc">
<title id="progress-write-dark-title">Each progress write passes four checks before it replaces the value</title>
<desc id="progress-write-dark-desc">Workhorse checks a progress write in order. A value larger than 64 KiB fails. A write from a handler that is not the current owner fails with a lease-lost error. An identical value changes nothing. A changed value less than 100 milliseconds after the last change from the same fence fails with a rate-limit error. Otherwise the value replaces the previous value, the revision increments, and Workhorse adds one progress_updated event.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="272" fill="#04080e"/>
<path d="M 188,74 H 210" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 106,100 V 174" fill="none" stroke="#ced1d4" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dark)"/>
<path d="M 376,74 H 398" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 294,100 V 174" fill="none" stroke="#ced1d4" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dark)"/>
<path d="M 564,74 H 586" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 482,100 V 174" fill="none" stroke="#ced1d4" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dark)"/>
<path d="M 752,74 H 774" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 670,100 V 174" fill="none" stroke="#ced1d4" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dark)"/>
<rect x="24" y="48" width="164" height="52" rx="6" fill="#04080e"/>
<rect x="24" y="48" width="164" height="52" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="106" y="72" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">size</text>
<text x="106" y="86" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">at most 64 KiB</text>
<rect x="74" y="138" width="64" height="12" rx="2" fill="#04080e"/>
<text x="106" y="147" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">TOO LARGE</text>
<rect x="24" y="176" width="164" height="48" rx="6" fill="#04080e"/>
<rect x="24" y="176" width="164" height="48" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="106" y="198" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">rejected</text>
<text x="106" y="212" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the value is too large</text>
<rect x="212" y="48" width="164" height="52" rx="6" fill="#04080e"/>
<rect x="212" y="48" width="164" height="52" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="294" y="72" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">owner</text>
<text x="294" y="86" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">current worker and fence</text>
<rect x="252" y="138" width="84" height="12" rx="2" fill="#04080e"/>
<text x="294" y="147" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">NOT THE OWNER</text>
<rect x="212" y="176" width="164" height="48" rx="6" fill="#04080e"/>
<rect x="212" y="176" width="164" height="48" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="294" y="198" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">lease-lost error</text>
<text x="294" y="212" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">an old handler</text>
<rect x="400" y="48" width="164" height="52" rx="6" fill="#04080e"/>
<rect x="400" y="48" width="164" height="52" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="482" y="72" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">same value?</text>
<text x="482" y="86" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">compare to the latest</text>
<rect x="450" y="138" width="64" height="12" rx="2" fill="#04080e"/>
<text x="482" y="147" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">IDENTICAL</text>
<rect x="400" y="176" width="164" height="48" rx="6" fill="#04080e"/>
<rect x="400" y="176" width="164" height="48" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="482" y="198" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">no change</text>
<text x="482" y="212" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no revision · no event</text>
<rect x="588" y="48" width="164" height="52" rx="6" fill="#04080e"/>
<rect x="588" y="48" width="164" height="52" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="670" y="72" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">cadence</text>
<text x="670" y="86" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">same fence · 100 ms</text>
<rect x="642" y="138" width="56" height="12" rx="2" fill="#04080e"/>
<text x="670" y="147" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">TOO SOON</text>
<rect x="588" y="176" width="164" height="48" rx="6" fill="#04080e"/>
<rect x="588" y="176" width="164" height="48" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="670" y="198" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">rate-limit error</text>
<text x="670" y="212" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">with the retry delay</text>
<rect x="776" y="48" width="160" height="52" rx="6" fill="#04080e"/>
<rect x="776" y="48" width="160" height="52" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="856" y="72" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">value replaced</text>
<text x="856" y="86" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">revision + 1</text>
<rect x="776" y="176" width="160" height="48" rx="6" fill="#04080e"/>
<rect x="776" y="176" width="160" height="48" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="856" y="198" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">progress_updated</text>
<text x="856" y="212" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">revision and byte size</text>
<path d="M 856,100 V 174" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="256" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Only the current owner can write. Write one time for each batch, or at a fixed interval.</text>
</svg>
