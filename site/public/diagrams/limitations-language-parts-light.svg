<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344" role="img" aria-labelledby="limitations-language-parts-light-title limitations-language-parts-light-desc">
<title id="limitations-language-parts-light-title">Each language runs the queue; only TypeScript changes the schema</title>
<desc id="limitations-language-parts-light-desc">TypeScript, Python, Go, Rust, and Ruby each have a transactional queue client, a complete worker runtime, and an Admin operator client. Schema installation and migration, the workhorse admin CLI, and the TUI are only in the TypeScript package. A deployment with many languages runs the CLI as a deployment step.</desc>
