<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="rate-limits-bucket-dark-title rate-limits-bucket-dark-desc">
<title id="rate-limits-bucket-dark-title">The burst starts ten tasks at once, and the rate starts one each second</title>
<desc id="rate-limits-bucket-dark-desc">The rate-limit policy of provider-api adds sixty tokens each minute and keeps a burst of ten. After an idle hour, the bucket holds ten tokens. At 0 s, the app enqueues 50 tasks, and ten start at once. Then one token arrives each second, and each token lets one task start. A task that ends gives back no token. At about 40 s, the last task starts.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="336" fill="#04080e"/>
<text x="24" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">provider-api</text>
<text x="24" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">60 each minute · burst 10</text>
<text x="260" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">0 s</text>
<text x="420" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">10 s</text>
<text x="580" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">20 s</text>
<text x="740" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">30 s</text>
<text x="900" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">40 s</text>
<line x1="260" y1="52" x2="900" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="88" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">bucket</text>
<text x="24" y="103" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">tokens</text>
<rect x="260" y="72" width="640" height="40" rx="6" fill="#04080e"/>
<rect x="260" y="72" width="640" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="580" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">1 new token each second</text>
<text x="580" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">after the burst of 10 is used</text>
<text x="24" y="144" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">starts</text>
<text x="24" y="159" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">10 at once</text>
<rect x="260" y="128" width="136" height="40" rx="6" fill="#04080e"/>
<rect x="260" y="128" width="136" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="328" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">10 tasks start</text>
<text x="328" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the burst</text>
<text x="24" y="200" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">starts</text>
<text x="24" y="215" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">then</text>
<rect x="276" y="184" width="624" height="40" rx="6" fill="#04080e"/>
<rect x="276" y="184" width="624" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="588" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">1 task starts each second</text>
<text x="588" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">with each new token</text>
<text x="24" y="256" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">ready</text>
<text x="24" y="271" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the rest</text>
<rect x="260" y="240" width="640" height="40" rx="6" fill="#04080e"/>
<rect x="260" y="240" width="640" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="580" y="258" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">40 tasks wait for tokens</text>
<text x="580" y="272" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">none is ready at about 40 s</text>
<text x="24" y="320" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The bucket counts starts, not running tasks. A task that ends gives back no token.</text>
</svg>
