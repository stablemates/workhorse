<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 332" width="960" height="332" role="img" aria-labelledby="leases-and-fences-dark-title leases-and-fences-dark-desc">
<title id="leases-and-fences-dark-title">A lease gives a task one owner, and a fence token refuses a late write</title>
<desc id="leases-and-fences-dark-desc">Worker A claims the task with fence token 41 and sends heartbeats. Its machine stops at 25 s, and the lease expires at 50 s. At about 52 s, worker B claims the task with fence token 57. At 70 s, worker A starts again. At 90 s, it tries to complete the task with token 41, and PostgreSQL refuses the write because the row has 57.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="332" fill="#04080e"/>
<path d="M 883,120 V 160" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 580,240 V 212" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="200" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">0 s</text>
<text x="270" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">10 s</text>
<text x="340" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">20 s</text>
<text x="410" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">30 s</text>
<text x="480" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">40 s</text>
<text x="550" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">50 s</text>
<text x="620" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">60 s</text>
<text x="690" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">70 s</text>
<text x="760" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">80 s</text>
<text x="830" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">90 s</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="104" fill="#f2f4f5" font-size="10" font-family="Geist Mono">worker A</text>
<text x="24" y="188" fill="#f2f4f5" font-size="10" font-family="Geist Mono">runtime row</text>
<text x="24" y="264" fill="#f2f4f5" font-size="10" font-family="Geist Mono">worker B</text>
<rect x="200" y="80" width="175" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="80" width="175" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="287.5" y="98" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">runs the handler</text>
<text x="287.5" y="112" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">heartbeats at 10 s and 20 s</text>
<rect x="375" y="80" width="315" height="40" rx="6" fill="#04080e"/>
<rect x="375" y="80" width="315" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="532.5" y="98" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">machine stopped</text>
<text x="532.5" y="112" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no heartbeats</text>
<rect x="690" y="80" width="140" height="40" rx="6" fill="#04080e"/>
<rect x="690" y="80" width="140" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="760" y="98" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">starts again</text>
<text x="760" y="112" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">runs the old handler</text>
<rect x="830" y="80" width="106" height="40" rx="6" fill="#04080e"/>
<rect x="830" y="80" width="106" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="883" y="98" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">complete</text>
<text x="883" y="112" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">fence 41</text>
<rect x="200" y="164" width="350" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="164" width="350" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="375" y="182" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">owner A · fence 41</text>
<text x="375" y="196" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">expiry 30 s → 40 s → 50 s</text>
<rect x="564" y="164" width="372" height="40" rx="6" fill="#04080e"/>
<rect x="564" y="164" width="372" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="750" y="182" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">owner B · fence 57</text>
<text x="750" y="196" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a new lease</text>
<rect x="564" y="240" width="372" height="40" rx="6" fill="#04080e"/>
<rect x="564" y="240" width="372" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="750" y="264" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">runs the handler</text>
<rect x="333" y="64" width="84" height="12" rx="2" fill="#04080e"/>
<text x="375" y="73" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">STOPS AT 25 S</text>
<rect x="628" y="64" width="124" height="12" rx="2" fill="#04080e"/>
<text x="690" y="73" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">STARTS AGAIN AT 70 S</text>
<rect x="458" y="134" width="128" height="12" rx="2" fill="#04080e"/>
<text x="522" y="143" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">LEASE EXPIRES AT 50 S</text>
<rect x="771" y="134" width="144" height="12" rx="2" fill="#04080e"/>
<text x="843" y="143" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">REFUSED · RESULT DROPPED</text>
<rect x="428" y="220" width="144" height="12" rx="2" fill="#04080e"/>
<text x="500" y="229" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">CLAIM AT 52 S · FENCE 57</text>
<text x="24" y="316" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">A write counts only if its worker ID and fence token match the row.</text>
</svg>
