<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 232" width="960" height="232" role="img" aria-labelledby="integrations-common-dark-title integrations-common-dark-desc">
<title id="integrations-common-dark-title">Each integration gives Workhorse your transaction</title>
<desc id="integrations-common-dark-desc">Your ORM or driver already has a transaction object. The integration converts it to the Queryable protocol, a way to run a parameterized SQL query. enqueue writes the task in that transaction. If the transaction commits, the data and the task commit together. If it rolls back, PostgreSQL removes the task too. Workers always run in their own process.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="232" fill="#04080e"/>
<path d="M 200,74 H 222" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 400,74 H 422" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 600,74 H 622" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 704,100 V 134" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 856,100 V 134" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="24" y="48" width="176" height="52" rx="6" fill="#04080e"/>
<rect x="24" y="48" width="176" height="52" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="112" y="72" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">your transaction</text>
<text x="112" y="86" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">from your ORM or driver</text>
<rect x="224" y="48" width="176" height="52" rx="6" fill="#04080e"/>
<rect x="224" y="48" width="176" height="52" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="312" y="72" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the integration</text>
<text x="312" y="86" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">converts the object</text>
<rect x="424" y="48" width="176" height="52" rx="6" fill="#04080e"/>
<rect x="424" y="48" width="176" height="52" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="512" y="72" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Queryable</text>
<text x="512" y="86" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a parameterized query</text>
<rect x="624" y="48" width="312" height="52" rx="6" fill="#04080e"/>
<rect x="624" y="48" width="312" height="52" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="780" y="72" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">enqueue</text>
<text x="780" y="86" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">writes the task in your transaction</text>
<rect x="624" y="136" width="148" height="48" rx="6" fill="#04080e"/>
<rect x="624" y="136" width="148" height="48" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="698" y="158" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">commit</text>
<text x="698" y="172" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">data + task</text>
<rect x="788" y="136" width="148" height="48" rx="6" fill="#04080e"/>
<rect x="788" y="136" width="148" height="48" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="862" y="158" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">rollback</text>
<text x="862" y="172" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the task is gone</text>
<rect x="24" y="136" width="576" height="48" rx="6" fill="#04080e"/>
<rect x="24" y="136" width="576" height="48" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="312" y="158" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">worker</text>
<text x="312" y="172" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">always in its own process · never in a web request</text>
<text x="24" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Workhorse never opens a transaction for you.</text>
</svg>
