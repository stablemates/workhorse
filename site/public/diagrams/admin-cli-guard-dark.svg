<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 224" width="960" height="224" role="img" aria-labelledby="admin-cli-guard-dark-title admin-cli-guard-dark-desc">
<title id="admin-cli-guard-dark-title">A guarded command checks the database name, then asks for a confirmation</title>
<desc id="admin-cli-guard-dark-desc">The engineer runs admin redrive with --env workhorse_production, but the shell still points to staging. The client asks the database for its name and gets workhorse_staging. The names are different, so the command changes nothing. After the engineer corrects the URL and adds --yes, both checks pass, and the redrive occurs. No flag stops the database name check.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="224" fill="#04080e"/>
<text x="316" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">1 · database name</text>
<text x="564" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">2 · confirmation</text>
<text x="812" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">result</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="88" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">first run</text>
<text x="24" y="103" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the old staging URL</text>
<rect x="200" y="72" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="72" width="232" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="316" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">workhorse_staging</text>
<text x="316" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">--env names production</text>
<rect x="696" y="72" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="696" y="72" width="232" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="812" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">refused</text>
<text x="812" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">nothing changes</text>
<text x="564" y="96" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">not reached</text>
<text x="24" y="144" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">second run</text>
<text x="24" y="159" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the corrected URL</text>
<rect x="200" y="128" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="128" width="232" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="316" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">workhorse_production</text>
<text x="316" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the names are the same</text>
<rect x="448" y="128" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="448" y="128" width="232" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="564" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">--yes</text>
<text x="564" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the script confirms</text>
<rect x="696" y="128" width="232" height="40" rx="6" fill="#04080e"/>
<rect x="696" y="128" width="232" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="812" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">redrive occurs</text>
<text x="812" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">with the reason and actor</text>
<text x="24" y="208" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">No flag stops the database name check. In an interactive session, you type the identity again.</text>
</svg>
