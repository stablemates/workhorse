<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 303" width="400" height="303" role="img" aria-labelledby="debounce-reset-narrow-dark-title debounce-reset-narrow-dark-desc">
<title id="debounce-reset-narrow-dark-title">With reset, each new revision moves the run time</title>
<desc id="debounce-reset-narrow-dark-desc">Requests for doc-42 use a window of 2 s and schedule reset. Revision 1 at 0 s creates a task that runs at 2 s. Revision 2 at 1 s replaces the payload and moves the run time to 3 s. Revision 3 at 2.5 s moves it to 4.5 s. Soon after 4.5 s, a worker indexes revision 3. Every request gets the same taskId.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="303" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">0 s</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">revision 1: accepted</text>
<text x="244" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the task runs at 2 s</text>
<path d="M 248,66 V 78" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">1 s</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">revision 2: replaced</text>
<text x="244" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the run time moves to 3 s</text>
<path d="M 248,122 V 134" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">2.5 s</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">revision 3: replaced</text>
<text x="244" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the run time moves to 4.5 s</text>
<path d="M 248,178 V 190" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f2f4f5" font-size="9" font-family="Geist Mono">4.5 s</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="211" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the task runs</text>
<text x="244" y="225" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">indexes revision 3</text>
<text x="24" y="256" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Three requests make one task with one</text>
<text x="24" y="271" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">taskId. It uses the latest revision.</text>
</svg>
