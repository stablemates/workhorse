<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 288" width="960" height="288" role="img" aria-labelledby="concurrency-keys-dark-title concurrency-keys-dark-desc">
<title id="concurrency-keys-dark-title">A full key keeps its tasks ready, although the queue has room</title>
<desc id="concurrency-keys-dark-desc">The policy of the queue mail allows twenty active tasks and three for each key. Six tenant-a tasks, four tenant-b tasks, and two tasks without a key are ready. Workhorse admits three tenant-a tasks, three tenant-b tasks, and the two tasks without a key. The queue has room for twelve more, but each remaining task has a full key, so it stays ready.</desc>
