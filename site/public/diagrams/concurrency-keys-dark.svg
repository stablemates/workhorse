<text x="24" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">mail</text>
<text x="24" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">maxActive 20 · maxActivePerKey 3</text>
<text x="24" y="96" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">tenant-a</text>
<text x="24" y="111" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">6 ready</text>
