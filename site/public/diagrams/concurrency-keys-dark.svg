<text x="808" y="224" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">uses queue capacity only</text>
<text x="24" y="272" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">8 of 20 active. PostgreSQL decides each admission, so the limit holds for any number of workers.</text>
