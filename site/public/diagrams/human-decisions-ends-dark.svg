<path d="M 850,192 V 226" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="764" y="76" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="764" y="76" width="172" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="850" y="94" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">cancel the task</text>
<text x="850" y="108" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">while it waits</text>
<rect x="764" y="152" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="764" y="152" width="172" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="850" y="170" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">canceled</text>
<text x="850" y="184" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">at once</text>
<rect x="764" y="228" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="764" y="228" width="172" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
