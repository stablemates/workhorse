<text x="474" y="94" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">rev-4</text>
<text x="474" y="108" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">{ approved: true }</text>
<rect x="388" y="152" width="172" height="40" rx="6" fill="#04080e"/>
