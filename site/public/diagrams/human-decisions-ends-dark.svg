<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 324" width="960" height="324" role="img" aria-labelledby="human-decisions-ends-dark-title human-decisions-ends-dark-desc">
<title id="human-decisions-ends-dark-title">A result resumes a pending decision, and a time limit or a cancellation ends it</title>
<desc id="human-decisions-ends-dark-desc">The task for acct-19 waits on account-review. If an operator selects the Approve quick action, or the custom tool calls completeHumanWait with rev-4, Workhorse stores the result and the task becomes ready. If nobody answers before timeoutMs passes, maintenance fails the task with a deadline error. If the app cancels the task, Workhorse cancels it at once. After a failure or a cancellation, a late answer returns stale.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="324" fill="#04080e"/>
<text x="286" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">dashboard quick action</text>
<text x="474" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">completeHumanWait</text>
<text x="662" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">timeoutMs passes</text>
<text x="850" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">cancellation</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="98" fill="#f2f4f5" font-size="10" font-family="Geist Mono">decision</text>
<text x="24" y="174" fill="#f2f4f5" font-size="10" font-family="Geist Mono">Workhorse</text>
<text x="24" y="250" fill="#f2f4f5" font-size="10" font-family="Geist Mono">task</text>
<path d="M 286,116 V 150" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 286,192 V 226" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="200" y="76" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="76" width="172" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="286" y="94" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Approve</text>
<text x="286" y="108" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the operator confirms</text>
<rect x="200" y="152" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="152" width="172" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="286" y="170" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">completed</text>
<text x="286" y="184" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">stores the result</text>
<rect x="200" y="228" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="228" width="172" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="286" y="246" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">ready</text>
<text x="286" y="260" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the handler runs again</text>
<path d="M 474,116 V 150" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 474,192 V 226" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="388" y="76" width="172" height="40" rx="6" fill="#04080e"/>
