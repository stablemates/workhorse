server_tokens off;

# Markdown twins at /docs/<slug>.md are the form an agent reads. nginx maps no
# extension to Markdown, so without this the origin falls back to
# application/octet-stream and an agent's tooling treats the page as binary.
# This block adds to the mapping that nginx.conf's `include mime.types` builds;
# it does not replace it.
types {
  text/markdown md;
}

# text/markdown and application/json are not types nginx labels with a charset
# by default, and a twin and the JSON 404 body are both UTF-8. The list is the
# nginx default plus those two.
charset utf-8;
charset_types text/markdown application/json text/xml text/plain text/vnd.wap.wml application/javascript application/rss+xml;

# Content negotiation (acceptmarkdown.com, RFC 9110 section 12). A canonical
# page URL such as /docs/quickstart serves its Markdown twin to a client whose
# Accept header names text/markdown, and the HTML page to everyone else, so an
# agent that follows an ordinary link reads the page instead of its markup.
# The maps below read the header once; the locations act on the result.
#
# The match is a substring test, not a q-value ordering. `text/markdown;q=0.1,
# text/html` still gets Markdown, because the header names the type at all.
# The one q-value honoured is q=0, and only as the first parameter after the
# type: `text/markdown;q=0` is a rejection, `text/markdown;charset=utf-8;q=0`
# is not. `text/html;q=0` is not read as a rejection of HTML either. Every
# agent in acceptmarkdown.com's support matrix sends text/markdown first at
# q=1, and no browser sends it, so the substring test sorts the clients that
# exist. A map tests its regexes in file order and stops at the first match,
# so the rejection is listed before the acceptance it overrides.
#
# A header that names both text/markdown and application/json is a tie that
# Markdown wins: the page has no JSON form, and the 404 body follows the page.
map $http_accept $want {
  default html;
  "~*text/markdown\s*;\s*q=0(\.0+)?\s*(,|$)" html;
  "~*text/markdown" markdown;
  "~*application/json" json;
}

# Whether a client that asked for Markdown would also take HTML. When the twin
# does not exist that decides between the HTML page and 406 Not Acceptable.
map $http_accept $takes_html {
  default 0;
  "~*text/html" 1;
  "~*text/\*" 1;
  "~*\*/\*" 1;
}

# The twin to try before the page: /index.md for /, otherwise the path with its
# trailing slash dropped and .md appended, so /docs/quickstart and
# /docs/quickstart/ both reach /docs/quickstart.md. A path with an extension
# has no twin. /.none is a file that never exists, so try_files skips the
# candidate when it does not apply.
map "$want$uri" $twin {
  default /.none;
  "~^markdown/$" /index.md;
  "~^markdown(?<path>/[^.]+?)/?$" $path.md;
}

# The page to fall back to when there is no twin. A client that takes only
# Markdown gets no page: the fallback is the 406 in @unavailable instead.
map "$want$takes_html" $page {
  default $uri;
  markdown0 /.none;
}

# The body of a 404, chosen by the same Accept reading as the page itself, so
# an agent that asked for Markdown reads where to go next instead of an HTML
# page, and a JSON client gets a JSON error it can parse.
map $want $not_found_body {
  default /not-found/index.html;
  markdown /404.md;
  json /404.json;
}

server {
  listen 8080 default_server;
  server_name _;

  # The privacy notice promises that the origin keeps no access log. Cloudflare
  # still processes each request at the edge, but nginx must not duplicate that
  # request data in the site container's output.
  access_log off;

  root /usr/share/nginx/html;
  index index.html;

  # A 404 keeps its status and gets a body in the representation the client
  # asked for. No `=` here: `=200` would turn a missing page into a found one.
  error_page 404 $not_found_body;

  location = /up {
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    # This add_header replaces the inherited set, which is the point: a hashed
    # asset is one representation and must not carry Vary: Accept.
    add_header Cache-Control "public, immutable";
  }

  # The search index is a JSON file with no extension, so the type has to be
  # stated here. A missing /api/ path is a JSON 404 whatever the client accepts.
  location /api/ {
    default_type application/json;
    error_page 404 /404.json;
    try_files $uri =404;
  }

  # The 404 bodies exist only to be served through error_page. `internal` keeps
  # a direct request from getting them as a 200 page a crawler would index; it
  # gets a 404 with the same body instead. Regex locations match in file order,
  # so this one precedes the extension rule below. nginx sets headers in the
  # location that serves the body, so the Vary a negotiated 404 needs is added
  # here; the /api/ 404 passes through as well and carries it harmlessly.
  location ~ ^/(404\.(md|json)|not-found/index\.html)$ {
    internal;
    add_header Vary Accept always;
  }

  # A file named with its extension is one representation. Negotiation never
  # touches it, so it carries no Vary.
  location ~ \.(html|md|txt|xml|json)$ {
    try_files $uri =404;
  }

  # Every negotiated response varies by Accept, errors included (`always`), so
  # a cache in front never hands a browser a twin or an agent a page. Order of
  # candidates: the twin, then the page as a file, as a directory index, as a
  # .html file; then @unavailable decides between 406 and 404.
  # ADR 0064 renamed two documentation slugs. The old URLs answer with a permanent redirect.
  location = /docs/job-dependencies {
    return 301 /docs/task-dependencies;
  }

  location = /docs/child-jobs {
    return 301 /docs/child-tasks;
  }

  location / {
    add_header Vary Accept always;
    try_files $twin $page $page/index.html $page.html @unavailable;
  }

  # Reached when neither a twin nor a page was served. A client that takes only
  # Markdown lands here whenever the twin is missing, so the question is whether
  # the HTML page exists: 406 lists what is available, otherwise 404. A client
  # that would also take HTML never sees the 406, because $page served the HTML
  # page above. `if` with nothing but `return` inside is the one form nginx
  # documents as safe.
  location @unavailable {
    add_header Vary Accept always;
    add_header Cache-Control no-store always;
    default_type text/plain;
    if (-f $document_root$uri/index.html) {
      return 406 "406 Not Acceptable\n$uri is available as: text/html\n";
    }
    if (-f $document_root$uri.html) {
      return 406 "406 Not Acceptable\n$uri is available as: text/html\n";
    }
    return 404;
  }
}
