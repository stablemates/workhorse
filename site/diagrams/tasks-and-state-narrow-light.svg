<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 812" width="400" height="812" role="img" aria-labelledby="tasks-and-state-narrow-light-title tasks-and-state-narrow-light-desc">
<title id="tasks-and-state-narrow-light-title">One task after enqueue, after the claim, and after success</title>
<desc id="tasks-and-state-narrow-light-desc">After enqueue, the task has a task row and a ready task_runtime row. After the claim, the runtime row is active. After success, the runtime row is gone and a succeeded task_outcome row exists. task_event and attempt_history keep the history apart.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="400" height="812" fill="#f9fafb"/>
<text x="24" y="36" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">1 · After enqueue</text>
<text x="24" y="51" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">both rows in one transaction</text>
<rect x="24" y="76" width="352" height="44" rx="6" fill="#f9fafb"/>
<rect x="24" y="76" width="352" height="44" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="200" y="96" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task</text>
<text x="200" y="110" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">resize-image · media</text>
<rect x="24" y="132" width="352" height="44" rx="6" fill="#f9fafb"/>
<rect x="24" y="132" width="352" height="44" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="200" y="152" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task_runtime</text>
<text x="200" y="166" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">ready</text>
<rect x="24" y="188" width="352" height="44" rx="6" fill="#f9fafb"/>
<rect x="24" y="188" width="352" height="44" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="200" y="214" fill="#6d7277" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">task_outcome · no row</text>
<path d="M 200,236 V 254" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="272" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">2 · After the claim</text>
<text x="24" y="287" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">only task_runtime changes</text>
<rect x="24" y="312" width="352" height="44" rx="6" fill="#f9fafb"/>
<rect x="24" y="312" width="352" height="44" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="200" y="332" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task</text>
<text x="200" y="346" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">resize-image · media</text>
<rect x="24" y="368" width="352" height="44" rx="6" fill="#f9fafb"/>
<rect x="24" y="368" width="352" height="44" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="200" y="388" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task_runtime</text>
<text x="200" y="402" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">active · worker A</text>
<rect x="24" y="424" width="352" height="44" rx="6" fill="#f9fafb"/>
<rect x="24" y="424" width="352" height="44" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="200" y="450" fill="#6d7277" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">task_outcome · no row</text>
<path d="M 200,472 V 490" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="508" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">3 · After success</text>
<text x="24" y="523" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">delete and insert in one transaction</text>
<rect x="24" y="548" width="352" height="44" rx="6" fill="#f9fafb"/>
<rect x="24" y="548" width="352" height="44" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="200" y="568" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task</text>
<text x="200" y="582" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">resize-image · media</text>
<rect x="24" y="604" width="352" height="44" rx="6" fill="#f9fafb"/>
<rect x="24" y="604" width="352" height="44" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="200" y="630" fill="#6d7277" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">task_runtime · no row</text>
<rect x="24" y="660" width="352" height="44" rx="6" fill="#f9fafb"/>
<rect x="24" y="660" width="352" height="44" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="200" y="680" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task_outcome</text>
<text x="200" y="694" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">succeeded · result</text>
<line x1="24" y1="736" x2="376" y2="736" stroke="rgba(26,32,39,0.14)"/>
<text x="24" y="760" fill="#6d7277" font-size="9" font-family="Geist Mono">History, kept apart from these rows:</text>
<text x="24" y="778" fill="#1a2027" font-size="9" font-family="Geist Mono">task_event</text>
<text x="144" y="778" fill="#4e5359" font-size="9" font-family="Geist Mono">enqueued · claimed · succeeded</text>
<text x="24" y="796" fill="#1a2027" font-size="9" font-family="Geist Mono">attempt_history</text>
<text x="144" y="796" fill="#4e5359" font-size="9" font-family="Geist Mono">attempt 1 · succeeded</text>
</svg>
