<text x="716" y="215" fill="#555555" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">attempt count</text>
<rect x="496" y="232" width="440" height="30" rx="7.5" fill="#ffffff"/>
<rect x="496.5" y="232.5" width="439" height="29" rx="7.5" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="716" y="251" fill="#555555" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">cancellation state</text>
<rect x="496" y="268" width="440" height="30" rx="7.5" fill="#ffffff"/>
<rect x="496.5" y="268.5" width="439" height="29" rx="7.5" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="716" y="287" fill="#555555" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">old error</text>
<rect x="496" y="304" width="440" height="30" rx="7.5" fill="#ffffff"/>
<rect x="496.5" y="304.5" width="439" height="29" rx="7.5" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="716" y="323" fill="#555555" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">deadline</text>
<text x="24" y="372" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Redrive does not restart the failed task. A past deadline would fail the new task at once.</text>
</svg>
