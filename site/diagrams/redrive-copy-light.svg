<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" width="960" height="388" role="img" aria-labelledby="redrive-copy-light-title redrive-copy-light-desc">
<title id="redrive-copy-light-title">Redrive copies the work into a new task and keeps the failed task as evidence</title>
<desc id="redrive-copy-light-desc">The operator redrives charge-4711 with the request ID r-77. Workhorse creates charge-9020, ready on attempt 1, and records the link in the same transaction. charge-4711 stays failed, with its error. The new task copies the queue, type, payload, tags, maximum attempts, retry policy, and execution timeout. It does not copy checkpoints, waits, the attempt count, the cancellation state, the old error, or the deadline.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="388" fill="#ffffff"/>
<path d="M 344,84 H 594" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="427" y="64" width="84" height="12" rx="2" fill="#ffffff"/>
<text x="469" y="73" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">REDRIVE · r-77</text>
<rect x="24" y="56" width="320" height="56" rx="8" fill="#ffffff"/>
<rect x="24.5" y="56.5" width="319" height="55" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="184" y="82" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charge-4711</text>
<text x="184" y="96" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">failed · stays as evidence</text>
<rect x="596" y="56" width="340" height="56" rx="8" fill="#ffffff"/>
<rect x="596.5" y="56.5" width="339" height="55" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="766" y="82" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charge-9020</text>
<text x="766" y="96" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ready · attempt 1 · no deadline</text>
<text x="24" y="148" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">copied: the work</text>
<rect x="24" y="160" width="440" height="30" rx="7.5" fill="#ffffff"/>
<rect x="24.5" y="160.5" width="439" height="29" rx="7.5" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="244" y="179" fill="#000000" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">queue · type · payload</text>
<rect x="24" y="196" width="440" height="30" rx="7.5" fill="#ffffff"/>
<rect x="24.5" y="196.5" width="439" height="29" rx="7.5" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="244" y="215" fill="#000000" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">tags</text>
<rect x="24" y="232" width="440" height="30" rx="7.5" fill="#ffffff"/>
<rect x="24.5" y="232.5" width="439" height="29" rx="7.5" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="244" y="251" fill="#000000" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">maximum attempts</text>
<rect x="24" y="268" width="440" height="30" rx="7.5" fill="#ffffff"/>
<rect x="24.5" y="268.5" width="439" height="29" rx="7.5" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="244" y="287" fill="#000000" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">retry policy</text>
<rect x="24" y="304" width="440" height="30" rx="7.5" fill="#ffffff"/>
<rect x="24.5" y="304.5" width="439" height="29" rx="7.5" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="244" y="323" fill="#000000" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">execution timeout</text>
<text x="496" y="148" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">not copied: the failed run</text>
<rect x="496" y="160" width="440" height="30" rx="7.5" fill="#ffffff"/>
