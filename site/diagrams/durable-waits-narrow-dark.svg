<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 596" width="400" height="596" role="img" aria-labelledby="durable-waits-narrow-dark-title durable-waits-narrow-dark-desc">
<title id="durable-waits-narrow-dark-title">A durable wait frees the worker, and the handler runs again from its first line</title>
<desc id="durable-waits-narrow-dark-desc">Worker A runs the welcome checkpoint, then the handler sleeps until 16:00 and frees the worker. No worker holds the task during the wait. At 16:00, worker B runs the handler from its first line. The welcome checkpoint returns its stored result, the ended wait returns at once, and the handler sends the follow-up. Both runs are attempt 1.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="596" fill="#000000"/>
<text x="24" y="36" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Run 1</text>
<text x="24" y="51" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">worker A · 14:00 · attempt 1 · fence 1</text>
<text x="24" y="74" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">checkpoint("welcome")</text>
<rect x="24" y="80" width="352" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="80.5" width="351" height="43" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="200" y="100" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs</text>
<text x="200" y="114" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">sends the welcome · result stored</text>
<text x="24" y="142" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">sleepUntil("follow-up-window")</text>
<rect x="24" y="148" width="352" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="148.5" width="351" height="43" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="200" y="168" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">pauses</text>
<text x="200" y="182" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">until 16:00 · frees the slot</text>
<text x="24" y="210" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">checkpoint("follow-up")</text>
<text x="200" y="238" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">not reached</text>
<rect x="24" y="272" width="352" height="52" rx="8" fill="#000000"/>
<rect x="24.5" y="272.5" width="351" height="51" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="200" y="294" fill="#f4f4f4" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">the wait · 14:00 to 16:00</text>
<text x="200" y="309" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">no worker holds the task · scheduled, no owner</text>
<text x="24" y="352" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Run 2</text>
<text x="24" y="367" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">worker B · 16:00 · attempt 1 · fence 2</text>
<text x="24" y="390" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">checkpoint("welcome")</text>
<rect x="24" y="396" width="352" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="396.5" width="351" height="43" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="200" y="416" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">replays</text>
<text x="200" y="430" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stored result · no second email</text>
<text x="24" y="458" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">sleepUntil("follow-up-window")</text>
<rect x="24" y="464" width="352" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="464.5" width="351" height="43" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="200" y="484" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns</text>
<text x="200" y="498" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the wait ended</text>
<text x="24" y="526" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">checkpoint("follow-up")</text>
<rect x="24" y="532" width="352" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="532.5" width="351" height="43" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="200" y="552" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs</text>
<text x="200" y="566" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">sends the follow-up · task succeeds</text>
</svg>
