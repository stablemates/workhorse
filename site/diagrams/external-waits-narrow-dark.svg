<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 359" width="400" height="359" role="img" aria-labelledby="external-waits-narrow-dark-title external-waits-narrow-dark-desc">
<title id="external-waits-narrow-dark-title">Each external wait releases the worker until a value arrives</title>
<desc id="external-waits-narrow-dark-desc">The order handler waits for a signal, and no worker holds the task. The application calls sendSignal, and Workhorse stores the payload and sets the task to ready. A worker runs the handler from the first line. The signal wait returns the payload, and the handler waits for an operator. An operator tool calls completeHumanWait. A worker runs the handler again, and each wait returns its stored value.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="359" fill="#000000"/>
<text x="24" y="49" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">first run</text>
<rect x="104" y="24" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="24.5" width="271" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="240" y="43" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">handler: waitForSignal</text>
<text x="240" y="57" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">releases the lease</text>
<path d="M 240,66 V 78" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">webhook</text>
<rect x="104" y="80" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="80.5" width="271" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="240" y="99" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">application: sendSignal</text>
<text x="240" y="113" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">payload stored · task ready</text>
<path d="M 240,122 V 134" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">second run</text>
<rect x="104" y="136" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="136.5" width="271" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="240" y="155" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the signal wait returns</text>
<text x="240" y="169" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">then waitForHuman</text>
<path d="M 240,178 V 190" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">decision</text>
<rect x="104" y="192" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="192.5" width="271" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="240" y="211" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">operator: completeHumanWait</text>
<text x="240" y="225" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">decision stored · task ready</text>
<path d="M 240,234 V 246" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="273" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">third run</text>
<rect x="104" y="248" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="248.5" width="271" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="240" y="267" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">both waits return</text>
<text x="240" y="281" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">their stored values</text>
<text x="24" y="312" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Each run starts at the first line of the</text>
<text x="24" y="327" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">handler. A repeated delivery does not</text>
<text x="24" y="342" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">resume the task.</text>
</svg>
