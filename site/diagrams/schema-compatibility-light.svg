<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" height="272" role="img" aria-labelledby="schema-compatibility-light-title schema-compatibility-light-desc">
<title id="schema-compatibility-light-title">schemaCompatibilityRefusal tests in this order; the first failed test decides</title>
<desc id="schema-compatibility-light-desc">A missing schema version gives schema-not-installed. A version below MINIMUM_SCHEMA_VERSION gives schema-too-old. A client protocol below MINIMUM_PROTOCOL_VERSION gives client-protocol-too-old, and above MAXIMUM_PROTOCOL_VERSION gives client-protocol-too-new. If the schema declares served protocols without the client protocol, a lower client protocol gives schema-too-new, and a higher one gives schema-too-old. Otherwise the schema is compatible.</desc>
