<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 228" width="960" height="228" role="img" aria-labelledby="deadlines-timeout-light-title deadlines-timeout-light-desc">
<title id="deadlines-timeout-light-title">An execution timeout ends one attempt, and the task continues</title>
<desc id="deadlines-timeout-light-desc">A report.build task has an execution timeout of 2 min. At 0 s, a worker claims it, and the call to the reporting service does not return. At 2 min, PostgreSQL closes attempt 1 as timed out and schedules attempt 2. The worker aborts the signal of the handler. Attempt 2 starts with a full budget of 2 min.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="228" fill="#f9fafb"/>
<text x="24" y="40" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">report.build</text>
<text x="24" y="55" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">execution timeout 2 min</text>
<text x="286" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">0 s</text>
<text x="474" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">2 min</text>
<text x="662" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">then</text>
<text x="850" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">after the retry delay</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="rgba(26,32,39,0.14)"/>
<text x="24" y="97" fill="#1a2027" font-size="10" font-family="Geist Mono">attempts</text>
<rect x="200" y="72" width="172" height="40" rx="6" fill="#f9fafb"/>
<rect x="200" y="72" width="172" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="286" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">attempt 1 runs</text>
<text x="286" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the call does not return</text>
<rect x="388" y="72" width="172" height="40" rx="6" fill="#f9fafb"/>
<rect x="388" y="72" width="172" height="40" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="474" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">attempt 1 timed out</text>
<text x="474" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">PostgreSQL closes it</text>
<rect x="576" y="72" width="172" height="40" rx="6" fill="#f9fafb"/>
<rect x="576" y="72" width="172" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="662" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">ctx.signal aborted</text>
<text x="662" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the handler must stop</text>
<rect x="764" y="72" width="172" height="40" rx="6" fill="#f9fafb"/>
<rect x="764" y="72" width="172" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="850" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">attempt 2 starts</text>
<text x="850" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">full budget of 2 min</text>
<text x="24" y="153" fill="#1a2027" font-size="10" font-family="Geist Mono">task</text>
<rect x="200" y="128" width="172" height="40" rx="6" fill="#f9fafb"/>
<rect x="200" y="128" width="172" height="40" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="286" y="146" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">active</text>
<text x="286" y="160" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">worker A</text>
<rect x="388" y="128" width="172" height="40" rx="6" fill="#f9fafb"/>
<rect x="388" y="128" width="172" height="40" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="474" y="146" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">scheduled</text>
<text x="474" y="160" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the retry rules apply</text>
<rect x="764" y="128" width="172" height="40" rx="6" fill="#f9fafb"/>
<rect x="764" y="128" width="172" height="40" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="850" y="146" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">active</text>
<text x="850" y="160" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">a new attempt</text>
<text x="24" y="212" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">A timeout ends one attempt. If attempts are left, the task gets another attempt.</text>
</svg>
