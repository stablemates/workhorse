<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" role="img" aria-labelledby="admin-cli-waits-light-title admin-cli-waits-light-desc">
<title id="admin-cli-waits-light-title">Three read-only commands tell why a task does not finish</title>
<desc id="admin-cli-waits-light-desc">The task order-88 did not finish in one hour. admin checkpoints order-88 shows that the handler completed reserve-stock, so it ran. admin waits order-88 shows no durable timer. admin external-waits lists order-88 with a pending human decision named approval.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="284" fill="#ffffff"/>
<text x="24" y="40" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">order-88</text>
<text x="24" y="55" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">did not finish in one hour</text>
<path d="M 444,92 H 534" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="24" y="72" width="420" height="40" rx="8" fill="#ffffff"/>
<rect x="24.5" y="72.5" width="419" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="234" y="96" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">admin checkpoints order-88</text>
<rect x="536" y="72" width="400" height="40" rx="8" fill="#ffffff"/>
<rect x="536.5" y="72.5" width="399" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="736" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">reserve-stock completed</text>
<text x="736" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the handler ran</text>
<path d="M 444,148 H 534" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="24" y="128" width="420" height="40" rx="8" fill="#ffffff"/>
<rect x="24.5" y="128.5" width="419" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="234" y="152" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">admin waits order-88</text>
<rect x="536" y="128" width="400" height="40" rx="8" fill="#ffffff"/>
<rect x="536.5" y="128.5" width="399" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="736" y="146" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no durable timer</text>
<text x="736" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the task does not sleep</text>
<path d="M 444,204 H 534" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="24" y="184" width="420" height="40" rx="8" fill="#ffffff"/>
<rect x="24.5" y="184.5" width="419" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="234" y="208" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">admin external-waits</text>
<rect x="536" y="184" width="400" height="40" rx="8" fill="#ffffff"/>
<rect x="536.5" y="184.5" width="399" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="736" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">order-88: approval</text>
<text x="736" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a pending human decision</text>
<text x="24" y="268" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">These commands only read. You can run them on production without a confirmation.</text>
</svg>
