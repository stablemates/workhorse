<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 236" width="960" height="236" role="img" aria-labelledby="active-job-kinds-light-title active-job-kinds-light-desc">
<title id="active-job-kinds-light-title">A default job runs only on Ruby; a typed job runs on any worker</title>
<desc id="active-job-kinds-light-desc">A default job has no task type. Workhorse stores it as an active_job task whose payload is the serialized job, and only the Ruby worker runs it. A typed job names its own task type with workhorse_options and takes one JSON Hash with String keys. A Python, Go, TypeScript, Rust, or Ruby worker can run it.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="236" fill="#ffffff"/>
<text x="416" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">task</text>
<text x="776" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">who can run it</text>
<line x1="256" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="90" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">default job</text>
<text x="24" y="105" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">no task type</text>
<path d="M 576,96 H 614" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="256" y="72" width="320" height="48" rx="8" fill="#ffffff"/>
<rect x="256.5" y="72.5" width="319" height="47" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="416" y="94" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">task type active_job</text>
<text x="416" y="108" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">payload: the serialized job</text>
<rect x="616" y="72" width="320" height="48" rx="8" fill="#ffffff"/>
<rect x="616.5" y="72.5" width="319" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="776" y="94" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the Ruby worker only</text>
<text x="776" y="108" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">every Active Job argument type</text>
<text x="24" y="154" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">typed job</text>
<text x="24" y="169" fill="#555555" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">workhorse_options task_type:</text>
<path d="M 576,160 H 614" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="256" y="136" width="320" height="48" rx="8" fill="#ffffff"/>
<rect x="256.5" y="136.5" width="319" height="47" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="416" y="158" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">its own task type</text>
<text x="416" y="172" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">payload: one JSON Hash</text>
<rect x="616" y="136" width="320" height="48" rx="8" fill="#ffffff"/>
<rect x="616.5" y="136.5" width="319" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="776" y="158" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">any language worker</text>
<text x="776" y="172" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Python · Go · TypeScript · Rust · Ruby</text>
<text x="24" y="220" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A typed job takes exactly one Hash with String keys. Its callers do not change.</text>
</svg>
