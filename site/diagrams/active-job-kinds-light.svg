<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 236" width="960" height="236" role="img" aria-labelledby="active-job-kinds-light-title active-job-kinds-light-desc">
<title id="active-job-kinds-light-title">A default job runs only on Ruby; a typed job runs on any worker</title>
<desc id="active-job-kinds-light-desc">A default job has no task type. Workhorse stores it as an active_job task whose payload is the serialized job, and only the Ruby worker runs it. A typed job names its own task type with workhorse_options and takes one JSON Hash with String keys. A Python, Go, TypeScript, Rust, or Ruby worker can run it.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="236" fill="#f9fafb"/>
<text x="416" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">task</text>
<text x="776" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">who can run it</text>
<line x1="256" y1="52" x2="936" y2="52" stroke="rgba(26,32,39,0.14)"/>
<text x="24" y="90" fill="#1a2027" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">default job</text>
<text x="24" y="105" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">no task type</text>
<path d="M 576,96 H 614" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="256" y="72" width="320" height="48" rx="6" fill="#f9fafb"/>
<rect x="256" y="72" width="320" height="48" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="416" y="94" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task type active_job</text>
<text x="416" y="108" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">payload: the serialized job</text>
<rect x="616" y="72" width="320" height="48" rx="6" fill="#f9fafb"/>
<rect x="616" y="72" width="320" height="48" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="776" y="94" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the Ruby worker only</text>
<text x="776" y="108" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">every Active Job argument type</text>
<text x="24" y="154" fill="#1a2027" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">typed job</text>
<text x="24" y="169" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">workhorse_options task_type:</text>
<path d="M 576,160 H 614" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="256" y="136" width="320" height="48" rx="6" fill="#f9fafb"/>
<rect x="256" y="136" width="320" height="48" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="416" y="158" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">its own task type</text>
<text x="416" y="172" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">payload: one JSON Hash</text>
<rect x="616" y="136" width="320" height="48" rx="6" fill="#f9fafb"/>
<rect x="616" y="136" width="320" height="48" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="776" y="158" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">any language worker</text>
<text x="776" y="172" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">Python · Go · TypeScript · Rust · Ruby</text>
<text x="24" y="220" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">A typed job takes exactly one Hash with String keys. Its callers do not change.</text>
</svg>
