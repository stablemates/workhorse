<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" width="400" height="344" role="img" aria-labelledby="human-decisions-wait-narrow-light-title human-decisions-wait-narrow-light-desc">
<title id="human-decisions-wait-narrow-light-title">A human wait frees the worker until a person decides</title>
<desc id="human-decisions-wait-narrow-light-desc">At 0 s, worker A runs the handler for acct-19, and the handler waits for the account-review decision. No worker holds the task during the wait, and the dashboard shows the decision to operators. At 40 min, an operator approves, and Workhorse stores the result and sets the task to ready. Worker B runs the handler from its first line. The wait returns the stored result, and the handler activates the account. Both runs are attempt 1.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="344" fill="#ffffff"/>
<text x="24" y="49" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">0 s</text>
<rect x="112" y="24" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="24.5" width="263" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="244" y="43" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">worker A: waitForHuman</text>
<text x="244" y="57" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stores the context · frees the slot</text>
<path d="M 248,66 V 78" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="105" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">0 s to 40 min</text>
<rect x="112" y="80" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="80.5" width="263" height="41" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="99" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no worker holds the task</text>
<text x="244" y="113" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the dashboard shows the decision</text>
<path d="M 248,122 V 134" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="161" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">40 min</text>
<rect x="112" y="136" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="136.5" width="263" height="41" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="155" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">an operator approves</text>
<text x="244" y="169" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">result stored · task ready</text>
<path d="M 248,178 V 190" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="217" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">after 40 min</text>
<rect x="112" y="192" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="192.5" width="263" height="41" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="211" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker B: the wait returns</text>
<text x="244" y="225" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the stored result at once</text>
<path d="M 248,234 V 246" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="112" y="248" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="248.5" width="263" height="41" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="244" y="267" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">activateAccount runs</text>
<text x="244" y="281" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">activates acct-19 · task succeeds</text>
<text x="24" y="312" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Each run starts at the first line of the</text>
<text x="24" y="327" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">handler. The wait does not use an attempt.</text>
</svg>
