<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 751" width="400" height="751" role="img" aria-labelledby="worker-process-states-narrow-dark-title worker-process-states-narrow-dark-desc">
<title id="worker-process-states-narrow-dark-title">Every state of a worker process, and how the process leaves it</title>
<desc id="worker-process-states-narrow-dark-desc">A worker process starts in starting. From starting, a configuration or probe failure exits with failure, a refused startup check makes it failing, every worker passing its startup checks with readiness true makes it running, and a first signal makes it draining after startup completes. From running, a first SIGTERM or SIGINT makes it draining, and a fatal worker-loop failure makes it failing. From failing, the process exits with failure when its siblings settle or the deadline is missed. From draining, it exits with code 0 when handlers settle and resources close cleanly, with code 1 when a run loop or close rejects or the deadline is missed, with 130 on a second SIGINT, and with 143 on a second SIGTERM.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="751" fill="#000000"/>
<text x="24" y="49" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">start</text>
<rect x="112" y="24" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="24.5" width="263" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="244" y="43" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">→ starting</text>
<text x="244" y="57" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the process starts</text>
<text x="24" y="105" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">starting</text>
<rect x="112" y="80" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="80.5" width="263" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="99" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">→ exited_failure · code 1</text>
<text x="244" y="113" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">configuration or probe failure</text>
<text x="24" y="161" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">starting</text>
<rect x="112" y="136" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="136.5" width="263" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="155" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">→ failing</text>
<text x="244" y="169" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">startup check refused</text>
<text x="24" y="217" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">starting</text>
<rect x="112" y="192" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="192.5" width="263" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="244" y="211" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">→ running</text>
<text x="244" y="225" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">startup checks passed, readiness true</text>
<text x="24" y="273" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">starting</text>
<rect x="112" y="248" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="248.5" width="263" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="244" y="267" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">→ draining</text>
<text x="244" y="281" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">first signal, after startup completes</text>
<text x="24" y="329" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">running</text>
<rect x="112" y="304" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="304.5" width="263" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="244" y="323" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">→ draining</text>
<text x="244" y="337" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">first SIGTERM or SIGINT</text>
<text x="24" y="385" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">running</text>
<rect x="112" y="360" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="360.5" width="263" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="379" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">→ failing</text>
<text x="244" y="393" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">fatal worker-loop failure</text>
<text x="24" y="441" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">failing</text>
<rect x="112" y="416" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="416.5" width="263" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="435" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">→ exited_failure · code 1</text>
<text x="244" y="449" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">siblings settle or deadline missed</text>
<text x="24" y="497" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">draining</text>
<rect x="112" y="472" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="472.5" width="263" height="41" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="491" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">→ exited_ok · code 0</text>
<text x="244" y="505" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">handlers settle, resources close cleanly</text>
<text x="24" y="553" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">draining</text>
<rect x="112" y="528" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="528.5" width="263" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="547" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">→ exited_failure · code 1</text>
<text x="244" y="561" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">run loop or close rejects, or deadline missed</text>
<text x="24" y="609" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">draining</text>
<rect x="112" y="584" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="584.5" width="263" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="603" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">→ exit_130 · code 130</text>
<text x="244" y="617" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">second SIGINT</text>
<text x="24" y="665" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">draining</text>
<rect x="112" y="640" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="640.5" width="263" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="659" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">→ exit_143 · code 143</text>
<text x="244" y="673" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">second SIGTERM</text>
<text x="24" y="704" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Grouped by the state that each</text>
<text x="24" y="719" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">transition leaves.</text>
</svg>
