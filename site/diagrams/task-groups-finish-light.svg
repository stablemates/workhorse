<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-labelledby="task-groups-finish-light-title task-groups-finish-light-desc">
<title id="task-groups-finish-light-title">The last finished member task finishes the group and enqueues its callback</title>
<desc id="task-groups-finish-light-desc">Queue.taskGroup creates the group for imp-7, enqueues 20,000 imports.row tasks, and seals the group in one transaction. Workers run the rows. 19,998 succeed, and 2 fail after their last retry. In the transaction of the last terminal row, Workhorse finishes the group with the result failed and enqueues the imports.report callback.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="264" fill="#ffffff"/>
<path d="M 216,128 H 254" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 476,128 H 514" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 716,128 H 754" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="24" y="96" width="192" height="64" rx="8" fill="#ffffff"/>
<rect x="24.5" y="96.5" width="191" height="63" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="120" y="126" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">Queue.taskGroup</text>
<text x="120" y="140" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">create · add 20,000 · seal</text>
<text x="120" y="184" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">one transaction</text>
<rect x="256" y="56" width="220" height="152" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="268" y="50" width="144" height="12" fill="#ffffff"/>
<text x="340" y="59" fill="#555555" font-size="8" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle" letter-spacing="0.04em">MEMBER TASKS · imports.row</text>
<rect x="272" y="76" width="188" height="36" rx="8" fill="#ffffff"/>
<rect x="272.5" y="76.5" width="187" height="35" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="366" y="98" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">19,998 succeeded</text>
<rect x="272" y="120" width="188" height="36" rx="8" fill="#ffffff"/>
<rect x="272.5" y="120.5" width="187" height="35" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="366" y="136" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">2 failed</text>
<text x="366" y="150" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">after the last retry</text>
<rect x="272" y="164" width="188" height="32" rx="8" fill="#ffffff"/>
<rect x="272.5" y="164.5" width="187" height="31" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="366" y="184" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">pending: 0</text>
<rect x="516" y="96" width="200" height="64" rx="8" fill="#ffffff"/>
<rect x="516.5" y="96.5" width="199" height="63" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="616" y="126" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">group finished</text>
<text x="616" y="140" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">result: failed</text>
<text x="616" y="184" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">in the transaction of the last row</text>
<rect x="756" y="76" width="180" height="48" rx="8" fill="#ffffff"/>
<rect x="756.5" y="76.5" width="179" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="846" y="98" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">onFinish</text>
<text x="846" y="112" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">imports.report enqueued</text>
<rect x="756" y="136" width="180" height="48" rx="8" fill="#ffffff"/>
<rect x="756.5" y="136.5" width="179" height="47" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="846" y="158" fill="#555555" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">onSuccess</text>
<text x="846" y="172" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">only for succeeded</text>
<text x="24" y="248" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Each member task counts when it becomes terminal. A retry does not finish a member task.</text>
</svg>
