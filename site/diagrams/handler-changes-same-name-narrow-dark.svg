<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550" role="img" aria-labelledby="handler-changes-same-name-narrow-dark-title handler-changes-same-name-narrow-dark-desc">
<title id="handler-changes-same-name-narrow-dark-title">A changed operation under a stored name does not run</title>
<desc id="handler-changes-same-name-narrow-dark-desc">The old code stores a result under ship. After the task waits, the new code calls the same checkpoint with a changed operation. Workhorse returns the stored result by name and does not run the new operation.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="550" fill="#000000"/>
<text x="24" y="28" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">old code</text>
<text x="24" y="43" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">before the wait</text>
<rect x="24" y="64" width="328" height="48" rx="8" fill="#000000"/>
<rect x="24.5" y="64.5" width="327" height="47" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="188" y="86" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">checkpoint("ship", old)</text>
<text x="188" y="100" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stores its result</text>
<path d="M 188,112 V 132" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="24" y="140" width="328" height="96" rx="8" fill="#000000"/>
<rect x="24.5" y="140.5" width="327" height="95" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="188" y="164" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="middle">one stored row</text>
<text x="188" y="179" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">the name is the key</text>
<path d="M 328,208 H 372 V 432 H 360" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="48" y="188" width="280" height="40" rx="8" fill="#000000"/>
<rect x="48.5" y="188.5" width="279" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="188" y="206" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ship</text>
<text x="188" y="220" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">result from old code</text>
<path d="M 188,236 V 256" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="288" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">new code</text>
<text x="24" y="303" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">after the wait</text>
<rect x="24" y="324" width="328" height="48" rx="8" fill="#000000"/>
<rect x="24.5" y="324.5" width="327" height="47" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="188" y="346" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">checkpoint("ship", new)</text>
<text x="188" y="360" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">same name</text>
<path d="M 188,372 V 392" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="24" y="400" width="328" height="64" rx="8" fill="#000000"/>
<rect x="24.5" y="400.5" width="327" height="63" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="188" y="430" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns the stored result</text>
<text x="188" y="444" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">new operation does not run</text>
<text x="24" y="510" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A changed operation does not replace</text>
<text x="24" y="525" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the value of a stored name.</text>
</svg>
