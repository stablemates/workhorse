<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550" role="img" aria-labelledby="handler-changes-same-name-narrow-dark-title handler-changes-same-name-narrow-dark-desc">
<title id="handler-changes-same-name-narrow-dark-title">A changed operation under a stored name does not run</title>
<desc id="handler-changes-same-name-narrow-dark-desc">The old code stores a result under ship. After the task waits, the new code calls the same checkpoint with a changed operation. Workhorse returns the stored result by name and does not run the new operation.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="550" fill="#04080e"/>
<text x="24" y="28" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">old code</text>
<text x="24" y="43" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">before the wait</text>
<rect x="24" y="64" width="328" height="48" rx="6" fill="#04080e"/>
<rect x="24" y="64" width="328" height="48" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="188" y="86" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">checkpoint("ship", old)</text>
<text x="188" y="100" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">stores its result</text>
<path d="M 188,112 V 132" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="24" y="140" width="328" height="96" rx="6" fill="#04080e"/>
<rect x="24" y="140" width="328" height="96" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="188" y="164" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="middle">one stored row</text>
<text x="188" y="179" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">the name is the key</text>
<path d="M 328,208 H 372 V 432 H 360" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="48" y="188" width="280" height="40" rx="6" fill="#04080e"/>
<rect x="48" y="188" width="280" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="188" y="206" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">ship</text>
<text x="188" y="220" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">result from old code</text>
<path d="M 188,236 V 256" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="288" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">new code</text>
<text x="24" y="303" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">after the wait</text>
<rect x="24" y="324" width="328" height="48" rx="6" fill="#04080e"/>
<rect x="24" y="324" width="328" height="48" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="188" y="346" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">checkpoint("ship", new)</text>
<text x="188" y="360" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">same name</text>
<path d="M 188,372 V 392" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="24" y="400" width="328" height="64" rx="6" fill="#04080e"/>
<rect x="24" y="400" width="328" height="64" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="188" y="430" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">returns the stored result</text>
<text x="188" y="444" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">new operation does not run</text>
<text x="24" y="510" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">A changed operation does not replace</text>
<text x="24" y="525" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the value of a stored name.</text>
</svg>
