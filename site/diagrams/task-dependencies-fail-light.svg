<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="task-dependencies-fail-light-title task-dependencies-fail-light-desc">
<title id="task-dependencies-fail-light-title">A failed prerequisite with the policy fail fails the dependent</title>
<desc id="task-dependencies-fail-light-desc">release.announce waits for release.publish and release.index with onFailure fail. At 1 min, release.index fails after its last retry. Workhorse marks the announcement as rejected, but one edge is still unresolved, so it stays blocked. At 2 min, release.publish succeeds. No edge is unresolved, and the fail policy has precedence, so Workhorse fails the announcement. It never runs.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="280" fill="#ffffff"/>
<text x="24" y="40" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">release.announce</text>
<text x="24" y="55" fill="#555555" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">onFailure: "fail"</text>
<text x="317.3333333333333" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 s</text>
<text x="568" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">1 min</text>
<text x="818.6666666666666" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">2 min</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="97" fill="#000000" font-size="10" font-family="Geist Mono, monospace" text-anchor="start">release.publish</text>
<rect x="200" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="317.3333333333333" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">not finished</text>
<text x="317.3333333333333" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the edge is unresolved</text>
<rect x="450.66666666666663" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="568" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">not finished</text>
<text x="568" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the edge is unresolved</text>
<rect x="701.3333333333333" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="701.8333333333333" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="818.6666666666666" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">succeeds</text>
<text x="818.6666666666666" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the edge resolves: release</text>
<text x="24" y="153" fill="#000000" font-size="10" font-family="Geist Mono, monospace" text-anchor="start">release.index</text>
<rect x="200" y="128" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="317.3333333333333" y="146" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">not finished</text>
<text x="317.3333333333333" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the edge is unresolved</text>
<rect x="450.66666666666663" y="128" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="568" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">fails</text>
<text x="568" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the edge resolves: fail</text>
<text x="24" y="209" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">announcement</text>
<rect x="200" y="184" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="184.5" width="233.66666666666666" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="317.3333333333333" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">blocked</text>
<text x="317.3333333333333" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">2 unresolved edges</text>
<rect x="450.66666666666663" y="184" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="184.5" width="233.66666666666666" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="568" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">blocked · rejected</text>
<text x="568" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">1 unresolved edge</text>
<rect x="701.3333333333333" y="184" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="701.8333333333333" y="184.5" width="233.66666666666666" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="818.6666666666666" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">failed</text>
<text x="818.6666666666666" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">it never runs</text>
<text x="24" y="264" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">After all edges resolve, fail has precedence over cancel, and cancel over release.</text>
</svg>
