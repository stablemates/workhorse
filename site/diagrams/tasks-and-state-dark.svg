<text x="480" y="156" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">task_runtime</text>
<text x="480" y="170" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active · worker A</text>
<rect x="344" y="192" width="272" height="44" rx="8" fill="#000000"/>
<rect x="344.5" y="192.5" width="271" height="43" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="480" y="218" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">task_outcome · no row</text>
<text x="664" y="40" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">3 · After success</text>
