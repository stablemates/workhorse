<rect x="664.5" y="136.5" width="271" height="43" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="800" y="162" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">task_runtime · no row</text>
<rect x="664" y="192" width="272" height="44" rx="8" fill="#000000"/>
<rect x="664.5" y="192.5" width="271" height="43" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="800" y="212" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">task_outcome</text>
<text x="800" y="226" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">succeeded · result</text>
<line x1="24" y1="268" x2="936" y2="268" stroke="#2b2b2b"/>
<text x="24" y="292" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">History, kept apart from these rows:</text>
<text x="24" y="310" fill="#f4f4f4" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">task_event</text>
<text x="120" y="310" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">enqueued · claimed · succeeded</text>
<text x="344" y="310" fill="#f4f4f4" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">attempt_history</text>
<text x="472" y="310" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">attempt 1 · succeeded</text>
