<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 324" width="960" height="324" role="img" aria-labelledby="tasks-and-state-dark-title tasks-and-state-dark-desc">
<title id="tasks-and-state-dark-title">One task after enqueue, after the claim, and after success</title>
<desc id="tasks-and-state-dark-desc">After enqueue, the task has a task row and a ready task_runtime row. After the claim, the runtime row is active. After success, the runtime row is gone and a succeeded task_outcome row exists. task_event and attempt_history keep the history apart.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="324" fill="#000000"/>
<path d="M 300,160 H 338" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 620,160 H 658" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="40" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">1 · After enqueue</text>
<text x="24" y="55" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">both rows in one transaction</text>
<rect x="24" y="80" width="272" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="80.5" width="271" height="43" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
