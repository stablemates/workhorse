<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 324" width="960" height="324" role="img" aria-labelledby="tasks-and-state-dark-title tasks-and-state-dark-desc">
<title id="tasks-and-state-dark-title">One task after enqueue, after the claim, and after success</title>
<desc id="tasks-and-state-dark-desc">After enqueue, the task has a task row and a ready task_runtime row. After the claim, the runtime row is active. After success, the runtime row is gone and a succeeded task_outcome row exists. task_event and attempt_history keep the history apart.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="324" fill="#04080e"/>
<path d="M 300,160 H 338" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 620,160 H 658" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">1 · After enqueue</text>
<text x="24" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">both rows in one transaction</text>
<rect x="24" y="80" width="272" height="44" rx="6" fill="#04080e"/>
<rect x="24" y="80" width="272" height="44" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="160" y="100" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task</text>
<text x="160" y="114" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">resize-image · media</text>
<rect x="24" y="136" width="272" height="44" rx="6" fill="#04080e"/>
<rect x="24" y="136" width="272" height="44" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="160" y="156" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task_runtime</text>
<text x="160" y="170" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">ready</text>
<rect x="24" y="192" width="272" height="44" rx="6" fill="#04080e"/>
<rect x="24" y="192" width="272" height="44" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="160" y="218" fill="#95999d" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">task_outcome · no row</text>
<text x="344" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">2 · After the claim</text>
<text x="344" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">only task_runtime changes</text>
<rect x="344" y="80" width="272" height="44" rx="6" fill="#04080e"/>
<rect x="344" y="80" width="272" height="44" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="480" y="100" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task</text>
<text x="480" y="114" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">resize-image · media</text>
<rect x="344" y="136" width="272" height="44" rx="6" fill="#04080e"/>
<rect x="344" y="136" width="272" height="44" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="480" y="156" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task_runtime</text>
<text x="480" y="170" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">active · worker A</text>
<rect x="344" y="192" width="272" height="44" rx="6" fill="#04080e"/>
<rect x="344" y="192" width="272" height="44" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="480" y="218" fill="#95999d" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">task_outcome · no row</text>
<text x="664" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">3 · After success</text>
<text x="664" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">delete and insert in one transaction</text>
<rect x="664" y="80" width="272" height="44" rx="6" fill="#04080e"/>
<rect x="664" y="80" width="272" height="44" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="800" y="100" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task</text>
<text x="800" y="114" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">resize-image · media</text>
<rect x="664" y="136" width="272" height="44" rx="6" fill="#04080e"/>
<rect x="664" y="136" width="272" height="44" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="800" y="162" fill="#95999d" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">task_runtime · no row</text>
<rect x="664" y="192" width="272" height="44" rx="6" fill="#04080e"/>
<rect x="664" y="192" width="272" height="44" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="800" y="212" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">task_outcome</text>
<text x="800" y="226" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">succeeded · result</text>
<line x1="24" y1="268" x2="936" y2="268" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="292" fill="#95999d" font-size="9" font-family="Geist Mono">History, kept apart from these rows:</text>
<text x="24" y="310" fill="#f2f4f5" font-size="9" font-family="Geist Mono">task_event</text>
<text x="120" y="310" fill="#ced1d4" font-size="9" font-family="Geist Mono">enqueued · claimed · succeeded</text>
<text x="344" y="310" fill="#f2f4f5" font-size="9" font-family="Geist Mono">attempt_history</text>
<text x="472" y="310" fill="#ced1d4" font-size="9" font-family="Geist Mono">attempt 1 · succeeded</text>
</svg>
