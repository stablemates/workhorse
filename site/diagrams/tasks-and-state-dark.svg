<text x="160" y="114" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">resize-image · media</text>
<rect x="24" y="136" width="272" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="136.5" width="271" height="43" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="160" y="156" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">task_runtime</text>
<text x="160" y="170" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ready</text>
<rect x="24" y="192" width="272" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="192.5" width="271" height="43" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="160" y="218" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">task_outcome · no row</text>
<text x="344" y="40" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">2 · After the claim</text>
<text x="344" y="55" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">only task_runtime changes</text>
<rect x="344" y="80" width="272" height="44" rx="8" fill="#000000"/>
<rect x="344.5" y="80.5" width="271" height="43" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
