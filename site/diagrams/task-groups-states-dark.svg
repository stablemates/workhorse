<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" width="960" height="368" role="img" aria-labelledby="task-groups-states-dark-title task-groups-states-dark-desc">
<title id="task-groups-states-dark-title">An open group cannot finish. After the seal, only a running member task can add</title>
<desc id="task-groups-states-dark-desc">Queue.createTaskGroup creates an open group for imp-7. While it is open, the app adds pages of rows with Queue.addToTaskGroup, and a running member task can add with ctx.taskGroup.add. Queue.sealTaskGroup seals the group. After the seal, only a running member task can add. When the last member task is finished, Workhorse finishes the group and enqueues the callbacks.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="368" fill="#000000"/>
<path d="M 424,76 H 446" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 680,76 H 702" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="192" y="52" width="232" height="48" rx="8" fill="#000000"/>
<rect x="192.5" y="52.5" width="231" height="47" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="308" y="74" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">open</text>
<text x="308" y="88" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">Queue.createTaskGroup</text>
<rect x="448" y="52" width="232" height="48" rx="8" fill="#000000"/>
<rect x="448.5" y="52.5" width="231" height="47" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="564" y="74" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">sealed</text>
<text x="564" y="88" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">Queue.sealTaskGroup</text>
<rect x="704" y="52" width="232" height="48" rx="8" fill="#000000"/>
<rect x="704.5" y="52.5" width="231" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="820" y="74" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">finished</text>
<text x="820" y="88" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the last member is finished</text>
<text x="24" y="156" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">the app adds</text>
<text x="24" y="172" fill="#ababab" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">Queue.addToTaskGroup</text>
<text x="24" y="220" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">a member adds</text>
<text x="24" y="236" fill="#ababab" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">ctx.taskGroup.add</text>
<text x="24" y="284" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">the group</text>
<rect x="192" y="136" width="232" height="44" rx="8" fill="#000000"/>
<rect x="192.5" y="136.5" width="231" height="43" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="308" y="156" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">can add</text>
<text x="308" y="170" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">in the app's transaction</text>
<rect x="448" y="136" width="232" height="44" rx="8" fill="#000000"/>
<rect x="448.5" y="136.5" width="231" height="43" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="564" y="156" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">raises an error</text>
<text x="564" y="170" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">after the seal</text>
<rect x="704" y="136" width="232" height="44" rx="8" fill="#000000"/>
<rect x="704.5" y="136.5" width="231" height="43" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="820" y="156" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">raises an error</text>
<text x="820" y="170" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the group is finished</text>
<rect x="192" y="200" width="232" height="44" rx="8" fill="#000000"/>
<rect x="192.5" y="200.5" width="231" height="43" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="308" y="220" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">can add</text>
<text x="308" y="234" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">while the member runs</text>
<rect x="448" y="200" width="232" height="44" rx="8" fill="#000000"/>
<rect x="448.5" y="200.5" width="231" height="43" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="564" y="220" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">can add</text>
<text x="564" y="234" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">while the member runs</text>
<rect x="704" y="200" width="232" height="44" rx="8" fill="#000000"/>
<rect x="704.5" y="200.5" width="231" height="43" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="820" y="220" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no add</text>
<text x="820" y="234" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no member task runs</text>
<rect x="192" y="264" width="232" height="44" rx="8" fill="#000000"/>
<rect x="192.5" y="264.5" width="231" height="43" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="308" y="284" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">cannot finish</text>
<text x="308" y="298" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">it never expires</text>
<rect x="448" y="264" width="232" height="44" rx="8" fill="#000000"/>
<rect x="448.5" y="264.5" width="231" height="43" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="564" y="284" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">waits</text>
<text x="564" y="298" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">for each pending member</text>
<rect x="704" y="264" width="232" height="44" rx="8" fill="#000000"/>
<rect x="704.5" y="264.5" width="231" height="43" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="820" y="284" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">callbacks enqueued</text>
<text x="820" y="298" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one time</text>
<text x="24" y="352" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">If the app does not seal the group, the callbacks never run.</text>
</svg>
