<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-labelledby="idempotency-lifetime-light-title idempotency-lifetime-light-desc">
<title id="idempotency-lifetime-light-title">A key stays active for its time limit, also after the task completes</title>
<desc id="idempotency-lifetime-light-desc">The key capture:7781 has the default time limit of one day. At 0 h, the first request creates the task. At 1 min, a worker completes it. At 3 h, a client repeats the request and gets the original task. At 25 h, the key is no longer active, and the same request creates a new task.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="264" fill="#ffffff"/>
<text x="24" y="40" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">capture:7781</text>
<text x="24" y="55" fill="#555555" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">ttlMs: 1 day</text>
<text x="286" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 h</text>
<text x="474" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">1 min</text>
<text x="662" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">3 h</text>
<text x="850" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">25 h</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="97" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">request</text>
<rect x="200" y="72" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="72.5" width="171" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="286" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the first request</text>
<text x="286" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">from the client</text>
<rect x="576" y="72" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="576.5" y="72.5" width="171" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="662" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the same request</text>
<text x="662" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the client repeats it</text>
<rect x="764" y="72" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="764.5" y="72.5" width="171" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="850" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the same request</text>
<text x="850" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the client repeats it</text>
<text x="24" y="153" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">task</text>
<rect x="200" y="128" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="128.5" width="171" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="286" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">created</text>
<text x="286" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">accepted</text>
<rect x="388" y="128" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="388.5" y="128.5" width="171" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="474" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">succeeded</text>
<text x="474" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a worker completes it</text>
<rect x="576" y="128" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="576.5" y="128.5" width="171" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="662" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the original task</text>
<text x="662" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">replayed</text>
<rect x="764" y="128" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="764.5" y="128.5" width="171" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="850" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a new task</text>
<text x="850" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">accepted</text>
<text x="24" y="209" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">key</text>
<rect x="200" y="184" width="548" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="184.5" width="547" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="474" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active</text>
<text x="474" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a repeat does not make the time limit longer</text>
<rect x="764" y="184" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="764.5" y="184.5" width="171" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="850" y="202" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no longer active</text>
<text x="850" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">after 1 day</text>
<text x="24" y="248" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Set ttlMs to the longest time in which a client can repeat a request.</text>
</svg>
