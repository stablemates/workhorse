<rect x="800" y="64" width="136" height="196" rx="8" fill="#ffffff"/>
<rect x="800.5" y="64.5" width="135" height="195" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="868" y="160" fill="#000000" font-size="12" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ready</text>
<text x="868" y="174" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">same attempt</text>
<path d="M 868,260 V 298" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="820" y="272" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="868" y="281" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">claim, fence N+k</text>
<rect x="560" y="300" width="376" height="52" rx="8" fill="#ffffff"/>
<rect x="560.5" y="300.5" width="375" height="51" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="748" y="324" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active</text>
<text x="748" y="338" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">handler restarts from entry · named wait replays</text>
<text x="24" y="384" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Each suspension clears ownership but does not close the logical attempt.</text>
</svg>
