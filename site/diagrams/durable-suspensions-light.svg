<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="durable-suspensions-light-title durable-suspensions-light-desc">
<title id="durable-suspensions-light-title">A suspension clears the owner but keeps the attempt; the wake makes it claimable</title>
<desc id="durable-suspensions-light-desc">An active task with worker and fence N calls schedule_wait_v1 with a future target, wait_for_signal_v1, or wait_for_human_v1. The task becomes scheduled with wait_name set and no owner, or scheduled and parked with a pending task_signal_wait or task_human_wait. promote_v1 at run_at, send_signal_v1, or complete_human_wait_v1 makes it ready in the same attempt. A claim with fence N+k makes it active, and the handler restarts from entry, where the named wait replays.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="400" fill="#ffffff"/>
<text x="88" y="40" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">active</text>
<text x="280" y="40" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">suspend</text>
<text x="528" y="40" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">scheduled, no owner</text>
<text x="720" y="40" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">wake</text>
<text x="868" y="40" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">ready</text>
<line x1="24" y1="48" x2="936" y2="48" stroke="#e7e7e7"/>
<rect x="24" y="64" width="128" height="196" rx="8" fill="#ffffff"/>
