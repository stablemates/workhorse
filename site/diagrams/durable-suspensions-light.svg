<rect x="416" y="216" width="224" height="48" rx="8" fill="#ffffff"/>
<rect x="416.5" y="216.5" width="223" height="47" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="528" y="238" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">scheduled</text>
<text x="528" y="252" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">task_human_wait pending</text>
<path d="M 640,240 H 798" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
