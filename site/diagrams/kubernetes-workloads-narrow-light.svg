<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 303" width="400" height="303" role="img" aria-labelledby="kubernetes-workloads-narrow-light-title kubernetes-workloads-narrow-light-desc">
<title id="kubernetes-workloads-narrow-light-title">The schema Job runs first; the dashboard stays behind an internal Service</title>
<desc id="kubernetes-workloads-narrow-light-desc">Step 1: the schema Job migrates the schema and verifies it. Step 2: the worker Deployment, with two replicas and probes on port 9090, and the dashboard Deployment, with one replica, start from the same image. Your authenticated HTTPS ingress reaches the dashboard through an internal ClusterIP Service. Each workload connects to PostgreSQL with the URL from the Secret workhorse-database.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="400" height="303" fill="#f9fafb"/>
<text x="24" y="49" fill="#1a2027" font-size="9" font-family="Geist Mono">1</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="43" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">schema Job</text>
<text x="244" y="57" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">migrate, then verify</text>
<text x="24" y="105" fill="#1a2027" font-size="9" font-family="Geist Mono">2</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="244" y="99" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">worker Deployment</text>
<text x="244" y="113" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">2 replicas · probes on :9090</text>
<text x="24" y="161" fill="#1a2027" font-size="9" font-family="Geist Mono">2</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="155" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">dashboard Deployment</text>
<text x="244" y="169" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">1 replica</text>
<text x="24" y="217" fill="#1a2027" font-size="9" font-family="Geist Mono">access</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="211" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">ingress → ClusterIP Service</text>
<text x="244" y="225" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the dashboard stays internal</text>
<text x="24" y="256" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Start the Deployments only after the</text>
<text x="24" y="271" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Job succeeds.</text>
</svg>
