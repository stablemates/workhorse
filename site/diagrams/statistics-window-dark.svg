<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 268" width="960" height="268" role="img" aria-labelledby="statistics-window-dark-title statistics-window-dark-desc">
<title id="statistics-window-dark-title">A window reads summary rows before the watermark and raw history after it</title>
<desc id="statistics-window-dark-desc">At 10:05:02, the rollup summarizes the minute 10:04 and moves the watermark to 10:05. At 10:05:40, an operator asks for the last hour. Workhorse reads the summary rows before the watermark and counts the part from 10:05 to 10:05:40 from the raw history. If the rollup is late, the raw part is longer, and the answer stays correct.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="268" fill="#04080e"/>
<text x="24" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">the last hour</text>
<text x="24" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">asked at 10:05:40</text>
<text x="24" y="101" fill="#f2f4f5" font-size="10" font-family="Geist Mono">rollup</text>
<path d="M 680,112 V 146" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="562" y="72" width="236" height="40" rx="6" fill="#04080e"/>
<rect x="562" y="72" width="236" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="680" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">10:05:02 · rollup</text>
<text x="680" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">summarizes 10:04</text>
<text x="24" y="177" fill="#f2f4f5" font-size="10" font-family="Geist Mono">window</text>
<rect x="200" y="152" width="476" height="48" rx="6" fill="#04080e"/>
<rect x="200" y="152" width="476" height="48" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="438" y="174" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">summary rows</text>
<text x="438" y="188" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">before the watermark</text>
<rect x="684" y="152" width="252" height="48" rx="6" fill="#04080e"/>
<rect x="684" y="152" width="252" height="48" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="810" y="174" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">raw history</text>
<text x="810" y="188" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">10:05 to 10:05:40</text>
<rect x="632" y="208" width="96" height="12" rx="2" fill="#04080e"/>
<text x="680" y="217" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">WATERMARK 10:05</text>
<text x="24" y="252" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Your own work counts at once. If the rollup is late, the raw part is longer, and the answer stays correct.</text>
</svg>
