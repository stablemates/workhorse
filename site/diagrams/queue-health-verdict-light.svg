<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 232" width="960" height="232" role="img" aria-labelledby="queue-health-verdict-light-title queue-health-verdict-light-desc">
<title id="queue-health-verdict-light-title">The verdict collects one reason for each budget that the queue exceeds</title>
<desc id="queue-health-verdict-light-desc">A bad deployment stops all workers of billing. Scheduled tasks become due, and no worker tick moves them to ready. When the oldest due task waits longer than its budget, the verdict becomes critical with the reason stalled-promotion. When the leases of the running tasks expire with no recovery, the verdict adds expired-leases. Each reason has a code, the observed value, and the budget.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="232" fill="#ffffff"/>
<text x="24" y="40" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">billing</text>
<text x="24" y="55" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the workers stop</text>
<text x="317.3333333333333" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">before</text>
<text x="568" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">due tasks wait</text>
<text x="818.6666666666666" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">leases expire</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="97" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">event</text>
<rect x="200" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="317.3333333333333" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">workers run</text>
<text x="317.3333333333333" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">each tick moves due tasks</text>
<rect x="450.66666666666663" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="568" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no worker tick</text>
<text x="568" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the oldest due task waits</text>
<rect x="701.3333333333333" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="701.8333333333333" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="818.6666666666666" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no recovery</text>
<text x="818.6666666666666" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">running leases expire</text>
<text x="24" y="153" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">verdict</text>
<rect x="200" y="128" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="317.3333333333333" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">healthy</text>
<text x="317.3333333333333" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no budget exceeded</text>
<rect x="450.66666666666663" y="128" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="128.5" width="233.66666666666666" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="568" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">critical</text>
<text x="568" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stalled-promotion</text>
<rect x="701.3333333333333" y="128" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="701.8333333333333" y="128.5" width="233.66666666666666" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="818.6666666666666" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">critical</text>
<text x="818.6666666666666" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stalled-promotion · expired-leases</text>
<text x="24" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Each reason has a stable code, the observed value, and the budget that the value exceeds.</text>
</svg>
