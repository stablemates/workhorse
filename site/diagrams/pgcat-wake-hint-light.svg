<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="pgcat-wake-hint-light-title pgcat-wake-hint-light-desc">
<title id="pgcat-wake-hint-light-title">PgCat holds the wake hint until the idle worker sends a query</title>
<desc id="pgcat-wake-hint-light-desc">The worker sends LISTEN workhorse_tasks through PgCat, and no error occurs. The worker waits and sends no query. A task is enqueued, and PostgreSQL sends a notification. PgCat buffers it until the next query of the worker. The fallback poll of the worker finds the task, and the buffered notification arrives only with the result of that poll.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="360" fill="#ffffff"/>
<text x="312" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">the worker</text>
<text x="568" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">PgCat</text>
<text x="824" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">PostgreSQL</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="90" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">1 · listen</text>
<text x="24" y="105" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">pool mode does not matter</text>
<path d="M 424,96 H 454" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="200" y="72" width="224" height="48" rx="8" fill="#ffffff"/>
<rect x="200.5" y="72.5" width="223" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="312" y="94" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">LISTEN workhorse_tasks</text>
<text x="312" y="108" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">through PgCat</text>
<rect x="456" y="72" width="224" height="48" rx="8" fill="#ffffff"/>
<rect x="456.5" y="72.5" width="223" height="47" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="568" y="94" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">accepts it</text>
<text x="568" y="108" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no error</text>
<text x="24" y="154" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">2 · wait</text>
<text x="24" y="169" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the queue is empty</text>
<rect x="200" y="136" width="224" height="48" rx="8" fill="#ffffff"/>
<rect x="200.5" y="136.5" width="223" height="47" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="312" y="158" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">waits</text>
<text x="312" y="172" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">sends no query</text>
<text x="24" y="218" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">3 · enqueue</text>
<text x="24" y="233" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">your application</text>
<path d="M 712,224 H 682" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="456" y="200" width="224" height="48" rx="8" fill="#ffffff"/>
<rect x="456.5" y="200.5" width="223" height="47" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="568" y="222" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">buffers the hint</text>
<text x="568" y="236" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">until the next query</text>
<rect x="712" y="200" width="224" height="48" rx="8" fill="#ffffff"/>
<rect x="712.5" y="200.5" width="223" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="824" y="222" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">notification</text>
<text x="824" y="236" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a task is enqueued</text>
<text x="24" y="282" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">4 · poll</text>
<text x="24" y="297" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the fallback poll</text>
<path d="M 424,288 H 454" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="200" y="264" width="224" height="48" rx="8" fill="#ffffff"/>
<rect x="200.5" y="264.5" width="223" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="312" y="286" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">sends the poll query</text>
<text x="312" y="300" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">and claims the task</text>
<rect x="456" y="264" width="224" height="48" rx="8" fill="#ffffff"/>
<rect x="456.5" y="264.5" width="223" height="47" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="568" y="286" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">relays the hint</text>
<text x="568" y="300" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">with the poll result</text>
<text x="24" y="344" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Every task still runs. To keep wake hints, give the worker a direct pool or session-mode PgBouncer.</text>
</svg>
