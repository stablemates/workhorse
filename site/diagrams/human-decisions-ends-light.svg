<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 324" width="960" height="324" role="img" aria-labelledby="human-decisions-ends-light-title human-decisions-ends-light-desc">
<title id="human-decisions-ends-light-title">A result resumes a pending decision, and a time limit or a cancellation ends it</title>
<desc id="human-decisions-ends-light-desc">The task for acct-19 waits on account-review. If an operator selects the Approve quick action, or the custom tool calls completeHumanWait with rev-4, Workhorse stores the result and the task becomes ready. If nobody answers before timeoutMs passes, maintenance fails the task with a deadline error. If the app cancels the task, Workhorse cancels it at once. After a failure or a cancellation, a late answer returns stale.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="324" fill="#ffffff"/>
<text x="286" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">dashboard quick action</text>
<text x="474" y="44" fill="#555555" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">completeHumanWait</text>
<text x="662" y="44" fill="#555555" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">timeoutMs passes</text>
<text x="850" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">cancellation</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
