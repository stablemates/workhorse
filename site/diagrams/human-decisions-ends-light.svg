<text x="24" y="250" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">task</text>
<path d="M 286,116 V 150" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 286,192 V 226" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="200" y="76" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="76.5" width="171" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="286" y="94" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Approve</text>
<text x="286" y="108" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the operator confirms</text>
<rect x="200" y="152" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="152.5" width="171" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="286" y="170" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">completed</text>
<text x="286" y="184" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stores the result</text>
<rect x="200" y="228" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="228.5" width="171" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="286" y="246" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ready</text>
<text x="286" y="260" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the handler runs again</text>
