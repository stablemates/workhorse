<text x="850" y="94" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">cancel the task</text>
<text x="850" y="108" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">while it waits</text>
<rect x="764" y="152" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="764.5" y="152.5" width="171" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
