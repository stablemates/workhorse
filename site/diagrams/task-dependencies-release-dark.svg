<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="task-dependencies-release-dark-title task-dependencies-release-dark-desc">
<title id="task-dependencies-release-dark-title">A dependent becomes ready when its last edge releases</title>
<desc id="task-dependencies-release-dark-desc">release.announce waits for release.publish and release.index. At 0 s, it is blocked with two unresolved edges. At 1 min, release.publish succeeds, and one edge is still unresolved. At 2 min, release.index succeeds. No edge is unresolved, so Workhorse makes the announcement ready and appends dependency_released.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="280" fill="#000000"/>
<text x="24" y="40" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">release.announce</text>
<text x="24" y="55" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">onSuccess: "release"</text>
<text x="317.3333333333333" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 s</text>
<text x="568" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">1 min</text>
<text x="818.6666666666666" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">2 min</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#2b2b2b"/>
<text x="24" y="97" fill="#f4f4f4" font-size="10" font-family="Geist Mono, monospace" text-anchor="start">release.publish</text>
<rect x="200" y="72" width="234.66666666666666" height="40" rx="8" fill="#000000"/>
<rect x="200.5" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="317.3333333333333" y="90" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">not finished</text>
<text x="317.3333333333333" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the edge is unresolved</text>
<rect x="450.66666666666663" y="72" width="234.66666666666666" height="40" rx="8" fill="#000000"/>
<rect x="451.16666666666663" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="568" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">succeeds</text>
<text x="568" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the edge resolves: release</text>
<text x="24" y="153" fill="#f4f4f4" font-size="10" font-family="Geist Mono, monospace" text-anchor="start">release.index</text>
<rect x="200" y="128" width="234.66666666666666" height="40" rx="8" fill="#000000"/>
<rect x="200.5" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="317.3333333333333" y="146" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">not finished</text>
<text x="317.3333333333333" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the edge is unresolved</text>
<rect x="450.66666666666663" y="128" width="234.66666666666666" height="40" rx="8" fill="#000000"/>
<rect x="451.16666666666663" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="568" y="146" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">not finished</text>
<text x="568" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the edge is unresolved</text>
<rect x="701.3333333333333" y="128" width="234.66666666666666" height="40" rx="8" fill="#000000"/>
<rect x="701.8333333333333" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="818.6666666666666" y="146" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">succeeds</text>
<text x="818.6666666666666" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the edge resolves: release</text>
<text x="24" y="209" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">announcement</text>
<rect x="200" y="184" width="234.66666666666666" height="40" rx="8" fill="#000000"/>
<rect x="200.5" y="184.5" width="233.66666666666666" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="317.3333333333333" y="202" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">blocked</text>
<text x="317.3333333333333" y="216" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">2 unresolved edges</text>
<rect x="450.66666666666663" y="184" width="234.66666666666666" height="40" rx="8" fill="#000000"/>
<rect x="451.16666666666663" y="184.5" width="233.66666666666666" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="568" y="202" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">blocked</text>
<text x="568" y="216" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">1 unresolved edge</text>
<rect x="701.3333333333333" y="184" width="234.66666666666666" height="40" rx="8" fill="#000000"/>
<rect x="701.8333333333333" y="184.5" width="233.66666666666666" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="818.6666666666666" y="202" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ready</text>
<text x="818.6666666666666" y="216" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">dependency_released</text>
<text x="24" y="264" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Each resolved edge decreases the counter. At zero, the dependent leaves blocked.</text>
</svg>
