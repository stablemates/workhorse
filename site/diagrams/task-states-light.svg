<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" role="img" aria-labelledby="task-states-light-title task-states-light-desc">
<title id="task-states-light-title">Every lifecycle transition, grouped by the state that it leaves</title>
<desc id="task-states-light-desc">Enqueue creates a blocked task with a live prerequisite, a ready task when it is due, or a scheduled task in the future. A blocked task becomes ready or scheduled when its prerequisite succeeds after or before run_at. Blocked, scheduled, and ready tasks can be canceled immediately. Promote moves scheduled to ready, and a claim moves ready to active. An active task stays active on a heartbeat or a cancel request. It becomes canceled on an exact-fence acknowledgement or a requested lease expiry, scheduled on a named durable wait in the same attempt, ready or scheduled on fail or recover with a zero or positive delay, succeeded on complete, and failed on an exhausted fail or recovery.</desc>
