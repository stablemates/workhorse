<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="throttle-window-dark-title throttle-window-dark-desc">
<title id="throttle-window-dark-title">Throttle accepts one task in each window</title>
<desc id="throttle-window-dark-desc">Each change in acct-7 sends a request with a window of 10 min. At 0 min, the first request is accepted and opens the window. At 2 min, a request is coalesced. At 3 min, the task succeeds. At 7 min, a request is still coalesced, because the end of the task does not close the window. At 12 min, the window is closed, so a request is accepted with a new task.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="392" fill="#04080e"/>
<text x="24" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">acct-7</text>
<text x="24" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">window 10 min</text>
<text x="260" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">0 min</text>
<text x="372" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">4 min</text>
<text x="484" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">8 min</text>
<text x="596" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">12 min</text>
<text x="708" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">16 min</text>
<text x="820" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">20 min</text>
<text x="932" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">24 min</text>
<line x1="260" y1="52" x2="932" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="88" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">change 1</text>
<text x="24" y="103" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">accepted</text>
<rect x="260" y="72" width="280" height="40" rx="6" fill="#04080e"/>
<rect x="260" y="72" width="280" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="400" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">window 1</text>
<text x="400" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the first task</text>
<text x="24" y="144" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">first task</text>
<text x="24" y="159" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">ready at once</text>
<rect x="260" y="128" width="84" height="40" rx="6" fill="#04080e"/>
<rect x="260" y="128" width="84" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="302" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">succeeds</text>
<text x="302" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">at 3 min</text>
<text x="24" y="200" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">change 2</text>
<text x="24" y="215" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">coalesced</text>
<rect x="260" y="184" width="112" height="40" rx="6" fill="#04080e"/>
<rect x="260" y="184" width="112" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="316" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">same taskId</text>
<text x="316" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">at 2 min</text>
<text x="24" y="256" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">change 3</text>
<text x="24" y="271" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">coalesced</text>
<rect x="400" y="240" width="112" height="40" rx="6" fill="#04080e"/>
<rect x="400" y="240" width="112" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="456" y="258" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">same taskId</text>
<text x="456" y="272" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">at 7 min</text>
<text x="24" y="312" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">change 4</text>
<text x="24" y="327" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">accepted</text>
<rect x="596" y="296" width="280" height="40" rx="6" fill="#04080e"/>
<rect x="596" y="296" width="280" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="736" y="314" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">window 2</text>
<text x="736" y="328" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a new task, a new taskId</text>
<text x="24" y="376" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Four requests make two tasks, one in each window. The end of a task does not close its window.</text>
</svg>
