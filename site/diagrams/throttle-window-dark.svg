<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="throttle-window-dark-title throttle-window-dark-desc">
<title id="throttle-window-dark-title">Throttle accepts one task in each window</title>
<desc id="throttle-window-dark-desc">Each change in acct-7 sends a request with a window of 10 min. At 0 min, the first request is accepted and opens the window. At 2 min, a request is coalesced. At 3 min, the task succeeds. At 7 min, a request is still coalesced, because the end of the task does not close the window. At 12 min, the window is closed, so a request is accepted with a new task.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="392" fill="#000000"/>
<text x="24" y="40" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">acct-7</text>
<text x="24" y="55" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">window 10 min</text>
<text x="260" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 min</text>
<text x="372" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">4 min</text>
<text x="484" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">8 min</text>
<text x="596" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">12 min</text>
<text x="708" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">16 min</text>
<text x="820" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">20 min</text>
<text x="932" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">24 min</text>
<line x1="260" y1="52" x2="932" y2="52" stroke="#2b2b2b"/>
<text x="24" y="88" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">change 1</text>
<text x="24" y="103" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">accepted</text>
<rect x="260" y="72" width="280" height="40" rx="8" fill="#000000"/>
<rect x="260.5" y="72.5" width="279" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="400" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">window 1</text>
<text x="400" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the first task</text>
<text x="24" y="144" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">first task</text>
<text x="24" y="159" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">ready at once</text>
<rect x="260" y="128" width="84" height="40" rx="8" fill="#000000"/>
<rect x="260.5" y="128.5" width="83" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="302" y="146" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">succeeds</text>
<text x="302" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">at 3 min</text>
<text x="24" y="200" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">change 2</text>
<text x="24" y="215" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">coalesced</text>
<rect x="260" y="184" width="112" height="40" rx="8" fill="#000000"/>
<rect x="260.5" y="184.5" width="111" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="316" y="202" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">same taskId</text>
<text x="316" y="216" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">at 2 min</text>
<text x="24" y="256" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">change 3</text>
<text x="24" y="271" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">coalesced</text>
<rect x="400" y="240" width="112" height="40" rx="8" fill="#000000"/>
<rect x="400.5" y="240.5" width="111" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="456" y="258" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">same taskId</text>
<text x="456" y="272" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">at 7 min</text>
<text x="24" y="312" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">change 4</text>
<text x="24" y="327" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">accepted</text>
<rect x="596" y="296" width="280" height="40" rx="8" fill="#000000"/>
<rect x="596.5" y="296.5" width="279" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="736" y="314" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">window 2</text>
<text x="736" y="328" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">a new task, a new taskId</text>
<text x="24" y="376" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Four requests make two tasks, one in each window. The end of a task does not close its window.</text>
</svg>
