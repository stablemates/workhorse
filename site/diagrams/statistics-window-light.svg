<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 268" width="960" height="268" role="img" aria-labelledby="statistics-window-light-title statistics-window-light-desc">
<title id="statistics-window-light-title">A window reads summary rows before the watermark and raw history after it</title>
<desc id="statistics-window-light-desc">At 10:05:02, the rollup summarizes the minute 10:04 and moves the watermark to 10:05. At 10:05:40, an operator asks for the last hour. Workhorse reads the summary rows before the watermark and counts the part from 10:05 to 10:05:40 from the raw history. If the rollup is late, the raw part is longer, and the answer stays correct.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="268" fill="#ffffff"/>
<text x="24" y="40" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">the last hour</text>
<text x="24" y="55" fill="#555555" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">asked at 10:05:40</text>
<text x="24" y="101" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">rollup</text>
<path d="M 680,112 V 146" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="562" y="72" width="236" height="40" rx="8" fill="#ffffff"/>
<rect x="562.5" y="72.5" width="235" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="680" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">10:05:02 · rollup</text>
<text x="680" y="104" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">summarizes 10:04</text>
<text x="24" y="177" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">window</text>
<rect x="200" y="152" width="476" height="48" rx="8" fill="#ffffff"/>
<rect x="200.5" y="152.5" width="475" height="47" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="438" y="174" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">summary rows</text>
<text x="438" y="188" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">before the watermark</text>
<rect x="684" y="152" width="252" height="48" rx="8" fill="#ffffff"/>
<rect x="684.5" y="152.5" width="251" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="810" y="174" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">raw history</text>
<text x="810" y="188" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">10:05 to 10:05:40</text>
<rect x="632" y="208" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="680" y="217" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">WATERMARK 10:05</text>
<text x="24" y="252" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Your own work counts at once. If the rollup is late, the raw part is longer, and the answer stays correct.</text>
</svg>
