<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" width="960" height="648" role="img" aria-labelledby="worker-process-states-dark-title worker-process-states-dark-desc">
<title id="worker-process-states-dark-title">Every state of a worker process, and how the process leaves it</title>
<desc id="worker-process-states-dark-desc">A worker process starts in starting. From starting, a configuration or probe failure exits with failure, a refused startup check makes it failing, every worker passing its startup checks with readiness true makes it running, and a first signal makes it draining after startup completes. From running, a first SIGTERM or SIGINT makes it draining, and a fatal worker-loop failure makes it failing. From failing, the process exits with failure when its siblings settle or the deadline is missed. From draining, it exits with code 0 when handlers settle and resources close cleanly, with code 1 when a run loop or close rejects or the deadline is missed, with 130 on a second SIGINT, and with 143 on a second SIGTERM.</desc>
