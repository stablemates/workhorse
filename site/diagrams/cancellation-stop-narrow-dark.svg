<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 374" width="400" height="374" role="img" aria-labelledby="cancellation-stop-narrow-dark-title cancellation-stop-narrow-dark-desc">
<title id="cancellation-stop-narrow-dark-title">Workhorse asks a running handler to stop, and the handler decides when it stops</title>
<desc id="cancellation-stop-narrow-dark-desc">Worker A claims the order.upload task at 0 s, and its heartbeat at 10 s moves the lease to 40 s. At 12 s, an operator cancels the task, and Workhorse records the request. The heartbeat at 20 s returns cancel_requested and does not move the lease. If the handler obeys the signal, it stops and the worker confirms the cancellation. If the handler ignores the signal, the lease expires at 40 s and recovery cancels the task.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="374" fill="#000000"/>
<text x="24" y="49" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">0 s</text>
<rect x="104" y="24" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="24.5" width="271" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="240" y="43" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker A claims the task</text>
<text x="240" y="57" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the lease lasts 30 s</text>
<path d="M 240,66 V 78" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">10 s</text>
<rect x="104" y="80" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="80.5" width="271" height="41" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="240" y="99" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">heartbeat: accepted</text>
<text x="240" y="113" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">lease until 40 s</text>
<path d="M 240,122 V 134" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">12 s</text>
<rect x="104" y="136" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="136.5" width="271" height="41" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="240" y="155" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">an operator cancels</text>
<text x="240" y="169" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Workhorse records the request</text>
<path d="M 240,178 V 190" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">20 s</text>
<rect x="104" y="192" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="192.5" width="271" height="41" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="240" y="211" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">heartbeat: cancel_requested</text>
<text x="240" y="225" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the signal is aborted</text>
<path d="M 240,234 V 246 H 110 V 270" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 240,246 H 290 V 270" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="24" y="272" width="172" height="42" rx="8" fill="#000000"/>
<rect x="24.5" y="272.5" width="171" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="110" y="291" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the handler obeys</text>
<text x="110" y="305" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">canceled · the worker confirms</text>
<rect x="204" y="272" width="172" height="42" rx="8" fill="#000000"/>
<rect x="204.5" y="272.5" width="171" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="290" y="291" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the handler ignores</text>
<text x="290" y="305" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">canceled at 40 s · recovery</text>
<text x="24" y="342" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">After the request, a heartbeat does not move</text>
<text x="24" y="357" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the lease. The handler decides when it stops.</text>
</svg>
