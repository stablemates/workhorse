<text x="90" y="67" fill="#ababab" font-size="8" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle" letter-spacing="0.04em">LIVE · task_runtime</text>
<rect x="744" y="64" width="192" height="192" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="756" y="58" width="128" height="12" fill="#000000"/>
<text x="820" y="67" fill="#ababab" font-size="8" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle" letter-spacing="0.04em">FINISHED · task_outcome</text>
