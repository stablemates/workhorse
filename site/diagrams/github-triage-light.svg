<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="github-triage-light-title github-triage-light-desc">
<title id="github-triage-light-title">One GitHub delivery becomes one label task</title>
<desc id="github-triage-light-desc">The GitHub App sends issues.opened. The receiver verifies the signature over the raw body and checks the repository, the installation, and the issue. In one transaction, it writes the inbox row and the intent row and enqueues a github.ensure-label task. It replies 202 only after the commit. The worker adds the label if the issue does not have it.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="260" fill="#ffffff"/>
<path d="M 176,98 H 198" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 368,98 H 406" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 624,98 H 662" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 624,158 H 662" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="392" y="48" width="248" height="156" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="404" y="42" width="92" height="12" fill="#ffffff"/>
<text x="450" y="51" fill="#555555" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">ONE TRANSACTION</text>
<rect x="24" y="72" width="152" height="52" rx="8" fill="#ffffff"/>
<rect x="24.5" y="72.5" width="151" height="51" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="100" y="96" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">GitHub App</text>
<text x="100" y="110" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">issues.opened</text>
<rect x="200" y="72" width="168" height="52" rx="8" fill="#ffffff"/>
<rect x="200.5" y="72.5" width="167" height="51" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="284" y="96" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">receiver</text>
<text x="284" y="110" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">signature + scope</text>
<rect x="408" y="76" width="216" height="44" rx="8" fill="#ffffff"/>
<rect x="408.5" y="76.5" width="215" height="43" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="516" y="96" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">inbox row + intent row</text>
<text x="516" y="110" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one for each issue and label</text>
<rect x="408" y="136" width="216" height="44" rx="8" fill="#ffffff"/>
<rect x="408.5" y="136.5" width="215" height="43" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="516" y="156" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">github.ensure-label</text>
<text x="516" y="170" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">payload { inboxId }</text>
<rect x="664" y="76" width="272" height="44" rx="8" fill="#ffffff"/>
<rect x="664.5" y="76.5" width="271" height="43" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="800" y="96" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">replies 202</text>
<text x="800" y="110" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">only after the commit</text>
<rect x="664" y="136" width="272" height="44" rx="8" fill="#ffffff"/>
<rect x="664.5" y="136.5" width="271" height="43" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="800" y="156" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker</text>
<text x="800" y="170" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">adds the label if missing</text>
<text x="24" y="244" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">GitHub does not retry a failed delivery. Use the recovery commands to find missed deliveries.</text>
</svg>
