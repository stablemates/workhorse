<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="production-telemetry-trace-dark-title production-telemetry-trace-dark-desc">
<title id="production-telemetry-trace-dark-title">One trace connects the enqueue and the handler run in another process</title>
<desc id="production-telemetry-trace-dark-desc">At 0 min, a web request has an HTTP server span, and the TypeScript queue makes an enqueue span below it. PostgreSQL stores the trace context of the enqueue span next to the payload of the invoice.send task. At 10 min, a worker in another process claims the task. The claim returns the stored context, and the handler span joins the first trace. Workhorse does not store baggage.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="372" fill="#000000"/>
<text x="330" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 min</text>
<text x="800" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">10 min</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#2b2b2b"/>
<path d="M 400,160 V 194" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 640,218 H 720 V 270" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="666" y="238" width="108" height="12" rx="2" fill="#000000"/>
<text x="720" y="247" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">CLAIM RETURNS IT</text>
<text x="24" y="88" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">web process</text>
<text x="24" y="103" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the request</text>
<rect x="200" y="72" width="260" height="40" rx="8" fill="#000000"/>
<rect x="200.5" y="72.5" width="259" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="330" y="96" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">HTTP server span</text>
<rect x="240" y="120" width="220" height="40" rx="8" fill="#000000"/>
<rect x="240.5" y="120.5" width="219" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="350" y="138" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">enqueue span</text>
<text x="350" y="152" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">TypeScript queue</text>
<text x="24" y="212" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">PostgreSQL</text>
<text x="24" y="227" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the task row</text>
<rect x="200" y="196" width="440" height="44" rx="8" fill="#000000"/>
<rect x="200.5" y="196.5" width="439" height="43" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="420" y="216" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">trace context next to the payload</text>
<text x="420" y="230" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the payload does not change</text>
<text x="24" y="288" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">worker process</text>
<text x="24" y="303" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">another process</text>
<rect x="664" y="272" width="272" height="44" rx="8" fill="#000000"/>
<rect x="664.5" y="272.5" width="271" height="43" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="800" y="292" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">handler span</text>
<text x="800" y="306" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">parent: the stored context</text>
<text x="24" y="356" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">One trace shows the request, the enqueue, and the handler run. Workhorse does not store baggage.</text>
</svg>
