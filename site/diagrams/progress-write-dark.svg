<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" height="272" role="img" aria-labelledby="progress-write-dark-title progress-write-dark-desc">
<title id="progress-write-dark-title">Each progress write passes four checks before it replaces the value</title>
<desc id="progress-write-dark-desc">Workhorse checks a progress write in order. A value larger than 64 KiB fails. A write from a handler that is not the current owner fails with a lease-lost error. An identical value changes nothing. A changed value less than 100 milliseconds after the last change from the same fence fails with a rate-limit error. Otherwise the value replaces the previous value, the revision increments, and Workhorse adds one progress_updated event.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="272" fill="#000000"/>
<path d="M 188,74 H 210" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 106,100 V 174" fill="none" stroke="#838383" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
<path d="M 376,74 H 398" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 294,100 V 174" fill="none" stroke="#838383" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
<path d="M 564,74 H 586" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 482,100 V 174" fill="none" stroke="#838383" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
<path d="M 752,74 H 774" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 670,100 V 174" fill="none" stroke="#838383" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
<rect x="24" y="48" width="164" height="52" rx="8" fill="#000000"/>
<rect x="24.5" y="48.5" width="163" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="106" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">size</text>
<text x="106" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">at most 64 KiB</text>
<rect x="72" y="138" width="68" height="12" rx="2" fill="#000000"/>
<text x="106" y="147" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">TOO LARGE</text>
<rect x="24" y="176" width="164" height="48" rx="8" fill="#000000"/>
<rect x="24.5" y="176.5" width="163" height="47" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="106" y="198" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">rejected</text>
<text x="106" y="212" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the value is too large</text>
<rect x="212" y="48" width="164" height="52" rx="8" fill="#000000"/>
<rect x="212.5" y="48.5" width="163" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="294" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">owner</text>
<text x="294" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">current worker and fence</text>
<rect x="248" y="138" width="92" height="12" rx="2" fill="#000000"/>
<text x="294" y="147" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">NOT THE OWNER</text>
<rect x="212" y="176" width="164" height="48" rx="8" fill="#000000"/>
<rect x="212.5" y="176.5" width="163" height="47" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="294" y="198" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">lease-lost error</text>
<text x="294" y="212" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">an old handler</text>
<rect x="400" y="48" width="164" height="52" rx="8" fill="#000000"/>
<rect x="400.5" y="48.5" width="163" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="482" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">same value?</text>
<text x="482" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">compare to the latest</text>
<rect x="448" y="138" width="68" height="12" rx="2" fill="#000000"/>
<text x="482" y="147" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">IDENTICAL</text>
<rect x="400" y="176" width="164" height="48" rx="8" fill="#000000"/>
<rect x="400.5" y="176.5" width="163" height="47" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="482" y="198" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no change</text>
<text x="482" y="212" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no revision · no event</text>
<rect x="588" y="48" width="164" height="52" rx="8" fill="#000000"/>
<rect x="588.5" y="48.5" width="163" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="670" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">cadence</text>
<text x="670" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">same fence · 100 ms</text>
<rect x="640" y="138" width="60" height="12" rx="2" fill="#000000"/>
<text x="670" y="147" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">TOO SOON</text>
<rect x="588" y="176" width="164" height="48" rx="8" fill="#000000"/>
<rect x="588.5" y="176.5" width="163" height="47" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="670" y="198" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">rate-limit error</text>
<text x="670" y="212" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">with the retry delay</text>
<rect x="776" y="48" width="160" height="52" rx="8" fill="#000000"/>
<rect x="776.5" y="48.5" width="159" height="51" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="856" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">value replaced</text>
<text x="856" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">revision + 1</text>
<rect x="776" y="176" width="160" height="48" rx="8" fill="#000000"/>
<rect x="776.5" y="176.5" width="159" height="47" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="856" y="198" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">progress_updated</text>
<text x="856" y="212" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">revision and byte size</text>
<path d="M 856,100 V 174" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="256" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Only the current owner can write. Write one time for each batch, or at a fixed interval.</text>
</svg>
