<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="priority-order-light-title priority-order-light-desc">
<title id="priority-order-light-title">An urgent ready task starts before older ordinary tasks</title>
<desc id="priority-order-light-desc">Queue billing has fifty ordinary reminders ready, and all worker slots are busy. At 2 s, the app enqueues an urgent reminder. At 3 s, a slot becomes free, and the worker gets the urgent reminder. At 4 s, another slot becomes free, and the worker gets the oldest ordinary reminder.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="280" fill="#ffffff"/>
<text x="24" y="40" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">billing</text>
<text x="24" y="55" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">all slots are busy</text>
<text x="286" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 s</text>
<text x="474" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">2 s</text>
<text x="662" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">3 s</text>
<text x="850" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">4 s</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="97" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">event</text>
<rect x="200" y="72" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="72.5" width="171" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="286" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">50 ordinary ready</text>
<text x="286" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">in FIFO order</text>
<rect x="388" y="72" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="388.5" y="72.5" width="171" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="474" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">enqueue urgent</text>
<text x="474" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the reminder is ready</text>
<rect x="576" y="72" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="576.5" y="72.5" width="171" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="662" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a slot is free</text>
<text x="662" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the worker asks</text>
<rect x="764" y="72" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="764.5" y="72.5" width="171" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="850" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a slot is free</text>
<text x="850" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the worker asks</text>
<text x="24" y="153" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">ready order</text>
<rect x="200" y="128" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="128.5" width="171" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="286" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ordinary</text>
<text x="286" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">oldest first</text>
<rect x="388" y="128" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="388.5" y="128.5" width="171" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="474" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">urgent first</text>
<text x="474" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">then the ordinary</text>
<rect x="576" y="128" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="576.5" y="128.5" width="171" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="662" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ordinary</text>
<text x="662" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">oldest first</text>
<rect x="764" y="128" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="764.5" y="128.5" width="171" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="850" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ordinary</text>
<text x="850" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">49 are left</text>
<text x="24" y="209" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">worker gets</text>
<rect x="576" y="184" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="576.5" y="184.5" width="171" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="662" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the urgent reminder</text>
<text x="662" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">not the oldest</text>
<rect x="764" y="184" width="172" height="40" rx="8" fill="#ffffff"/>
<rect x="764.5" y="184.5" width="171" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="850" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the oldest ordinary</text>
<text x="850" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no urgent is ready</text>
<text x="24" y="264" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The highest priority starts first. Tasks with the same priority keep their FIFO order.</text>
</svg>
