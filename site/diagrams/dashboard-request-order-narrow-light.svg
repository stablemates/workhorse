<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 359" width="400" height="359" role="img" aria-labelledby="dashboard-request-order-narrow-light-title dashboard-request-order-narrow-light-desc">
<title id="dashboard-request-order-narrow-light-title">Each owned request passes four checks before its procedure runs</title>
<desc id="dashboard-request-order-narrow-light-desc">The host check refuses another request host with 421. Authorization answers 401 for an unauthenticated request and 403 for an unauthorized one. An incompatible schema answers 503. A mutation without a same-origin Origin header answers 403. Then the backend validates the input and runs the procedure. A read-only backend answers FORBIDDEN for every mutation.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="359" fill="#ffffff"/>
<text x="24" y="49" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">1</text>
<rect x="112" y="24" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="24.5" width="263" height="41" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="43" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">host check</text>
<text x="244" y="57" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">another host: 421</text>
<path d="M 248,66 V 78" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="105" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">2</text>
<rect x="112" y="80" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="80.5" width="263" height="41" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="99" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">authorization</text>
<text x="244" y="113" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">401 or 403</text>
<path d="M 248,122 V 134" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="161" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">3</text>
<rect x="112" y="136" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="136.5" width="263" height="41" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="155" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">schema compatibility</text>
<text x="244" y="169" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">incompatible: 503</text>
<path d="M 248,178 V 190" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="217" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">4</text>
<rect x="112" y="192" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="192.5" width="263" height="41" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="211" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">same origin</text>
<text x="244" y="225" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a mutation without it: 403</text>
<path d="M 248,234 V 246" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="273" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">5</text>
<rect x="112" y="248" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="248.5" width="263" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="244" y="267" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">input validation</text>
<text x="244" y="281" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">then the procedure</text>
<text x="24" y="312" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A backend must not reorder these</text>
<text x="24" y="327" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">checks.</text>
</svg>
