<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 303" width="400" height="303" role="img" aria-labelledby="batch-handlers-timing-narrow-dark-title batch-handlers-timing-narrow-dark-desc">
<title id="batch-handlers-timing-narrow-dark-title">A full batch runs at once, and a partial batch runs after the linger</title>
<desc id="batch-handlers-timing-narrow-dark-desc">A worker with a batch handler for email.send claims 27 tasks. The handler takes a maximum of 20 tasks, with a linger of 50 ms. The first 20 tasks make a full batch, and the handler gets them at once. The other seven wait for the linger, and the handler gets them at about 50 ms. 27 tasks need two provider requests.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="303" fill="#000000"/>
<text x="24" y="49" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">0 ms</text>
<rect x="112" y="24" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="24.5" width="263" height="41" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="43" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">27 tasks claimed</text>
<text x="244" y="57" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">each fills one slot</text>
<path d="M 248,66 V 78" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">0 ms</text>
<rect x="112" y="80" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="80.5" width="263" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="244" y="99" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">batch 1: 20 tasks</text>
<text x="244" y="113" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">full · provider request 1</text>
<path d="M 248,122 V 134" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">0–50 ms</text>
<rect x="112" y="136" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="136.5" width="263" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="155" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">batch 2: 7 tasks</text>
<text x="244" y="169" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the linger waits for more</text>
<path d="M 248,178 V 190" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">50 ms</text>
<rect x="112" y="192" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="192.5" width="263" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="244" y="211" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">batch 2 runs</text>
<text x="244" y="225" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">provider request 2</text>
<text x="24" y="256" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">27 tasks need two provider requests,</text>
<text x="24" y="271" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">not 27.</text>
</svg>
