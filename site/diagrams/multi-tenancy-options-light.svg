<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 308" width="960" height="308" role="img" aria-labelledby="multi-tenancy-options-light-title multi-tenancy-options-light-desc">
<title id="multi-tenancy-options-light-title">One tenant identifier goes into three enqueue options</title>
<desc id="multi-tenancy-options-light-desc">The app enqueues report.generate on the queue reports for the tenant acme. It writes acme into concurrencyKey, budget, and a tenant:acme tag. The concurrency policy of reports lets acme run 4 tasks at the same time. The budget acme lets acme run 8 tasks across all queues. The tag lets an operator filter the task list. Workhorse does not check that the three agree.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="308" fill="#f9fafb"/>
<path d="M 420,98 H 536" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<path d="M 420,162 H 536" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<path d="M 420,226 H 536" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="24" y="56" width="396" height="204" rx="8" fill="rgba(26,32,39,0.02)" stroke="rgba(26,32,39,0.12)" stroke-width="0.8"/>
<rect x="36" y="50" width="216" height="12" rx="2" fill="#f9fafb"/>
<text x="144" y="59" fill="#6d7277" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">TASK · report.generate · queue reports</text>
<rect x="40" y="72" width="364" height="44" rx="6" fill="#f9fafb"/>
<rect x="40" y="72" width="364" height="44" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="222" y="98" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">concurrencyKey: acme</text>
<rect x="40" y="136" width="364" height="44" rx="6" fill="#f9fafb"/>
<rect x="40" y="136" width="364" height="44" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="222" y="162" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">budget: acme</text>
<rect x="40" y="200" width="364" height="44" rx="6" fill="#f9fafb"/>
<rect x="40" y="200" width="364" height="44" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="222" y="226" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">tags: tenant:acme</text>
<rect x="538" y="72" width="398" height="44" rx="6" fill="#f9fafb"/>
<rect x="538" y="72" width="398" height="44" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="737" y="92" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">concurrency policy of reports</text>
<text x="737" y="106" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">4 active for acme · fair share</text>
<rect x="538" y="136" width="398" height="44" rx="6" fill="#f9fafb"/>
<rect x="538" y="136" width="398" height="44" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="737" y="156" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">budget acme</text>
<text x="737" y="170" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">8 active across all queues</text>
<rect x="538" y="200" width="398" height="44" rx="6" fill="#f9fafb"/>
<rect x="538" y="200" width="398" height="44" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="737" y="220" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">tag filter</text>
<text x="737" y="234" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the operator sees only acme</text>
<text x="24" y="292" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Your app keeps the three options consistent. Workhorse does not check that they agree.</text>
</svg>
