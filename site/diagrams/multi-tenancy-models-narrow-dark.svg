<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" width="400" height="262" role="img" aria-labelledby="multi-tenancy-models-narrow-dark-title multi-tenancy-models-narrow-dark-desc">
<title id="multi-tenancy-models-narrow-dark-title">Shared tenancy keeps work fair. Isolated tenancy keeps tenants apart</title>
<desc id="multi-tenancy-models-narrow-dark-desc">With shared tenancy, acme and globex use one database and one worker fleet, and the app keeps the tenant identifier of each task consistent. With isolated tenancy, acme and globex each have a database with the Workhorse schema and their own worker fleet. No worker sees the tasks of both tenants, and PostgreSQL enforces the boundary.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="262" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">shared</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">one database, one fleet</text>
<text x="244" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">acme and globex together</text>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">isolated</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">acme database</text>
<text x="244" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">its own worker fleet</text>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">isolated</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">globex database</text>
<text x="244" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">its own worker fleet</text>
<text x="24" y="200" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Shared: your app keeps the tenant</text>
<text x="24" y="215" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">consistent. Isolated: PostgreSQL</text>
<text x="24" y="230" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">enforces the boundary.</text>
</svg>
