<rect x="40.5" y="124.5" width="255" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="168" y="148" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">retry policy</text>
<rect x="40" y="172" width="256" height="40" rx="8" fill="#ffffff"/>
<rect x="40.5" y="172.5" width="255" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="168" y="190" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">langgraph-approval</text>
<text x="168" y="204" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the human wait</text>
