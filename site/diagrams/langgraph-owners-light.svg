<rect x="664" y="220" width="256" height="40" rx="8" fill="#ffffff"/>
<rect x="664.5" y="220.5" width="255" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="792" y="244" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">tool idempotency</text>
<text x="24" y="312" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The thread ID workhorse:{task_id} does not change. Workhorse checkpoints hold bridge receipts, not a graph snapshot.</text>
</svg>
