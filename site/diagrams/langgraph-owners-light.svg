<text x="480" y="204" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the actual one</text>
<rect x="648" y="48" width="288" height="232" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
