<text x="66" y="51" fill="#555555" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">WORKHORSE</text>
<rect x="40" y="76" width="256" height="40" rx="8" fill="#ffffff"/>
