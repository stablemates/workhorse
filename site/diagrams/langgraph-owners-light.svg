<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" width="960" height="328" role="img" aria-labelledby="langgraph-owners-light-title langgraph-owners-light-desc">
<title id="langgraph-owners-light-title">Workhorse, LangGraph, and your application each own their own state</title>
<desc id="langgraph-owners-light-desc">Workhorse owns admission, leases, the retry policy, and the langgraph-approval human wait. LangGraph PostgresSaver owns the graph state, replay, and the actual Interrupt.id. Your application owns graph-driver coordination, receipt storage, reviewer authorization, and tool idempotency. The thread ID workhorse:{task_id} does not change.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
