<rect x="348" y="42" width="136" height="12" fill="#ffffff"/>
<text x="416" y="51" fill="#555555" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">LANGGRAPH POSTGRESSAVER</text>
<rect x="352" y="76" width="256" height="40" rx="8" fill="#ffffff"/>
<rect x="352.5" y="76.5" width="255" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="480" y="100" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">graph state</text>
