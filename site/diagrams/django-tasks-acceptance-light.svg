<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 252" width="960" height="252" role="img" aria-labelledby="django-tasks-acceptance-light-title django-tasks-acceptance-light-desc">
<title id="django-tasks-acceptance-light-title">A TaskResult shows acceptance; the outer block decides the commit</title>
<desc id="django-tasks-acceptance-light-desc">The request opens transaction.atomic(using="business"). In an inner atomic block, greet.enqueue("Ada") returns a TaskResult with the status READY and a task ID. A later statement in the outer block fails, and Django rolls back the outer block. PostgreSQL removes the task, and the task ID identifies no task.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="252" fill="#ffffff"/>
<rect x="24" y="48" width="640" height="156" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="36" y="42" width="204" height="12" fill="#ffffff"/>
<text x="138" y="51" fill="#555555" font-size="8" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle" letter-spacing="0.04em">OUTER BLOCK · atomic(using="business")</text>
<rect x="40" y="80" width="300" height="108" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="52" y="74" width="108" height="12" fill="#ffffff"/>
<text x="106" y="83" fill="#555555" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">INNER ATOMIC BLOCK</text>
<path d="M 324,134 H 366" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 648,134 H 702" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="56" y="108" width="268" height="52" rx="8" fill="#ffffff"/>
<rect x="56.5" y="108.5" width="267" height="51" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="190" y="132" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">greet.enqueue("Ada")</text>
<text x="190" y="146" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">TaskResult · READY · task ID</text>
<rect x="368" y="108" width="280" height="52" rx="8" fill="#ffffff"/>
<rect x="368.5" y="108.5" width="279" height="51" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="508" y="132" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a later statement fails</text>
<text x="508" y="146" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Django rolls back the outer block</text>
<rect x="704" y="108" width="232" height="52" rx="8" fill="#ffffff"/>
<rect x="704.5" y="108.5" width="231" height="51" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="820" y="132" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the task is gone</text>
<text x="820" y="146" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">its task ID identifies no task</text>
<text x="24" y="236" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A TaskResult shows that Workhorse accepted the task. It does not show that the transaction committed.</text>
</svg>
