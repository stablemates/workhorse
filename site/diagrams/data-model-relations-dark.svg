<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" width="960" height="608" role="img" aria-labelledby="data-model-relations-dark-title data-model-relations-dark-desc">
<title id="data-model-relations-dark-title">The task table and the tables that hang from it</title>
<desc id="data-model-relations-dark-desc">task owns retained enqueue_idempotency keys, at most one live task_runtime row, at most one terminal task_outcome row, exactly one task_query projection, task_redrive edges as the failed source and at most one as the redrive target, task_checkpoint restart boundaries, at most one task_progress row, task_wait timer boundaries, the task_event rows it emits, and the attempt_history rows of its closed attempts. schedule_definition fires schedule_occurrence rows, and each occurrence enqueues at most one task. rate_limit_policy owns rate_limit_bucket token state. concurrency_policy and admission_shard are queue tables without a relation.</desc>
