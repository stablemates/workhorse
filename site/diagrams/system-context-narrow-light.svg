<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 456" width="400" height="456" role="img" aria-labelledby="system-context-narrow-light-title system-context-narrow-light-desc">
<title id="system-context-narrow-light-title">Every component reaches the durable state through SQL functions in PostgreSQL</title>
<desc id="system-context-narrow-light-desc">The application transaction calls enqueue_v1 or enqueue_batch_v1. The deployment syncs schedules. The TypeScript Worker calls claim_many_v1, heartbeat_many_v2, acknowledge_cancel_v1, complete_v1, fail_v1, register_worker_v1, tick_v1, fire_due_schedules_v2, and the split maintenance routines, and gets the payload, attempt, fence, and operator pause flag. The operator layer calls cancel_v1 with attribution, list_dead_letters_v1, redrive_v1, and redrive_many_v1. The dashboard reads the read model and worker_registry and calls Admin.setWorkerPaused with attribution. Health and scenarios read runtime, outcome, and statistics. A process supervisor sends SIGINT or SIGTERM to the dedicated worker process, and the handler runs external effects outside the SQL transaction.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
