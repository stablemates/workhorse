<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="960" height="484" role="img" aria-labelledby="readme-overview-light-title readme-overview-light-desc">
<title id="readme-overview-light-title">One protocol for your workers and your dashboard</title>
<desc id="readme-overview-light-desc">Any of the seven SDKs serves one dashboard from a route in your own server. The dashboard and workers in TypeScript, Python, Go, Rust, Ruby, Java, Kotlin, and C# call the same versioned SQL functions. PostgreSQL holds durable task state and history, and applies priority, concurrency limits, rate limits, budgets, and queue pause when a worker claims a task.</desc>
