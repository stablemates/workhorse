<text x="578" y="146" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">one transaction · attempts · time limits</text>
<text x="24" y="288" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The deployment owns the schema. The application does not install it when it starts.</text>
