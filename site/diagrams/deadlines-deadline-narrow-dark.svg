<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 359" width="400" height="359" role="img" aria-labelledby="deadlines-deadline-narrow-dark-title deadlines-deadline-narrow-dark-desc">
<title id="deadlines-deadline-narrow-dark-title">A deadline ends the task, even if attempts are left</title>
<desc id="deadlines-deadline-narrow-dark-desc">A price.quote task has a deadline of 20:00. Attempts 1 to 3 fail between 18:00 and 19:40, and attempt 4 waits until 20:05. At 20:00, the deadline passes while no worker holds the task. Soon after, maintenance ends the task as failed, and attempt 4 does not start.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="359" fill="#000000"/>
<text x="24" y="49" fill="#f4f4f4" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">18:00</text>
<rect x="112" y="24" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="24.5" width="263" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="244" y="43" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">attempt 1 fails</text>
<text x="244" y="57" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the provider is down</text>
<path d="M 248,66 V 78" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f4f4f4" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">until 19:40</text>
<rect x="112" y="80" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="80.5" width="263" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="244" y="99" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">attempts 2 and 3 fail</text>
<text x="244" y="113" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">attempt 4 waits until 20:05</text>
<path d="M 248,122 V 134" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f4f4f4" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">20:00</text>
<rect x="112" y="136" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="136.5" width="263" height="41" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="155" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the deadline passes</text>
<text x="244" y="169" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">scheduled · no worker holds it</text>
<path d="M 248,178 V 190" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">soon after</text>
<rect x="112" y="192" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="192.5" width="263" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="244" y="211" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the task fails</text>
<text x="244" y="225" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">maintenance ends it</text>
<path d="M 248,234 V 246" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="273" fill="#f4f4f4" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">20:05</text>
<rect x="112" y="248" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="248.5" width="263" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="267" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">attempt 4</text>
<text x="244" y="281" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">does not start</text>
<text x="24" y="312" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A deadline ends the task at a fixed time.</text>
<text x="24" y="327" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Attempts that are left do not start.</text>
</svg>
