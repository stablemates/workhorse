<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 228" width="960" height="228" role="img" aria-labelledby="statistics-tiers-light-title statistics-tiers-light-desc">
<title id="statistics-tiers-light-title">Workhorse counts from summary rows, so a count stays fast as the history grows</title>
<desc id="statistics-tiers-light-desc">Workhorse keeps summary rows for each queue and task type. The oldest history has day rows, older history has hour rows, and recent history has minute rows. Each row holds the last error. Only the newest part, after the watermark, is read from the raw history.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="228" fill="#f9fafb"/>
<text x="24" y="40" fill="#6d7277" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">older</text>
<text x="936" y="40" fill="#6d7277" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">now</text>
<path d="M 72,37 H 900" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="24" y="60" width="300" height="52" rx="6" fill="#f9fafb"/>
<rect x="24" y="60" width="300" height="52" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="174" y="84" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">day rows</text>
<text x="174" y="98" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the oldest history</text>
<rect x="332" y="60" width="236" height="52" rx="6" fill="#f9fafb"/>
<rect x="332" y="60" width="236" height="52" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="450" y="84" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">hour rows</text>
<text x="450" y="98" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">older history</text>
<rect x="576" y="60" width="200" height="52" rx="6" fill="#f9fafb"/>
<rect x="576" y="60" width="200" height="52" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="676" y="84" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">minute rows</text>
<text x="676" y="98" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">recent history</text>
<rect x="784" y="60" width="152" height="52" rx="6" fill="#f9fafb"/>
<rect x="784" y="60" width="152" height="52" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="860" y="84" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">raw history</text>
<text x="860" y="98" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">after the watermark</text>
<rect x="24" y="136" width="752" height="44" rx="6" fill="#f9fafb"/>
<rect x="24" y="136" width="752" height="44" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="400" y="156" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">one row for each queue and task type in each period</text>
<text x="400" y="170" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">it counts tasks and attempts, and holds the last error</text>
<text x="24" y="212" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">A count reads a bounded number of summary rows, and the raw history only for its newest part.</text>
</svg>
