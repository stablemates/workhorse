<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="delivery-crash-narrow-dark-title delivery-crash-narrow-dark-desc">
<title id="delivery-crash-narrow-dark-title">A crash after the email and before the completion sends the email two times</title>
<desc id="delivery-crash-narrow-dark-desc">Worker A claims the task, and the mail provider sends the email at 1 s. At 2 s, the process of worker A stops before it records the completion. At about 30 s, the lease expires and the task is ready again. Worker B claims the task and runs the handler again, so the provider sends a second email.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="400" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">0 s</text>
<rect x="104" y="24" width="272" height="42" rx="6" fill="#04080e"/>
<rect x="104" y="24" width="272" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="240" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">worker A claims</text>
<text x="240" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">runtime row: owner A</text>
<path d="M 240,66 V 78" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">1 s</text>
<rect x="104" y="80" width="272" height="42" rx="6" fill="#04080e"/>
<rect x="104" y="80" width="272" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="240" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">worker A sends the email</text>
<text x="240" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">email 1 sent</text>
<path d="M 240,122 V 134" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">2 s</text>
<rect x="104" y="136" width="272" height="42" rx="6" fill="#04080e"/>
<rect x="104" y="136" width="272" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="240" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">worker A stops</text>
<text x="240" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no completion</text>
<path d="M 240,178 V 190" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f2f4f5" font-size="9" font-family="Geist Mono">about 30 s</text>
<rect x="104" y="192" width="272" height="42" rx="6" fill="#04080e"/>
<rect x="104" y="192" width="272" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="240" y="211" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the lease expires</text>
<text x="240" y="225" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the task is ready again</text>
<path d="M 240,234 V 246" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="273" fill="#f2f4f5" font-size="9" font-family="Geist Mono">soon after</text>
<rect x="104" y="248" width="272" height="42" rx="6" fill="#04080e"/>
<rect x="104" y="248" width="272" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="240" y="267" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">worker B claims</text>
<text x="240" y="281" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">runs the handler again</text>
<path d="M 240,290 V 302" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="329" fill="#f2f4f5" font-size="9" font-family="Geist Mono">soon after</text>
<rect x="104" y="304" width="272" height="42" rx="6" fill="#04080e"/>
<rect x="104" y="304" width="272" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="240" y="323" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">worker B sends the email</text>
<text x="240" y="337" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">email 2 sent · a duplicate</text>
<text x="24" y="368" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The handler ran two times. Write it so</text>
<text x="24" y="383" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">that a second run causes no damage.</text>
</svg>
