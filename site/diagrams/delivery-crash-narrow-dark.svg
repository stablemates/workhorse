<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="delivery-crash-narrow-dark-title delivery-crash-narrow-dark-desc">
<title id="delivery-crash-narrow-dark-title">A crash after the email and before the completion sends the email two times</title>
<desc id="delivery-crash-narrow-dark-desc">Worker A claims the task, and the mail provider sends the email at 1 s. At 2 s, the process of worker A stops before it records the completion. At about 30 s, the lease expires and the task is ready again. Worker B claims the task and runs the handler again, so the provider sends a second email.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="400" fill="#000000"/>
<text x="24" y="49" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">0 s</text>
<rect x="104" y="24" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="24.5" width="271" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="240" y="43" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker A claims</text>
<text x="240" y="57" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runtime row: owner A</text>
<path d="M 240,66 V 78" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">1 s</text>
<rect x="104" y="80" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="80.5" width="271" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="240" y="99" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker A sends the email</text>
<text x="240" y="113" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">email 1 sent</text>
<path d="M 240,122 V 134" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">2 s</text>
<rect x="104" y="136" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="136.5" width="271" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="240" y="155" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker A stops</text>
<text x="240" y="169" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no completion</text>
<path d="M 240,178 V 190" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">about 30 s</text>
<rect x="104" y="192" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="192.5" width="271" height="41" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="240" y="211" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the lease expires</text>
<text x="240" y="225" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the task is ready again</text>
<path d="M 240,234 V 246" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="273" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">soon after</text>
<rect x="104" y="248" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="248.5" width="271" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="240" y="267" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker B claims</text>
<text x="240" y="281" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs the handler again</text>
<path d="M 240,290 V 302" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="329" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">soon after</text>
<rect x="104" y="304" width="272" height="42" rx="8" fill="#000000"/>
<rect x="104.5" y="304.5" width="271" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="240" y="323" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker B sends the email</text>
<text x="240" y="337" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">email 2 sent · a duplicate</text>
<text x="24" y="368" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The handler ran two times. Write it so</text>
<text x="24" y="383" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">that a second run causes no damage.</text>
</svg>
