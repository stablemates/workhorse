<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" width="960" height="368" role="img" aria-labelledby="signals-wait-dark-title signals-wait-dark-desc">
<title id="signals-wait-dark-title">A signal wait frees the worker until the payload arrives</title>
<desc id="signals-wait-dark-desc">At 0 s, worker A runs the handler for ord-381, and the handler waits for the approval signal. No worker holds the task during the wait. At 3 h, the review service calls sendSignal, and Workhorse stores the payload and sets the task to ready. Worker B runs the handler from its first line. The wait returns the stored payload, and the handler publishes the order. Both runs are attempt 1.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="368" fill="#000000"/>
<text x="374" y="52" fill="#f4f4f4" font-size="10" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">ctx.waitForSignal("approval")</text>
<text x="754" y="52" fill="#f4f4f4" font-size="10" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">publishOrder()</text>
<line x1="192" y1="68" x2="936" y2="68" stroke="#2b2b2b"/>
<text x="24" y="98" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Run 1</text>
<text x="24" y="113" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">worker A · 0 s</text>
<text x="24" y="128" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">attempt 1 · fence 1</text>
<rect x="192" y="84" width="364" height="48" rx="8" fill="#000000"/>
<rect x="192.5" y="84.5" width="363" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="374" y="106" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">waits</text>
<text x="374" y="120" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">records the wait · frees the slot</text>
<text x="754" y="111" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">not reached</text>
<rect x="192" y="148" width="744" height="40" rx="8" fill="#000000"/>
<rect x="192.5" y="148.5" width="743" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="564" y="172" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">no worker holds the task · scheduled, no owner · a new deployment can replace worker A</text>
<text x="24" y="164" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the wait</text>
<text x="24" y="179" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">0 s to 3 h</text>
<rect x="192" y="204" width="744" height="44" rx="8" fill="#000000"/>
<rect x="192.5" y="204.5" width="743" height="43" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="564" y="224" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">the review service: sendSignal("approval", { approved: true })</text>
<text x="564" y="238" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Workhorse stores the payload · the task becomes ready</text>
<text x="24" y="222" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the signal</text>
<text x="24" y="237" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">3 h</text>
<text x="24" y="278" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Run 2</text>
<text x="24" y="293" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">worker B · after 3 h</text>
<text x="24" y="308" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">attempt 1 · fence 2</text>
<rect x="192" y="264" width="364" height="48" rx="8" fill="#000000"/>
<rect x="192.5" y="264.5" width="363" height="47" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="374" y="286" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns</text>
<text x="374" y="300" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the stored payload at once</text>
<rect x="572" y="264" width="364" height="48" rx="8" fill="#000000"/>
<rect x="572.5" y="264.5" width="363" height="47" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="754" y="286" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs</text>
<text x="754" y="300" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">publishes ord-381 · task succeeds</text>
<text x="24" y="352" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Each run starts at the first line of the handler. The wait does not use an attempt.</text>
</svg>
