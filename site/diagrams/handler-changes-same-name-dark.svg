<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" role="img" aria-labelledby="handler-changes-same-name-dark-title handler-changes-same-name-dark-desc">
<title id="handler-changes-same-name-dark-title">A changed operation under a stored name does not run</title>
<desc id="handler-changes-same-name-dark-desc">The old code stores a result under ship. After the task waits, the new code calls the same checkpoint with a changed operation. Workhorse returns the stored result by name and does not run the new operation.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="310" fill="#000000"/>
<path d="M 294,140 H 328" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 666,140 H 632" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="44" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">old code</text>
<text x="24" y="59" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">before the wait</text>
<text x="666" y="44" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">new code</text>
<text x="666" y="59" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">after the wait</text>
<line x1="24" y1="68" x2="936" y2="68" stroke="#2b2b2b"/>
<rect x="24" y="104" width="270" height="72" rx="8" fill="#000000"/>
<rect x="24.5" y="104.5" width="269" height="71" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="159" y="138" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">checkpoint("ship", old)</text>
<text x="159" y="152" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stores its result</text>
<rect x="336" y="92" width="288" height="148" rx="8" fill="#000000"/>
<rect x="336.5" y="92.5" width="287" height="147" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="480" y="120" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="middle">one stored row</text>
<text x="480" y="135" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">the name is the key</text>
<path d="M 600,174 H 645 V 228 H 658" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="360" y="148" width="240" height="52" rx="8" fill="#000000"/>
<rect x="360.5" y="148.5" width="239" height="51" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="480" y="172" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ship</text>
<text x="480" y="186" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">result from old code</text>
<rect x="666" y="104" width="270" height="72" rx="8" fill="#000000"/>
<rect x="666.5" y="104.5" width="269" height="71" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="801" y="138" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">checkpoint("ship", new)</text>
<text x="801" y="152" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">same name</text>
<rect x="666" y="202" width="270" height="52" rx="8" fill="#000000"/>
<rect x="666.5" y="202.5" width="269" height="51" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="801" y="226" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns the stored result</text>
<text x="801" y="240" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">new operation does not run</text>
<text x="24" y="286" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A changed operation does not replace the value of a stored name.</text>
</svg>
