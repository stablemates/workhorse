<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 224" width="960" height="224" role="img" aria-labelledby="batch-handlers-timing-dark-title batch-handlers-timing-dark-desc">
<title id="batch-handlers-timing-dark-title">A full batch runs at once, and a partial batch runs after the linger</title>
<desc id="batch-handlers-timing-dark-desc">A worker with a batch handler for email.send claims 27 tasks. The handler takes a maximum of 20 tasks, with a linger of 50 ms. The first 20 tasks make a full batch, and the handler gets them at once. The other seven wait for the linger, and the handler gets them at about 50 ms. 27 tasks need two provider requests.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="224" fill="#04080e"/>
<text x="24" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">email.send</text>
<text x="24" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">maxSize 20 · lingerMs 50</text>
<text x="260" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">0 ms</text>
<text x="360" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">10 ms</text>
<text x="460" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">20 ms</text>
<text x="560" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">30 ms</text>
<text x="660" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">40 ms</text>
<text x="760" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">50 ms</text>
<text x="860" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">60 ms</text>
<line x1="260" y1="52" x2="860" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="88" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">batch 1</text>
<text x="24" y="103" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">20 tasks · full</text>
<rect x="260" y="72" width="150" height="40" rx="6" fill="#04080e"/>
<rect x="260" y="72" width="150" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="335" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">handler call</text>
<text x="335" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">provider request 1</text>
<text x="24" y="144" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">batch 2</text>
<text x="24" y="159" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">7 tasks · partial</text>
<path d="M 752,148 H 758" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="260" y="128" width="488" height="40" rx="6" fill="#04080e"/>
<rect x="260" y="128" width="488" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="504" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">linger 50 ms</text>
<text x="504" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">waits for more tasks</text>
<rect x="760" y="128" width="150" height="40" rx="6" fill="#04080e"/>
<rect x="760" y="128" width="150" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="835" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">handler call</text>
<text x="835" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">provider request 2</text>
<text x="24" y="208" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">27 tasks need two provider requests, not 27. Each task keeps its own lease and fence token.</text>
</svg>
