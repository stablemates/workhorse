<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 308" width="960" height="308" role="img" aria-labelledby="batch-handlers-outcomes-dark-title batch-handlers-outcomes-dark-desc">
<title id="batch-handlers-outcomes-dark-title">Each outcome of a batch applies to its own task</title>
<desc id="batch-handlers-outcomes-dark-desc">The handler of the first batch returns 20 outcomes, in the order of the items. Nineteen are succeeded, and Workhorse completes each of these tasks with its own fence token. One is failed, and that task follows its own retry policy and attempt budget. If the handler throws an error, all 20 tasks fail, each with its own retry budget.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="308" fill="#04080e"/>
<path d="M 324,112 H 420 V 84 H 494" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<path d="M 324,112 H 420 V 160 H 494" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="24" y="80" width="300" height="64" rx="6" fill="#04080e"/>
<rect x="24" y="80" width="300" height="64" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="174" y="110" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">handler returns 20 outcomes</text>
<text x="174" y="124" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">in the order of the items</text>
<rect x="496" y="56" width="440" height="56" rx="6" fill="#04080e"/>
<rect x="496" y="56" width="440" height="56" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="716" y="82" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">19 succeeded</text>
<text x="716" y="96" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">each task completes with its own fence token</text>
<rect x="496" y="132" width="440" height="56" rx="6" fill="#04080e"/>
<rect x="496" y="132" width="440" height="56" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="716" y="158" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">1 failed</text>
<text x="716" y="172" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">its own retry policy and attempt budget</text>
<rect x="24" y="216" width="912" height="44" rx="6" fill="#04080e"/>
<rect x="24" y="216" width="912" height="44" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="480" y="236" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">if the handler throws an error</text>
<text x="480" y="250" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">all 20 tasks fail · each with its own retry budget</text>
<text x="24" y="292" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">A batch shares one handler call. Leases, fence tokens, retries, and cancellation stay with each task.</text>
</svg>
