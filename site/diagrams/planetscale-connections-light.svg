<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="planetscale-connections-light-title planetscale-connections-light-desc">
<title id="planetscale-connections-light-title">Which PlanetScale connection each Workhorse part uses</title>
<desc id="planetscale-connections-light-desc">The schema setup uses a direct primary connection on port 5432. The worker uses a direct primary connection pool on port 5432, so the LISTEN wake hints arrive. The application connects directly on port 5432, or through the transaction-mode PgBouncer on port 6432. Through PgBouncer, it must not depend on LISTEN or on session-level state.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="336" fill="#ffffff"/>
<text x="416" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">connection</text>
<text x="776" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">result</text>
<line x1="256" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="88" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">schema setup</text>
<text x="24" y="103" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">workhorse schema migrate</text>
<path d="M 576,92 H 614" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="256" y="72" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="256.5" y="72.5" width="319" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="416" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">direct primary · :5432</text>
<text x="416" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">an authorized schema owner</text>
<rect x="616" y="72" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="616.5" y="72.5" width="319" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="776" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">DDL works</text>
<text x="776" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">PlanetScale recommends direct</text>
<text x="24" y="144" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">worker</text>
<text x="24" y="159" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">a dedicated process</text>
<path d="M 576,148 H 614" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="256" y="128" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="256.5" y="128.5" width="319" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="416" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">direct primary pool · :5432</text>
<text x="416" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">keeps its session</text>
<rect x="616" y="128" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="616.5" y="128.5" width="319" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="776" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">wake hints arrive</text>
<text x="776" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">LISTEN works</text>
<text x="24" y="200" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">application</text>
<text x="24" y="215" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">direct</text>
<path d="M 576,204 H 614" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="256" y="184" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="256.5" y="184.5" width="319" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="416" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">direct primary · :5432</text>
<text x="416" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">your connection</text>
<rect x="616" y="184" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="616.5" y="184.5" width="319" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="776" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">enqueue in your transaction</text>
<text x="776" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the same transaction connection</text>
<text x="24" y="256" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">application</text>
<text x="24" y="271" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">through PgBouncer</text>
<path d="M 576,260 H 614" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="256" y="240" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="256.5" y="240.5" width="319" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="416" y="258" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">PgBouncer · :6432</text>
<text x="416" y="272" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">transaction mode</text>
<rect x="616" y="240" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="616.5" y="240.5" width="319" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="776" y="258" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no LISTEN</text>
<text x="776" y="272" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no session-level state</text>
<text x="24" y="320" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Each connection uses TLS. Verify the certificate and the hostname, for example sslmode=verify-full.</text>
</svg>
