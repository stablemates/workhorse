<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 232" width="960" height="232" role="img" aria-labelledby="integrations-common-dark-title integrations-common-dark-desc">
<title id="integrations-common-dark-title">Each integration gives Workhorse your transaction</title>
<desc id="integrations-common-dark-desc">Your ORM or driver already has a transaction object. The integration converts it to the Queryable protocol, a way to run a parameterized SQL query. enqueue writes the task in that transaction. If the transaction commits, the data and the task commit together. If it rolls back, PostgreSQL removes the task too. Workers always run in their own process.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="232" fill="#000000"/>
<path d="M 200,74 H 222" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 400,74 H 422" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 600,74 H 622" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 704,100 V 134" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 856,100 V 134" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="24" y="48" width="176" height="52" rx="8" fill="#000000"/>
<rect x="24.5" y="48.5" width="175" height="51" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="112" y="72" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">your transaction</text>
<text x="112" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">from your ORM or driver</text>
<rect x="224" y="48" width="176" height="52" rx="8" fill="#000000"/>
<rect x="224.5" y="48.5" width="175" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="312" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the integration</text>
<text x="312" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">converts the object</text>
<rect x="424" y="48" width="176" height="52" rx="8" fill="#000000"/>
<rect x="424.5" y="48.5" width="175" height="51" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="512" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Queryable</text>
<text x="512" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a parameterized query</text>
<rect x="624" y="48" width="312" height="52" rx="8" fill="#000000"/>
<rect x="624.5" y="48.5" width="311" height="51" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="780" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">enqueue</text>
<text x="780" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">writes the task in your transaction</text>
<rect x="624" y="136" width="148" height="48" rx="8" fill="#000000"/>
<rect x="624.5" y="136.5" width="147" height="47" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="698" y="158" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">commit</text>
<text x="698" y="172" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">data + task</text>
<rect x="788" y="136" width="148" height="48" rx="8" fill="#000000"/>
<rect x="788.5" y="136.5" width="147" height="47" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="862" y="158" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">rollback</text>
<text x="862" y="172" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the task is gone</text>
<rect x="24" y="136" width="576" height="48" rx="8" fill="#000000"/>
<rect x="24.5" y="136.5" width="575" height="47" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="312" y="158" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker</text>
<text x="312" y="172" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">always in its own process · never in a web request</text>
<text x="24" y="216" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Workhorse never opens a transaction for you.</text>
</svg>
