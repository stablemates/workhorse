<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 324" width="960" height="324" role="img" aria-labelledby="signals-once-light-title signals-once-light-desc">
<title id="signals-once-light-title">Workhorse accepts only the first delivery of a signal</title>
<desc id="signals-once-light-desc">The task for ord-381 waits for the approval signal. At 3 h, the review service sends approval with the key review-77, and Workhorse resumes the task. At 3 h + 5 s, the service sends the same key again, and Workhorse returns duplicate. At 3 h + 1 min, a second reviewer sends the key review-78, and Workhorse returns already_delivered with the first payload. The task resumes one time.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="324" fill="#ffffff"/>
<text x="316" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">3 h</text>
<text x="564" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">3 h + 5 s</text>
<text x="812" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">3 h + 1 min</text>
<line x1="200" y1="52" x2="928" y2="52" stroke="#e7e7e7"/>
<text x="24" y="98" fill="#000000" font-size="10" font-family="Geist Mono, monospace" text-anchor="start">sendSignal</text>
<text x="24" y="174" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">Workhorse</text>
<text x="24" y="250" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">task</text>
<path d="M 316,116 V 150" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 316,192 V 226" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 564,116 V 150" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 564,192 V 226" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 812,116 V 150" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 812,192 V 226" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="200" y="76" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="76.5" width="231" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="316" y="94" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">review-77</text>
<text x="316" y="108" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">{ approved: true }</text>
<rect x="448" y="76" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="448.5" y="76.5" width="231" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="564" y="94" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">review-77 again</text>
<text x="564" y="108" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the same request</text>
<rect x="696" y="76" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="696.5" y="76.5" width="231" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="812" y="94" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">review-78</text>
<text x="812" y="108" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">{ approved: false }</text>
<rect x="200" y="152" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="152.5" width="231" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="316" y="170" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">delivered</text>
<text x="316" y="184" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stores the payload</text>
<rect x="448" y="152" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="448.5" y="152.5" width="231" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="564" y="170" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">duplicate</text>
<text x="564" y="184" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns the stored payload</text>
<rect x="696" y="152" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="696.5" y="152.5" width="231" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="812" y="170" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">already_delivered</text>
<text x="812" y="184" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns the first payload</text>
<rect x="200" y="228" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="228.5" width="231" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="316" y="246" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">resumes</text>
<text x="316" y="260" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one time</text>
<rect x="448" y="228" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="448.5" y="228.5" width="231" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="564" y="246" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no change</text>
<text x="564" y="260" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">does not resume again</text>
<rect x="696" y="228" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="696.5" y="228.5" width="231" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="812" y="246" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no change</text>
<text x="812" y="260" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">does not resume again</text>
<text x="24" y="308" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The first accepted delivery resumes the task. A later delivery does not change it.</text>
</svg>
