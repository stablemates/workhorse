<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 288" width="960" height="288" role="img" aria-labelledby="concurrency-keys-light-title concurrency-keys-light-desc">
<title id="concurrency-keys-light-title">A full key keeps its tasks ready, although the queue has room</title>
<desc id="concurrency-keys-light-desc">The policy of the queue mail allows twenty active tasks and three for each key. Six tenant-a tasks, four tenant-b tasks, and two tasks without a key are ready. Workhorse admits three tenant-a tasks, three tenant-b tasks, and the two tasks without a key. The queue has room for twelve more, but each remaining task has a full key, so it stays ready.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
