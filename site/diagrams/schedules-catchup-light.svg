<rect x="798.4" y="248" width="137.6" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="867.1999999999999" y="266" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">a task</text>
<text x="867.1999999999999" y="280" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">on time</text>
<text x="24" y="328" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">By default, Workhorse skips missed occurrences, so an outage does not make a backlog of tasks.</text>
</svg>
