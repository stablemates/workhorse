<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344" role="img" aria-labelledby="schedules-catchup-light-title schedules-catchup-light-desc">
<title id="schedules-catchup-light-title">After a gap, the catch-up policy decides which missed occurrences fire</title>
<desc id="schedules-catchup-light-desc">invoice-run is due each night at 02:00. Every worker that offers billing-production stops on Monday at 01:30 and starts again on Thursday at 09:00, so four occurrences are missed. With skip, none of them fires. With latest, one task fires, for Thursday at 02:00. With all, four tasks fire. Each policy fires Friday at 02:00 normally.</desc>
