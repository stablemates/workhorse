<text x="568" y="266" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">a task</text>
<text x="568" y="280" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">after the restart</text>
