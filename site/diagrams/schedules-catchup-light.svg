<text x="24" y="273" fill="#1a2027" font-size="10" font-family="Geist Mono">all</text>
<rect x="200" y="248" width="137.6" height="40" rx="6" fill="#f9fafb"/>
<rect x="200" y="248" width="137.6" height="40" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="268.8" y="266" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">a task</text>
<text x="268.8" y="280" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">after the restart</text>
