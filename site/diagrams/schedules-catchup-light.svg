<rect width="960" height="344" fill="#ffffff"/>
<text x="24" y="40" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">invoice-run</text>
<text x="24" y="55" fill="#555555" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">0 2 * * *</text>
