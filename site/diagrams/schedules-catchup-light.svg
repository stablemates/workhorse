<text x="867.1999999999999" y="44" fill="#555555" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">Fri 02:00</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="97" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">workers</text>
