<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344" role="img" aria-labelledby="schedules-catchup-light-title schedules-catchup-light-desc">
<title id="schedules-catchup-light-title">After a gap, the catch-up policy decides which missed occurrences fire</title>
<desc id="schedules-catchup-light-desc">invoice-run is due each night at 02:00. Every worker that offers billing-production stops on Monday at 01:30 and starts again on Thursday at 09:00, so four occurrences are missed. With skip, none of them fires. With latest, one task fires, for Thursday at 02:00. With all, four tasks fire. Each policy fires Friday at 02:00 normally.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="344" fill="#f9fafb"/>
<text x="24" y="40" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">invoice-run</text>
<text x="24" y="55" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">0 2 * * *</text>
<text x="268.8" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">Mon 02:00</text>
<text x="418.40000000000003" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">Tue 02:00</text>
<text x="568" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">Wed 02:00</text>
<text x="717.5999999999999" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">Thu 02:00</text>
<text x="867.1999999999999" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">Fri 02:00</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="rgba(26,32,39,0.14)"/>
<text x="24" y="97" fill="#1a2027" font-size="10" font-family="Geist Mono">workers</text>
<rect x="200" y="72" width="586.4" height="40" rx="6" fill="#f9fafb"/>
<rect x="200" y="72" width="586.4" height="40" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="493.2" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">every worker stopped</text>
<text x="493.2" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">Mon 01:30 to Thu 09:00 · 4 occurrences missed</text>
<rect x="798.4" y="72" width="137.6" height="40" rx="6" fill="#f9fafb"/>
<rect x="798.4" y="72" width="137.6" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="867.1999999999999" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">running</text>
<text x="867.1999999999999" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">since Thu 09:00</text>
<text x="24" y="161" fill="#1a2027" font-size="10" font-family="Geist Mono">skip</text>
<text x="268.8" y="160" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">not fired</text>
<text x="418.40000000000003" y="160" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">not fired</text>
