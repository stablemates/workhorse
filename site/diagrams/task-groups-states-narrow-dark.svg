<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 247" width="400" height="247" role="img" aria-labelledby="task-groups-states-narrow-dark-title task-groups-states-narrow-dark-desc">
<title id="task-groups-states-narrow-dark-title">An open group cannot finish. After the seal, only a running member task can add</title>
<desc id="task-groups-states-narrow-dark-desc">Queue.createTaskGroup creates an open group for imp-7. While it is open, the app adds pages of rows with Queue.addToTaskGroup, and a running member task can add with ctx.taskGroup.add. Queue.sealTaskGroup seals the group. After the seal, only a running member task can add. When the last member task is finished, Workhorse finishes the group and enqueues the callbacks.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="247" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">open</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Queue.createTaskGroup</text>
<text x="244" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the app and members can add</text>
<path d="M 248,66 V 78" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">sealed</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Queue.sealTaskGroup</text>
<text x="244" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">only a running member can add</text>
<path d="M 248,122 V 134" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">finished</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the last member is finished</text>
<text x="244" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">callbacks enqueued one time</text>
<text x="24" y="200" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">An open group cannot finish. If the app</text>
<text x="24" y="215" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">does not seal it, the callbacks never run.</text>
</svg>
