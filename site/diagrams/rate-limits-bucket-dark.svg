<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="rate-limits-bucket-dark-title rate-limits-bucket-dark-desc">
<title id="rate-limits-bucket-dark-title">The burst starts ten tasks at once, and the rate starts one each second</title>
<desc id="rate-limits-bucket-dark-desc">The rate-limit policy of provider-api adds sixty tokens each minute and keeps a burst of ten. After an idle hour, the bucket holds ten tokens. At 0 s, the app enqueues 50 tasks, and ten start at once. Then one token arrives each second, and each token lets one task start. A task that ends gives back no token. At about 40 s, the last task starts.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="336" fill="#000000"/>
<text x="24" y="40" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">provider-api</text>
<text x="24" y="55" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">60 each minute · burst 10</text>
<text x="260" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 s</text>
<text x="420" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">10 s</text>
<text x="580" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">20 s</text>
<text x="740" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">30 s</text>
<text x="900" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">40 s</text>
<line x1="260" y1="52" x2="900" y2="52" stroke="#2b2b2b"/>
<text x="24" y="88" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">bucket</text>
<text x="24" y="103" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">tokens</text>
<rect x="260" y="72" width="640" height="40" rx="8" fill="#000000"/>
<rect x="260.5" y="72.5" width="639" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="580" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">1 new token each second</text>
<text x="580" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">after the burst of 10 is used</text>
<text x="24" y="144" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">starts</text>
<text x="24" y="159" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">10 at once</text>
<rect x="260" y="128" width="136" height="40" rx="8" fill="#000000"/>
<rect x="260.5" y="128.5" width="135" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="328" y="146" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">10 tasks start</text>
<text x="328" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the burst</text>
<text x="24" y="200" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">starts</text>
<text x="24" y="215" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">then</text>
<rect x="276" y="184" width="624" height="40" rx="8" fill="#000000"/>
<rect x="276.5" y="184.5" width="623" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="588" y="202" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">1 task starts each second</text>
<text x="588" y="216" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">with each new token</text>
<text x="24" y="256" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">ready</text>
<text x="24" y="271" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the rest</text>
<rect x="260" y="240" width="640" height="40" rx="8" fill="#000000"/>
<rect x="260.5" y="240.5" width="639" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="580" y="258" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">40 tasks wait for tokens</text>
<text x="580" y="272" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">none is ready at about 40 s</text>
<text x="24" y="320" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The bucket counts starts, not running tasks. A task that ends gives back no token.</text>
</svg>
