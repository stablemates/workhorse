<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" width="960" height="368" role="img" aria-labelledby="child-tasks-join-dark-title child-tasks-join-dark-desc">
<title id="child-tasks-join-dark-title">A parent gives up its worker until its child succeeds</title>
<desc id="child-tasks-join-dark-desc">Worker A runs orders.checkout for ord-9, and the handler calls runChild for the charge. Workhorse creates the child and blocks the parent, and worker A has a free slot. A payments worker charges the card, and the child succeeds with a receipt. The success releases the parent. Worker B runs the handler from its first line, and runChild returns the stored receipt and creates no task.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="368" fill="#04080e"/>
<text x="374" y="52" fill="#f2f4f5" font-size="10" font-family="Geist Mono" font-weight="400" text-anchor="middle">ctx.runChild("charge", "payments.charge", …)</text>
<text x="754" y="52" fill="#f2f4f5" font-size="10" font-family="Geist Mono" font-weight="400" text-anchor="middle">return { receiptId }</text>
<line x1="192" y1="68" x2="936" y2="68" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="98" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">Run 1</text>
<text x="24" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">worker A</text>
<text x="24" y="128" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">fence 1</text>
<rect x="192" y="84" width="364" height="48" rx="6" fill="#04080e"/>
<rect x="192" y="84" width="364" height="48" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="374" y="106" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">creates the child</text>
<text x="374" y="120" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the parent is blocked · frees the slot</text>
<text x="754" y="111" fill="#95999d" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">not reached</text>
<rect x="192" y="148" width="744" height="40" rx="6" fill="#04080e"/>
<rect x="192" y="148" width="744" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="564" y="172" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="middle">no worker holds the parent · a payments worker charges the card</text>
<text x="24" y="172" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the child runs</text>
<rect x="192" y="204" width="744" height="44" rx="6" fill="#04080e"/>
<rect x="192" y="204" width="744" height="44" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="564" y="224" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the charge child succeeds with a receipt</text>
<text x="564" y="238" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">Workhorse stores the receipt · the parent is released</text>
<text x="24" y="230" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the child ends</text>
<text x="24" y="278" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">Run 2</text>
<text x="24" y="293" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">worker B</text>
<text x="24" y="308" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">fence 2</text>
<rect x="192" y="264" width="364" height="48" rx="6" fill="#04080e"/>
<rect x="192" y="264" width="364" height="48" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="374" y="286" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">returns</text>
<text x="374" y="300" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the stored receipt · no new task</text>
<rect x="572" y="264" width="364" height="48" rx="6" fill="#04080e"/>
<rect x="572" y="264" width="364" height="48" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="754" y="286" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">runs</text>
<text x="754" y="300" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the checkout finishes</text>
<text x="24" y="352" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Each run starts at the first line of the handler. The wait does not use an attempt.</text>
</svg>
