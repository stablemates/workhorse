<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 192" width="960" height="192" role="img" aria-labelledby="slack-approval-dark-title slack-approval-dark-desc">
<title id="slack-approval-dark-title">Each Slack approval process does one job</title>
<desc id="slack-approval-dark-desc">The task handler registers waitForHuman. The notifier finds the committed wait through Admin.listHumanWaits and posts the buttons. A user clicks. The receiver verifies the signed action and commits the first authorized decision within 2,500 ms, before HTTP 200. The decision worker calls completeHumanWait with the stored key and actor.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="192" fill="#000000"/>
<rect x="24" y="64" width="168" height="52" rx="8" fill="#000000"/>
<rect x="24.5" y="64.5" width="167" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="108" y="88" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">task handler</text>
<text x="108" y="102" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">waitForHuman</text>
<path d="M 192,90 H 208" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="210" y="64" width="168" height="52" rx="8" fill="#000000"/>
<rect x="210.5" y="64.5" width="167" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="294" y="88" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">notifier</text>
<text x="294" y="102" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">posts the buttons</text>
<path d="M 378,90 H 394" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="396" y="64" width="168" height="52" rx="8" fill="#000000"/>
<rect x="396.5" y="64.5" width="167" height="51" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="480" y="88" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Slack user</text>
<text x="480" y="102" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">clicks a button</text>
<path d="M 564,90 H 580" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="582" y="64" width="168" height="52" rx="8" fill="#000000"/>
<rect x="582.5" y="64.5" width="167" height="51" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="666" y="88" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">receiver</text>
<text x="666" y="102" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">commits · HTTP 200</text>
<path d="M 750,90 H 766" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="768" y="64" width="168" height="52" rx="8" fill="#000000"/>
<rect x="768.5" y="64.5" width="167" height="51" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="852" y="88" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">decision worker</text>
<text x="852" y="102" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">completeHumanWait</text>
<text x="666" y="140" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">within 2,500 ms</text>
<text x="24" y="176" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">HTTP 200 confirms a durable receipt. It does not confirm an approval or a task completion.</text>
</svg>
