<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 812" width="400" height="812" role="img" aria-labelledby="tasks-and-state-narrow-dark-title tasks-and-state-narrow-dark-desc">
<title id="tasks-and-state-narrow-dark-title">One task after enqueue, after the claim, and after success</title>
<desc id="tasks-and-state-narrow-dark-desc">After enqueue, the task has a task row and a ready task_runtime row. After the claim, the runtime row is active. After success, the runtime row is gone and a succeeded task_outcome row exists. task_event and attempt_history keep the history apart.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="812" fill="#000000"/>
<text x="24" y="36" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">1 · After enqueue</text>
<text x="24" y="51" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">both rows in one transaction</text>
<rect x="24" y="76" width="352" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="76.5" width="351" height="43" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
