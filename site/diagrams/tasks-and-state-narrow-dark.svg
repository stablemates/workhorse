<rect x="24.5" y="132.5" width="351" height="43" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="200" y="152" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">task_runtime</text>
<text x="200" y="166" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ready</text>
<rect x="24" y="188" width="352" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="188.5" width="351" height="43" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="200" y="214" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">task_outcome · no row</text>
<path d="M 200,236 V 254" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="272" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">2 · After the claim</text>
<text x="24" y="287" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">only task_runtime changes</text>
<rect x="24" y="312" width="352" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="312.5" width="351" height="43" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="200" y="332" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">task</text>
<text x="200" y="346" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">resize-image · media</text>
