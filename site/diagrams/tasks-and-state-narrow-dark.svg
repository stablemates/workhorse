<text x="200" y="630" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">task_runtime · no row</text>
<rect x="24" y="660" width="352" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="660.5" width="351" height="43" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="200" y="680" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">task_outcome</text>
<text x="200" y="694" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">succeeded · result</text>
<line x1="24" y1="736" x2="376" y2="736" stroke="#2b2b2b"/>
<text x="24" y="760" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">History, kept apart from these rows:</text>
<text x="24" y="778" fill="#f4f4f4" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">task_event</text>
<text x="144" y="778" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">enqueued · claimed · succeeded</text>
<text x="24" y="796" fill="#f4f4f4" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">attempt_history</text>
<text x="144" y="796" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">attempt 1 · succeeded</text>
</svg>
