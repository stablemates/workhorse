<rect x="24.5" y="424.5" width="351" height="43" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="200" y="450" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">task_outcome · no row</text>
<path d="M 200,472 V 490" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
