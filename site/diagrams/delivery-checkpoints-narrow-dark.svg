<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 692" width="400" height="692" role="img" aria-labelledby="delivery-checkpoints-narrow-dark-title delivery-checkpoints-narrow-dark-desc">
<title id="delivery-checkpoints-narrow-dark-title">A checkpoint stores a result, and a later attempt reads it</title>
<desc id="delivery-checkpoints-narrow-dark-desc">In attempt 1, the charge checkpoint charges the card and Workhorse stores the result. Then renderInvoice throws, and Workhorse schedules a retry. In attempt 2, the charge checkpoint returns the stored value, the invoice checkpoint runs and is stored, and sendEmail runs.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="692" fill="#000000"/>
<text x="24" y="36" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Attempt 1</text>
<text x="24" y="51" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">renderInvoice fails one time</text>
<rect x="24" y="64" width="352" height="42" rx="8" fill="#000000"/>
<rect x="24.5" y="64.5" width="351" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="200" y="83" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charge</text>
<text x="200" y="97" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs · charges the card</text>
<rect x="24" y="116" width="352" height="42" rx="8" fill="#000000"/>
<rect x="24.5" y="116.5" width="351" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="200" y="135" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">invoice</text>
<text x="200" y="149" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">renderInvoice throws</text>
<rect x="24" y="168" width="352" height="42" rx="8" fill="#000000"/>
<rect x="24.5" y="168.5" width="351" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="200" y="187" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">sendEmail</text>
<text x="200" y="201" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">not reached</text>
<path d="M 200,232 V 250" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="218" y="234" width="84" height="12" rx="2" fill="#000000"/>
<text x="260" y="243" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">STORE CHARGE</text>
<text x="24" y="268" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">task_checkpoint</text>
<text x="24" y="283" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">one row for each stored name</text>
<rect x="24" y="296" width="352" height="42" rx="8" fill="#000000"/>
<rect x="24.5" y="296.5" width="351" height="41" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="200" y="315" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charge</text>
<text x="200" y="329" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stored in attempt 1</text>
<rect x="24" y="348" width="352" height="42" rx="8" fill="#000000"/>
<rect x="24.5" y="348.5" width="351" height="41" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="200" y="367" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">invoice</text>
<text x="200" y="381" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stored in attempt 2</text>
<path d="M 200,412 V 430" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="220" y="414" width="80" height="12" rx="2" fill="#000000"/>
<text x="260" y="423" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">READ CHARGE</text>
<text x="24" y="448" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Attempt 2</text>
<text x="24" y="463" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the handler starts from the top</text>
<rect x="24" y="476" width="352" height="42" rx="8" fill="#000000"/>
<rect x="24.5" y="476.5" width="351" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="200" y="495" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charge</text>
<text x="200" y="509" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns the stored value</text>
<rect x="24" y="528" width="352" height="42" rx="8" fill="#000000"/>
<rect x="24.5" y="528.5" width="351" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="200" y="547" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">invoice</text>
<text x="200" y="561" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs · result stored</text>
<rect x="24" y="580" width="352" height="42" rx="8" fill="#000000"/>
<rect x="24.5" y="580.5" width="351" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="200" y="599" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">sendEmail</text>
<text x="200" y="613" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs · no checkpoint</text>
<text x="24" y="660" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">sendEmail has no checkpoint. It can run</text>
<text x="24" y="675" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">again, so give it a provider idempotency key.</text>
</svg>
