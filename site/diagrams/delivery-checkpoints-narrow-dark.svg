<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 692" width="400" height="692" role="img" aria-labelledby="delivery-checkpoints-narrow-dark-title delivery-checkpoints-narrow-dark-desc">
<title id="delivery-checkpoints-narrow-dark-title">A checkpoint stores a result, and a later attempt reads it</title>
<desc id="delivery-checkpoints-narrow-dark-desc">In attempt 1, the charge checkpoint charges the card and Workhorse stores the result. Then renderInvoice throws, and Workhorse schedules a retry. In attempt 2, the charge checkpoint returns the stored value, the invoice checkpoint runs and is stored, and sendEmail runs.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="692" fill="#04080e"/>
<text x="24" y="36" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">Attempt 1</text>
<text x="24" y="51" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">renderInvoice fails one time</text>
<rect x="24" y="64" width="352" height="42" rx="6" fill="#04080e"/>
<rect x="24" y="64" width="352" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="200" y="83" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">charge</text>
<text x="200" y="97" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">runs · charges the card</text>
<rect x="24" y="116" width="352" height="42" rx="6" fill="#04080e"/>
<rect x="24" y="116" width="352" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="200" y="135" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">invoice</text>
<text x="200" y="149" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">renderInvoice throws</text>
<rect x="24" y="168" width="352" height="42" rx="6" fill="#04080e"/>
<rect x="24" y="168" width="352" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="200" y="187" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">sendEmail</text>
<text x="200" y="201" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">not reached</text>
<path d="M 200,232 V 250" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="220" y="234" width="80" height="12" rx="2" fill="#04080e"/>
<text x="260" y="243" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">STORE CHARGE</text>
<text x="24" y="268" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">task_checkpoint</text>
<text x="24" y="283" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">one row for each stored name</text>
<rect x="24" y="296" width="352" height="42" rx="6" fill="#04080e"/>
<rect x="24" y="296" width="352" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="200" y="315" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">charge</text>
<text x="200" y="329" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">stored in attempt 1</text>
<rect x="24" y="348" width="352" height="42" rx="6" fill="#04080e"/>
<rect x="24" y="348" width="352" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="200" y="367" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">invoice</text>
<text x="200" y="381" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">stored in attempt 2</text>
<path d="M 200,412 V 430" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="224" y="414" width="72" height="12" rx="2" fill="#04080e"/>
<text x="260" y="423" fill="#95999d" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">READ CHARGE</text>
<text x="24" y="448" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">Attempt 2</text>
<text x="24" y="463" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the handler starts from the top</text>
<rect x="24" y="476" width="352" height="42" rx="6" fill="#04080e"/>
<rect x="24" y="476" width="352" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="200" y="495" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">charge</text>
<text x="200" y="509" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">returns the stored value</text>
<rect x="24" y="528" width="352" height="42" rx="6" fill="#04080e"/>
<rect x="24" y="528" width="352" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="200" y="547" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">invoice</text>
<text x="200" y="561" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">runs · result stored</text>
<rect x="24" y="580" width="352" height="42" rx="6" fill="#04080e"/>
<rect x="24" y="580" width="352" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="200" y="599" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">sendEmail</text>
<text x="200" y="613" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">runs · no checkpoint</text>
<text x="24" y="660" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">sendEmail has no checkpoint. It can run</text>
<text x="24" y="675" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">again, so give it a provider idempotency key.</text>
</svg>
