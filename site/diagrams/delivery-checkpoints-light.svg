<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" width="960" height="316" role="img" aria-labelledby="delivery-checkpoints-light-title delivery-checkpoints-light-desc">
<title id="delivery-checkpoints-light-title">A checkpoint stores a result, and a later attempt reads it</title>
<desc id="delivery-checkpoints-light-desc">In attempt 1, the charge checkpoint charges the card and Workhorse stores the result. Then renderInvoice throws, and Workhorse schedules a retry. In attempt 2, the charge checkpoint returns the stored value, the invoice checkpoint runs and is stored, and sendEmail runs.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="316" fill="#ffffff"/>
<path d="M 304,102 H 362" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 594,102 H 652" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 656,166 H 598" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="44" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Attempt 1</text>
<text x="24" y="59" fill="#555555" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">renderInvoice fails one time</text>
<text x="366" y="44" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">task_checkpoint</text>
<text x="366" y="59" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">one row for each stored name</text>
<text x="656" y="44" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Attempt 2</text>
<text x="656" y="59" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the handler starts from the top</text>
<rect x="24" y="80" width="280" height="44" rx="8" fill="#ffffff"/>
<rect x="24.5" y="80.5" width="279" height="43" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="164" y="100" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charge</text>
<text x="164" y="114" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs · charges the card</text>
<rect x="24" y="144" width="280" height="44" rx="8" fill="#ffffff"/>
<rect x="24.5" y="144.5" width="279" height="43" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="164" y="164" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">invoice</text>
<text x="164" y="178" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">renderInvoice throws</text>
<rect x="24" y="208" width="280" height="44" rx="8" fill="#ffffff"/>
<rect x="24.5" y="208.5" width="279" height="43" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="164" y="228" fill="#555555" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">sendEmail</text>
<text x="164" y="242" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">not reached</text>
