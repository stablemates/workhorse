<rect x="366.5" y="80.5" width="223" height="43" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="478" y="100" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charge</text>
<text x="478" y="114" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stored in attempt 1</text>
<rect x="366" y="144" width="224" height="44" rx="8" fill="#ffffff"/>
<rect x="366.5" y="144.5" width="223" height="43" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="478" y="164" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">invoice</text>
<text x="478" y="178" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stored in attempt 2</text>
