<rect x="656.5" y="80.5" width="279" height="43" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="796" y="100" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charge</text>
<text x="796" y="114" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns the stored value</text>
<rect x="656" y="144" width="280" height="44" rx="8" fill="#ffffff"/>
<rect x="656.5" y="144.5" width="279" height="43" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="796" y="164" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">invoice</text>
<text x="796" y="178" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs · result stored</text>
<rect x="656" y="208" width="280" height="44" rx="8" fill="#ffffff"/>
<rect x="656.5" y="208.5" width="279" height="43" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="796" y="228" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">sendEmail</text>
<text x="796" y="242" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs · no checkpoint</text>
<rect x="312" y="84" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="334" y="93" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">STORE</text>
<rect x="606" y="84" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="624" y="93" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">READ</text>
<rect x="604" y="148" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="626" y="157" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">STORE</text>
<text x="24" y="300" fill="#555555" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">sendEmail has no checkpoint. It can run again, so give it a provider idempotency key.</text>
