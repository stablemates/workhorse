<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 304" width="960" height="304" role="img" aria-labelledby="installation-order-light-title installation-order-light-desc">
<title id="installation-order-light-title">Migrate, check the status, then start the new release</title>
<desc id="installation-order-light-desc">A deployment step runs workhorse schema migrate with the tool at the version of the application. Then it runs workhorse schema status --json. If the command exits with 1, the deployment stops. If it exits with 0, the new release starts, and each of its processes checks the schema without a change. Processes of the earlier release find the state ahead and continue.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="304" fill="#ffffff"/>
<rect x="16" y="48" width="468" height="132" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="28" y="42" width="92" height="12" fill="#ffffff"/>
<text x="74" y="51" fill="#555555" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">DEPLOYMENT STEP</text>
<rect x="488" y="48" width="456" height="132" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="500" y="42" width="176" height="12" fill="#ffffff"/>
<text x="588" y="51" fill="#555555" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">EACH PROCESS OF THE NEW RELEASE</text>
<path d="M 228,102 H 258" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 464,102 H 494" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 700,102 H 730" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 362,128 V 204" fill="none" stroke="#7d7d7d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-light)"/>
<rect x="24" y="76" width="204" height="52" rx="8" fill="#ffffff"/>
<rect x="24.5" y="76.5" width="203" height="51" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="126" y="100" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">1 · schema migrate</text>
<text x="126" y="114" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the tool at the app version</text>
<rect x="260" y="76" width="204" height="52" rx="8" fill="#ffffff"/>
<rect x="260.5" y="76.5" width="203" height="51" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="362" y="100" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">2 · schema status --json</text>
<text x="362" y="114" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">exit 0 or exit 1</text>
<rect x="496" y="76" width="204" height="52" rx="8" fill="#ffffff"/>
<rect x="496.5" y="76.5" width="203" height="51" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="598" y="100" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">3 · start the new release</text>
<text x="598" y="114" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">after exit 0</text>
<rect x="732" y="76" width="204" height="52" rx="8" fill="#ffffff"/>
<rect x="732.5" y="76.5" width="203" height="51" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="834" y="100" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">startup check</text>
<text x="834" y="114" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">reads the version · no change</text>
<rect x="338" y="150" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="362" y="159" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">EXIT 1</text>
<rect x="24" y="206" width="440" height="44" rx="8" fill="#ffffff"/>
<rect x="24.5" y="206.5" width="439" height="43" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="226" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the deployment stops</text>
<text x="244" y="240" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">write schema.refusal to the log</text>
<rect x="496" y="206" width="440" height="44" rx="8" fill="#ffffff"/>
<rect x="496.5" y="206.5" width="439" height="43" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="716" y="226" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">earlier release · state ahead</text>
<text x="716" y="240" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">its processes continue</text>
<text x="24" y="288" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A runtime process checks the schema. It does not install it, so it needs no permission to create objects.</text>
</svg>
