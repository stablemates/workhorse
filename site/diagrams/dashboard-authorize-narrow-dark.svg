<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" width="400" height="344" role="img" aria-labelledby="dashboard-authorize-narrow-dark-title dashboard-authorize-narrow-dark-desc">
<title id="dashboard-authorize-narrow-dark-title">The dashboard asks your application who the operator is before it serves anything</title>
<desc id="dashboard-authorize-narrow-dark-desc">Dana opens /workhorse in the application. The dashboard calls the authorize callback before it serves anything. The callback reads the application session and returns a principal that names dana. If the callback refuses the request, the dashboard serves nothing. The dashboard checks that the installed schema is compatible and does not change it. When Dana cancels a task, the dashboard records dana as the operator.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="344" fill="#000000"/>
<text x="24" y="49" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">request</text>
<rect x="112" y="24" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="24.5" width="263" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="43" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">Dana opens /workhorse</text>
<text x="244" y="57" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">nothing is served yet</text>
<text x="24" y="105" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">callback</text>
<rect x="112" y="80" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="80.5" width="263" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="244" y="99" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">authorize</text>
<text x="244" y="113" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">reads the application session</text>
<text x="24" y="161" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">refuses</text>
<rect x="112" y="136" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="136.5" width="263" height="41" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="155" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the dashboard serves nothing</text>
<text x="244" y="169" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no page, no data</text>
<text x="24" y="217" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">accepts</text>
<rect x="112" y="192" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="192.5" width="263" height="41" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="211" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">principal: dana</text>
<text x="244" y="225" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">schema check · no change</text>
<text x="24" y="273" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">action</text>
<rect x="112" y="248" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="248.5" width="263" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="244" y="267" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Dana cancels a task</text>
<text x="244" y="281" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">recorded actor: dana</text>
<text x="24" y="312" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The application owns the login. The</text>
<text x="24" y="327" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">dashboard records the operator it names.</text>
</svg>
