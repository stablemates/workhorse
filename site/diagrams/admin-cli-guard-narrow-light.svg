<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 288" width="400" height="288" role="img" aria-labelledby="admin-cli-guard-narrow-light-title admin-cli-guard-narrow-light-desc">
<title id="admin-cli-guard-narrow-light-title">A guarded command checks the database name, then asks for a confirmation</title>
<desc id="admin-cli-guard-narrow-light-desc">The engineer runs admin redrive with --env workhorse_production, but the shell still points to staging. The client asks the database for its name and gets workhorse_staging. The names are different, so the command changes nothing. After the engineer corrects the URL and adds --yes, both checks pass, and the redrive occurs. No flag stops the database name check.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="288" fill="#ffffff"/>
<text x="24" y="49" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">run 1</text>
<rect x="112" y="24" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="24.5" width="263" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="244" y="43" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">connected: workhorse_staging</text>
<text x="244" y="57" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">--env names production</text>
<path d="M 248,66 V 78" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="105" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start"></text>
<rect x="112" y="80" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="80.5" width="263" height="41" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="99" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">refused</text>
<text x="244" y="113" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">nothing changes</text>
<path d="M 248,122 V 134" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="161" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">run 2</text>
<rect x="112" y="136" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="136.5" width="263" height="41" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="155" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">names match · --yes</text>
<text x="244" y="169" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">both checks pass</text>
<path d="M 248,178 V 190" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="217" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start"></text>
<rect x="112" y="192" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="192.5" width="263" height="41" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="244" y="211" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">redrive occurs</text>
<text x="244" y="225" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">with the reason and actor</text>
<text x="24" y="256" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">No flag stops the database name check.</text>
</svg>
