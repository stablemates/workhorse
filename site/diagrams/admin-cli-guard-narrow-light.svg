<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 288" width="400" height="288" role="img" aria-labelledby="admin-cli-guard-narrow-light-title admin-cli-guard-narrow-light-desc">
<title id="admin-cli-guard-narrow-light-title">A guarded command checks the database name, then asks for a confirmation</title>
<desc id="admin-cli-guard-narrow-light-desc">The engineer runs admin redrive with --env workhorse_production, but the shell still points to staging. The client asks the database for its name and gets workhorse_staging. The names are different, so the command changes nothing. After the engineer corrects the URL and adds --yes, both checks pass, and the redrive occurs. No flag stops the database name check.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="400" height="288" fill="#f9fafb"/>
<text x="24" y="49" fill="#1a2027" font-size="9" font-family="Geist Mono">run 1</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="244" y="43" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">connected: workhorse_staging</text>
<text x="244" y="57" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">--env names production</text>
<path d="M 248,66 V 78" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="105" fill="#1a2027" font-size="9" font-family="Geist Mono"></text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="99" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">refused</text>
<text x="244" y="113" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">nothing changes</text>
<path d="M 248,122 V 134" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="161" fill="#1a2027" font-size="9" font-family="Geist Mono">run 2</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="155" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">names match · --yes</text>
<text x="244" y="169" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">both checks pass</text>
<path d="M 248,178 V 190" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="217" fill="#1a2027" font-size="9" font-family="Geist Mono"></text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="211" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">redrive occurs</text>
<text x="244" y="225" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">with the reason and actor</text>
<text x="24" y="256" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">No flag stops the database name check.</text>
</svg>
