<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="serverless-tiers-dark-title serverless-tiers-dark-desc">
<title id="serverless-tiers-dark-title">The web tier and the worker tier meet only in PostgreSQL</title>
<desc id="serverless-tiers-dark-desc">The checkout runs on Vercel Node.js. It commits order-42 and its order.fulfill task in one transaction. workhorse worker runs on a Cloud Run worker pool and connects to the same PostgreSQL database. It claims the task and runs the handler. During a deployment, the old worker gets a termination signal, stops claims, and lets active handlers finish.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="260" fill="#000000"/>
<path d="M 296,124 H 362" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 664,124 H 598" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="306" y="104" width="48" height="12" rx="2" fill="#000000"/>
<text x="330" y="113" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">COMMIT</text>
<rect x="609" y="104" width="44" height="12" rx="2" fill="#000000"/>
<text x="631" y="113" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">CLAIM</text>
<rect x="24" y="56" width="272" height="152" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="36" y="50" width="136" height="12" fill="#000000"/>
<text x="104" y="59" fill="#ababab" font-size="8" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle" letter-spacing="0.04em">WEB TIER · VERCEL NODE.JS</text>
<rect x="40" y="76" width="240" height="48" rx="8" fill="#000000"/>
<rect x="40.5" y="76.5" width="239" height="47" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="160" y="98" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">checkout route</text>
<text x="160" y="112" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a request invocation</text>
<rect x="40" y="140" width="240" height="52" rx="8" fill="#000000"/>
<rect x="40.5" y="140.5" width="239" height="51" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="160" y="164" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">order-42 + order.fulfill</text>
<text x="160" y="178" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one transaction</text>
<rect x="364" y="92" width="232" height="64" rx="8" fill="#000000"/>
<rect x="364.5" y="92.5" width="231" height="63" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="480" y="122" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">PostgreSQL</text>
<text x="480" y="136" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the same database</text>
<rect x="664" y="56" width="272" height="152" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="676" y="50" width="200" height="12" fill="#000000"/>
<text x="776" y="59" fill="#ababab" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">WORKER TIER · CLOUD RUN WORKER POOL</text>
<rect x="680" y="76" width="240" height="48" rx="8" fill="#000000"/>
<rect x="680.5" y="76.5" width="239" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="800" y="98" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">workhorse worker</text>
<text x="800" y="112" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a continuous process</text>
<rect x="680" y="140" width="240" height="52" rx="8" fill="#000000"/>
<rect x="680.5" y="140.5" width="239" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="800" y="164" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">termination signal</text>
<text x="800" y="178" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stops claims · drains</text>
<text x="24" y="244" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Keep request handlers on the serverless platform. Run the worker on compute that keeps a process.</text>
</svg>
