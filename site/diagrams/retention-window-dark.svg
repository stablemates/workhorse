<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 224" width="960" height="224" role="img" aria-labelledby="retention-window-dark-title retention-window-dark-desc">
<title id="retention-window-dark-title">A window is a minimum: the event stays until the pass after it expires</title>
<desc id="retention-window-dark-desc">The event window is 14 days, and the history pass runs each day at 03:00 UTC. A task writes an event on day 1 at 10:00. On day 15 at 03:00, the cutoff is the start of day 1, so the pass keeps the event. At 10:00 the event is 14 days old, and no routine deletes it yet. On day 16 at 03:00, the cutoff is the start of day 2, and the pass drops the day-1 partition.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="224" fill="#000000"/>
<text x="24" y="40" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">event window</text>
<text x="24" y="55" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">14 days · pass at 03:00 UTC</text>
<text x="286" y="44" fill="#ababab" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">day 1 · 10:00</text>
<text x="474" y="44" fill="#ababab" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">day 15 · 03:00</text>
<text x="662" y="44" fill="#ababab" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">day 15 · 10:00</text>
<text x="850" y="44" fill="#ababab" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">day 16 · 03:00</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#2b2b2b"/>
<text x="24" y="97" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">event</text>
<rect x="200" y="72" width="172" height="40" rx="8" fill="#000000"/>
<rect x="200.5" y="72.5" width="171" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="286" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">written</text>
<text x="286" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">in the day-1 partition</text>
<rect x="388" y="72" width="172" height="40" rx="8" fill="#000000"/>
<rect x="388.5" y="72.5" width="171" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="474" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">kept</text>
<text x="474" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">not older than the cutoff</text>
<rect x="576" y="72" width="172" height="40" rx="8" fill="#000000"/>
<rect x="576.5" y="72.5" width="171" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="662" y="90" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">14 days old</text>
<text x="662" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no routine deletes it yet</text>
<rect x="764" y="72" width="172" height="40" rx="8" fill="#000000"/>
<rect x="764.5" y="72.5" width="171" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="850" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">deleted</text>
<text x="850" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">with the day-1 partition</text>
<text x="24" y="153" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">history pass</text>
<rect x="388" y="128" width="172" height="40" rx="8" fill="#000000"/>
<rect x="388.5" y="128.5" width="171" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="474" y="146" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">cutoff: start of day 1</text>
<text x="474" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">keeps day 1</text>
<rect x="764" y="128" width="172" height="40" rx="8" fill="#000000"/>
<rect x="764.5" y="128.5" width="171" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="850" y="146" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">cutoff: start of day 2</text>
<text x="850" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">drops day 1</text>
<text x="24" y="208" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The event stays for about 14 days and 17 hours. Workhorse always keeps data a little longer than its window.</text>
</svg>
