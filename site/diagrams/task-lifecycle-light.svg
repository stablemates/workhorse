<text x="840" y="168" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">failed</text>
<text x="840" y="182" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the error</text>
<path d="M 704,164 H 720 V 170 H 758" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="760" y="204" width="160" height="44" rx="6" fill="#f9fafb"/>
<rect x="760" y="204" width="160" height="44" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="840" y="224" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">canceled</text>
<text x="840" y="238" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">the envelope</text>
<path d="M 704,164 H 720 V 226 H 758" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="292" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Each finished state is final. A dependency policy can also finish a blocked task.</text>
</svg>
