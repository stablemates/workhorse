<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 308" width="960" height="308" role="img" aria-labelledby="task-lifecycle-light-title task-lifecycle-light-desc">
<title id="task-lifecycle-light-title">A task is in one of seven states: four live and three finished</title>
<desc id="task-lifecycle-light-desc">A live task is blocked, scheduled, ready, or active, and it has a task_runtime row. A blocked task waits for its prerequisite tasks. A scheduled task waits for its run time, a retry delay, or a durable sleep. A ready task waits for a worker, and a worker claim makes it active. An active task finishes as succeeded, failed, or canceled, in task_outcome. If a failed attempt has attempts left, the task retries through scheduled, or through ready when the delay is zero.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="308" fill="#f9fafb"/>
<rect x="24" y="64" width="696" height="192" rx="8" fill="rgba(26,32,39,0.02)" stroke="rgba(26,32,39,0.12)" stroke-width="0.8"/>
<rect x="36" y="58" width="116" height="12" rx="2" fill="#f9fafb"/>
<text x="94" y="67" fill="#6d7277" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">LIVE · task_runtime</text>
<rect x="744" y="64" width="192" height="192" rx="8" fill="rgba(26,32,39,0.02)" stroke="rgba(26,32,39,0.12)" stroke-width="0.8"/>
<rect x="756" y="58" width="136" height="12" rx="2" fill="#f9fafb"/>
<text x="824" y="67" fill="#6d7277" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">FINISHED · task_outcome</text>
