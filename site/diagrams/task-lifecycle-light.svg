<text x="286" y="227" fill="#6d7277" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">prerequisites finish</text>
<rect x="40" y="140" width="148" height="48" rx="6" fill="#f9fafb"/>
<rect x="40" y="140" width="148" height="48" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="114" y="162" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">blocked</text>
