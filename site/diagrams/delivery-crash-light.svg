<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" role="img" aria-labelledby="delivery-crash-light-title delivery-crash-light-desc">
<title id="delivery-crash-light-title">A crash after the email and before the completion sends the email two times</title>
<desc id="delivery-crash-light-desc">Worker A claims the task, and the mail provider sends the email at 1 s. At 2 s, the process of worker A stops before it records the completion. At about 30 s, the lease expires and the task is ready again. Worker B claims the task and runs the handler again, so the provider sends a second email.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="408" fill="#ffffff"/>
<path d="M 224,164 V 124" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 416.5,204 V 312" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 812,240 V 124" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 857.5,280 V 312" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="269.5" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 s</text>
<text x="416.5" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">1 s</text>
<text x="563.5" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">2 s</text>
<text x="710.5" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">about 30 s</text>
<text x="857.5" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">soon after</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="104" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">runtime row</text>
<text x="24" y="188" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">worker A</text>
<text x="24" y="264" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">worker B</text>
<text x="24" y="340" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">mail provider</text>
