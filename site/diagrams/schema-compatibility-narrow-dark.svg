<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="schema-compatibility-narrow-dark-title schema-compatibility-narrow-dark-desc">
<title id="schema-compatibility-narrow-dark-title">schemaCompatibilityRefusal tests in this order; the first failed test decides</title>
<desc id="schema-compatibility-narrow-dark-desc">A missing schema version gives schema-not-installed. A version below MINIMUM_SCHEMA_VERSION gives schema-too-old. A client protocol below MINIMUM_PROTOCOL_VERSION gives client-protocol-too-old, and above MAXIMUM_PROTOCOL_VERSION gives client-protocol-too-new. If the schema declares served protocols without the client protocol, a lower client protocol gives schema-too-new, and a higher one gives schema-too-old. Otherwise the schema is compatible.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="400" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">1</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">no schema version</text>
<text x="244" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">schema-not-installed</text>
<path d="M 248,66 V 78" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">2</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">below the minimum</text>
<text x="244" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">schema-too-old</text>
<path d="M 248,122 V 134" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">3</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">protocol below the range</text>
<text x="244" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">client-protocol-too-old</text>
<path d="M 248,178 V 190" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f2f4f5" font-size="9" font-family="Geist Mono">4</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="211" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">protocol above the range</text>
<text x="244" y="225" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">client-protocol-too-new</text>
<path d="M 248,234 V 246" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="273" fill="#f2f4f5" font-size="9" font-family="Geist Mono">5</text>
<rect x="112" y="248" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="248" width="264" height="42" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="267" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">not in the served set</text>
<text x="244" y="281" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">schema-too-new or -too-old</text>
<path d="M 248,290 V 302" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="329" fill="#f2f4f5" font-size="9" font-family="Geist Mono">else</text>
<rect x="112" y="304" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="304" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="323" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">compatible</text>
<text x="244" y="337" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">returns null</text>
<text x="24" y="368" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The first failed test decides.</text>
</svg>
