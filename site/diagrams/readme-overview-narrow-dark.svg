<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 568" width="400" height="568" role="img" aria-labelledby="readme-overview-narrow-dark-title readme-overview-narrow-dark-desc">
<title id="readme-overview-narrow-dark-title">One protocol for your workers and your dashboard</title>
<desc id="readme-overview-narrow-dark-desc">Any of the seven SDKs serves one dashboard from a route in your own server. The dashboard and workers in TypeScript, Python, Go, Rust, Ruby, Java, Kotlin, and C# call the same versioned SQL functions. PostgreSQL holds durable task state and history, and applies priority, concurrency limits, rate limits, budgets, and queue pause when a worker claims a task.</desc>
