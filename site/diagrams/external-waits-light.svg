<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" role="img" aria-labelledby="external-waits-light-title external-waits-light-desc">
<title id="external-waits-light-title">Each external wait releases the worker until a value arrives</title>
<desc id="external-waits-light-desc">The order handler waits for a signal, and no worker holds the task. The application calls sendSignal, and Workhorse stores the payload and sets the task to ready. A worker runs the handler from the first line. The signal wait returns the payload, and the handler waits for an operator. An operator tool calls completeHumanWait. A worker runs the handler again, and each wait returns its stored value.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="396" fill="#f9fafb"/>
<path d="M 416.5,224 V 116" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<path d="M 710.5,300 V 116" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="269.5" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">first run</text>
<text x="416.5" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">webhook</text>
<text x="563.5" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">second run</text>
<text x="710.5" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">decision</text>
<text x="857.5" y="44" fill="#6d7277" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">third run</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="rgba(26,32,39,0.14)"/>
<text x="24" y="96" fill="#1a2027" font-size="10" font-family="Geist Mono">task</text>
