<text x="24" y="248" fill="#1a2027" font-size="10" font-family="Geist Mono">application</text>
<text x="24" y="324" fill="#1a2027" font-size="10" font-family="Geist Mono">operator</text>
<rect x="200" y="72" width="139" height="40" rx="6" fill="#f9fafb"/>
<rect x="200" y="72" width="139" height="40" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="269.5" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">scheduled</text>
<text x="269.5" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">no owner</text>
