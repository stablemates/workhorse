<rect x="494.5" y="72.5" width="138" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="563.5" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">scheduled</text>
<text x="563.5" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no owner</text>
<rect x="641" y="72" width="139" height="40" rx="8" fill="#ffffff"/>
<rect x="641.5" y="72.5" width="138" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="710.5" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ready</text>
<text x="710.5" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">decision stored</text>
<rect x="788" y="72" width="139" height="40" rx="8" fill="#ffffff"/>
<rect x="788.5" y="72.5" width="138" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="857.5" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active</text>
<text x="857.5" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a worker runs it</text>
<rect x="200" y="148" width="139" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="148.5" width="138" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="269.5" y="166" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">waitForSignal</text>
<text x="269.5" y="180" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">releases the lease</text>
<rect x="494" y="148" width="139" height="40" rx="8" fill="#ffffff"/>
<rect x="494.5" y="148.5" width="138" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="563.5" y="166" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">signal returns</text>
<text x="563.5" y="180" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">then waitForHuman</text>
<rect x="788" y="148" width="139" height="40" rx="8" fill="#ffffff"/>
<rect x="788.5" y="148.5" width="138" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="857.5" y="166" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">both waits return</text>
<text x="857.5" y="180" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">their stored values</text>
<rect x="347" y="224" width="139" height="40" rx="8" fill="#ffffff"/>
<rect x="347.5" y="224.5" width="138" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="416.5" y="242" fill="#555555" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">sendSignal</text>
<text x="416.5" y="256" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">after the webhook</text>
<rect x="641" y="300" width="139" height="40" rx="8" fill="#ffffff"/>
<rect x="641.5" y="300.5" width="138" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="710.5" y="318" fill="#555555" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">completeHumanWait</text>
<text x="710.5" y="332" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">an operator decides</text>
<text x="24" y="380" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Each run starts at the first line of the handler. A repeated delivery does not resume the task.</text>
</svg>
