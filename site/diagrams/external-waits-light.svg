<rect x="641" y="72" width="139" height="40" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="710.5" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">ready</text>
<text x="710.5" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">decision stored</text>
<rect x="788" y="72" width="139" height="40" rx="6" fill="#f9fafb"/>
