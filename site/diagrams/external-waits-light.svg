<text x="269.5" y="180" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">releases the lease</text>
<rect x="494" y="148" width="139" height="40" rx="6" fill="#f9fafb"/>
<rect x="494" y="148" width="139" height="40" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="563.5" y="166" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">signal returns</text>
<text x="563.5" y="180" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">then waitForHuman</text>
<rect x="788" y="148" width="139" height="40" rx="6" fill="#f9fafb"/>
<rect x="788" y="148" width="139" height="40" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="857.5" y="166" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">both waits return</text>
<text x="857.5" y="180" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">their stored values</text>
<rect x="347" y="224" width="139" height="40" rx="6" fill="#f9fafb"/>
<rect x="347" y="224" width="139" height="40" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="416.5" y="242" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">sendSignal</text>
<text x="416.5" y="256" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">after the webhook</text>
<rect x="641" y="300" width="139" height="40" rx="6" fill="#f9fafb"/>
<rect x="641" y="300" width="139" height="40" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="710.5" y="318" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">completeHumanWait</text>
<text x="710.5" y="332" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">an operator decides</text>
<text x="24" y="380" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Each run starts at the first line of the handler. A repeated delivery does not resume the task.</text>
</svg>
