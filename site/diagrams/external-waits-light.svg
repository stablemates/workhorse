<text x="857.5" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">active</text>
<text x="857.5" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">a worker runs it</text>
