<text x="416.5" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">payload stored</text>
<rect x="494" y="72" width="139" height="40" rx="6" fill="#f9fafb"/>
<rect x="494" y="72" width="139" height="40" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="563.5" y="90" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">scheduled</text>
<text x="563.5" y="104" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">no owner</text>
