<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 276" width="960" height="276" role="img" aria-labelledby="durable-waits-dark-title durable-waits-dark-desc">
<title id="durable-waits-dark-title">A durable wait frees the worker, and the handler runs again from its first line</title>
<desc id="durable-waits-dark-desc">Worker A runs the welcome checkpoint, then the handler sleeps until 16:00 and frees the worker. No worker holds the task during the wait. At 16:00, worker B runs the handler from its first line. The welcome checkpoint returns its stored result, the ended wait returns at once, and the handler sends the follow-up. Both runs are attempt 1.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="276" fill="#000000"/>
<text x="312" y="52" fill="#f4f4f4" font-size="10" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">ctx.checkpoint("welcome", …)</text>
<text x="564" y="52" fill="#f4f4f4" font-size="10" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">ctx.sleepUntil("follow-up-window", …)</text>
<text x="816" y="52" fill="#f4f4f4" font-size="10" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">ctx.checkpoint("follow-up", …)</text>
<line x1="192" y1="68" x2="936" y2="68" stroke="#2b2b2b"/>
<text x="24" y="98" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Run 1</text>
<text x="24" y="113" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">worker A · 14:00</text>
<text x="24" y="128" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">attempt 1 · fence 1</text>
<rect x="192" y="84" width="240" height="48" rx="8" fill="#000000"/>
<rect x="192.5" y="84.5" width="239" height="47" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="312" y="106" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs</text>
<text x="312" y="120" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">sends the welcome · result stored</text>
<rect x="444" y="84" width="240" height="48" rx="8" fill="#000000"/>
<rect x="444.5" y="84.5" width="239" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="564" y="106" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">pauses</text>
<text x="564" y="120" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">until 16:00 · frees the slot</text>
<text x="816" y="111" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">not reached</text>
<rect x="192" y="148" width="744" height="40" rx="8" fill="#000000"/>
<rect x="192.5" y="148.5" width="743" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="564" y="172" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">no worker holds the task · scheduled, no owner · a new deployment can replace worker A</text>
<text x="24" y="164" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the wait</text>
<text x="24" y="179" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">14:00 to 16:00</text>
<text x="24" y="218" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Run 2</text>
<text x="24" y="233" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">worker B · 16:00</text>
<text x="24" y="248" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">attempt 1 · fence 2</text>
<rect x="192" y="204" width="240" height="48" rx="8" fill="#000000"/>
<rect x="192.5" y="204.5" width="239" height="47" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="312" y="226" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">replays</text>
<text x="312" y="240" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stored result · no second email</text>
<rect x="444" y="204" width="240" height="48" rx="8" fill="#000000"/>
<rect x="444.5" y="204.5" width="239" height="47" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="564" y="226" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns</text>
<text x="564" y="240" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the wait ended</text>
<rect x="696" y="204" width="240" height="48" rx="8" fill="#000000"/>
<rect x="696.5" y="204.5" width="239" height="47" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="816" y="226" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs</text>
<text x="816" y="240" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">sends the follow-up · task succeeds</text>
</svg>
