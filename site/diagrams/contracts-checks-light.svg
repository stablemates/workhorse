<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-labelledby="contracts-checks-light-title contracts-checks-light-desc">
<title id="contracts-checks-light-title">Workhorse checks the payload before it saves a task, and the result before it completes it</title>
<desc id="contracts-checks-light-desc">The app enqueues mail.send. Workhorse checks the payload with the payload contract. If the check fails, the enqueue code gets TaskContractValidationError, and Workhorse saves no task. Otherwise, Workhorse saves the task with the version mail-current. A worker runs the handler, and Workhorse checks the result with mail-current. If the check fails, the attempt fails, and the retry rules apply. Otherwise, the task is complete.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="264" fill="#ffffff"/>
<path d="M 156,80 H 178" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 312,80 H 334" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 468,80 H 490" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 624,80 H 646" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 780,80 H 802" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 246,104 V 158" fill="none" stroke="#7d7d7d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-light)"/>
<path d="M 714,104 V 158" fill="none" stroke="#7d7d7d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-light)"/>
<rect x="24" y="56" width="132" height="48" rx="8" fill="#ffffff"/>
<rect x="24.5" y="56.5" width="131" height="47" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="90" y="78" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the app enqueues</text>
<text x="90" y="92" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">mail.send</text>
<rect x="180" y="56" width="132" height="48" rx="8" fill="#ffffff"/>
<rect x="180.5" y="56.5" width="131" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="246" y="78" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">payload check</text>
<text x="246" y="92" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">mail-current</text>
<rect x="336" y="56" width="132" height="48" rx="8" fill="#ffffff"/>
<rect x="336.5" y="56.5" width="131" height="47" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="402" y="78" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">task saved</text>
<text x="402" y="92" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">keeps mail-current</text>
<rect x="492" y="56" width="132" height="48" rx="8" fill="#ffffff"/>
<rect x="492.5" y="56.5" width="131" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="558" y="78" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the handler runs</text>
<text x="558" y="92" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns a result</text>
<rect x="648" y="56" width="132" height="48" rx="8" fill="#ffffff"/>
<rect x="648.5" y="56.5" width="131" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="714" y="78" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">result check</text>
<text x="714" y="92" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">mail-current</text>
<rect x="804" y="56" width="132" height="48" rx="8" fill="#ffffff"/>
<rect x="804.5" y="56.5" width="131" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="870" y="78" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">task complete</text>
<text x="870" y="92" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the result is stored</text>
<rect x="224" y="122" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="246" y="131" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">FAILS</text>
<rect x="692" y="122" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="714" y="131" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">FAILS</text>
<rect x="24" y="160" width="444" height="48" rx="8" fill="#ffffff"/>
<rect x="24.5" y="160.5" width="443" height="47" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="246" y="182" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">TaskContractValidationError</text>
<text x="246" y="196" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">in the enqueue code · no task is saved</text>
<rect x="492" y="160" width="444" height="48" rx="8" fill="#ffffff"/>
<rect x="492.5" y="160.5" width="443" height="47" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="714" y="182" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the attempt fails</text>
<text x="714" y="196" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the retry rules apply · the task is not complete</text>
<text x="24" y="248" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The error occurs in the code that enqueued the task, or in the attempt that returned the result.</text>
</svg>
