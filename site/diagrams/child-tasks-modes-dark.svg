<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="child-tasks-modes-dark-title child-tasks-modes-dark-desc">
<title id="child-tasks-modes-dark-title">The join mode decides what a failed child does to the parent</title>
<desc id="child-tasks-modes-dark-desc">The checkout handler for ord-9 starts the fraud and inventory children. At 2 s, inventory succeeds. At 5 s, fraud fails. With runChildren, Workhorse releases the parent, and the handler runs again and gets a failed outcome for fraud. With runChildrenAll, Workhorse fails the parent, and the handler does not run again.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="336" fill="#000000"/>
<text x="24" y="40" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">orders.checkout</text>
<text x="24" y="55" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">ord-9 · 2 children</text>
<text x="286" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">the set starts</text>
<text x="474" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">2 s</text>
<text x="662" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">5 s</text>
<text x="850" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">then</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#2b2b2b"/>
<text x="24" y="97" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">inventory</text>
<rect x="200" y="72" width="172" height="40" rx="8" fill="#000000"/>
<rect x="200.5" y="72.5" width="171" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="286" y="90" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs</text>
<text x="286" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a child task</text>
<rect x="388" y="72" width="172" height="40" rx="8" fill="#000000"/>
<rect x="388.5" y="72.5" width="171" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="474" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">succeeds</text>
<text x="474" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">reserved</text>
<text x="24" y="153" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">fraud</text>
<rect x="200" y="128" width="172" height="40" rx="8" fill="#000000"/>
<rect x="200.5" y="128.5" width="171" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="286" y="146" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs</text>
<text x="286" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a child task</text>
<rect x="388" y="128" width="172" height="40" rx="8" fill="#000000"/>
<rect x="388.5" y="128.5" width="171" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="474" y="146" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs</text>
<text x="474" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the set is not done</text>
<rect x="576" y="128" width="172" height="40" rx="8" fill="#000000"/>
<rect x="576.5" y="128.5" width="171" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="662" y="146" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">fails</text>
<text x="662" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">every child has ended</text>
<text x="24" y="209" fill="#f4f4f4" font-size="10" font-family="Geist Mono, monospace" text-anchor="start">runChildren</text>
<rect x="200" y="184" width="172" height="40" rx="8" fill="#000000"/>
<rect x="200.5" y="184.5" width="171" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="286" y="202" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">blocked</text>
<text x="286" y="216" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one time for the set</text>
<rect x="388" y="184" width="172" height="40" rx="8" fill="#000000"/>
<rect x="388.5" y="184.5" width="171" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="474" y="202" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">blocked</text>
<text x="474" y="216" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">fraud still runs</text>
<rect x="576" y="184" width="172" height="40" rx="8" fill="#000000"/>
<rect x="576.5" y="184.5" width="171" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="662" y="202" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">released</text>
<text x="662" y="216" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a worker claims it</text>
<rect x="764" y="184" width="172" height="40" rx="8" fill="#000000"/>
<rect x="764.5" y="184.5" width="171" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="850" y="202" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">handler runs again</text>
<text x="850" y="216" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">fraud: failed outcome</text>
<text x="24" y="265" fill="#f4f4f4" font-size="10" font-family="Geist Mono, monospace" text-anchor="start">runChildrenAll</text>
<rect x="200" y="240" width="172" height="40" rx="8" fill="#000000"/>
<rect x="200.5" y="240.5" width="171" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="286" y="258" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">blocked</text>
<text x="286" y="272" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one time for the set</text>
<rect x="388" y="240" width="172" height="40" rx="8" fill="#000000"/>
<rect x="388.5" y="240.5" width="171" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="474" y="258" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">blocked</text>
<text x="474" y="272" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">fraud still runs</text>
<rect x="576" y="240" width="172" height="40" rx="8" fill="#000000"/>
<rect x="576.5" y="240.5" width="171" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="662" y="258" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">failed</text>
<text x="662" y="272" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a child failed</text>
<rect x="764" y="240" width="172" height="40" rx="8" fill="#000000"/>
<rect x="764.5" y="240.5" width="171" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="850" y="258" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no second run</text>
<text x="850" y="272" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the handler stops</text>
<line x1="24" y1="176" x2="936" y2="176" stroke="#2b2b2b"/>
<text x="24" y="320" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">runChildren returns each outcome to the handler. runChildrenAll fails the parent instead.</text>
</svg>
