<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="child-tasks-modes-dark-title child-tasks-modes-dark-desc">
<title id="child-tasks-modes-dark-title">The join mode decides what a failed child does to the parent</title>
<desc id="child-tasks-modes-dark-desc">The checkout handler for ord-9 starts the fraud and inventory children. At 2 s, inventory succeeds. At 5 s, fraud fails. With runChildren, Workhorse releases the parent, and the handler runs again and gets a failed outcome for fraud. With runChildrenAll, Workhorse fails the parent, and the handler does not run again.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="336" fill="#04080e"/>
<text x="24" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">orders.checkout</text>
<text x="24" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">ord-9 · 2 children</text>
<text x="286" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">the set starts</text>
<text x="474" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">2 s</text>
<text x="662" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">5 s</text>
<text x="850" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">then</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="97" fill="#f2f4f5" font-size="10" font-family="Geist Mono">inventory</text>
<rect x="200" y="72" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="72" width="172" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="286" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">runs</text>
<text x="286" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a child task</text>
<rect x="388" y="72" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="388" y="72" width="172" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="474" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">succeeds</text>
<text x="474" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">reserved</text>
<text x="24" y="153" fill="#f2f4f5" font-size="10" font-family="Geist Mono">fraud</text>
<rect x="200" y="128" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="128" width="172" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="286" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">runs</text>
<text x="286" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a child task</text>
<rect x="388" y="128" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="388" y="128" width="172" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="474" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">runs</text>
<text x="474" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the set is not done</text>
<rect x="576" y="128" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="576" y="128" width="172" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="662" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">fails</text>
<text x="662" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">every child has ended</text>
<text x="24" y="209" fill="#f2f4f5" font-size="10" font-family="Geist Mono">runChildren</text>
<rect x="200" y="184" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="184" width="172" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="286" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">blocked</text>
<text x="286" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">one time for the set</text>
<rect x="388" y="184" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="388" y="184" width="172" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="474" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">blocked</text>
<text x="474" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">fraud still runs</text>
<rect x="576" y="184" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="576" y="184" width="172" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="662" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">released</text>
<text x="662" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a worker claims it</text>
<rect x="764" y="184" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="764" y="184" width="172" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="850" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">handler runs again</text>
<text x="850" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">fraud: failed outcome</text>
<text x="24" y="265" fill="#f2f4f5" font-size="10" font-family="Geist Mono">runChildrenAll</text>
<rect x="200" y="240" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="240" width="172" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="286" y="258" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">blocked</text>
<text x="286" y="272" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">one time for the set</text>
<rect x="388" y="240" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="388" y="240" width="172" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="474" y="258" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">blocked</text>
<text x="474" y="272" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">fraud still runs</text>
<rect x="576" y="240" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="576" y="240" width="172" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="662" y="258" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">failed</text>
<text x="662" y="272" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a child failed</text>
<rect x="764" y="240" width="172" height="40" rx="6" fill="#04080e"/>
<rect x="764" y="240" width="172" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="850" y="258" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">no second run</text>
<text x="850" y="272" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the handler stops</text>
<line x1="24" y1="176" x2="936" y2="176" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="320" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">runChildren returns each outcome to the handler. runChildrenAll fails the parent instead.</text>
</svg>
