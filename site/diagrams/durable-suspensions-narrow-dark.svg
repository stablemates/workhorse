<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" width="400" height="344" role="img" aria-labelledby="durable-suspensions-narrow-dark-title durable-suspensions-narrow-dark-desc">
<title id="durable-suspensions-narrow-dark-title">A suspension clears the owner but keeps the attempt; the wake makes it claimable</title>
<desc id="durable-suspensions-narrow-dark-desc">An active task with worker and fence N calls schedule_wait_v1 with a future target, wait_for_signal_v1, or wait_for_human_v1. The task becomes scheduled with wait_name set and no owner, or scheduled and parked with a pending task_signal_wait or task_human_wait. promote_v1 at run_at, send_signal_v1, or complete_human_wait_v1 makes it ready in the same attempt. A claim with fence N+k makes it active, and the handler restarts from entry, where the named wait replays.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="344" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">timer</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">schedule_wait_v1</text>
<text x="244" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">wake: promote_v1 at run_at</text>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">signal</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">wait_for_signal_v1</text>
<text x="244" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">wake: send_signal_v1</text>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">human</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="244" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">wait_for_human_v1</text>
<text x="244" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">wake: complete_human_wait_v1</text>
<text x="24" y="217" fill="#f2f4f5" font-size="9" font-family="Geist Mono">then</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="211" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">ready</text>
<text x="244" y="225" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the same attempt</text>
<text x="24" y="273" fill="#f2f4f5" font-size="9" font-family="Geist Mono">claim</text>
<rect x="112" y="248" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="248" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="267" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">active · fence N+k</text>
<text x="244" y="281" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the named wait replays</text>
<text x="24" y="312" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">A suspension does not close the attempt.</text>
</svg>
