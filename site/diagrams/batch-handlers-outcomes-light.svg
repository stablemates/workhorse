<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 308" width="960" height="308" role="img" aria-labelledby="batch-handlers-outcomes-light-title batch-handlers-outcomes-light-desc">
<title id="batch-handlers-outcomes-light-title">Each outcome of a batch applies to its own task</title>
<desc id="batch-handlers-outcomes-light-desc">The handler of the first batch returns 20 outcomes, in the order of the items. Nineteen are succeeded, and Workhorse completes each of these tasks with its own fence token. One is failed, and that task follows its own retry policy and attempt budget. If the handler throws an error, all 20 tasks fail, each with its own retry budget.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="308" fill="#ffffff"/>
<path d="M 324,112 H 420 V 84 H 494" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 324,112 H 420 V 160 H 494" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="24" y="80" width="300" height="64" rx="8" fill="#ffffff"/>
<rect x="24.5" y="80.5" width="299" height="63" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="174" y="110" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">handler returns 20 outcomes</text>
<text x="174" y="124" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">in the order of the items</text>
<rect x="496" y="56" width="440" height="56" rx="8" fill="#ffffff"/>
<rect x="496.5" y="56.5" width="439" height="55" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="716" y="82" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">19 succeeded</text>
<text x="716" y="96" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">each task completes with its own fence token</text>
<rect x="496" y="132" width="440" height="56" rx="8" fill="#ffffff"/>
<rect x="496.5" y="132.5" width="439" height="55" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="716" y="158" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">1 failed</text>
<text x="716" y="172" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">its own retry policy and attempt budget</text>
<rect x="24" y="216" width="912" height="44" rx="8" fill="#ffffff"/>
<rect x="24.5" y="216.5" width="911" height="43" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="480" y="236" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">if the handler throws an error</text>
<text x="480" y="250" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">all 20 tasks fail · each with its own retry budget</text>
<text x="24" y="292" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A batch shares one handler call. Leases, fence tokens, retries, and cancellation stay with each task.</text>
</svg>
