<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 224" width="960" height="224" role="img" aria-labelledby="admin-cli-guard-light-title admin-cli-guard-light-desc">
<title id="admin-cli-guard-light-title">A guarded command checks the database name, then asks for a confirmation</title>
<desc id="admin-cli-guard-light-desc">The engineer runs admin redrive with --env workhorse_production, but the shell still points to staging. The client asks the database for its name and gets workhorse_staging. The names are different, so the command changes nothing. After the engineer corrects the URL and adds --yes, both checks pass, and the redrive occurs. No flag stops the database name check.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="224" fill="#ffffff"/>
<text x="316" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">1 · database name</text>
<text x="564" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">2 · confirmation</text>
<text x="812" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">result</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="88" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">first run</text>
<text x="24" y="103" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the old staging URL</text>
<rect x="200" y="72" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="72.5" width="231" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="316" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">workhorse_staging</text>
<text x="316" y="104" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">--env names production</text>
<rect x="696" y="72" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="696.5" y="72.5" width="231" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="812" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">refused</text>
<text x="812" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">nothing changes</text>
<text x="564" y="96" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">not reached</text>
<text x="24" y="144" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">second run</text>
<text x="24" y="159" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the corrected URL</text>
<rect x="200" y="128" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="128.5" width="231" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="316" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">workhorse_production</text>
<text x="316" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the names are the same</text>
<rect x="448" y="128" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="448.5" y="128.5" width="231" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="564" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">--yes</text>
<text x="564" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the script confirms</text>
<rect x="696" y="128" width="232" height="40" rx="8" fill="#ffffff"/>
<rect x="696.5" y="128.5" width="231" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="812" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">redrive occurs</text>
<text x="812" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">with the reason and actor</text>
<text x="24" y="208" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">No flag stops the database name check. In an interactive session, you type the identity again.</text>
</svg>
