<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="query-reads-light-title query-reads-light-desc">
<title id="query-reads-light-title">One read for each operator question</title>
<desc id="query-reads-light-desc">admin.getTask tells if a task exists and returns its TaskSnapshot, or null. admin.listTasks returns pages of tasks, newest first, with a cursor and without payloads by default. admin.getTaskTimeline merges events and closed attempts, and it can be empty after retention. queue.health() reads the queue in one SQL statement and gives healthy, degraded, or critical.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="336" fill="#ffffff"/>
<text x="416" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">read</text>
<text x="776" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">result</text>
<line x1="256" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="88" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Does it exist?</text>
<text x="24" y="103" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">one task</text>
<path d="M 576,92 H 614" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="256" y="72" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="256.5" y="72.5" width="319" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="416" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">admin.getTask(taskId)</text>
<text x="416" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the current state</text>
<rect x="616" y="72" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="616.5" y="72.5" width="319" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="776" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">TaskSnapshot or null</text>
<text x="776" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">null if unknown or deleted</text>
<text x="24" y="144" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Which tasks?</text>
<text x="24" y="159" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">queue, type, states, time</text>
<path d="M 576,148 H 614" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="256" y="128" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="256.5" y="128.5" width="319" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="416" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">admin.listTasks(query)</text>
<text x="416" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">newest first</text>
<rect x="616" y="128" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="616.5" y="128.5" width="319" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="776" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">a page and nextCursor</text>
<text x="776" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no payloads by default</text>
<text x="24" y="200" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">What happened?</text>
<text x="24" y="215" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the history</text>
<path d="M 576,204 H 614" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="256" y="184" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="256.5" y="184.5" width="319" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="416" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">admin.getTaskTimeline</text>
<text x="416" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">events + closed attempts</text>
<rect x="616" y="184" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="616.5" y="184.5" width="319" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="776" y="202" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a page of entries</text>
<text x="776" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">can be empty after retention</text>
<text x="24" y="256" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Is it healthy?</text>
<text x="24" y="271" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the queue</text>
<path d="M 576,260 H 614" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="256" y="240" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="256.5" y="240.5" width="319" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="416" y="258" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">queue.health()</text>
<text x="416" y="272" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one SQL statement</text>
<rect x="616" y="240" width="320" height="40" rx="8" fill="#ffffff"/>
<rect x="616.5" y="240.5" width="319" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="776" y="258" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">healthy · degraded · critical</text>
<text x="776" y="272" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">with a code for each reason</text>
<text x="24" y="320" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">An empty timeline does not prove that a task does not exist. Use getTask for that question.</text>
</svg>
