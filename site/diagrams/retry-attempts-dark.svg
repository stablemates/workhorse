<text x="24" y="195" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">attempt 3</text>
<text x="24" y="210" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">worker stops at 90 s</text>
