<text x="24" y="262" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">error at 240 s</text>
<rect x="488" y="232" width="288" height="36" rx="8" fill="#000000"/>
<rect x="488.5" y="232.5" width="287" height="35" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="632" y="254" fill="#f4f4f4" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">240 s</text>
<text x="24" y="299" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">attempt 5</text>
<text x="24" y="314" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">error at 480 s</text>
<rect x="250" y="88" width="204" height="12" rx="2" fill="#000000"/>
<text x="352" y="97" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">THE WAIT BEFORE THE NEXT ATTEMPT</text>
<rect x="776" y="284" width="160" height="36" rx="8" fill="#000000"/>
<rect x="776.5" y="284.5" width="159" height="35" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="856" y="300" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">failed</text>
<text x="856" y="314" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no attempts left</text>
<text x="24" y="348" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A thrown error and an expired lease both use one attempt. The wait comes from the policy.</text>
