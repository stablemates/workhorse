<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" width="960" height="364" role="img" aria-labelledby="retry-attempts-dark-title retry-attempts-dark-desc">
<title id="retry-attempts-dark-title">Each failure uses one attempt, and the wait doubles after each failure</title>
<desc id="retry-attempts-dark-desc">Attempt 1 fails at 0 s and waits 30 s. Attempt 2 fails at 30 s and waits 60 s. At 90 s, the worker stops during attempt 3. The lease expires about 30 s later, and attempt 4 waits 120 s. Attempt 4 fails at about 240 s and waits 240 s. Attempt 5 fails at about 480 s, and Workhorse writes a failed outcome.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="364" fill="#000000"/>
<path d="M 236,112 V 126" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 308,164 V 178" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 488,216 V 230" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 776,268 V 282" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="200" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 s</text>
<text x="236" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">30 s</text>
<text x="308" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">90 s</text>
<text x="344" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">120 s</text>
<text x="488" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">240 s</text>
<text x="776" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">480 s</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#2b2b2b"/>
<text x="24" y="91" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">attempt 1</text>
<text x="24" y="106" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">error at 0 s</text>
<rect x="200" y="76" width="36" height="36" rx="8" fill="#000000"/>
<rect x="200.5" y="76.5" width="35" height="35" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="218" y="98" fill="#f4f4f4" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">30 s</text>
<text x="24" y="143" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">attempt 2</text>
<text x="24" y="158" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">error at 30 s</text>
<rect x="236" y="128" width="72" height="36" rx="8" fill="#000000"/>
<rect x="236.5" y="128.5" width="71" height="35" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
