<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="planetscale-connections-dark-title planetscale-connections-dark-desc">
<title id="planetscale-connections-dark-title">Which PlanetScale connection each Workhorse part uses</title>
<desc id="planetscale-connections-dark-desc">The schema setup uses a direct primary connection on port 5432. The worker uses a direct primary connection pool on port 5432, so the LISTEN wake hints arrive. The application connects directly on port 5432, or through the transaction-mode PgBouncer on port 6432. Through PgBouncer, it must not depend on LISTEN or on session-level state.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="336" fill="#04080e"/>
<text x="416" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">connection</text>
<text x="776" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">result</text>
<line x1="256" y1="52" x2="936" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="88" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">schema setup</text>
<text x="24" y="103" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">workhorse schema migrate</text>
<path d="M 576,92 H 614" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="256" y="72" width="320" height="40" rx="6" fill="#04080e"/>
<rect x="256" y="72" width="320" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="416" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">direct primary · :5432</text>
<text x="416" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">an authorized schema owner</text>
<rect x="616" y="72" width="320" height="40" rx="6" fill="#04080e"/>
<rect x="616" y="72" width="320" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="776" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">DDL works</text>
<text x="776" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">PlanetScale recommends direct</text>
<text x="24" y="144" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">worker</text>
<text x="24" y="159" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">a dedicated process</text>
<path d="M 576,148 H 614" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="256" y="128" width="320" height="40" rx="6" fill="#04080e"/>
<rect x="256" y="128" width="320" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="416" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">direct primary pool · :5432</text>
<text x="416" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">keeps its session</text>
<rect x="616" y="128" width="320" height="40" rx="6" fill="#04080e"/>
<rect x="616" y="128" width="320" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="776" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">wake hints arrive</text>
<text x="776" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">LISTEN works</text>
<text x="24" y="200" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">application</text>
<text x="24" y="215" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">direct</text>
<path d="M 576,204 H 614" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="256" y="184" width="320" height="40" rx="6" fill="#04080e"/>
<rect x="256" y="184" width="320" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="416" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">direct primary · :5432</text>
<text x="416" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">your connection</text>
<rect x="616" y="184" width="320" height="40" rx="6" fill="#04080e"/>
<rect x="616" y="184" width="320" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="776" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">enqueue in your transaction</text>
<text x="776" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the same transaction connection</text>
<text x="24" y="256" fill="#f2f4f5" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">application</text>
<text x="24" y="271" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">through PgBouncer</text>
<path d="M 576,260 H 614" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="256" y="240" width="320" height="40" rx="6" fill="#04080e"/>
<rect x="256" y="240" width="320" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="416" y="258" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">PgBouncer · :6432</text>
<text x="416" y="272" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">transaction mode</text>
<rect x="616" y="240" width="320" height="40" rx="6" fill="#04080e"/>
<rect x="616" y="240" width="320" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="776" y="258" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">no LISTEN</text>
<text x="776" y="272" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no session-level state</text>
<text x="24" y="320" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Each connection uses TLS. Verify the certificate and the hostname, for example sslmode=verify-full.</text>
</svg>
