<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="limitations-language-parts-narrow-light-title limitations-language-parts-narrow-light-desc">
<title id="limitations-language-parts-narrow-light-title">Each language runs the queue; only TypeScript changes the schema</title>
<desc id="limitations-language-parts-narrow-light-desc">TypeScript, Python, Go, Rust, Ruby, and the JVM SDK for Java and Kotlin each have a transactional queue client, a complete worker runtime, and an Admin operator client. Schema installation and migration, the workhorse admin CLI, and the TUI are only in the TypeScript package. A deployment with many languages runs the CLI as a deployment step.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="400" height="400" fill="#f9fafb"/>
<text x="24" y="49" fill="#1a2027" font-size="9" font-family="Geist Mono">TypeScript</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="244" y="43" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">queue · worker · Admin</text>
<text x="244" y="57" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">and the schema tools, CLI, TUI</text>
<text x="24" y="105" fill="#1a2027" font-size="9" font-family="Geist Mono">Python</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#f9fafb"/>
