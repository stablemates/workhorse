<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" height="272" role="img" aria-labelledby="release-lines-dark-title release-lines-dark-desc">
<title id="release-lines-dark-title">The location of the defect decides which lines change in a release train</title>
<desc id="release-lines-dark-desc">Each fix ships in a release train that publishes the npm packages, Python, Go, Rust, Ruby, JVM, and .NET lines at one version. If the defect is in the SQL schema or in the protocol that the SDKs share, each line gets the fix. If the defect is in one SDK, for example Python, that line gets the fix. Each other line publishes the same version with no change. Each fix ships only on the highest published minor release of the current major.</desc>
