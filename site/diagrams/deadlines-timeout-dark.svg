<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 228" width="960" height="228" role="img" aria-labelledby="deadlines-timeout-dark-title deadlines-timeout-dark-desc">
<title id="deadlines-timeout-dark-title">An execution timeout ends one attempt, and the task continues</title>
<desc id="deadlines-timeout-dark-desc">A report.build task has an execution timeout of 2 min. At 0 s, a worker claims it, and the call to the reporting service does not return. At 2 min, PostgreSQL closes attempt 1 as timed out and schedules attempt 2. The worker aborts the signal of the handler. Attempt 2 starts with a full budget of 2 min.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="228" fill="#000000"/>
<text x="24" y="40" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">report.build</text>
<text x="24" y="55" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">execution timeout 2 min</text>
<text x="286" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 s</text>
<text x="474" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">2 min</text>
<text x="662" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">then</text>
<text x="850" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">after the retry delay</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#2b2b2b"/>
<text x="24" y="97" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">attempts</text>
<rect x="200" y="72" width="172" height="40" rx="8" fill="#000000"/>
<rect x="200.5" y="72.5" width="171" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="286" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">attempt 1 runs</text>
<text x="286" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the call does not return</text>
<rect x="388" y="72" width="172" height="40" rx="8" fill="#000000"/>
<rect x="388.5" y="72.5" width="171" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="474" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">attempt 1 timed out</text>
<text x="474" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">PostgreSQL closes it</text>
<rect x="576" y="72" width="172" height="40" rx="8" fill="#000000"/>
<rect x="576.5" y="72.5" width="171" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="662" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">ctx.signal aborted</text>
<text x="662" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the handler must stop</text>
<rect x="764" y="72" width="172" height="40" rx="8" fill="#000000"/>
<rect x="764.5" y="72.5" width="171" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="850" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">attempt 2 starts</text>
<text x="850" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">full budget of 2 min</text>
<text x="24" y="153" fill="#f4f4f4" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">task</text>
<rect x="200" y="128" width="172" height="40" rx="8" fill="#000000"/>
<rect x="200.5" y="128.5" width="171" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="286" y="146" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active</text>
<text x="286" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker A</text>
<rect x="388" y="128" width="172" height="40" rx="8" fill="#000000"/>
<rect x="388.5" y="128.5" width="171" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="474" y="146" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">scheduled</text>
<text x="474" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the retry rules apply</text>
<rect x="764" y="128" width="172" height="40" rx="8" fill="#000000"/>
<rect x="764.5" y="128.5" width="171" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="850" y="146" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active</text>
<text x="850" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a new attempt</text>
<text x="24" y="212" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A timeout ends one attempt. If attempts are left, the task gets another attempt.</text>
</svg>
