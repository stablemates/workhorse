<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" role="img" aria-labelledby="admin-cli-waits-dark-title admin-cli-waits-dark-desc">
<title id="admin-cli-waits-dark-title">Three read-only commands tell why a task does not finish</title>
<desc id="admin-cli-waits-dark-desc">The task order-88 did not finish in one hour. admin checkpoints order-88 shows that the handler completed reserve-stock, so it ran. admin waits order-88 shows no durable timer. admin external-waits lists order-88 with a pending human decision named approval.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="284" fill="#04080e"/>
<text x="24" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">order-88</text>
<text x="24" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">did not finish in one hour</text>
<path d="M 444,92 H 534" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="24" y="72" width="420" height="40" rx="6" fill="#04080e"/>
<rect x="24" y="72" width="420" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="234" y="96" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">admin checkpoints order-88</text>
<rect x="536" y="72" width="400" height="40" rx="6" fill="#04080e"/>
<rect x="536" y="72" width="400" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="736" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">reserve-stock completed</text>
<text x="736" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the handler ran</text>
<path d="M 444,148 H 534" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="24" y="128" width="420" height="40" rx="6" fill="#04080e"/>
<rect x="24" y="128" width="420" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="234" y="152" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">admin waits order-88</text>
<rect x="536" y="128" width="400" height="40" rx="6" fill="#04080e"/>
<rect x="536" y="128" width="400" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="736" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">no durable timer</text>
<text x="736" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the task does not sleep</text>
<path d="M 444,204 H 534" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<rect x="24" y="184" width="420" height="40" rx="6" fill="#04080e"/>
<rect x="24" y="184" width="420" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="234" y="208" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">admin external-waits</text>
<rect x="536" y="184" width="400" height="40" rx="6" fill="#04080e"/>
<rect x="536" y="184" width="400" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="736" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">order-88: approval</text>
<text x="736" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">a pending human decision</text>
<text x="24" y="268" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">These commands only read. You can run them on production without a confirmation.</text>
</svg>
