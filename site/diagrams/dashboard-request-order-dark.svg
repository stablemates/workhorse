<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" height="272" role="img" aria-labelledby="dashboard-request-order-dark-title dashboard-request-order-dark-desc">
<title id="dashboard-request-order-dark-title">Each owned request passes four checks before its procedure runs</title>
<desc id="dashboard-request-order-dark-desc">The host check refuses another request host with 421. Authorization answers 401 for an unauthenticated request and 403 for an unauthorized one. An incompatible schema answers 503. A mutation without a same-origin Origin header answers 403. Then the backend validates the input and runs the procedure. A read-only backend answers FORBIDDEN for every mutation.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="272" fill="#000000"/>
<path d="M 188,74 H 210" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 106,100 V 174" fill="none" stroke="#838383" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
<path d="M 376,74 H 398" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 294,100 V 174" fill="none" stroke="#838383" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
<path d="M 564,74 H 586" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 482,100 V 174" fill="none" stroke="#838383" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
<path d="M 752,74 H 774" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 670,100 V 174" fill="none" stroke="#838383" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
<rect x="24" y="48" width="164" height="52" rx="8" fill="#000000"/>
<rect x="24.5" y="48.5" width="163" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="106" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">host check</text>
<text x="106" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">configured host names</text>
<rect x="70" y="138" width="72" height="12" rx="2" fill="#000000"/>
<text x="106" y="147" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">OTHER HOST</text>
<rect x="24" y="176" width="164" height="48" rx="8" fill="#000000"/>
<rect x="24.5" y="176.5" width="163" height="47" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="106" y="198" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">421</text>
<text x="106" y="212" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Misdirected Request</text>
<rect x="212" y="48" width="164" height="52" rx="8" fill="#000000"/>
<rect x="212.5" y="48.5" width="163" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="294" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">authorization</text>
<text x="294" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the host application</text>
<rect x="266" y="138" width="56" height="12" rx="2" fill="#000000"/>
<text x="294" y="147" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">REFUSED</text>
<rect x="212" y="176" width="164" height="48" rx="8" fill="#000000"/>
<rect x="212.5" y="176.5" width="163" height="47" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="294" y="198" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">401 or 403</text>
<text x="294" y="212" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the request is refused</text>
<rect x="400" y="48" width="164" height="52" rx="8" fill="#000000"/>
<rect x="400.5" y="48.5" width="163" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="482" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">schema</text>
<text x="482" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">compatible installation</text>
<rect x="440" y="138" width="84" height="12" rx="2" fill="#000000"/>
<text x="482" y="147" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">INCOMPATIBLE</text>
<rect x="400" y="176" width="164" height="48" rx="8" fill="#000000"/>
<rect x="400.5" y="176.5" width="163" height="47" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="482" y="198" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">503</text>
<text x="482" y="212" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">an error message</text>
<rect x="588" y="48" width="164" height="52" rx="8" fill="#000000"/>
<rect x="588.5" y="48.5" width="163" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="670" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">same origin</text>
<text x="670" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">mutation only</text>
<rect x="640" y="138" width="60" height="12" rx="2" fill="#000000"/>
<text x="670" y="147" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">NO MATCH</text>
<rect x="588" y="176" width="164" height="48" rx="8" fill="#000000"/>
<rect x="588.5" y="176.5" width="163" height="47" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="670" y="198" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">403</text>
<text x="670" y="212" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">same-origin required</text>
<rect x="776" y="48" width="160" height="52" rx="8" fill="#000000"/>
<rect x="776.5" y="48.5" width="159" height="51" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="856" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">input validation</text>
<text x="856" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">then the procedure</text>
<text x="24" y="256" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A read-only backend answers FORBIDDEN for every mutation. The server assigns audit.actor.</text>
</svg>
