<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" width="400" height="344" role="img" aria-labelledby="task-lifecycle-narrow-dark-title task-lifecycle-narrow-dark-desc">
<title id="task-lifecycle-narrow-dark-title">A task is in one of seven states: four live and three finished</title>
<desc id="task-lifecycle-narrow-dark-desc">A live task is blocked, scheduled, ready, or active, and it has a task_runtime row. A blocked task waits for its prerequisite tasks. A scheduled task waits for its run time, a retry delay, or a durable sleep. A ready task waits for a worker, and a worker claim makes it active. An active task finishes as succeeded, failed, or canceled, in task_outcome. If a failed attempt has attempts left, the task retries through scheduled, or through ready when the delay is zero.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="344" fill="#000000"/>
<text x="24" y="49" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">live</text>
<rect x="112" y="24" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="24.5" width="263" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="244" y="43" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">blocked</text>
<text x="244" y="57" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">waits for prerequisites</text>
<path d="M 248,66 V 78" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">live</text>
<rect x="112" y="80" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="80.5" width="263" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="244" y="99" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">scheduled</text>
<text x="244" y="113" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">run time · retry delay · sleep</text>
<path d="M 248,122 V 134" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">live</text>
<rect x="112" y="136" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="136.5" width="263" height="41" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="244" y="155" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ready</text>
<text x="244" y="169" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">waits for a worker</text>
<path d="M 248,178 V 190" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="217" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">live</text>
<rect x="112" y="192" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="192.5" width="263" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="244" y="211" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active</text>
<text x="244" y="225" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one worker, a lease</text>
<path d="M 248,234 V 246" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<text x="24" y="273" fill="#f4f4f4" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">finished</text>
<rect x="112" y="248" width="264" height="42" rx="8" fill="#000000"/>
<rect x="112.5" y="248.5" width="263" height="41" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="244" y="267" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">succeeded · failed · canceled</text>
<text x="244" y="281" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">in task_outcome</text>
<text x="24" y="312" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A failed attempt with attempts left</text>
<text x="24" y="327" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">retries through scheduled or ready.</text>
</svg>
