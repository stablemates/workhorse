<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="idempotency-outcomes-light-title idempotency-outcomes-light-desc">
<title id="idempotency-outcomes-light-title">One key gives one task. A changed request with the same key fails</title>
<desc id="idempotency-outcomes-light-desc">The first request for capture:7781 binds the key and creates the invoice.capture task. The same request again finds the key and returns the same taskId. A request with the same key and a different payload raises a conflict error. The original task does not change, and Workhorse creates no second task.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="280" fill="#ffffff"/>
<text x="24" y="40" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">capture:7781</text>
<text x="24" y="55" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">scope invoice-capture</text>
<text x="317.3333333333333" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">the first request</text>
<text x="568" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">the same request again</text>
<text x="818.6666666666666" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">a different payload</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="97" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">request</text>
<rect x="200" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="317.3333333333333" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">invoice.capture</text>
<text x="317.3333333333333" y="104" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">{ invoiceId: 7781 }</text>
<rect x="450.66666666666663" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="568" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">invoice.capture</text>
<text x="568" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the same data</text>
<rect x="701.3333333333333" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="701.8333333333333" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="818.6666666666666" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">invoice.capture</text>
<text x="818.6666666666666" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the payload is different</text>
<text x="24" y="153" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">Workhorse</text>
<rect x="200" y="128" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="317.3333333333333" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">binds the key</text>
<text x="317.3333333333333" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">creates the task</text>
<rect x="450.66666666666663" y="128" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="568" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">finds the key</text>
<text x="568" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the request is the same</text>
<rect x="701.3333333333333" y="128" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="701.8333333333333" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="818.6666666666666" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">finds the key</text>
<text x="818.6666666666666" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">compares the request</text>
<text x="24" y="209" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">result</text>
<rect x="200" y="184" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="184.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="317.3333333333333" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">accepted</text>
<text x="317.3333333333333" y="216" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">a new taskId</text>
<rect x="450.66666666666663" y="184" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="184.5" width="233.66666666666666" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="568" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">replayed</text>
<text x="568" y="216" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">the same taskId</text>
<rect x="701.3333333333333" y="184" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="701.8333333333333" y="184.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="818.6666666666666" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">conflict error</text>
<text x="818.6666666666666" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no change · no second task</text>
<text x="24" y="264" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Workhorse records the first request. Each later request with the same key must be the same.</text>
</svg>
