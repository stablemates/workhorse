<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="task-dependencies-fail-dark-title task-dependencies-fail-dark-desc">
<title id="task-dependencies-fail-dark-title">A failed prerequisite with the policy fail fails the dependent</title>
<desc id="task-dependencies-fail-dark-desc">release.announce waits for release.publish and release.index with onFailure fail. At 1 min, release.index fails after its last retry. Workhorse marks the announcement as rejected, but one edge is still unresolved, so it stays blocked. At 2 min, release.publish succeeds. No edge is unresolved, and the fail policy has precedence, so Workhorse fails the announcement. It never runs.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="960" height="280" fill="#04080e"/>
<text x="24" y="40" fill="#f2f4f5" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">release.announce</text>
<text x="24" y="55" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">onFailure: "fail"</text>
<text x="317.3333333333333" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">0 s</text>
<text x="568" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">1 min</text>
<text x="818.6666666666666" y="44" fill="#95999d" font-size="8" font-family="Geist Mono" font-weight="400" text-anchor="middle">2 min</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="rgba(242,244,245,0.14)"/>
<text x="24" y="97" fill="#f2f4f5" font-size="10" font-family="Geist Mono">release.publish</text>
<rect x="200" y="72" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="72" width="234.66666666666666" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="317.3333333333333" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">not finished</text>
<text x="317.3333333333333" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the edge is unresolved</text>
<rect x="450.66666666666663" y="72" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="450.66666666666663" y="72" width="234.66666666666666" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="568" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">not finished</text>
<text x="568" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the edge is unresolved</text>
<rect x="701.3333333333333" y="72" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="701.3333333333333" y="72" width="234.66666666666666" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="818.6666666666666" y="90" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">succeeds</text>
<text x="818.6666666666666" y="104" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the edge resolves: release</text>
<text x="24" y="153" fill="#f2f4f5" font-size="10" font-family="Geist Mono">release.index</text>
<rect x="200" y="128" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="128" width="234.66666666666666" height="40" rx="6" fill="rgba(242,244,245,0.03)" stroke="rgba(242,244,245,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="317.3333333333333" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">not finished</text>
<text x="317.3333333333333" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the edge is unresolved</text>
<rect x="450.66666666666663" y="128" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="450.66666666666663" y="128" width="234.66666666666666" height="40" rx="6" fill="#0a1017" stroke="#f2f4f5" stroke-width="1"/>
<text x="568" y="146" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">fails</text>
<text x="568" y="160" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the edge resolves: fail</text>
<text x="24" y="209" fill="#f2f4f5" font-size="10" font-family="Geist Mono">announcement</text>
<rect x="200" y="184" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="200" y="184" width="234.66666666666666" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="317.3333333333333" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">blocked</text>
<text x="317.3333333333333" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">2 unresolved edges</text>
<rect x="450.66666666666663" y="184" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="450.66666666666663" y="184" width="234.66666666666666" height="40" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="568" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">blocked · rejected</text>
<text x="568" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">1 unresolved edge</text>
<rect x="701.3333333333333" y="184" width="234.66666666666666" height="40" rx="6" fill="#04080e"/>
<rect x="701.3333333333333" y="184" width="234.66666666666666" height="40" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="818.6666666666666" y="202" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">failed</text>
<text x="818.6666666666666" y="216" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">it never runs</text>
<text x="24" y="264" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">After all edges resolve, fail has precedence over cancel, and cancel over release.</text>
</svg>
