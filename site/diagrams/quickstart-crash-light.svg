<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" width="960" height="364" role="img" aria-labelledby="quickstart-crash-light-title quickstart-crash-light-desc">
<title id="quickstart-crash-light-title">The worker stops after the charge, and the next run does not charge again</title>
<desc id="quickstart-crash-light-desc">Run 1 of crash-demo.ts prints charging card, commits the charge checkpoint, and stops the process. The lease of 5 s expires, and the task is available again. Run 2 enqueues with the key order:42 and gets the same task. Its handler starts from the top. The charge checkpoint returns the stored result and prints nothing. The label checkpoint runs, and the task succeeds.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="364" fill="#ffffff"/>
<text x="312" y="52" fill="#000000" font-size="10" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">checkpoint("charge")</text>
<text x="564" y="52" fill="#000000" font-size="10" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">checkpoint("label")</text>
<text x="816" y="52" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">return</text>
<line x1="192" y1="68" x2="936" y2="68" stroke="#e7e7e7"/>
<text x="24" y="98" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Run 1</text>
<text x="24" y="113" fill="#555555" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">node crash-demo.ts</text>
<rect x="192" y="84" width="240" height="48" rx="8" fill="#ffffff"/>
<rect x="192.5" y="84.5" width="239" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="312" y="106" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charging card…</text>
<text x="312" y="120" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the checkpoint commits</text>
<rect x="444" y="84" width="240" height="48" rx="8" fill="#ffffff"/>
<rect x="444.5" y="84.5" width="239" height="47" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="564" y="106" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the process stops</text>
<text x="564" y="120" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">before the label</text>
<text x="816" y="111" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">not reached</text>
<rect x="192" y="148" width="744" height="40" rx="8" fill="#ffffff"/>
<rect x="192.5" y="148.5" width="743" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="564" y="172" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">the lease of 5 s expires · the task is available again</text>
<text x="24" y="172" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the lease</text>
<rect x="192" y="204" width="744" height="40" rx="8" fill="#ffffff"/>
<rect x="192.5" y="204.5" width="743" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="564" y="222" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">same task</text>
<text x="564" y="236" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">the second run enqueues with the key order:42</text>
<text x="24" y="228" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the enqueue</text>
<text x="24" y="274" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Run 2</text>
<text x="24" y="289" fill="#555555" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">SURVIVED=1</text>
<rect x="192" y="260" width="240" height="48" rx="8" fill="#ffffff"/>
<rect x="192.5" y="260.5" width="239" height="47" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="312" y="282" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stored result</text>
<text x="312" y="296" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charging card… does not print</text>
<rect x="444" y="260" width="240" height="48" rx="8" fill="#ffffff"/>
<rect x="444.5" y="260.5" width="239" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="564" y="282" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">printing shipping label…</text>
<text x="564" y="296" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the checkpoint commits</text>
<rect x="696" y="260" width="240" height="48" rx="8" fill="#ffffff"/>
<rect x="696.5" y="260.5" width="239" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="816" y="282" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the task succeeds</text>
<text x="816" y="296" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">chargeId and labelId</text>
<text x="24" y="348" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The card is charged one time. A handler starts from the top, and its named checkpoints do not run again.</text>
</svg>
