<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 224" width="960" height="224" role="img" aria-labelledby="debounce-preserve-dark-title debounce-preserve-dark-desc">
<title id="debounce-preserve-dark-title">With preserve, the first request sets the run time</title>
<desc id="debounce-preserve-dark-desc">Requests for doc-42 use a window of 2 s and schedule preserve. Revision 1 at 0 s creates a task that runs at 2 s. Revision 2 at 1 s replaces the payload, and the run time stays at 2 s. Soon after 2 s, a worker indexes revision 2.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="224" fill="#000000"/>
<text x="24" y="40" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">doc-42</text>
<text x="24" y="55" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">schedule: "preserve"</text>
<text x="240" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 s</text>
<text x="352" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">1 s</text>
<text x="464" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">2 s</text>
<text x="576" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">3 s</text>
<text x="688" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">4 s</text>
<text x="800" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">5 s</text>
<line x1="240" y1="52" x2="800" y2="52" stroke="#2b2b2b"/>
<text x="24" y="88" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">revision 1</text>
<text x="24" y="103" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">accepted</text>
<rect x="240" y="72" width="224" height="40" rx="8" fill="#000000"/>
<rect x="240.5" y="72.5" width="223" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="352" y="90" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">run time 2 s</text>
<text x="352" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">set by revision 1</text>
<text x="24" y="144" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">revision 2</text>
<text x="24" y="159" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">replaced</text>
<rect x="352" y="128" width="112" height="40" rx="8" fill="#000000"/>
<rect x="352.5" y="128.5" width="111" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="408" y="146" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stays 2 s</text>
<text x="408" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">new payload</text>
<rect x="472" y="128" width="132" height="40" rx="8" fill="#000000"/>
<rect x="472.5" y="128.5" width="131" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="538" y="146" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs</text>
<text x="538" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">indexes revision 2</text>
<text x="24" y="208" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Later requests replace only the payload. The task runs by a known time.</text>
</svg>
