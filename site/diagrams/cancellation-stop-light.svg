<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 332" width="960" height="332" role="img" aria-labelledby="cancellation-stop-light-title cancellation-stop-light-desc">
<title id="cancellation-stop-light-title">Workhorse asks a running handler to stop, and the handler decides when it stops</title>
<desc id="cancellation-stop-light-desc">Worker A claims the order.upload task at 0 s, and its heartbeat at 10 s moves the lease to 40 s. At 12 s, an operator cancels the task, and Workhorse records the request. The heartbeat at 20 s returns cancel_requested and does not move the lease. If the handler obeys the signal, it stops and the worker confirms the cancellation. If the handler ignores the signal, the lease expires at 40 s and recovery cancels the task.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="332" fill="#ffffff"/>
<text x="200" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 s</text>
<text x="347.2" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">10 s</text>
<text x="376.64" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">12 s</text>
<text x="494.4" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">20 s</text>
<text x="641.6" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">30 s</text>
<text x="788.8" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">40 s</text>
<text x="936" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">50 s</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<rect x="376.64" y="72" width="559.36" height="216" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="388.64" y="66" width="140" height="12" fill="#ffffff"/>
<text x="458.64" y="75" fill="#555555" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">CANCEL REQUESTED AT 12 S</text>
<text x="24" y="112" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">the handler obeys</text>
<rect x="200" y="96" width="290.4" height="36" rx="8" fill="#ffffff"/>
<rect x="200.5" y="96.5" width="289.4" height="35" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="345.2" y="112" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs the handler</text>
<text x="345.2" y="126" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">attempt 1</text>
<rect x="498.4" y="96" width="120" height="36" rx="8" fill="#ffffff"/>
<rect x="498.9" y="96.5" width="119" height="35" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="558.4" y="112" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">canceled</text>
<text x="558.4" y="126" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the worker confirms</text>
<text x="24" y="154" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">heartbeat</text>
<rect x="343.2" y="146" width="8" height="8" rx="2" fill="#ffffff"/>
<rect x="343.7" y="146.5" width="7" height="7" rx="2" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="331.2" y="168" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">LEASE UNTIL 40 S</text>
<rect x="490.4" y="146" width="8" height="8" rx="2" fill="#ffffff"/>
<rect x="490.9" y="146.5" width="7" height="7" rx="2" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="494.4" y="168" fill="#555555" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">CANCEL_REQUESTED</text>
<text x="24" y="212" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">the handler ignores</text>
<rect x="200" y="196" width="584.8" height="36" rx="8" fill="#ffffff"/>
<rect x="200.5" y="196.5" width="583.8" height="35" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="492.4" y="212" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs the handler</text>
<text x="492.4" y="226" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the signal is aborted at 20 s</text>
<rect x="792.8" y="196" width="120" height="36" rx="8" fill="#ffffff"/>
<rect x="793.3" y="196.5" width="119" height="35" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="852.8" y="212" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">canceled</text>
<text x="852.8" y="226" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the lease expires</text>
<text x="24" y="254" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">heartbeat</text>
<rect x="343.2" y="246" width="8" height="8" rx="2" fill="#ffffff"/>
<rect x="343.7" y="246.5" width="7" height="7" rx="2" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="331.2" y="268" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">LEASE UNTIL 40 S</text>
<rect x="490.4" y="246" width="8" height="8" rx="2" fill="#ffffff"/>
<rect x="490.9" y="246.5" width="7" height="7" rx="2" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="494.4" y="268" fill="#555555" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">CANCEL_REQUESTED</text>
<rect x="637.6" y="246" width="8" height="8" rx="2" fill="#ffffff"/>
<rect x="638.1" y="246.5" width="7" height="7" rx="2" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="641.6" y="268" fill="#555555" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">CANCEL_REQUESTED</text>
<text x="24" y="316" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">After the request, a heartbeat does not move the lease. The handler decides when it stops.</text>
</svg>
