<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="rate-limits-keys-dark-title rate-limits-keys-dark-desc">
<title id="rate-limits-keys-dark-title">Each key has its own bucket, so one customer does not delay another</title>
<desc id="rate-limits-keys-dark-desc">The perKey bucket of provider-api lets each customer start five tasks each minute, with a burst of two. At 0 s, acme enqueues 20 tasks, and two start. At 6 s, globex enqueues one task. The claim skips the 18 acme tasks, because the acme bucket has no whole token, and the globex task starts. At 12 s, the acme bucket has one new token, and one more acme task starts.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="336" fill="#000000"/>
<text x="24" y="40" fill="#f4f4f4" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">provider-api</text>
<text x="24" y="55" fill="#cfcfcf" font-size="9" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">perKey: 5 each minute · burst 2</text>
<text x="260" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 s</text>
<text x="351.42857142857144" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">2 s</text>
<text x="442.8571428571429" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">4 s</text>
<text x="534.2857142857142" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">6 s</text>
<text x="625.7142857142858" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">8 s</text>
<text x="717.1428571428571" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">10 s</text>
<text x="808.5714285714286" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">12 s</text>
<text x="900" y="44" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">14 s</text>
<line x1="260" y1="52" x2="900" y2="52" stroke="#2b2b2b"/>
<text x="24" y="88" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">acme</text>
<text x="24" y="103" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">20 tasks</text>
<rect x="260" y="72" width="136" height="40" rx="8" fill="#000000"/>
<rect x="260.5" y="72.5" width="135" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="328" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">2 tasks start</text>
<text x="328" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">acme bucket empty</text>
<text x="24" y="144" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">acme</text>
<text x="24" y="159" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">waiting</text>
<rect x="260" y="128" width="548.5714285714286" height="40" rx="8" fill="#000000"/>
<rect x="260.5" y="128.5" width="547.5714285714286" height="39" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="534.2857142857142" y="146" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">18 tasks stay ready</text>
<text x="534.2857142857142" y="160" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no whole acme token</text>
<text x="24" y="200" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">globex</text>
<text x="24" y="215" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">1 task</text>
<rect x="534.2857142857142" y="184" width="136" height="40" rx="8" fill="#000000"/>
<rect x="534.7857142857142" y="184.5" width="135" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="602.2857142857142" y="202" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">starts</text>
<text x="602.2857142857142" y="216" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">own bucket full</text>
<text x="24" y="256" fill="#f4f4f4" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">acme</text>
<text x="24" y="271" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">new token</text>
<rect x="808.5714285714286" y="240" width="136" height="40" rx="8" fill="#000000"/>
<rect x="809.0714285714286" y="240.5" width="135" height="39" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="876.5714285714286" y="258" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">1 task starts</text>
<text x="876.5714285714286" y="272" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one acme token</text>
<text x="24" y="320" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A start needs a token from the queue bucket and from the bucket of its key.</text>
</svg>
