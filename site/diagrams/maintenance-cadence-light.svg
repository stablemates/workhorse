<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="maintenance-cadence-light-title maintenance-cadence-light-desc">
<title id="maintenance-cadence-light-title">Each worker runs the tick at one cadence and the maintenance routines at another</title>
<desc id="maintenance-cadence-light-desc">Every worker calls tick_v1 every maintenanceIntervalMs, 1 s by default. Under the workhorse:tick advisory lock, tick_v1 promotes scheduled tasks to ready, then recovers expired leases. At the same cadence, and only with scheduleNamespaces set, the worker evaluates schedules. Every maintenanceRoutinePollMs, 60 s by default, it calls run_maintenance_v1, which runs rollup_stats_v1, prune_terminal_storage_v1, prune_worker_registry_v1, retain_history_v1, and prepare_history_partitions_v1 in this order.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="432" fill="#ffffff"/>
<rect x="24" y="48" width="152" height="336" rx="8" fill="#ffffff"/>
<rect x="24.5" y="48.5" width="151" height="335" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="100" y="220" fill="#000000" font-size="12" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">every worker</text>
<path d="M 176,108 H 230" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="232" y="56" width="704" height="104" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="244" y="50" width="372" height="12" fill="#ffffff"/>
<text x="430" y="59" fill="#555555" font-size="8" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle" letter-spacing="0.04em">tick_v1 · every maintenanceIntervalMs, default 1 s · workhorse:tick lock</text>
<path d="M 572,108 H 594" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="248" y="84" width="324" height="48" rx="8" fill="#ffffff"/>
<rect x="248.5" y="84.5" width="323" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="410" y="106" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">promote</text>
<text x="410" y="120" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">scheduled to ready</text>
<rect x="596" y="84" width="324" height="48" rx="8" fill="#ffffff"/>
<rect x="596.5" y="84.5" width="323" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="758" y="106" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">recover</text>
<text x="758" y="120" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">expired leases</text>
