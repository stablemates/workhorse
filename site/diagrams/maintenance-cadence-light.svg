<rect x="248" y="180" width="672" height="48" rx="8" fill="#ffffff"/>
<rect x="248.5" y="180.5" width="671" height="47" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="584" y="202" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">schedule evaluation</text>
<text x="584" y="216" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">same cadence · only with scheduleNamespaces set</text>
