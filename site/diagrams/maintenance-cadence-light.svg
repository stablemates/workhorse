<rect x="248" y="180" width="672" height="48" rx="6" fill="#f9fafb"/>
<rect x="248" y="180" width="672" height="48" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="584" y="202" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">schedule evaluation</text>
<text x="584" y="216" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">same cadence · only with scheduleNamespaces set</text>
<path d="M 176,316 H 230" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
