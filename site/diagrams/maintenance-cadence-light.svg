<rect x="244" y="246" width="360" height="12" rx="2" fill="#f9fafb"/>
<text x="424" y="255" fill="#6d7277" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">run_maintenance_v1 · every maintenanceRoutinePollMs, default 60 s</text>
