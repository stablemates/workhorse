<text x="584" y="352" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">5</text>
<text x="584" y="366" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">prepare_history_partitions_v1</text>
