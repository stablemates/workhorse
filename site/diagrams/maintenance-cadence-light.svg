<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="maintenance-cadence-light-title maintenance-cadence-light-desc">
<title id="maintenance-cadence-light-title">Each worker runs the tick at one cadence and the maintenance routines at another</title>
<desc id="maintenance-cadence-light-desc">Every worker calls tick_v1 every maintenanceIntervalMs, 1 s by default. Under the workhorse:tick advisory lock, tick_v1 promotes scheduled tasks to ready, then recovers expired leases. At the same cadence, and only with scheduleNamespaces set, the worker evaluates schedules. Every maintenanceRoutinePollMs, 60 s by default, it calls run_maintenance_v1, which runs rollup_stats_v1, prune_terminal_storage_v1, prune_worker_registry_v1, retain_history_v1, and prepare_history_partitions_v1 in this order.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="432" fill="#f9fafb"/>
<rect x="24" y="48" width="152" height="336" rx="6" fill="#f9fafb"/>
<rect x="24" y="48" width="152" height="336" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="100" y="220" fill="#1a2027" font-size="12" font-weight="600" font-family="Geist" text-anchor="middle">every worker</text>
<path d="M 176,108 H 230" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="232" y="56" width="704" height="104" rx="8" fill="rgba(26,32,39,0.02)" stroke="rgba(26,32,39,0.12)" stroke-width="0.8"/>
<rect x="244" y="50" width="396" height="12" rx="2" fill="#f9fafb"/>
<text x="442" y="59" fill="#6d7277" font-size="7" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.14em">tick_v1 · every maintenanceIntervalMs, default 1 s · workhorse:tick lock</text>
<path d="M 572,108 H 594" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="248" y="84" width="324" height="48" rx="6" fill="#f9fafb"/>
