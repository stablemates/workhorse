<path d="M 812,320 V 326 H 356 V 330" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="416" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Between passes, a worker sends only the claim query.</text>
</svg>
