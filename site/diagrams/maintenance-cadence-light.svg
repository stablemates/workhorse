<text x="410" y="106" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">promote</text>
<text x="410" y="120" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">scheduled to ready</text>
<rect x="596" y="84" width="324" height="48" rx="6" fill="#f9fafb"/>
<rect x="596" y="84" width="324" height="48" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
