<path d="M 812,320 V 326 H 356 V 330" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<text x="24" y="416" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">Between passes, a worker sends only the claim query.</text>
</svg>
