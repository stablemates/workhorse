<rect x="476.5" y="332.5" width="215" height="43" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="584" y="352" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">5</text>
<text x="584" y="366" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">prepare_history_partitions_v1</text>
