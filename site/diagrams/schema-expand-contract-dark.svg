<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" width="960" height="316" role="img" aria-labelledby="schema-expand-contract-dark-title schema-expand-contract-dark-desc">
<title id="schema-expand-contract-dark-title">A change that spans deployments rolls out in three releases</title>
<desc id="schema-expand-contract-dark-desc">Release 1, expand: a migration adds the new shape beside the old one. Release 2, migrate: applications move reads, then writes, to the new shape. Release 3, contract: a migration removes the old shape. When that removal narrows workhorse.protocol_version, it ships as a contract step that the operator runs with workhorse schema contract --yes.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="316" fill="#000000"/>
<rect x="24" y="48" width="280" height="108" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="36" y="42" width="108" height="12" fill="#000000"/>
<text x="90" y="51" fill="#ababab" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">RELEASE 1 · EXPAND</text>
<rect x="40" y="76" width="248" height="52" rx="8" fill="#000000"/>
<rect x="40.5" y="76.5" width="247" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="164" y="100" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">migration adds the new shape</text>
<text x="164" y="114" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">beside the old one</text>
<rect x="340" y="48" width="280" height="108" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="352" y="42" width="116" height="12" fill="#000000"/>
<text x="410" y="51" fill="#ababab" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">RELEASE 2 · MIGRATE</text>
<rect x="356" y="76" width="248" height="52" rx="8" fill="#000000"/>
<rect x="356.5" y="76.5" width="247" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="480" y="100" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">applications move to the new shape</text>
<text x="480" y="114" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">reads first, then writes</text>
<path d="M 304,102 H 338" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="656" y="48" width="280" height="108" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="668" y="42" width="120" height="12" fill="#000000"/>
<text x="728" y="51" fill="#ababab" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">RELEASE 3 · CONTRACT</text>
<rect x="672" y="76" width="248" height="52" rx="8" fill="#000000"/>
<rect x="672.5" y="76.5" width="247" height="51" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="796" y="100" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">migration removes the old shape</text>
<text x="796" y="114" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no supported version uses it</text>
<path d="M 620,102 H 654" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 796,128 V 214" fill="none" stroke="#838383" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
<rect x="694" y="176" width="204" height="12" rx="2" fill="#000000"/>
<text x="796" y="185" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">narrows workhorse.protocol_version</text>
<rect x="656" y="216" width="280" height="52" rx="8" fill="#000000"/>
<rect x="656.5" y="216.5" width="279" height="51" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="796" y="240" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">contract step</text>
<text x="796" y="254" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">workhorse schema contract --yes</text>
<text x="24" y="300" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">workhorse schema migrate does not run a contract step. The operator runs it deliberately.</text>
</svg>
