<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="workers-slots-dark-title workers-slots-dark-desc">
<title id="workers-slots-dark-title">A worker fills its free slots with as few claims as possible</title>
<desc id="workers-slots-dark-desc">mailer-1 has eight slots. At start, one claim to email for eight tasks fills every slot. One task finishes, and the worker claims one task; the queue rotation sends this claim to billing. Two more tasks finish while that claim is in flight, so the worker claims two tasks from email. One heartbeat timer renews all leases of the worker in one batch.</desc>
