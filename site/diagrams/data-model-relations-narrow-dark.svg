<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 512" width="400" height="512" role="img" aria-labelledby="data-model-relations-narrow-dark-title data-model-relations-narrow-dark-desc">
<title id="data-model-relations-narrow-dark-title">The task table and the tables that hang from it</title>
<desc id="data-model-relations-narrow-dark-desc">task owns retained enqueue_idempotency keys, at most one live task_runtime row, at most one terminal task_outcome row, exactly one task_query projection, task_redrive edges as the failed source and at most one as the redrive target, task_checkpoint restart boundaries, at most one task_progress row, task_wait timer boundaries, the task_event rows it emits, and the attempt_history rows of its closed attempts. schedule_definition fires schedule_occurrence rows, and each occurrence enqueues at most one task. rate_limit_policy owns rate_limit_bucket token state. concurrency_policy and admission_shard are queue tables without a relation.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
