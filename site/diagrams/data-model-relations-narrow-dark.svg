<text x="244" y="435" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">rate_limit_policy</text>
<text x="244" y="449" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">owns rate_limit_bucket</text>
<text x="24" y="480" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Each table section ends with its</text>
