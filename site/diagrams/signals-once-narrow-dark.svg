<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 232" width="400" height="232" role="img" aria-labelledby="signals-once-narrow-dark-title signals-once-narrow-dark-desc">
<title id="signals-once-narrow-dark-title">Workhorse accepts only the first delivery of a signal</title>
<desc id="signals-once-narrow-dark-desc">The task for ord-381 waits for the approval signal. At 3 h, the review service sends approval with the key review-77, and Workhorse resumes the task. At 3 h + 5 s, the service sends the same key again, and Workhorse returns duplicate. At 3 h + 1 min, a second reviewer sends the key review-78, and Workhorse returns already_delivered with the first payload. The task resumes one time.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ced1d4"/></marker></defs>
<rect width="400" height="232" fill="#04080e"/>
<text x="24" y="49" fill="#f2f4f5" font-size="9" font-family="Geist Mono">3 h</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(252,152,76,0.08)" stroke="#fc984c" stroke-width="1.4"/>
<text x="244" y="43" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">review-77: delivered</text>
<text x="244" y="57" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">the task resumes</text>
<path d="M 248,66 V 78" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="105" fill="#f2f4f5" font-size="9" font-family="Geist Mono">3 h + 5 s</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="99" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">review-77 again: duplicate</text>
<text x="244" y="113" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no change</text>
<path d="M 248,122 V 134" fill="none" stroke="#ced1d4" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
<text x="24" y="161" fill="#f2f4f5" font-size="9" font-family="Geist Mono">3 h + 1 min</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#04080e"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(242,244,245,0.05)" stroke="#ced1d4" stroke-width="1"/>
<text x="244" y="155" fill="#f2f4f5" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">review-78: already_delivered</text>
<text x="244" y="169" fill="#ced1d4" font-size="9" font-family="Geist Mono" text-anchor="middle">no change · first payload</text>
<text x="24" y="200" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The first accepted delivery resumes the</text>
<text x="24" y="215" fill="#ced1d4" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">task. A later delivery does not change it.</text>
</svg>
