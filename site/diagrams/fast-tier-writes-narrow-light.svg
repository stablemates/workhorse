<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 416" width="400" height="416" role="img" aria-labelledby="fast-tier-writes-narrow-light-title fast-tier-writes-narrow-light-desc">
<title id="fast-tier-writes-narrow-light-title">The writes of one task on the full tier and on the fast tier</title>
<desc id="fast-tier-writes-narrow-light-desc">On the full tier, enqueue writes the task row, a ready task_runtime row, and an enqueued event. The claim changes task_runtime and adds a claimed event. Success writes a task_outcome row, an event, and an attempt_history row. On the fast tier, enqueue writes the task row and a ready fast_task_runtime row. The claim changes only that row. Success writes one fast_task_outcome row. History is written only when the queue enables it.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="416" fill="#ffffff"/>
<text x="24" y="49" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">full</text>
<rect x="112" y="24" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="24.5" width="263" height="41" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="43" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">enqueue</text>
<text x="244" y="57" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">task · task_runtime · event</text>
<text x="24" y="105" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">full</text>
<rect x="112" y="80" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="80.5" width="263" height="41" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="99" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">claim</text>
<text x="244" y="113" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">task_runtime · event</text>
<text x="24" y="161" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">full</text>
<rect x="112" y="136" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="136.5" width="263" height="41" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="155" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">success</text>
<text x="244" y="169" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">task_outcome · event · history</text>
<text x="24" y="233" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">fast</text>
<rect x="112" y="208" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="208.5" width="263" height="41" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="227" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">enqueue</text>
<text x="244" y="241" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">task · fast_task_runtime</text>
<text x="24" y="289" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">fast</text>
<rect x="112" y="264" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="264.5" width="263" height="41" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="283" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">claim</text>
<text x="244" y="297" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">fast_task_runtime</text>
<text x="24" y="345" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">fast</text>
<rect x="112" y="320" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="320.5" width="263" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="244" y="339" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">success</text>
<text x="244" y="353" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">fast_task_outcome · no history</text>
<text x="24" y="384" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">On the fast tier, history rows and claimed</text>
<text x="24" y="399" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">events are opt-in for each queue.</text>
</svg>
