<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 247" width="400" height="247" role="img" aria-labelledby="statistics-window-narrow-light-title statistics-window-narrow-light-desc">
<title id="statistics-window-narrow-light-title">A window reads summary rows before the watermark and raw history after it</title>
<desc id="statistics-window-narrow-light-desc">At 10:05:02, the rollup summarizes the minute 10:04 and moves the watermark to 10:05. At 10:05:40, an operator asks for the last hour. Workhorse reads the summary rows before the watermark and counts the part from 10:05 to 10:05:40 from the raw history. If the rollup is late, the raw part is longer, and the answer stays correct.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="247" fill="#ffffff"/>
<text x="24" y="49" fill="#000000" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">10:05:02</text>
<rect x="112" y="24" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="24.5" width="263" height="41" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="244" y="43" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">the rollup summarizes 10:04</text>
<text x="244" y="57" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">the watermark moves to 10:05</text>
<path d="M 248,66 V 78" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="105" fill="#000000" font-size="9" font-family="Geist Mono, monospace" text-anchor="start">10:05:40</text>
<rect x="112" y="80" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="80.5" width="263" height="41" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="244" y="99" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">summary rows</text>
<text x="244" y="113" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">before the watermark</text>
<path d="M 248,122 V 134" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="161" fill="#000000" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start"></text>
<rect x="112" y="136" width="264" height="42" rx="8" fill="#ffffff"/>
<rect x="112.5" y="136.5" width="263" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="244" y="155" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">raw history</text>
<text x="244" y="169" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">10:05 to 10:05:40</text>
<text x="24" y="200" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">If the rollup is late, the raw part is</text>
<text x="24" y="215" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">longer, and the answer stays correct.</text>
</svg>
