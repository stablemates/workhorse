<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" width="960" height="368" role="img" aria-labelledby="human-decisions-wait-light-title human-decisions-wait-light-desc">
<title id="human-decisions-wait-light-title">A human wait frees the worker until a person decides</title>
<desc id="human-decisions-wait-light-desc">At 0 s, worker A runs the handler for acct-19, and the handler waits for the account-review decision. No worker holds the task during the wait, and the dashboard shows the decision to operators. At 40 min, an operator approves, and Workhorse stores the result and sets the task to ready. Worker B runs the handler from its first line. The wait returns the stored result, and the handler activates the account. Both runs are attempt 1.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="368" fill="#ffffff"/>
<text x="374" y="52" fill="#000000" font-size="10" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">ctx.waitForHuman("account-review", …)</text>
<text x="754" y="52" fill="#000000" font-size="10" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">activateAccount()</text>
<line x1="192" y1="68" x2="936" y2="68" stroke="#e7e7e7"/>
<text x="24" y="98" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Run 1</text>
<text x="24" y="113" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">worker A · 0 s</text>
<text x="24" y="128" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">attempt 1 · fence 1</text>
<rect x="192" y="84" width="364" height="48" rx="8" fill="#ffffff"/>
<rect x="192.5" y="84.5" width="363" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="374" y="106" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">waits</text>
<text x="374" y="120" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stores the context · frees the slot</text>
<text x="754" y="111" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">not reached</text>
<rect x="192" y="148" width="744" height="40" rx="8" fill="#ffffff"/>
<rect x="192.5" y="148.5" width="743" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="564" y="172" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">no worker holds the task · the dashboard shows the decision to operators</text>
<text x="24" y="164" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the wait</text>
<text x="24" y="179" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">0 s to 40 min</text>
<rect x="192" y="204" width="744" height="44" rx="8" fill="#ffffff"/>
<rect x="192.5" y="204.5" width="743" height="43" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="564" y="224" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">an operator approves: { approved: true }</text>
<text x="564" y="238" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Workhorse stores the result · the task becomes ready</text>
<text x="24" y="222" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the decision</text>
<text x="24" y="237" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">40 min</text>
<text x="24" y="278" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">Run 2</text>
<text x="24" y="293" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">worker B · after 40 min</text>
<text x="24" y="308" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">attempt 1 · fence 2</text>
<rect x="192" y="264" width="364" height="48" rx="8" fill="#ffffff"/>
<rect x="192.5" y="264.5" width="363" height="47" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="374" y="286" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns</text>
<text x="374" y="300" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the stored result at once</text>
<rect x="572" y="264" width="364" height="48" rx="8" fill="#ffffff"/>
<rect x="572.5" y="264.5" width="363" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="754" y="286" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs</text>
<text x="754" y="300" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">activates acct-19 · task succeeds</text>
<text x="24" y="352" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Each run starts at the first line of the handler. The wait does not use an attempt.</text>
</svg>
