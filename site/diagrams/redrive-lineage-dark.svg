<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 244" width="960" height="244" role="img" aria-labelledby="redrive-lineage-dark-title redrive-lineage-dark-desc">
<title id="redrive-lineage-dark-title">Each redrive adds a link, so the lineage leads back to the first failure</title>
<desc id="redrive-lineage-dark-desc">charge-4711 failed, and a redrive created charge-9020. charge-9020 failed too, and a second redrive created charge-9311. Each link is a task_redrive row. From any task in the chain, Admin.getRedriveLineage returns the chain from the first failure to the newest redrive.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="244" fill="#000000"/>
<path d="M 272,92 H 354" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="274" y="72" width="80" height="12" rx="2" fill="#000000"/>
<text x="314" y="81" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">task_redrive</text>
<path d="M 604,92 H 686" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="606" y="72" width="80" height="12" rx="2" fill="#000000"/>
<text x="646" y="81" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">task_redrive</text>
<rect x="24" y="64" width="248" height="56" rx="8" fill="#000000"/>
<rect x="24.5" y="64.5" width="247" height="55" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="148" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charge-4711</text>
<text x="148" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">failed · the first failure</text>
<rect x="356" y="64" width="248" height="56" rx="8" fill="#000000"/>
<rect x="356.5" y="64.5" width="247" height="55" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="480" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charge-9020</text>
<text x="480" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">failed · redrive 1</text>
<rect x="688" y="64" width="248" height="56" rx="8" fill="#000000"/>
<rect x="688.5" y="64.5" width="247" height="55" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="812" y="90" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">charge-9311</text>
<text x="812" y="104" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ready · redrive 2</text>
<rect x="24" y="152" width="912" height="44" rx="8" fill="#000000"/>
<rect x="24.5" y="152.5" width="911" height="43" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="480" y="172" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">Admin.getRedriveLineage(any task in the chain)</text>
<text x="480" y="186" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">returns the chain from the first failure to the newest redrive</text>
<text x="24" y="228" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Retention keeps charge-4711 while a newer task in its chain stays.</text>
