<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" width="960" height="348" role="img" aria-labelledby="frameworks-shape-dark-title frameworks-shape-dark-desc">
<title id="frameworks-shape-dark-title">The web process enqueues and serves the dashboard; the worker runs alone</title>
<desc id="frameworks-shape-dark-desc">In the web process, the request handler gets the Queue from the dependency injection of your framework and enqueues in the transaction that writes its data. The dashboard mounts in one of two shapes: host.handle(request) for a Fetch Request, or dashboardNodeMiddleware(host) for a Node req and res pair. The worker runs as its own continuous process. Both connect to PostgreSQL.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="348" fill="#000000"/>
<rect x="24" y="48" width="568" height="180" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="36" y="42" width="72" height="12" fill="#000000"/>
<text x="72" y="51" fill="#ababab" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">WEB PROCESS</text>
<rect x="616" y="48" width="320" height="180" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="628" y="42" width="88" height="12" fill="#000000"/>
<text x="672" y="51" fill="#ababab" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">WORKER PROCESS</text>
<path d="M 284,100 H 318" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 304,228 V 258" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<path d="M 776,228 V 258" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="40" y="76" width="244" height="48" rx="8" fill="#000000"/>
<rect x="40.5" y="76.5" width="243" height="47" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="162" y="98" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">request handler</text>
<text x="162" y="112" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">writes your data</text>
<rect x="320" y="76" width="256" height="48" rx="8" fill="#000000"/>
<rect x="320.5" y="76.5" width="255" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="448" y="98" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Queue from your DI</text>
<text x="448" y="112" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">enqueues in that transaction</text>
<text x="40" y="150" fill="#ababab" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the dashboard · one of two shapes</text>
<rect x="40" y="160" width="260" height="52" rx="8" fill="#000000"/>
<rect x="40.5" y="160.5" width="259" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="170" y="184" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Fetch Request</text>
<text x="170" y="198" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">host.handle(request)</text>
<rect x="316" y="160" width="260" height="52" rx="8" fill="#000000"/>
<rect x="316.5" y="160.5" width="259" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="446" y="184" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">Node req / res</text>
<text x="446" y="198" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">dashboardNodeMiddleware(host)</text>
<rect x="632" y="76" width="288" height="48" rx="8" fill="#000000"/>
<rect x="632.5" y="76.5" width="287" height="47" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="776" y="98" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">workhorse worker</text>
<text x="776" y="112" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a continuous process</text>
<rect x="632" y="140" width="288" height="72" rx="8" fill="#000000"/>
<rect x="632.5" y="140.5" width="287" height="71" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="776" y="174" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">its own pool</text>
<text x="776" y="188" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">renews leases · drains on a signal</text>
<rect x="24" y="260" width="912" height="40" rx="8" fill="#000000"/>
<rect x="24.5" y="260.5" width="911" height="39" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="480" y="284" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">PostgreSQL</text>
<text x="24" y="332" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A web replica never starts a worker. Scale the web tier and the worker tier separately.</text>
</svg>
