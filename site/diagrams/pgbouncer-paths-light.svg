<rect x="676.5" y="128.5" width="259" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="806" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">works</text>
<text x="806" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">on any server session</text>
