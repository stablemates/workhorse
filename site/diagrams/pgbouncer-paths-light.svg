<rect x="676" y="184" width="260" height="40" rx="8" fill="#ffffff"/>
<rect x="676.5" y="184.5" width="259" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="806" y="202" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no wake hint</text>
<text x="806" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">next fallback poll</text>
<path d="M 432,260 H 454" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 652,260 H 674" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="256" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">w1</text>
<text x="24" y="271" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the listener</text>
<rect x="176" y="240" width="256" height="40" rx="8" fill="#ffffff"/>
<rect x="176.5" y="240.5" width="255" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="304" y="258" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">LISTEN workhorse_tasks</text>
<text x="304" y="272" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">session state</text>
<rect x="456" y="240" width="196" height="40" rx="8" fill="#ffffff"/>
<rect x="456.5" y="240.5" width="195" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="554" y="258" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">direct pool</text>
<text x="554" y="272" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">or session mode</text>
