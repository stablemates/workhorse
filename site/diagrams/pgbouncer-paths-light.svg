<path d="M 652,204 H 674" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="200" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">w1</text>
<text x="24" y="215" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the listener</text>
<rect x="176" y="184" width="256" height="40" rx="8" fill="#ffffff"/>
<rect x="176.5" y="184.5" width="255" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="304" y="202" fill="#555555" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">LISTEN workhorse_tasks</text>
<text x="304" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">session state</text>
<rect x="456" y="184" width="196" height="40" rx="8" fill="#ffffff"/>
