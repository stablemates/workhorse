<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="pgbouncer-paths-light-title pgbouncer-paths-light-desc">
<title id="pgbouncer-paths-light-title">Every queue operation works through the pooler; only the listener needs its own session</title>
<desc id="pgbouncer-paths-light-desc">The app shop enqueues order.fulfill for order-42 in one transaction through PgBouncer in transaction mode. The worker w1 claims, sends heartbeats, and completes through the same pooler. Both work. The LISTEN workhorse_tasks of the listener gets no notification through transaction mode, so w1 claims at its next fallback poll. Through a direct or session-mode pool, the wake hint arrives.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="336" fill="#ffffff"/>
<text x="304" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">client</text>
<text x="554" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">pool path</text>
<text x="806" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">result</text>
<line x1="176" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<path d="M 432,92 H 454" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
