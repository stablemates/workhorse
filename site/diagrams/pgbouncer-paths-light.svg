<text x="24" y="88" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">shop</text>
<text x="24" y="103" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the app</text>
<rect x="176" y="72" width="256" height="40" rx="8" fill="#ffffff"/>
<rect x="176.5" y="72.5" width="255" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="304" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">enqueue order.fulfill</text>
<text x="304" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">with order-42 · one transaction</text>
<rect x="456" y="72" width="196" height="40" rx="8" fill="#ffffff"/>
<rect x="456.5" y="72.5" width="195" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="554" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">PgBouncer</text>
<text x="554" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">transaction mode</text>
<rect x="676" y="72" width="260" height="40" rx="8" fill="#ffffff"/>
<rect x="676.5" y="72.5" width="259" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="806" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">works</text>
<text x="806" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">commits together</text>
<path d="M 432,148 H 454" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 652,148 H 674" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<text x="24" y="144" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">w1</text>
<text x="24" y="159" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">the worker</text>
<rect x="176" y="128" width="256" height="40" rx="8" fill="#ffffff"/>
<rect x="176.5" y="128.5" width="255" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="304" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">claim · heartbeat · complete</text>
<text x="304" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">self-contained statements</text>
