<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" width="960" height="348" role="img" aria-labelledby="observability-sources-dark-title observability-sources-dark-desc">
<title id="observability-sources-dark-title">Each worker records its own metrics, and one service records the database gauges</title>
<desc id="observability-sources-dark-desc">Each worker replica records counters and durations for its own work, such as claims and handler outcomes, with the queue, task type, and outcome as attributes. One long-lived service runs WorkhorseMetricsObserver. It reads the shared state in PostgreSQL and records gauges, such as queue depth and the age of ready work. An observer in each replica would export one copy of each gauge per replica.</desc>
