<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" height="272" role="img" aria-labelledby="concurrency-budget-light-title concurrency-budget-light-desc">
<title id="concurrency-budget-light-title">A budget limits the active tasks of several queues together</title>
<desc id="concurrency-budget-light-desc">The queues billing and crm call one vendor API, and the budget vendor-api allows four active tasks. At 1 s, billing runs three invoice.sync tasks. crm has two ready contact.sync tasks, and its own policy has room. Workhorse admits one, because the budget has room for one. The other task stays ready until an invoice.sync task completes at 3 s.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="272" fill="#ffffff"/>
<path d="M 456,84 H 560 V 122 H 598" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 456,180 H 560 V 142 H 598" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="24" y="48" width="432" height="72" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="36" y="42" width="120" height="12" fill="#ffffff"/>
<text x="96" y="51" fill="#555555" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">QUEUE · billing · at 1 s</text>
<rect x="40" y="64" width="128" height="40" rx="8" fill="#ffffff"/>
<rect x="40.5" y="64.5" width="127" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="104" y="82" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">invoice.sync</text>
<text x="104" y="96" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active</text>
<rect x="176" y="64" width="128" height="40" rx="8" fill="#ffffff"/>
<rect x="176.5" y="64.5" width="127" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="240" y="82" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">invoice.sync</text>
<text x="240" y="96" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active</text>
<rect x="312" y="64" width="128" height="40" rx="8" fill="#ffffff"/>
<rect x="312.5" y="64.5" width="127" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="376" y="82" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">invoice.sync</text>
<text x="376" y="96" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active</text>
<rect x="24" y="144" width="432" height="72" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="36" y="138" width="160" height="12" fill="#ffffff"/>
<text x="116" y="147" fill="#555555" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">QUEUE · crm · its policy has room</text>
<rect x="40" y="160" width="128" height="40" rx="8" fill="#ffffff"/>
<rect x="40.5" y="160.5" width="127" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="104" y="178" fill="#000000" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">contact.sync</text>
<text x="104" y="192" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active</text>
<rect x="176" y="160" width="128" height="40" rx="8" fill="#ffffff"/>
<rect x="176.5" y="160.5" width="127" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="240" y="178" fill="#555555" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">contact.sync</text>
<text x="240" y="192" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stays ready</text>
<rect x="600" y="108" width="336" height="48" rx="8" fill="#ffffff"/>
<rect x="600.5" y="108.5" width="335" height="47" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="768" y="130" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">budget vendor-api</text>
<text x="768" y="144" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">4 of 4 active · no room</text>
<text x="768" y="180" fill="#555555" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">at 3 s, an invoice.sync completes</text>
<text x="768" y="194" fill="#555555" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="middle">and the waiting contact.sync starts</text>
<text x="24" y="256" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A task must obey the policy of its queue and the budget that it names.</text>
</svg>
