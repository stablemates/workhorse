<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 216" width="960" height="216" role="img" aria-labelledby="queue-health-snapshot-light-title queue-health-snapshot-light-desc">
<title id="queue-health-snapshot-light-title">Two queries can report a problem that does not exist; one statement cannot</title>
<desc id="queue-health-snapshot-light-desc">A report reads billing with two separate queries. At 0 ms, the first query finds the expired lease of invoice-7. At 3 ms, recovery makes invoice-7 ready again. At 5 ms, the second query counts invoice-7 as ready. The report shows a problem and its recovery together. Queue.health() reads all exact values in one SQL statement, so every value is from the instant capturedAt.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="216" fill="#ffffff"/>
<text x="24" y="40" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">billing</text>
<text x="24" y="55" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">invoice-7 · worker A stopped</text>
<text x="317.3333333333333" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 ms</text>
<text x="568" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">3 ms</text>
<text x="818.6666666666666" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">5 ms</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="97" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">two queries</text>
<rect x="200" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="317.3333333333333" y="90" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">query 1: expired leases</text>
<text x="317.3333333333333" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">finds invoice-7</text>
<rect x="450.66666666666663" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="568" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">recovery</text>
<text x="568" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">invoice-7 is ready again</text>
<rect x="701.3333333333333" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="701.8333333333333" y="72.5" width="233.66666666666666" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="818.6666666666666" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">query 2: tasks by state</text>
<text x="818.6666666666666" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">counts invoice-7 as ready</text>
<text x="24" y="153" fill="#000000" font-size="10" font-family="Geist Mono, monospace" text-anchor="start">Queue.health()</text>
<rect x="200" y="128" width="736" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="128.5" width="735" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="568" y="146" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one SQL statement</text>
<text x="568" y="160" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">one consistent view · capturedAt</text>
<text x="24" y="200" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Every count, depth, and watermark of the snapshot is from the same instant.</text>
</svg>
