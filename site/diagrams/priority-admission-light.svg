<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="priority-admission-light-title priority-admission-light-desc">
<title id="priority-admission-light-title">Priority orders only the tasks that the admission rules let start</title>
<desc id="priority-admission-light-desc">Queue billing lets two tasks for one customer run at the same time, and two reminders for cust-8 run. At 0 s, an urgent reminder for cust-8 and an ordinary reminder for cust-9 are ready. At 1 s, cust-8 has no free capacity, so Workhorse skips the urgent reminder, and the worker gets the reminder for cust-9. At 20 s, a cust-8 reminder completes, and the next worker gets the urgent reminder.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="280" fill="#ffffff"/>
<text x="24" y="40" fill="#000000" font-size="12" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">billing</text>
<text x="24" y="55" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">2 tasks per customer</text>
<text x="317.3333333333333" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">0 s</text>
<text x="568" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">1 s</text>
<text x="818.6666666666666" y="44" fill="#555555" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="middle">20 s</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
<text x="24" y="97" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">ready order</text>
<rect x="200" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="317.3333333333333" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">urgent cust-8</text>
<text x="317.3333333333333" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">then ordinary cust-9</text>
<rect x="450.66666666666663" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="568" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">urgent cust-8</text>
<text x="568" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">stays ready · keeps its place</text>
<rect x="701.3333333333333" y="72" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="701.8333333333333" y="72.5" width="233.66666666666666" height="39" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="818.6666666666666" y="90" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">urgent cust-8</text>
<text x="818.6666666666666" y="104" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">first in the order</text>
<text x="24" y="153" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">cust-8</text>
<rect x="200" y="128" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="200.5" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="317.3333333333333" y="146" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">2 reminders run</text>
<text x="317.3333333333333" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">no free capacity</text>
<rect x="450.66666666666663" y="128" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="568" y="146" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">2 reminders run</text>
<text x="568" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Workhorse skips urgent cust-8</text>
<rect x="701.3333333333333" y="128" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="701.8333333333333" y="128.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="818.6666666666666" y="146" fill="#555555" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">1 reminder completes</text>
<text x="818.6666666666666" y="160" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">capacity is free</text>
<text x="24" y="209" fill="#000000" font-size="10" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="start">worker gets</text>
<rect x="450.66666666666663" y="184" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="451.16666666666663" y="184.5" width="233.66666666666666" height="39" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="568" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">ordinary cust-9</text>
<text x="568" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the first task that can start</text>
<rect x="701.3333333333333" y="184" width="234.66666666666666" height="40" rx="8" fill="#ffffff"/>
<rect x="701.8333333333333" y="184.5" width="233.66666666666666" height="39" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="818.6666666666666" y="202" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">urgent cust-8</text>
<text x="818.6666666666666" y="216" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the next worker gets it</text>
<text x="24" y="264" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">An admission rule can hold back an urgent task. The task stays ready and keeps its place.</text>
</svg>
