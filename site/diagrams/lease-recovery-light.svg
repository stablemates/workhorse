<text x="140" y="62" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Worker A</text>
<rect x="390" y="40" width="180" height="36" rx="6" fill="#f9fafb"/>
<rect x="390" y="40" width="180" height="36" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="480" y="62" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">PostgreSQL</text>
<rect x="730" y="40" width="180" height="36" rx="6" fill="#f9fafb"/>
<rect x="730" y="40" width="180" height="36" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="820" y="62" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Worker B</text>
