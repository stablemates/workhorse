<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 598" width="960" height="598" role="img" aria-labelledby="lease-recovery-light-title lease-recovery-light-desc">
<title id="lease-recovery-light-title">Recovery replaces the generation, so the late write of the old worker matches no row</title>
<desc id="lease-recovery-light-desc">Worker A calls claim_many_v1 and gets the task with attempt 1 and fence 41. Its heartbeat_many_v2 with fence 41 is accepted, and expires_at is extended. Then A stalls past its lease. Worker B calls tick_v1, which calls recover_expired_v1: the lease expires, and the task is ready with attempt 2. B calls claim_many_v1 and gets attempt 2 with fence 42. The late complete_v1 of A with fence 41 returns false, because no generation matches. The complete_v1 of B with fence 42 returns true: the runtime row is deleted, and the outcome is inserted.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="598" fill="#f9fafb"/>
<rect x="139" y="76" width="2" height="474" rx="0.5" fill="#f9fafb"/>
<rect x="139" y="76" width="2" height="474" rx="0.5" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<rect x="479" y="76" width="2" height="474" rx="0.5" fill="#f9fafb"/>
<rect x="479" y="76" width="2" height="474" rx="0.5" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<rect x="819" y="76" width="2" height="474" rx="0.5" fill="#f9fafb"/>
<rect x="819" y="76" width="2" height="474" rx="0.5" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<rect x="50" y="40" width="180" height="36" rx="6" fill="#f9fafb"/>
