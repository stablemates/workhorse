<text x="140" y="248" fill="#555555" font-size="10" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">A stalls past its lease</text>
<path d="M 820,278 H 484" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
