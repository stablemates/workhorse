<text x="650" y="375" fill="#6d7277" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">task, attempt 2, fence 42</text>
<path d="M 140,414 H 476" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="244" y="400" width="132" height="12" rx="2" fill="#f9fafb"/>
<text x="310" y="409" fill="#6d7277" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">complete_v1 (fence 41)</text>
<path d="M 480,448 H 144" fill="none" stroke="#4e5359" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-light)"/>
<rect x="226" y="434" width="168" height="12" rx="2" fill="#f9fafb"/>
<text x="310" y="443" fill="#6d7277" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">false, no generation matches</text>
<path d="M 820,482 H 484" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="584" y="468" width="132" height="12" rx="2" fill="#f9fafb"/>
<text x="650" y="477" fill="#6d7277" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">complete_v1 (fence 42)</text>
<path d="M 480,516 H 816" fill="none" stroke="#4e5359" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-light)"/>
<rect x="536" y="502" width="228" height="12" rx="2" fill="#f9fafb"/>
<text x="650" y="511" fill="#6d7277" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">true, runtime deleted, outcome inserted</text>
<text x="24" y="582" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The example retries without delay. A delayed retry waits for promotion first.</text>
</svg>
