<rect x="370" y="300" width="220" height="24" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="480" y="316" fill="#1a2027" font-size="10" font-weight="600" font-family="Geist" text-anchor="middle">lease_expired, attempt 2, ready</text>
