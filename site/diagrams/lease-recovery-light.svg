<text x="310" y="103" fill="#6d7277" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">claim_many_v1</text>
<path d="M 480,142 H 144" fill="none" stroke="#4e5359" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-light)"/>
<rect x="236" y="128" width="148" height="12" rx="2" fill="#f9fafb"/>
<text x="310" y="137" fill="#6d7277" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">task, attempt 1, fence 41</text>
<path d="M 140,176 H 476" fill="none" stroke="#4e5359" stroke-width="1.2" marker-end="url(#arrow-light)"/>
<rect x="226" y="162" width="168" height="12" rx="2" fill="#f9fafb"/>
<text x="310" y="171" fill="#6d7277" font-size="8" font-family="Geist Mono" text-anchor="middle" letter-spacing="0.06em">heartbeat_many_v2 (fence 41)</text>
