<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 598" width="960" height="598" role="img" aria-labelledby="lease-recovery-light-title lease-recovery-light-desc">
<title id="lease-recovery-light-title">Recovery replaces the generation, so the late write of the old worker matches no row</title>
<desc id="lease-recovery-light-desc">Worker A calls claim_many_v1 and gets the task with attempt 1 and fence 41. Its heartbeat_many_v2 with fence 41 is accepted, and expires_at is extended. Then A stalls past its lease. Worker B calls tick_v1, which calls recover_expired_v1: the lease expires, and the task is ready with attempt 2. B calls claim_many_v1 and gets attempt 2 with fence 42. The late complete_v1 of A with fence 41 returns false, because no generation matches. The complete_v1 of B with fence 42 returns true: the runtime row is deleted, and the outcome is inserted.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="598" fill="#ffffff"/>
<rect x="139" y="76" width="2" height="474" rx="0.5" fill="#ffffff"/>
<rect x="139.5" y="76.5" width="1" height="473" rx="0.5" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<rect x="479" y="76" width="2" height="474" rx="0.5" fill="#ffffff"/>
<rect x="479.5" y="76.5" width="1" height="473" rx="0.5" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<rect x="819" y="76" width="2" height="474" rx="0.5" fill="#ffffff"/>
<rect x="819.5" y="76.5" width="1" height="473" rx="0.5" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<rect x="50" y="40" width="180" height="36" rx="8" fill="#ffffff"/>
<rect x="50.5" y="40.5" width="179" height="35" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="140" y="62" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Worker A</text>
<rect x="390" y="40" width="180" height="36" rx="8" fill="#ffffff"/>
<rect x="390.5" y="40.5" width="179" height="35" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="480" y="62" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">PostgreSQL</text>
<rect x="730" y="40" width="180" height="36" rx="8" fill="#ffffff"/>
<rect x="730.5" y="40.5" width="179" height="35" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="820" y="62" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Worker B</text>
<path d="M 140,108 H 476" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="266" y="94" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="310" y="103" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">claim_many_v1</text>
<path d="M 480,142 H 144" fill="none" stroke="#7d7d7d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-light)"/>
<rect x="240" y="128" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="310" y="137" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">task, attempt 1, fence 41</text>
<path d="M 140,176 H 476" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="224" y="162" width="172" height="12" rx="2" fill="#ffffff"/>
<text x="310" y="171" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">heartbeat_many_v2 (fence 41)</text>
<path d="M 480,210 H 144" fill="none" stroke="#7d7d7d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-light)"/>
<rect x="222" y="196" width="176" height="12" rx="2" fill="#ffffff"/>
<text x="310" y="205" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">accepted, expires_at extended</text>
<rect x="30" y="232" width="220" height="24" rx="6" fill="#ffffff"/>
