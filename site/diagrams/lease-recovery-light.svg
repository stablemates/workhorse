<text x="480" y="316" fill="#555555" font-size="10" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">lease_expired, attempt 2, ready</text>
<path d="M 820,346 H 484" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="606" y="332" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="650" y="341" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">claim_many_v1</text>
<path d="M 480,380 H 816" fill="none" stroke="#7d7d7d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-light)"/>
<rect x="580" y="366" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="650" y="375" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">task, attempt 2, fence 42</text>
<path d="M 140,414 H 476" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="242" y="400" width="136" height="12" rx="2" fill="#ffffff"/>
<text x="310" y="409" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">complete_v1 (fence 41)</text>
<path d="M 480,448 H 144" fill="none" stroke="#7d7d7d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-light)"/>
<rect x="232" y="434" width="156" height="12" rx="2" fill="#ffffff"/>
<text x="310" y="443" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">false, no generation matches</text>
<path d="M 820,482 H 484" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="582" y="468" width="136" height="12" rx="2" fill="#ffffff"/>
<text x="650" y="477" fill="#555555" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">complete_v1 (fence 42)</text>
<path d="M 480,516 H 816" fill="none" stroke="#7d7d7d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-light)"/>
<rect x="544" y="502" width="212" height="12" rx="2" fill="#ffffff"/>
<text x="650" y="511" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">true, runtime deleted, outcome inserted</text>
<text x="24" y="582" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The example retries without delay. A delayed retry waits for promotion first.</text>
</svg>
