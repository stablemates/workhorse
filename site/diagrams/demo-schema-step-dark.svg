<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" height="272" role="img" aria-labelledby="demo-schema-step-dark-title demo-schema-step-dark-desc">
<title id="demo-schema-step-dark-title">The demo prepares its schema from the new image before any container starts</title>
<desc id="demo-schema-step-dark-desc">After the image is built and pushed, the pipeline runs node dist/prepare-schema.js in a container from the same image, with the same environment and volumes. It installs or migrates the Workhorse schema and the demo tables in every workspace and verifies each one. A refusal exits non-zero and fails the deploy before the container swap. After the swap, the server asserts compatibility and opens /up only when the step ran.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="272" fill="#000000"/>
<rect x="24" y="48" width="204" height="52" rx="8" fill="#000000"/>
<rect x="24.5" y="48.5" width="203" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="126" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">build and push</text>
<text x="126" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the image of the release</text>
<path d="M 228,74 H 256" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="258" y="48" width="204" height="52" rx="8" fill="#000000"/>
<rect x="258.5" y="48.5" width="203" height="51" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="360" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">prepare-schema.js</text>
<text x="360" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a container from that image</text>
<path d="M 462,74 H 490" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="492" y="48" width="204" height="52" rx="8" fill="#000000"/>
<rect x="492.5" y="48.5" width="203" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="594" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">container swap</text>
<text x="594" y="86" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">only after exit 0</text>
<path d="M 696,74 H 724" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="726" y="48" width="204" height="52" rx="8" fill="#000000"/>
<rect x="726.5" y="48.5" width="203" height="51" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="828" y="72" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">server starts</text>
<text x="828" y="86" fill="#ababab" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">asserts compatibility · /up</text>
<path d="M 360,100 V 174" fill="none" stroke="#838383" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
<rect x="278" y="132" width="164" height="12" rx="2" fill="#000000"/>
<text x="360" y="141" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">A REFUSAL · NON-ZERO EXIT</text>
<rect x="258" y="176" width="204" height="48" rx="8" fill="#000000"/>
<rect x="258.5" y="176.5" width="203" height="47" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="360" y="198" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the deploy fails</text>
<text x="360" y="212" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">before the swap</text>
<text x="24" y="256" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Nothing prepares a schema at startup. The entry point starts processes only.</text>
</svg>
