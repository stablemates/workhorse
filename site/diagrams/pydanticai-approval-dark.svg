<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 204" width="960" height="204" role="img" aria-labelledby="pydanticai-approval-dark-title pydanticai-approval-dark-desc">
<title id="pydanticai-approval-dark-title">No process waits for the reviewer: a new activation resumes the Agent</title>
<desc id="pydanticai-approval-dark-desc">In the first activation, the handler stores the history and the agent-history-receipt checkpoint, then registers the credit-approval human wait, and Workhorse suspends the task. The reviewer approves, and Workhorse commits the decision. A new activation reads the decision and gives the history to a new Agent.run call, which runs the credit tool.</desc>
<defs><marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#838383" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="204" fill="#000000"/>
<rect x="16" y="48" width="360" height="108" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="28" y="42" width="76" height="12" fill="#000000"/>
<text x="66" y="51" fill="#ababab" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">ACTIVATION 1</text>
<rect x="392" y="48" width="172" height="108" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="404" y="42" width="56" height="12" fill="#000000"/>
<text x="432" y="51" fill="#ababab" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">REVIEWER</text>
<rect x="580" y="48" width="360" height="108" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="592" y="42" width="76" height="12" fill="#000000"/>
<text x="630" y="51" fill="#ababab" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">ACTIVATION 2</text>
<rect x="24" y="80" width="156" height="52" rx="8" fill="#000000"/>
<rect x="24.5" y="80.5" width="155" height="51" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="102" y="104" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">store the history</text>
<text x="102" y="118" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">agent-history-receipt</text>
<path d="M 180,106 H 210" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="212" y="80" width="156" height="52" rx="8" fill="#000000"/>
<rect x="212.5" y="80.5" width="155" height="51" rx="8" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
<text x="290" y="104" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">credit-approval</text>
<text x="290" y="118" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the task suspends</text>
<path d="M 368,106 H 398" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="400" y="80" width="156" height="52" rx="8" fill="#000000"/>
<rect x="400.5" y="80.5" width="155" height="51" rx="8" fill="#000000" stroke="#2b2b2b" stroke-width="1"/>
<text x="478" y="104" fill="#cfcfcf" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">reviewer approves</text>
<text x="478" y="118" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Workhorse commits it</text>
<path d="M 556,106 H 586" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="588" y="80" width="156" height="52" rx="8" fill="#000000"/>
<rect x="588.5" y="80.5" width="155" height="51" rx="8" fill="#202020" stroke="#2b2b2b" stroke-width="1"/>
<text x="666" y="104" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">read the decision</text>
<text x="666" y="118" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">then store it</text>
<path d="M 744,106 H 774" fill="none" stroke="#838383" stroke-width="1" marker-end="url(#arrow-dark)"/>
<rect x="776" y="80" width="156" height="52" rx="8" fill="#000000"/>
<rect x="776.5" y="80.5" width="155" height="51" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="854" y="104" fill="#f4f4f4" font-size="11" font-weight="500" font-family="Geist Mono, monospace" text-anchor="middle">new Agent.run</text>
<text x="854" y="118" fill="#ababab" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs the credit tool</text>
<text x="24" y="188" fill="#cfcfcf" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">The conversation ID stays the task ID. Each Agent.run call gets a new run ID.</text>
</svg>
