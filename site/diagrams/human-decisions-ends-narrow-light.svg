<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" width="400" height="304" role="img" aria-labelledby="human-decisions-ends-narrow-light-title human-decisions-ends-narrow-light-desc">
<title id="human-decisions-ends-narrow-light-title">A result resumes a pending decision, and a time limit or a cancellation ends it</title>
<desc id="human-decisions-ends-narrow-light-desc">The task for acct-19 waits on account-review. If an operator selects the Approve quick action, or the custom tool calls completeHumanWait with rev-4, Workhorse stores the result and the task becomes ready. If nobody answers before timeoutMs passes, maintenance fails the task with a deadline error. If the app cancels the task, Workhorse cancels it at once. After a failure or a cancellation, a late answer returns stale.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="400" height="304" fill="#ffffff"/>
<text x="24" y="49" fill="#000000" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">quick action</text>
<rect x="176" y="24" width="200" height="42" rx="8" fill="#ffffff"/>
<rect x="176.5" y="24.5" width="199" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="276" y="43" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">Approve: completed</text>
<text x="276" y="57" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the task is ready</text>
<text x="24" y="105" fill="#000000" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">completeHumanWait</text>
<rect x="176" y="80" width="200" height="42" rx="8" fill="#ffffff"/>
<rect x="176.5" y="80.5" width="199" height="41" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="276" y="99" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">rev-4: completed</text>
<text x="276" y="113" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">the task is ready</text>
<text x="24" y="161" fill="#000000" font-size="8" font-family="Geist Mono, monospace" font-weight="400" text-anchor="start">timeoutMs passes</text>
<rect x="176" y="136" width="200" height="42" rx="8" fill="#ffffff"/>
<rect x="176.5" y="136.5" width="199" height="41" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="276" y="155" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">maintenance: failed</text>
<text x="276" y="169" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a late answer: stale</text>
<text x="24" y="217" fill="#000000" font-size="8" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">cancellation</text>
<rect x="176" y="192" width="200" height="42" rx="8" fill="#ffffff"/>
<rect x="176.5" y="192.5" width="199" height="41" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="276" y="211" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">cancel: canceled</text>
<text x="276" y="225" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">a late answer: stale</text>
<text x="24" y="256" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">A result resumes the task. A time limit or</text>
<text x="24" y="271" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">a cancellation ends it, and a late answer</text>
<text x="24" y="286" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">returns stale.</text>
</svg>
