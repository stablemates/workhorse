<text x="568" y="270" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">active · worker A</text>
<rect x="696" y="236" width="240" height="44" rx="8" fill="#ffffff"/>
<rect x="696.5" y="236.5" width="239" height="43" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
