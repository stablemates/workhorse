<text x="24" y="362" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">On the fast tier, attempt_history rows and claimed events are opt-in for each queue.</text>
</svg>
