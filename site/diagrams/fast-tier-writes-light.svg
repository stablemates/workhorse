<text x="696" y="40" fill="#000000" font-size="11" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="500" text-anchor="start">3 · After success</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="#e7e7e7"/>
