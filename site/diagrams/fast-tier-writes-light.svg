<rect x="696" y="236" width="240" height="44" rx="6" fill="#f9fafb"/>
<rect x="696" y="236" width="240" height="44" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="816" y="256" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">fast_task_outcome</text>
<text x="816" y="270" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">succeeded · no event, no history</text>
<text x="24" y="362" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">On the fast tier, attempt_history rows and claimed events are opt-in for each queue.</text>
