<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 378" width="960" height="378" role="img" aria-labelledby="fast-tier-writes-light-title fast-tier-writes-light-desc">
<title id="fast-tier-writes-light-title">The writes of one task on the full tier and on the fast tier</title>
<desc id="fast-tier-writes-light-desc">On the full tier, enqueue writes the task row, a ready task_runtime row, and an enqueued event. The claim changes task_runtime and adds a claimed event. Success writes a task_outcome row, an event, and an attempt_history row. On the fast tier, enqueue writes the task row and a ready fast_task_runtime row. The claim changes only that row. Success writes one fast_task_outcome row. History is written only when the queue enables it.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="960" height="378" fill="#f9fafb"/>
<text x="200" y="40" fill="#1a2027" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">1 · After enqueue</text>
<text x="448" y="40" fill="#1a2027" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">2 · After the claim</text>
<text x="696" y="40" fill="#1a2027" font-size="11" font-family="Geist" font-weight="600" text-anchor="start">3 · After success</text>
<line x1="200" y1="52" x2="936" y2="52" stroke="rgba(26,32,39,0.14)"/>
<text x="24" y="84" fill="#1a2027" font-size="12" font-family="Geist" font-weight="600" text-anchor="start">full tier</text>
<text x="24" y="99" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">the default</text>
