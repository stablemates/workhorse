<rect x="200" y="286" width="240" height="44" rx="6" fill="#f9fafb"/>
<rect x="200" y="286" width="240" height="44" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="320" y="306" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">fast_task_runtime</text>
<text x="320" y="320" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">ready · no event</text>
<rect x="448" y="236" width="240" height="44" rx="6" fill="#f9fafb"/>
<rect x="448" y="236" width="240" height="44" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
