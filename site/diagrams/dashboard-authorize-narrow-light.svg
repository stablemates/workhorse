<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" width="400" height="344" role="img" aria-labelledby="dashboard-authorize-narrow-light-title dashboard-authorize-narrow-light-desc">
<title id="dashboard-authorize-narrow-light-title">The dashboard asks your application who the operator is before it serves anything</title>
<desc id="dashboard-authorize-narrow-light-desc">Dana opens /workhorse in the application. The dashboard calls the authorize callback before it serves anything. The callback reads the application session and returns a principal that names dana. If the callback refuses the request, the dashboard serves nothing. The dashboard checks that the installed schema is compatible and does not change it. When Dana cancels a task, the dashboard records dana as the operator.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5359"/></marker></defs>
<rect width="400" height="344" fill="#f9fafb"/>
<text x="24" y="49" fill="#1a2027" font-size="9" font-family="Geist Mono">request</text>
<rect x="112" y="24" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="24" width="264" height="42" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="43" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Dana opens /workhorse</text>
<text x="244" y="57" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">nothing is served yet</text>
<text x="24" y="105" fill="#1a2027" font-size="9" font-family="Geist Mono">callback</text>
<rect x="112" y="80" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="80" width="264" height="42" rx="6" fill="rgba(213,92,19,0.08)" stroke="#aa4515" stroke-width="1.4"/>
<text x="244" y="99" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">authorize</text>
<text x="244" y="113" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">reads the application session</text>
<text x="24" y="161" fill="#1a2027" font-size="9" font-family="Geist Mono">refuses</text>
<rect x="112" y="136" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="136" width="264" height="42" rx="6" fill="rgba(26,32,39,0.03)" stroke="rgba(26,32,39,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="244" y="155" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">the dashboard serves nothing</text>
<text x="244" y="169" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">no page, no data</text>
<text x="24" y="217" fill="#1a2027" font-size="9" font-family="Geist Mono">accepts</text>
<rect x="112" y="192" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="192" width="264" height="42" rx="6" fill="rgba(26,32,39,0.05)" stroke="#4e5359" stroke-width="1"/>
<text x="244" y="211" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">principal: dana</text>
<text x="244" y="225" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">schema check · no change</text>
<text x="24" y="273" fill="#1a2027" font-size="9" font-family="Geist Mono">action</text>
<rect x="112" y="248" width="264" height="42" rx="6" fill="#f9fafb"/>
<rect x="112" y="248" width="264" height="42" rx="6" fill="#ffffff" stroke="#1a2027" stroke-width="1"/>
<text x="244" y="267" fill="#1a2027" font-size="11" font-weight="600" font-family="Geist" text-anchor="middle">Dana cancels a task</text>
<text x="244" y="281" fill="#4e5359" font-size="9" font-family="Geist Mono" text-anchor="middle">recorded actor: dana</text>
<text x="24" y="312" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">The application owns the login. The</text>
<text x="24" y="327" fill="#4e5359" font-size="9" font-family="Geist Mono" font-weight="400" text-anchor="start">dashboard records the operator it names.</text>
</svg>
