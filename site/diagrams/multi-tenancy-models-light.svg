<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="multi-tenancy-models-light-title multi-tenancy-models-light-desc">
<title id="multi-tenancy-models-light-title">Shared tenancy keeps work fair. Isolated tenancy keeps tenants apart</title>
<desc id="multi-tenancy-models-light-desc">With shared tenancy, acme and globex use one database and one worker fleet, and the app keeps the tenant identifier of each task consistent. With isolated tenancy, acme and globex each have a database with the Workhorse schema and their own worker fleet. No worker sees the tasks of both tenants, and PostgreSQL enforces the boundary.</desc>
<defs><marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5,1 L 6.5,4 L 1.5,7" fill="none" stroke="#7d7d7d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="300" fill="#ffffff"/>
<path d="M 212,124 V 158" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 588,124 V 158" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<path d="M 820,124 V 158" fill="none" stroke="#7d7d7d" stroke-width="1" marker-end="url(#arrow-light)"/>
<rect x="24" y="56" width="376" height="196" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="36" y="50" width="88" height="12" fill="#ffffff"/>
<text x="80" y="59" fill="#555555" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">SHARED TENANCY</text>
<rect x="40" y="76" width="344" height="48" rx="8" fill="#ffffff"/>
<rect x="40.5" y="76.5" width="343" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="212" y="98" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one worker fleet</text>
<text x="212" y="112" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">runs the tasks of acme and globex</text>
<rect x="40" y="160" width="344" height="72" rx="8" fill="#ffffff"/>
<rect x="40.5" y="160.5" width="343" height="71" rx="8" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
<text x="212" y="194" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">one database</text>
<text x="212" y="208" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">acme and globex in the same tables</text>
<rect x="424" y="56" width="512" height="196" rx="12" fill="none" stroke="#e7e7e7" stroke-width="1"/>
<rect x="436" y="50" width="100" height="12" fill="#ffffff"/>
<text x="486" y="59" fill="#555555" font-size="8" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle" letter-spacing="0.04em">ISOLATED TENANCY</text>
<rect x="440" y="76" width="232" height="48" rx="8" fill="#ffffff"/>
<rect x="440.5" y="76.5" width="231" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="556" y="98" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker fleet acme</text>
<text x="556" y="112" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">connects to acme only</text>
<rect x="688" y="76" width="232" height="48" rx="8" fill="#ffffff"/>
<rect x="688.5" y="76.5" width="231" height="47" rx="8" fill="#ffffff" stroke="#cdcdcd" stroke-width="1"/>
<text x="804" y="98" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">worker fleet globex</text>
<text x="804" y="112" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">connects to globex only</text>
<rect x="440" y="160" width="232" height="72" rx="8" fill="#ffffff"/>
<rect x="440.5" y="160.5" width="231" height="71" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="556" y="194" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">acme database</text>
<text x="556" y="208" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">own schema and migrations</text>
<rect x="688" y="160" width="232" height="72" rx="8" fill="#ffffff"/>
<rect x="688.5" y="160.5" width="231" height="71" rx="8" fill="rgba(207,145,72,0.12)" stroke="#cf9148" stroke-width="1"/>
<text x="804" y="194" fill="#000000" font-size="11" font-weight="500" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">globex database</text>
<text x="804" y="208" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" text-anchor="middle">own schema and migrations</text>
<text x="24" y="284" fill="#555555" font-size="9" font-family="Timeless Grotesk, Geist, sans-serif" font-weight="400" text-anchor="start">Shared: your app keeps the tenant consistent. Isolated: PostgreSQL enforces the boundary.</text>
</svg>
