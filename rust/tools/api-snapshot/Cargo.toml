[package]
name = "workhorse-api-snapshot"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
description = "Renders the workhorse crate's rustdoc JSON as the lines api/rust.txt commits."

[dependencies]
# Pinned exactly: 0.48 is the last release that reads rustdoc JSON format 53, which is what the
# pinned 1.89 toolchain writes. A newer release reads a newer format, so re-pin only alongside a
# toolchain bump.
public-api = "=0.48.0"
