[package]
# ADR 0074 publishes this one crate. SM-882 reserved `workhorse` on crates.io, and
# `.github/workflows/release.yml` publishes it when this version matches a release tag.
name = "workhorse"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Rust SDK for Workhorse, a durable task queue whose state lives in PostgreSQL"
license = "Apache-2.0"
repository = "https://github.com/stablemates/workhorse"
homepage = "https://github.com/stablemates/workhorse"
readme = "README.md"
keywords = ["postgresql", "task-queue", "durable", "workflow", "jobs"]
categories = ["asynchronous", "database"]
# The integration tests read `sql/schema/current.sql` from outside this directory, so the
# published archive carries only what a dependent crate compiles.
include = [
  "Cargo.toml",
  "LICENSE",
  "NOTICE",
  "README.md",
  "src/**/*.rs",
  "dashboard/bundle.json",
  "dashboard/*.tar.gz",
]

[lib]
name = "workhorse"

[features]
opentelemetry = ["dep:opentelemetry", "dep:tracing-opentelemetry"]
# The embedded dashboard backend. A build without it compiles no HTTP dependency.
dashboard = [
  "dep:bytes",
  "dep:flate2",
  "dep:http",
  "dep:http-body",
  "dep:http-body-util",
  "dep:tar",
  "dep:tower-service",
]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
libc = "0.2"
tokio-postgres = { version = "0.7", features = [
  "with-serde_json-1",
  "with-uuid-1",
  "with-chrono-0_4",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = "0.14"
jsonschema = { version = "0.57", default-features = false }
opentelemetry = { version = "0.32", optional = true, default-features = false, features = [
  "trace",
  "metrics",
] }
tracing-opentelemetry = { version = "0.33", optional = true, default-features = false }
bytes = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
tar = { version = "0.4", optional = true, default-features = false }
tower-service = { version = "0.3", optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
  "trace",
  "metrics",
  "testing",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "registry",
  "std",
] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[[test]]
name = "dashboard_conformance"
required-features = ["dashboard"]

[[test]]
name = "dashboard_http"
required-features = ["dashboard"]
