[package]
name = "workhorse-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = { version = "0.7", features = [
  "with-serde_json-1",
  "with-uuid-1",
  "with-chrono-0_4",
] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
workhorse-client = { path = ".." }
