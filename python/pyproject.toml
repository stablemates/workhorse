[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stablemates-workhorse"
version = "0.1.0"
description = "Python SDK for the Workhorse durable job queue for PostgreSQL. Public beta."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Stablemates" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database :: Front-Ends",
]
dependencies = ["jsonschema>=4.25,<5", "psycopg>=3.3,<4"]

[project.urls]
Documentation = "https://workhorse.run/docs/quickstart"
Repository = "https://github.com/stablemates/workhorse"
Issues = "https://github.com/stablemates/workhorse/issues"

[project.optional-dependencies]
psycopg = []
asyncpg = ["asyncpg>=0.31,<1"]
telemetry = ["opentelemetry-api>=1.44,<2"]

[dependency-groups]
dev = [
  "asyncpg>=0.31,<1",
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "opentelemetry-sdk>=1.44,<2",
  "pip-audit>=2.9,<3",
  "psycopg[binary]>=3.3,<4",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.12,<1",
  "tomli>=2.2,<3",
  "types-jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workhorse"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires the worktree's local PostgreSQL test database",
  "slow: unsuitable for the fast pre-commit unit tier",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["workhorse"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PLC",
  "PLE",
  "PLW",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.isort]
# Aliased private imports keep one statement per source module instead of one per name.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# This example imports only the driver selected by the caller, so either optional dependency can
# remain uninstalled when the other path runs.
"examples/async_worker.py" = ["PLC0415"]
