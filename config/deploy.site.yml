# Parameterized Kamal example for the documentation site. Export every required value before use.
service: workhorse-site
image: workhorse-site
minimum_version: 2.12.0

servers:
  web:
    - <%= ENV.fetch("WORKHORSE_DEPLOY_HOST") %>

ssh:
  user: <%= ENV.fetch("WORKHORSE_DEPLOY_USER") %>
  config: true

registry:
  server: <%= ENV.fetch("WORKHORSE_REGISTRY_SERVER") %>
  username: <%= ENV.fetch("WORKHORSE_REGISTRY_USER") %>
  password:
    - WORKHORSE_REGISTRY_TOKEN

builder:
  arch: amd64
  dockerfile: Dockerfile.site

proxy:
  hosts:
    - <%= ENV.fetch("WORKHORSE_SITE_HOST") %>
    - <%= ENV.fetch("WORKHORSE_SITE_WWW_HOST") %>
  app_port: 8080
  ssl: true
  healthcheck:
    path: /up
    interval: 2
    timeout: 2
  run:
    options:
      memory: 256m
      cpus: 0.5
      pids-limit: 128

deploy_timeout: 120
drain_timeout: 30
stop_timeout: 40
retain_containers: 3
