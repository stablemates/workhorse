# Parameterized Kamal example for the demo application. Export every required value before use.
service: workhorse-demo
image: workhorse-demo
minimum_version: 2.12.0

servers:
  web:
    hosts:
      - <%= ENV.fetch("WORKHORSE_DEPLOY_HOST") %>
    options:
      memory: 1g
      cpus: 1
      pids-limit: 256

ssh:
  user: <%= ENV.fetch("WORKHORSE_DEPLOY_USER") %>
  config: true

registry:
  server: <%= ENV.fetch("WORKHORSE_REGISTRY_SERVER") %>
  username: <%= ENV.fetch("WORKHORSE_REGISTRY_USER") %>
  password:
    - WORKHORSE_REGISTRY_TOKEN

builder:
  arch: amd64
  dockerfile: Dockerfile

env:
  clear:
    WORKHORSE_DEMO_ENV: production
    WORKHORSE_DEMO_MODE: production
    WORKHORSE_DEMO_PUBLIC_ORIGIN: <%= ENV.fetch("WORKHORSE_DEMO_PUBLIC_ORIGIN") %>
    WORKHORSE_DEMO_SHUTDOWN_GRACE_MS: 30000
  secret:
    - DATABASE_URL_PRIMARY
    - DATABASE_URL_SECONDARY

# The example reaches both PostgreSQL databases over the network. Do not expose a host-wide socket directory.
proxy:
  host: <%= ENV.fetch("WORKHORSE_DEMO_HOST") %>
  app_port: 3000
  ssl: true
  healthcheck:
    path: /up
    interval: 2
    timeout: 2
  run:
    options:
      memory: 256m
      cpus: 0.5
      pids-limit: 128

deploy_timeout: 120
drain_timeout: 30
stop_timeout: 40
retain_containers: 3
