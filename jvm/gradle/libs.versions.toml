# Every JVM dependency and build plugin version. mise.toml pins Java and Gradle.
[versions]
pgjdbc = "42.7.8"
jspecify = "1.0.0"
kotlin = "2.4.21"
kotlin-core-libraries = "2.2.21"
spring-boot = "4.0.8"
junit = "6.1.3"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
nullaway = "0.14.2"
spotless = "8.10.4"
# Spotless 8.10.4 cannot load google-java-format 1.37.0, which changed an API that Spotless calls.
google-java-format = "1.36.1"

[libraries]
pgjdbc = { module = "org.postgresql:postgresql", version.ref = "pgjdbc" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-jdbc = { module = "org.springframework.boot:spring-boot-jdbc", version.ref = "spring-boot" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
