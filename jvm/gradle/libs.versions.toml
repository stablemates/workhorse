# Every JVM dependency and build plugin version. mise.toml pins Java and Gradle.
[versions]
# The PgJDBC floor: the first release that fixes GHSA-98qh-xjc8-98pq and GHSA-j92g-9f8w-j867 (ADR
# 0103, "Amendment: the JVM floors rise past their known advisories"). `PgjdbcVersion.FLOOR` agrees.
pgjdbc = "42.7.12"
jspecify = "1.0.0"
# The OpenTelemetry API that the core compiles against, an optional dependency (ADR 0103,
# "Telemetry"). 1.62.0 is the first release that fixes GHSA-rcgg-9c38-7xpx. Spring Boot 4.1 manages
# it, and the Spring Boot floor manages 1.55.0.
opentelemetry = "1.62.0"
# The dashboard backend compiles against the Jakarta Servlet floor of ADR 0103.
jakarta-servlet = "6.0.0"
# The servlet container for the dashboard tests: the Tomcat that Spring Boot 4.1.1, the newest 4.1
# release, manages as `tomcat.version` in spring-boot-dependencies-4.1.1.pom on Maven Central.
tomcat = "11.0.24"
kotlin = "2.4.21"
kotlin-core-libraries = "2.2.21"
spring-boot = "4.0.8"
# The jackson-databind floor of the starter's `jackson` feature: the first Jackson 3 release that
# fixes the seven advisories of SM-1467. No Spring Boot BOM manages it yet: 4.0.8 and 4.1.1 manage
# 3.1.5. jackson-databind 3.1.7 requires jackson-core 3.1.7.
jackson = "3.1.7"
junit = "6.1.3"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
nullaway = "0.14.2"
spotless = "8.10.4"
# Spotless 8.10.4 cannot load google-java-format 1.37.0, which changed an API that Spotless calls.
google-java-format = "1.36.1"
# The Kotlin formatter: the default of Spotless 8.10.4 (plugin-gradle/CHANGES.md, "8.10.4").
ktfmt = "0.65"
# The Spring Boot lines the starter tests run on besides the 4.0 floor (ADR 0103, "Floors").
# `-Pworkhorse.springBoot=4.1` or `=snapshot` selects one for the starter's test class paths.
spring-boot-4-1 = "4.1.1"
spring-boot-snapshot = "4.2.0-SNAPSHOT"
# The kotlinx-coroutines floor of the Kotlin module (ADR 0103, "Floors"). 1.10.2 is the newest
# release that requires kotlin-stdlib 2.1.0, so a Kotlin 2.2 caller resolves no newer standard
# library through it. 1.11.0 requires kotlin-stdlib 2.2.20.
kotlinx-coroutines = "1.10.2"
# The documentation engine for the KDoc of `workhorse-kotlin`. Its HTML goes into the module's
# `-javadoc.jar`, because the module has no Java sources for the javadoc tool (SM-1507).
dokka = "2.2.0"

[libraries]
pgjdbc = { module = "org.postgresql:postgresql", version.ref = "pgjdbc" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-jdbc = { module = "org.springframework.boot:spring-boot-jdbc", version.ref = "spring-boot" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
# The starter's optional and test modules. The Spring Boot BOM supplies their versions.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "spring-boot" }
spring-boot-jackson = { module = "org.springframework.boot:spring-boot-jackson" }
spring-boot-health = { module = "org.springframework.boot:spring-boot-health" }
spring-web = { module = "org.springframework:spring-web" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-opentelemetry = { module = "org.springframework.boot:spring-boot-opentelemetry" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# The Kotlin parser of the API snapshot reader, at the version of the Kotlin compiler.
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
