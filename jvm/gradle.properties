# The train version. Every JVM artifact uses it (ADR 0103).
version=0.8.0
# Each build runs in a fresh process. A daemon keeps the environment of the build that started
# it, so it could run a test against the databases of another checkout.
org.gradle.daemon=false
# The build runs on the JDK that mise.toml pins, or on the JDK that a CI lane installs. Gradle
# must not find or download a different one (ADR 0103, "Build tool").
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
