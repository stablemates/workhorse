<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="light dark" />
    <title>Sign in · Workhorse</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        --background: #f4f6f8;
        --panel: #ffffff;
        --border: #ccd3da;
        --text: #1f252b;
        --muted: #626f7b;
        --field: #ffffff;
        --button: #535e68;
        --button-hover: #454e57;
        --error: #c92a2a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        align-items: center;
        background: var(--background);
        color: var(--text);
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        max-width: 420px;
        width: 100%;
      }
      .brand {
        align-items: center;
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .brand svg {
        height: 42px;
        width: 42px;
      }
      .brand-name {
        font-size: 25px;
        font-weight: 750;
        letter-spacing: -0.04em;
      }
      .login-panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 32px;
      }
      h1 {
        font-size: 24px;
        letter-spacing: -0.025em;
        margin: 0 0 8px;
      }
      .intro {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      form {
        display: grid;
        gap: 18px;
      }
      label {
        display: grid;
        font-size: 14px;
        font-weight: 650;
        gap: 7px;
      }
      input {
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: 5px;
        color: var(--text);
        font: inherit;
        min-height: 42px;
        padding: 9px 11px;
      }
      input:focus {
        border-color: #768592;
        outline: 2px solid #ccd3da;
        outline-offset: 1px;
      }
      button {
        background: var(--button);
        border: 0;
        border-radius: 5px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 42px;
        padding: 9px 16px;
      }
      button:hover {
        background: var(--button-hover);
      }
      .login-error {
        color: var(--error);
        font-size: 14px;
        margin: 0 0 18px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #141618;
          --panel: #1a1d20;
          --border: #454e57;
          --text: #f1efea;
          --muted: #afb9c3;
          --field: #202428;
          --button: #768592;
          --button-hover: #8594a1;
          --error: #ff8787;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg aria-hidden="true" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <path
            fill="#96938f"
            d="M388 102v3l-14 19-12 17-8 12 9 2 13 15 9 11 11 13 15 28 14 24 11 19v32l-5 8-5-2-13-23-2-3 9 28h-22l-19-28-10-5-41-17-4-2-12-22-4-6h-1l-7 53v8l34 101 5 15-2 0-5-8-13-16-14-17-11-13-11-14-10-11-9-11-10-11-9-11-14-15-7-8-6-7-2-1 2-4 9-9 8-7 14-14 8-7 8-8 8-7 10-10 6-5 5-5 16-12 16-12-55 15-48 12-21 5-3-1 27-16 25-15 25-15 56-8 9-5 28-17 18-11 18-11zm-32 93 2 4 7 11 5 7 6 1 24 1-5-4-15-10-21-9z"
          />
          <path
            fill="#b8b5b0"
            d="M267 183l2 1-18 20-8 7-13 13-8 7-12 12-8 7-6 5-35 17-28 13-36 17-13 6-5 2 5-5 10-9 11-9 10-9 11-9 12-11 11-9 13-12 8-7 10-9 5-4 37-15 37-15z"
          />
          <path
            fill="#626f7b"
            d="m195 271 4 2 21 21 8 7 81 81 2 1v2l4 2 14 14 7 6-3 0-16-10-18-10-23-13-24-13-23-13-23-12-22-12-26-14-15-8v-2l24-13 23-13z"
          />
        </svg>
        <span class="brand-name">Workhorse</span>
      </div>
      <section class="login-panel">
        <h1>Sign in</h1>
        <p class="intro">Sign in to the operator dashboard.</p>
        <!--__WORKHORSE_LOGIN_ERROR__-->
        <form method="post">
          <label
            >Username <input name="username" autocomplete="username" required autofocus
          /></label>
          <label
            >Password
            <input name="password" type="password" autocomplete="current-password" required
          /></label>
          <button type="submit">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
