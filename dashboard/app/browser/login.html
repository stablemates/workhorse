<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="light dark" />
    <title>Sign in · Workhorse</title>
    <style>
      /* The Untitled theme: neutral fills, no borders, amber only for keyboard focus. */
      :root {
        color-scheme: light dark;
        font-family: "Timeless Grotesk", "Geist Variable", ui-sans-serif, system-ui, sans-serif;
        --n1: #ffffff;
        --n2: #fbfbfb;
        --n3: #f4f4f4;
        --n8: #555555;
        --n10: #000000;
        --focus: #cf9148;
        --error: #bd0222;
      }
      * {
        box-sizing: border-box;
      }
      body {
        align-items: center;
        background: var(--n1);
        color: var(--n10);
        display: flex;
        font-size: 14px;
        justify-content: center;
        line-height: 20px;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        max-width: 400px;
        width: 100%;
      }
      .brand {
        align-items: center;
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
      }
      .brand svg {
        height: 32px;
        width: 32px;
      }
      .brand-name {
        font-size: 24px;
        font-weight: 600;
        line-height: 32px;
      }
      .login-panel {
        background: var(--n2);
        border-radius: 12px;
        padding: 24px;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        line-height: 32px;
        margin: 0 0 8px;
      }
      .intro {
        color: var(--n8);
        margin: 0 0 24px;
        text-wrap: pretty;
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        font-weight: 500;
        gap: 8px;
      }
      input {
        background: var(--n3);
        border: 0;
        border-radius: 8px;
        color: var(--n10);
        font: inherit;
        min-height: 40px;
        padding: 10px 12px;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      button {
        background: var(--n10);
        border: 0;
        border-radius: 8px;
        color: var(--n1);
        cursor: pointer;
        font: inherit;
        font-weight: 500;
        margin-top: 8px;
        padding: 12px 24px;
      }
      .login-error {
        color: var(--error);
        margin: 0 0 16px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --n1: #000000;
          --n2: #202020;
          --n3: #2b2b2b;
          --n8: #cfcfcf;
          --n10: #ffffff;
          --error: #fe8ea0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg aria-hidden="true" viewBox="65 63 383 383" xmlns="http://www.w3.org/2000/svg">
          <path
            fill="currentColor"
            transform="translate(388,102)"
            d="M0,0 L0,3 L-14,22 L-26,39 L-34,51 L-25,53 L-12,68 L-3,79 L8,92 L23,120 L37,144 L48,163 L48,195 L43,203 L38,201 L25,178 L23,175 L32,203 L10,203 L-9,175 L-19,170 L-60,153 L-64,151 L-76,129 L-80,123 L-81,123 L-88,176 L-88,184 L-54,285 L-49,300 L-51,300 L-56,292 L-69,276 L-83,259 L-94,246 L-105,232 L-115,221 L-124,210 L-134,199 L-143,188 L-157,173 L-164,165 L-170,158 L-172,157 L-170,153 L-161,144 L-153,137 L-139,123 L-131,116 L-123,108 L-115,101 L-105,91 L-99,86 L-94,81 L-78,69 L-62,57 L-117,72 L-165,84 L-186,89 L-189,88 L-162,72 L-137,57 L-112,42 L-56,34 L-47,29 L-19,12 L-1,1 Z M-32,93 L-30,97 L-23,108 L-18,115 L-12,116 L12,117 L7,113 L-8,103 L-29,94 Z"

          <path
            fill="#cf9148"
            transform="translate(267,183)"
            d="M0,0 L2,1 L-18,21 L-26,28 L-39,41 L-47,48 L-59,60 L-67,67 L-73,72 L-108,89 L-136,102 L-172,119 L-185,125 L-190,127 L-185,122 L-175,113 L-164,104 L-154,95 L-143,86 L-131,75 L-120,66 L-107,54 L-99,47 L-89,38 L-84,34 L-47,19 L-10,4 Z"
          />
          <path

            d="M0,0 L4,2 L25,23 L33,30 L114,111 L116,112 L116,114 L120,116 L134,130 L141,136 L138,136 L122,126 L104,116 L81,103 L57,90 L34,77 L11,65 L-11,53 L-37,39 L-52,31 L-52,29 L-28,16 L-5,3 Z"
          />
        </svg>
        <span class="brand-name">Workhorse</span>
      </div>
      <section class="login-panel">
        <h1>Sign in</h1>
        <p class="intro">Sign in to the operator dashboard.</p>
        <!--__WORKHORSE_LOGIN_ERROR__-->
        <form method="post">
          <label
            >Username <input name="username" autocomplete="username" required autofocus
          /></label>
          <label
            >Password
            <input name="password" type="password" autocomplete="current-password" required
          /></label>
          <button type="submit">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
