<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1b1e" />
    <script>
      (() => {
        const stored = localStorage.getItem("workhorse-theme-scheme");
        const scheme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.mantineColorScheme = scheme;
        document.documentElement.style.colorScheme = scheme;
      })();
    </script>
    <script>
      /*__WORKHORSE_RUNTIME_CONFIG__*/
    </script>
    <title>Workhorse Operations</title>
  </head>
  <body>
    <div id="root"></div>
    <!--__WORKHORSE_BROWSER_MODULES__-->
    <script type="module" src="/src/browser.tsx"></script>
  </body>
</html>
